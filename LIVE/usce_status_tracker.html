*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--navy);color:#fff;font-family:var(--sans);-webkit-font-smoothing:antialiased}.mm-track{min-height:100vh;background:linear-gradient(180deg,#06213a 0%,#0b4770 42%,#071627 42%,#071627 100%)}.mm-top{position:sticky;top:0;z-index:6;background:rgba(5,21,36,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}.mm-top-inner{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:18px}.mm-brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none}.mm-mark{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy);font-family:var(--serif);font-weight:700}.mm-brand strong{display:block;font-size:15px;text-transform:uppercase;letter-spacing:.08em}.mm-brand span span{display:block;color:rgba(255,255,255,.68);font-size:11px;text-transform:uppercase;letter-spacing:.12em}.mm-runtime{text-align:right;font-size:11px;color:rgba(255,255,255,.66)}.mm-runtime b{display:block;color:var(--gold2);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.mm-shell{max-width:1180px;margin:0 auto;padding:34px 20px 70px}.mm-hero{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:end;margin-bottom:18px}.mm-eyebrow{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:7px 12px;color:var(--gold2);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;background:rgba(255,255,255,.08)}.mm-hero h1{font-family:var(--serif);font-size:clamp(40px,6vw,76px);font-weight:600;line-height:.98;margin:15px 0 10px;text-shadow:0 10px 38px rgba(0,0,0,.28)}.mm-hero p{max-width:760px;margin:0;color:rgba(255,255,255,.82);font-size:16px;line-height:1.72}.mm-card{background:linear-gradient(180deg,#fff,#f8f3e7);color:var(--ink);border:1px solid rgba(255,255,255,.7);box-shadow:var(--shadow);border-radius:8px;overflow:hidden}.mm-status-card{padding:18px;border-top:6px solid var(--gold)}.mm-status-card small{display:block;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-size:10px;font-weight:800;margin-bottom:6px}.mm-status-card b{display:block;color:var(--navy);font-family:var(--serif);font-size:27px;line-height:1.1}.mm-status-card span{display:block;color:var(--muted);font-size:13px;line-height:1.55;margin-top:8px}.mm-board{border:1px solid rgba(255,255,255,.22);border-radius:12px;background:linear-gradient(180deg,#0b78a8,#0a5687);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08),0 26px 80px rgba(0,0,0,.34);padding:16px}.mm-board-top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:12px}.mm-board-title{font-size:28px;line-height:1;text-transform:uppercase;letter-spacing:.05em;font-weight:800}.mm-board-title span{display:block;color:var(--gold2)}.mm-board-copy{max-width:520px;color:rgba(255,255,255,.78);font-size:12px;line-height:1.55}.mm-tracker-window{border:1px solid rgba(255,255,255,.16);background:rgba(5,28,48,.36);box-shadow:inset 0 0 24px rgba(0,0,0,.22);padding:17px 16px 14px;border-radius:6px}.mm-bar-labels{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin:0 14px 6px}.mm-bar-labels span{min-width:0;text-align:center;font-size:10px;line-height:1.15;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,.82);font-weight:800}.mm-segment-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:0;filter:drop-shadow(0 8px 14px rgba(0,0,0,.34));border-radius:999px;overflow:hidden;border:3px solid rgba(255,255,255,.72);background:#637689}.mm-segment{position:relative;min-height:78px;display:grid;place-items:center;background:linear-gradient(180deg,#8ca0b2,#5d7285);color:rgba(255,255,255,.58);font-size:28px;font-weight:800;text-shadow:0 2px 6px rgba(0,0,0,.22);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%,16px 50%)}.mm-segment:first-child{clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%)}.mm-segment:last-child{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,16px 50%)}.mm-segment.complete{background:linear-gradient(180deg,#31c46f,#159a56);color:#fff}.mm-segment.active{background:linear-gradient(180deg,var(--orange2),var(--orange));color:#fff;animation:mmBlink 1.08s ease-in-out infinite}.mm-segment.issue{background:linear-gradient(180deg,#df6d6d,#b83e3e);color:#fff;animation:mmBlink 1.08s ease-in-out infinite}.mm-segment.waiting{background:linear-gradient(180deg,#9aa9b6,#657789)}@keyframes mmBlink{0%,100%{filter:brightness(1);box-shadow:inset 0 0 0 rgba(255,255,255,0)}50%{filter:brightness(1.34);box-shadow:inset 0 0 24px rgba(255,244,180,.62)}}.mm-status-strip{margin:12px 0 0;text-align:center;text-transform:uppercase;letter-spacing:.06em;font-size:17px;font-weight:800;color:#fff}.mm-status-strip span{color:var(--gold2)}.mm-subgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}.mm-subbox{min-height:96px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);border-radius:4px;padding:13px}.mm-subbox b{display:block;text-transform:uppercase;letter-spacing:.08em;color:#fff;font-size:12px;margin-bottom:7px}.mm-subbox span,.mm-subbox a{display:block;color:rgba(255,255,255,.77);font-size:12px;line-height:1.55}.mm-subbox a{color:var(--gold2);text-decoration:none;font-weight:800}.mm-gate{margin-top:16px;padding:20px;display:none}.mm-gate.is-on{display:block}.mm-gate h2{font-family:var(--serif);font-size:28px;line-height:1.1;margin:0 0 8px;color:var(--navy)}.mm-gate p{margin:0;color:var(--muted);font-size:13px;line-height:1.65}.mm-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.mm-btn{appearance:none;text-decoration:none;border:0;border-radius:999px;padding:12px 16px;font:800 12px var(--sans);letter-spacing:.07em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .18s,box-shadow .18s}.mm-btn:hover{transform:translateY(-1px)}.mm-btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy);box-shadow:0 12px 24px rgba(217,184,91,.26)}.mm-btn-dark{background:var(--navy);color:#fff}.mm-btn-ghost{background:#fff;color:var(--navy);border:1px solid var(--line2)}.mm-detail{display:grid;grid-template-columns:1.12fr .88fr;gap:16px;margin-top:16px}.mm-panel{padding:20px}.mm-panel h3{margin:0 0 12px;text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--navy)}.mm-next{border:1px solid rgba(217,184,91,.38);background:linear-gradient(135deg,rgba(217,184,91,.18),rgba(23,163,207,.08));border-radius:8px;padding:17px}.mm-next small{display:block;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}.mm-next b{display:block;color:var(--navy);font-family:var(--serif);font-size:25px;line-height:1.15}.mm-next span{display:block;color:var(--muted);font-size:13px;line-height:1.65;margin-top:8px}.mm-facts{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.mm-fact{border:1px solid var(--line2);border-radius:8px;background:#fff;padding:11px}.mm-fact small{display:block;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-size:9px;font-weight:800;margin-bottom:4px}.mm-fact b{display:block;color:var(--navy);font-size:13px;line-height:1.35}.mm-resources{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.mm-resource{padding:18px}.mm-resource b{display:block;color:var(--navy);font-size:15px;line-height:1.3;margin-bottom:7px}.mm-resource span{display:block;color:var(--muted);font-size:12px;line-height:1.55}.mm-resource a{display:inline-flex;margin-top:12px;color:var(--navy);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;text-decoration:none;border-bottom:2px solid var(--gold)}.mm-foot{margin:20px 0 0;text-align:center;color:rgba(255,255,255,.66);font-size:12px;line-height:1.65}.mm-foot a{color:var(--gold2)}[hidden]{display:none!important}@media(max-width:900px){.mm-hero,.mm-detail,.mm-resources{grid-template-columns:1fr}.mm-board-top{display:block}.mm-board-copy{margin-top:10px}.mm-segment{min-height:60px;font-size:22px}.mm-subgrid{grid-template-columns:1fr}.mm-bar-labels span{font-size:9px}}@media(max-width:560px){.mm-top-inner{align-items:flex-start}.mm-runtime{text-align:left}.mm-shell{padding-top:24px}.mm-board{padding:10px}.mm-bar-labels{display:none}.mm-segment-bar{display:block;border-radius:8px;overflow:visible;background:transparent;border:0;filter:none}.mm-segment{clip-path:none!important;border-radius:8px;margin-bottom:8px;min-height:52px}.mm-segment::after{content:attr(data-label);position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.mm-segment span{margin-left:auto;margin-right:16px}.mm-actions{display:grid}.mm-btn{width:100%}.mm-facts{grid-template-columns:1fr}.mm-hero h1{font-size:40px}}
</style>
<style>
@media(max-width:560px){
  .mm-bar-labels{display:grid!important;margin:0 4px 5px!important;gap:1px!important}

<style>[hidden]{display:none!important}.mm-resources{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}}</style>

<body><div class="mm-track">
<header class="mm-top"><div class="mm-top-inner"><a class="mm-brand" href="https://missionmedinstitute.com/usce/"><span class="mm-mark">MM</span><span><strong>MissionMed</strong><span>Clinical rotations</span></span></a></div></header>
<main class="mm-shell"><section class="mm-hero"><div><span class="mm-eyebrow">USCE request tracker</span><h1>View your rotation request</h1>
<p>Open your tracker with the MissionMed account you used for your request. If you’re already signed in, you’ll go straight to your linked requests.</p>
<div class="mm-actions"><a class="mm-btn mm-btn-primary" id="accountLink" target="_top" href="https://missionmedinstitute.com/wp-admin/admin-post.php?action=mmi_usce_student_tracker">Open my student tracker</a>
<a class="mm-btn mm-btn-ghost" href="https://missionmedinstitute.com/usce/" target="_top">Request a rotation</a></div></div></section></main></div>
<script>
(() => {
  const here = new URL(location.href);
  const ref = here.searchParams.get('ref');
  const link = document.querySelector('#accountLink');
  // Only an intake UUID may narrow the signed-in read. No identity or return URL travels with it.
  if (ref !== null) {
    if (/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(ref)) {
      const target = new URL(link.href); target.searchParams.set('ref',ref); link.href=target.href;
    } else {
      document.querySelector('.mm-hero p').textContent='This request reference is invalid. Open your tracker to see requests linked to your account.';
    }
  }
  // Clear the retired cross-origin handoff without exchanging or retaining any credential.
  if (here.hash || [...here.searchParams.keys()].some(k=>k!=='ref')) history.replaceState(null,'',here.pathname+(ref && /^[0-9a-f-]{36}$/i.test(ref)?'?ref='+encodeURIComponent(ref):''));
  try {sessionStorage.removeItem('mm_usce_student_bearer_session');} catch {}
})();
</script></body></html>
