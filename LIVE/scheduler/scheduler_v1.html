<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MissionMed Matrix Scheduler</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap");

    :root {
      --navy: #061727;
      --navy2: #0b2033;
      --navy3: #102b46;
      --blue: #3bb7ff;
      --blue2: #78d4ff;
      --gold: #ffcc4d;
      --gold2: #ffe08a;
      --orange: #ff8a3d;
      --orange2: #ffb27a;
      --green: #3dff9a;
      --green2: #9cffc7;
      --red: #ff5c7a;
      --matrix-heading: "Space Grotesk", "Poppins", sans-serif;
      --matrix-body: "Poppins", sans-serif;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--navy);
      color: #fff;
      overflow-x: hidden;
    }

    #schedule-root,
    #schedule-root * {
      box-sizing: border-box;
    }

    #schedule-root {
      --sidebar-w: 252px;
      position: relative;
      display: flex;
      width: 100vw;
      min-height: 100vh;
      background: var(--navy);
      color: #fff;
      font-family: var(--matrix-body);
      line-height: 1.5;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #schedule-root h1,
    #schedule-root h2,
    #schedule-root h3,
    #schedule-root p,
    #schedule-root ul,
    #schedule-root li,
    #schedule-root button {
      margin: 0;
      padding: 0;
      font-family: inherit;
      letter-spacing: 0;
    }

    #schedule-root a {
      color: inherit;
      text-decoration: none;
    }

    #schedule-root button,
    #schedule-root input,
    #schedule-root select,
    #schedule-root textarea {
      font: inherit;
    }

    #schedule-root button {
      border: 0;
      color: inherit;
      cursor: pointer;
    }

    #schedule-root input,
    #schedule-root select,
    #schedule-root textarea {
      width: 100%;
      min-height: 44px;
      padding: 11px 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02)),
        rgba(6, 23, 39, 0.42);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      color: #fff;
      outline: none;
      transition: border-color 0.24s ease, box-shadow 0.24s ease, transform 0.24s ease;
    }

    #schedule-root textarea {
      min-height: 98px;
      resize: vertical;
    }

    #schedule-root input:focus,
    #schedule-root select:focus,
    #schedule-root textarea:focus {
      border-color: rgba(243, 213, 118, 0.6);
      box-shadow: 0 0 0 4px rgba(217, 184, 91, 0.14);
      transform: translateY(-1px);
    }

    #schedule-root option {
      background: var(--navy2);
      color: #fff;
    }

    /*
      MM-SCHED-057D layout invariant:
      Standalone Scheduler may own the viewport, but Matrix embedded Scheduler must
      never use 100vw or escape the Matrix content lane again. Keep every booking
      step/card/grid fluid inside its current container.
    */
    #schedule-root.sos-schedule-embedded {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: auto;
      margin: 0;
      background: transparent;
      overflow: visible;
    }

    #schedule-root.sos-schedule-embedded .sos-page,
    #schedule-root.sos-schedule-embedded .sos-book-flow,
    #schedule-root.sos-schedule-embedded .sos-tracker-board,
    #schedule-root.sos-schedule-embedded .sos-card,
    #schedule-root.sos-schedule-embedded .sos-card-pad,
    #schedule-root.sos-schedule-embedded .sos-load-shell {
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    .hidden {
      display: none !important;
    }

    .sos-sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      width: var(--sidebar-w);
      min-height: 100vh;
      padding: 24px 0;
      overflow-y: auto;
      background: linear-gradient(180deg, #040e1a 0%, #07192d 100%);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 16px 0 48px rgba(0, 0, 0, 0.26);
    }

    .sos-main {
      position: relative;
      z-index: 1;
      flex: 1;
      min-height: 100vh;
      margin-left: var(--sidebar-w);
      overflow: hidden;
    }

    .sos-bg-layer {
      position: fixed;
      inset: 0 0 0 var(--sidebar-w);
      z-index: 0;
      overflow: hidden;
      contain: paint;
      pointer-events: none;
      background: linear-gradient(180deg, #0a2540 0%, #0e3a5c 30%, #0b3050 70%, #071e35 100%);
    }

    .sos-bg-layer::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.025), transparent);
      background-size: 200% 100%;
      animation: sos-shimmer 3s ease-in-out infinite;
    }

    .sos-bg-layer::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      background:
        radial-gradient(ellipse at 48% 38%, rgba(14, 117, 168, 0.12), transparent 58%),
        linear-gradient(180deg, rgba(6, 23, 39, 0) 0%, rgba(6, 23, 39, 0.44) 100%);
      animation: sos-glow-pulse 6s ease-in-out infinite alternate;
    }

    .sos-bg {
      position: absolute;
      inset: -8% -10%;
      z-index: 1;
      transform-origin: 50% 10%;
    }

    .sos-bg-a {
      background: linear-gradient(170deg, transparent 10%, rgba(54, 192, 113, 0.18) 25%, rgba(0, 229, 255, 0.15) 40%, transparent 55%);
      filter: blur(25px);
      animation: sos-aurora-a 5s ease-in-out infinite alternate;
    }

    .sos-bg-b {
      background: linear-gradient(160deg, transparent 30%, rgba(168, 85, 247, 0.14) 42%, rgba(0, 229, 255, 0.12) 54%, transparent 68%);
      filter: blur(35px);
      animation: sos-aurora-b 7s ease-in-out infinite alternate;
    }

    .sos-bg-c {
      background: linear-gradient(175deg, transparent 5%, rgba(54, 192, 113, 0.12) 18%, rgba(217, 184, 91, 0.1) 32%, transparent 48%);
      filter: blur(40px);
      animation: sos-aurora-c 9s ease-in-out infinite alternate;
    }

    .sos-content {
      position: relative;
      z-index: 3;
      min-height: 100vh;
      padding: 34px 38px 62px;
    }

    .sos-brand {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 0 20px;
      margin-bottom: 28px;
    }

    .sos-brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      flex: 0 0 42px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      box-shadow: 0 4px 20px rgba(217, 184, 91, 0.35);
      color: var(--navy);
      font-family: var(--matrix-heading);
      font-size: 15px;
      font-weight: 700;
    }

    .sos-brand-title {
      color: #fff;
      font-family: var(--matrix-heading);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.1;
    }

    .sos-brand-title small {
      display: block;
      margin-top: 3px;
      color: rgba(255, 255, 255, 0.45);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .sos-nav-section {
      margin-bottom: 22px;
    }

    .sos-nav-label {
      padding: 0 20px;
      margin-bottom: 8px;
      color: rgba(255, 255, 255, 0.32);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .sos-nav-list {
      display: grid;
      gap: 2px;
      list-style: none;
    }

    .sos-nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 44px;
      padding: 10px 20px;
      border-left: 3px solid transparent;
      background: transparent;
      color: rgba(255, 255, 255, 0.74);
      font-size: 13px;
      font-weight: 600;
      text-align: left;
      touch-action: manipulation;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .sos-nav-link:hover,
    .sos-nav-link:focus-visible {
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      outline: none;
    }

    .sos-nav-link.is-active {
      background: rgba(217, 184, 91, 0.1);
      border-left-color: var(--gold);
      color: var(--gold2);
    }

    .sos-nav-icon {
      display: grid;
      width: 22px;
      height: 22px;
      place-items: center;
      flex: 0 0 22px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.76);
      font-family: var(--matrix-heading);
      font-size: 10px;
      font-weight: 800;
    }

    .sos-nav-link.is-active .sos-nav-icon {
      background: rgba(217, 184, 91, 0.18);
      color: var(--gold2);
    }

    .sos-nav-badge {
      margin-left: auto;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--orange);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
    }

    .sos-sidebar-footer {
      padding: 14px 20px 0;
      margin-top: auto;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .sos-page {
      animation: sos-fade-in 0.35s ease;
    }

    .sos-page-header {
      max-width: 760px;
      margin-bottom: 28px;
    }

    .sos-eyebrow {
      display: inline-flex;
      align-items: center;
      padding: 5px 14px;
      margin-bottom: 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: var(--navy);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .sos-page-title {
      margin-bottom: 8px;
      color: #fff;
      font-family: var(--matrix-heading);
      font-size: 42px;
      font-weight: 700;
      line-height: 1.12;
    }

    .sos-page-copy {
      max-width: 620px;
      color: rgba(255, 255, 255, 0.62);
      font-size: 14px;
    }

    .sos-grid {
      display: grid;
      gap: 18px;
    }

    .sos-grid-stats {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: 28px;
    }

    .sos-grid-two {
      grid-template-columns: minmax(280px, 430px) minmax(0, 1fr);
      align-items: start;
    }

    .sos-card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(23, 163, 207, 0.12);
      border-radius: 8px;
      background: linear-gradient(180deg, #0d3a56 0%, #082a3f 100%);
      box-shadow:
        0 4px 8px rgba(0, 0, 0, 0.3),
        0 16px 48px rgba(0, 0, 0, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.05),
        inset 0 -3px 6px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .sos-card:hover {
      border-color: rgba(23, 163, 207, 0.22);
      box-shadow:
        0 8px 16px rgba(0, 0, 0, 0.35),
        0 24px 64px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transform: translateY(-3px);
    }

    .sos-card-pad {
      padding: 22px;
    }

    .sos-stat {
      display: grid;
      min-height: 126px;
      place-items: center;
      padding: 20px;
      text-align: center;
    }

    .sos-stat-value {
      display: block;
      color: var(--gold2);
      font-family: var(--matrix-heading);
      font-size: 32px;
      font-weight: 700;
      line-height: 1;
    }

    .sos-stat-label {
      display: block;
      margin-top: 8px;
      color: rgba(255, 255, 255, 0.48);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .sos-stat-sub {
      display: block;
      margin-top: 7px;
      color: rgba(255, 255, 255, 0.38);
      font-size: 11px;
    }

    .sos-panel-title {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
      color: var(--blue2);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .sos-panel-title::before {
      content: "";
      display: block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--blue2);
      box-shadow: 0 0 6px var(--blue2);
    }

    .sos-panel-heading {
      margin-bottom: 8px;
      color: #fff;
      font-family: var(--matrix-heading);
      font-size: 18px;
      font-weight: 700;
    }

    .sos-panel-copy {
      color: rgba(255, 255, 255, 0.56);
      font-size: 13px;
    }

    .sos-tracker-board {
      padding: 20px;
      margin-bottom: 28px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 8px;
      background: linear-gradient(180deg, #0b78a8, #0a5687);
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.08), 0 26px 80px rgba(0, 0, 0, 0.34);
    }

    .sos-tracker-top {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .sos-tracker-title {
      color: #fff;
      font-family: var(--matrix-heading);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1.05;
      text-transform: uppercase;
    }

    .sos-tracker-title span {
      display: block;
      color: var(--gold2);
    }

    .sos-tracker-copy {
      max-width: 560px;
      margin-top: 7px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 12px;
      line-height: 1.55;
    }

    .sos-tracker-labels {
      display: grid;
      gap: 3px;
      margin: 0 10px 6px;
    }

    .sos-tracker-labels span {
      overflow: hidden;
      color: rgba(255, 255, 255, 0.62);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-align: center;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .sos-segment-bar {
      display: grid;
      overflow: hidden;
      border: 3px solid rgba(255, 255, 255, 0.72);
      border-radius: 999px;
      background: #637689;
      filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.34));
    }

    .sos-segment {
      position: relative;
      display: grid;
      min-height: 68px;
      place-items: center;
      background: linear-gradient(180deg, #8ca0b2, #5d7285);
      clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%, 14px 50%);
      color: rgba(255, 255, 255, 0.55);
      font-family: var(--matrix-heading);
      font-size: 24px;
      font-weight: 800;
    }

    .sos-segment:first-child {
      clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%);
    }

    .sos-segment:last-child {
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 14px 50%);
    }

    .sos-segment.is-complete {
      background: linear-gradient(180deg, #31c46f, #159a56);
      color: #fff;
    }

    .sos-segment.is-active {
      background: linear-gradient(180deg, var(--orange2), var(--orange));
      color: #fff;
      animation: sos-tracker-pulse 1.08s ease-in-out infinite;
    }

    .sos-status-strip {
      margin-top: 13px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-align: center;
      text-transform: uppercase;
    }

    .sos-status-strip strong {
      color: var(--gold2);
      font-weight: 800;
    }

    .sos-btn,
    .sos-tab,
    .sos-sched-slot {
      touch-action: manipulation;
    }

    .sos-btn:disabled {
      cursor: not-allowed;
      opacity: 0.48;
      transform: none;
    }

    .sos-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      min-height: 44px;
      padding: 12px 18px;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      border-radius: 10px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02)),
        linear-gradient(180deg, #0f4668, #082a40);
      box-shadow:
        0 8px 18px rgba(0, 0, 0, 0.32),
        0 20px 50px rgba(0, 0, 0, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.16),
        inset 0 -4px 8px rgba(0, 0, 0, 0.25);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0;
      transition: transform 0.24s ease, box-shadow 0.24s ease, border-color 0.24s ease, filter 0.24s ease;
    }

    .sos-btn:hover,
    .sos-btn:focus-visible {
      border-color: rgba(23, 163, 207, 0.5) !important;
      box-shadow:
        0 12px 24px rgba(0, 0, 0, 0.38),
        0 28px 70px rgba(0, 0, 0, 0.32),
        0 0 22px rgba(23, 163, 207, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);
      transform: translateY(-2px) scale(1.015);
      outline: none;
    }

    .sos-btn:active {
      box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.34),
        inset 0 3px 8px rgba(0, 0, 0, 0.36);
      transform: translateY(1px) scale(0.98);
    }

    .sos-btn-primary {
      border-color: rgba(243, 213, 118, 0.36) !important;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.02)),
        linear-gradient(135deg, #b8941e, #d4a826);
      box-shadow:
        0 12px 28px rgba(0, 0, 0, 0.34),
        0 0 34px rgba(217, 184, 91, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.36),
        inset 0 -5px 12px rgba(110, 70, 0, 0.2);
      color: #fff;
    }

    .sos-btn-block {
      width: 100%;
      margin-top: 18px;
    }

    .sos-toolbar,
    .sos-tabs,
    .sos-badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 22px;
    }

    .sos-tab,
    .sos-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 8px 13px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02)),
        rgba(6, 23, 39, 0.5);
      box-shadow:
        0 7px 18px rgba(0, 0, 0, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.78);
      font-size: 12px;
      font-weight: 800;
      transition: transform 0.24s ease, box-shadow 0.24s ease, background 0.24s ease;
    }

    .sos-tab {
      min-height: 48px;
      padding-inline: 18px;
    }

    .sos-tab:hover,
    .sos-tab.is-active,
    .sos-tab[aria-current="true"] {
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3), 0 0 22px rgba(217, 184, 91, 0.22);
      color: var(--navy);
      transform: translateY(-2px);
    }

    .sos-pill {
      min-height: 32px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .sos-tier-high {
      background: rgba(54, 192, 113, 0.14);
      border-color: rgba(54, 192, 113, 0.32);
      color: #dfffea;
    }

    .sos-tier-medium {
      background: rgba(217, 184, 91, 0.14);
      border-color: rgba(243, 213, 118, 0.32);
      color: #fff0ba;
    }

    .sos-tier-low {
      background: rgba(240, 107, 47, 0.14);
      border-color: rgba(240, 107, 47, 0.34);
      color: #ffd8c2;
    }

    .sos-notice,
    .sos-banner {
      display: grid;
      gap: 4px;
      padding: 18px;
      border: 1px solid rgba(243, 213, 118, 0.32);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.03)),
        rgba(217, 184, 91, 0.12);
      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.16);
      color: var(--gold2);
      font-size: 13px;
      font-weight: 800;
    }

    .sos-notice strong,
    .sos-notice span {
      display: block;
    }

    .sos-banner.is-error {
      border-color: rgba(217, 92, 92, 0.32);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.03)),
        rgba(217, 92, 92, 0.12);
      color: #ffd9d9;
    }

    .sos-empty {
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      background: rgba(9, 36, 61, 0.45);
      color: rgba(255, 255, 255, 0.66);

    /* MX-APPT-5002E item 9 — the grid gained a role="row" layer for screen readers.
       display:contents keeps every cell a direct grid item, so the visual layout is
       byte-for-byte what it was while the row structure is now exposed to assistive tech. */
    .sos-sched-row {
      display: contents;
    }

    .sos-sched-time-label,
    .sos-sched-grid-cell {
      min-height: 44px;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      font-size: 11px;

      display: grid;
      place-items: center;
      color: rgba(255, 255, 255, 0.54);
      background: rgba(255, 255, 255, 0.03);
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .sos-sched-grid-cell {
      display: grid;
      place-items: stretch;
      background: rgba(255, 255, 255, 0.045);
      color: rgba(255, 255, 255, 0.62);
    }

    .sos-sched-grid-cell.is-open {
      border-color: rgba(61, 255, 154, 0.26);
      background: rgba(61, 255, 154, 0.1);

    .sos-sched-grid-cell.is-selected {
      border-color: rgba(23, 163, 207, 0.56);
      background: rgba(23, 163, 207, 0.16);
      box-shadow: 0 0 18px rgba(23, 163, 207, 0.18);
    }

    /* MX-APPT-5002E item 9 — 44x44 minimum. This was 30px high, below the WCAG 2.5.5
       target size and a genuine mis-tap source on phones. */
    .sos-sched-open-slot {
      display: grid;
      place-items: center;
      min-height: 44px;
      min-width: 44px;
      width: 100%;
      border: 1px solid rgba(61, 255, 154, 0.28);
      border-radius: 7px;
      background: rgba(61, 255, 154, 0.12);
      color: var(--green2);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .sos-sched-open-slot:hover {
      border-color: rgba(61, 255, 154, 0.52);
      background: rgba(61, 255, 154, 0.18);
      transform: scale(1.04);
    }

    /* MX-APPT-5002E item 9 — a real focus indicator. This rule used to set outline:none and
       rely on a 4% scale and a background tint, which is not a visible focus indicator for a
       keyboard user. */
    .sos-sched-open-slot:focus-visible {
      border-color: rgba(61, 255, 154, 0.52);
      background: rgba(61, 255, 154, 0.18);
      outline: 2px solid rgba(23, 163, 207, 0.72);
      outline-offset: 2px;

      text-transform: uppercase;

    .sos-sched-item {
      display: grid;
      gap: 10px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.055);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 7px 16px rgba(0, 0, 0, 0.2);
    }

    .sos-sched-item strong {
      color: #fff;
      font-family: var(--matrix-heading);
      font-size: 17px;
    }

    .sos-sched-item span {
      color: rgba(255, 255, 255, 0.58);
      font-size: 13px;
    }

    .sos-loading {
      display: grid;
      min-height: 260px;
      place-items: center;
      color: rgba(255, 255, 255, 0.64);
      font-size: 13px;
    }

    .sos-load-shell {
      position: relative;
      display: grid;
      gap: 14px;
      padding: 20px;
      border: 1px solid rgba(120, 212, 255, 0.22);
      border-radius: 14px;
      background:
        linear-gradient(180deg, rgba(9, 62, 92, 0.74), rgba(5, 28, 48, 0.88)),
        rgba(6, 23, 39, 0.72);
      box-shadow: 0 20px 58px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      overflow: hidden;
      animation: sos-fade-in 0.22s ease both;
    }

    .sos-load-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 16% 0%, rgba(255, 204, 77, 0.12), transparent 28%),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 20px);
    }

    .sos-load-shell > * {
      position: relative;
      z-index: 1;
    }

    .sos-load-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 210px;
      gap: 18px;
      align-items: start;
    }

    .sos-load-kicker {
      margin: 0 0 5px;
      color: var(--gold2);
      font-family: var(--matrix-heading);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color 0.24s ease, opacity 0.24s ease;
    }

    .sos-load-title {
      margin: 0;
      color: #fff;
      font-family: var(--matrix-heading);
      font-size: 22px;
      font-weight: 800;
      line-height: 1.15;
      transition: opacity 0.24s ease;
    }

    .sos-load-message {
      margin: 7px 0 0;
      color: rgba(255, 255, 255, 0.68);
      font-size: 14px;
      line-height: 1.48;
      transition: opacity 0.24s ease;
    }

    .sos-load-progress {
      display: grid;
      gap: 10px;
      min-width: 0;
    }

    .sos-load-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: rgba(255, 255, 255, 0.7);
      font-family: var(--matrix-heading);
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .sos-load-track {
      height: 18px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.32);
    }

    /* MX-APPT-5002C item 3 — indeterminate, not a fake percentage.
       This bar used to be driven by a hardcoded 12/34/58/82/96 sequence on a 950ms timer,
       so it always took ~3.8s to reach 96% no matter how fast the server actually answered.
       It now travels continuously and claims nothing about how far along the work is. */
    .sos-load-fill {
      height: 100%;
      width: 38%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--gold), var(--orange), var(--blue2));
      box-shadow: 0 0 22px rgba(255, 204, 77, 0.34);
      animation: sos-load-indeterminate 1.15s ease-in-out infinite;
    }

    @keyframes sos-load-indeterminate {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(320%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .sos-load-fill {
        animation: none;
        width: 100%;
        opacity: 0.55;
      }
    }

    .sos-slot-skeleton {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 9px;
      padding: 11px;
      border: 1px solid rgba(120, 212, 255, 0.16);
      border-radius: 12px;
      background: rgba(4, 27, 45, 0.72);
    }

    .sos-slot-skeleton-day {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .sos-slot-skeleton-day h3 {
      color: rgba(255, 255, 255, 0.76);
      font-family: var(--matrix-heading);
      font-size: 11px;
      font-weight: 800;
      text-align: center;
      text-transform: uppercase;
    }

    .sos-slot-skeleton-line {
      min-height: 34px;
      border: 1px solid rgba(120, 212, 255, 0.18);
      border-radius: 8px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.06), rgba(120, 212, 255, 0.18), rgba(255, 255, 255, 0.06));
      background-size: 220% 100%;
      animation: sos-load-shimmer 1.5s ease-in-out infinite;
    }

    .sos-slot-skeleton-line.is-open {
      border-color: rgba(61, 255, 154, 0.48);
      background: rgba(61, 255, 154, 0.12);
      box-shadow: 0 0 18px rgba(61, 255, 154, 0.08);
      animation: none;
    }

    .sos-load-foot {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
    }

    .sos-load-error {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 14px;
      border: 1px solid rgba(255, 92, 122, 0.52);
      border-radius: 12px;
      background: rgba(80, 28, 42, 0.52);
    }

    .sos-load-error h3 {
      margin: 0 0 4px;
      font-family: var(--matrix-heading);
      font-size: 16px;
    }

    .sos-load-error p {
      margin: 0;
      color: rgba(255, 225, 230, 0.84);
      font-size: 13px;
      line-height: 1.42;
    }

    @keyframes sos-aurora-a {
      0% { transform: translateX(-80px) skewX(-4deg) scaleY(1); }
      100% { transform: translateX(100px) skewX(5deg) scaleY(1.4); }
    }

    @keyframes sos-aurora-b {
      0% { transform: translateX(70px) skewX(3deg) scaleY(0.9); }
      100% { transform: translateX(-90px) skewX(-6deg) scaleY(1.3); }
    }

    @keyframes sos-aurora-c {
      0% { transform: translateX(-50px) scaleX(1) scaleY(1); }
      100% { transform: translateX(80px) scaleX(1.2) scaleY(1.2); }
    }

    @keyframes sos-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @keyframes sos-load-shimmer {
      0% { background-position: 120% 0; }
      100% { background-position: -120% 0; }
    }

    @keyframes sos-glow-pulse {
      0% { opacity: 0.4; transform: scale(0.96); }
      100% { opacity: 0.88; transform: scale(1.08); }
    }

    @keyframes sos-tracker-pulse {
      0%, 100% { filter: brightness(1); box-shadow: inset 0 0 0 rgba(255, 255, 255, 0); }
      50% { filter: brightness(1.34); box-shadow: inset 0 0 24px rgba(255, 244, 180, 0.62); }
    }

    @keyframes sos-fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 1100px) {
      .sos-grid-stats,
      .sos-grid-two,
      .sos-sched-book-shell,
      .sos-sched-discovery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 800px) {
      #schedule-root {
        --sidebar-w: 0px;
        display: block;
        width: 100%;
      }

      .sos-sidebar {
        position: relative;
        inset: auto;
        width: 100%;
        min-height: auto;
        padding: 16px 0;
      }

      .sos-main {
        margin-left: 0;
      }

      .sos-bg-layer {
        inset: 0;
      }

      .sos-content {
        padding: 24px 16px 44px;
      }

      .sos-page-title {
        font-size: 34px;
      }

      .sos-grid-stats,
      .sos-grid-two,
      .sos-sched-book-shell,
      .sos-sched-discovery,
      .sos-booking-fields,
      .sos-review-preferences,
      .sos-review-summary-grid,
      .sos-confirmation-grid,
      .sos-modal-grid,
      .sos-book-flow,
      .sos-sched-stepper,
      .sos-sched-week,
      .sos-load-head,
      .sos-load-error,
      .sos-slot-skeleton {
        grid-template-columns: 1fr;
      }

      .sos-load-shell {
        padding: 16px;
      }

      .sos-load-foot {
        justify-content: flex-start;
      }

      .sos-file-vault-callout {
        align-items: flex-start;
        flex-direction: column;
      }

      .sos-tracker-labels {
        display: none;
      }

      .sos-segment {
        min-height: 48px;
        font-size: 16px;
      }

      .sos-modal-backdrop {
        align-items: end;
        padding: 12px;
      }

      .sos-modal {
        max-height: calc(100vh - 24px);
        border-radius: 16px;
      }

      .sos-modal-head {
        padding: 20px 18px 10px;
      }

      .sos-modal-body {
        padding: 10px 18px 20px;
      }
    }

    @media (max-width: 480px) {
      .sos-content {
        padding: 20px 12px 40px;
      }

      .sos-page-title {
        font-size: 30px;
      }

      .sos-toolbar .sos-btn {
        flex: 1 1 auto;
        padding-inline: 12px;
      }
    }

    .sos-page-transition {
      animation: sos-step-fade 0.25s ease;
    }
    @keyframes sos-step-fade {
      from { opacity: 0.7; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .sos-step-slide-in {
      animation: sos-slide-in 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    @keyframes sos-slide-in {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .sos-step-slide-out {
      animation: sos-slide-out 0.2s ease forwards;
    }
    @keyframes sos-slide-out {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(-40px); }
    }

    .sos-week-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .sos-week-label {
      font-family: var(--matrix-heading);
      font-size: 14px;
      font-weight: 700;
      color: var(--gold2);
      letter-spacing: 0.03em;
    }
    .sos-btn-sm {
      min-width: 36px;
      min-height: 36px;
      padding: 6px 12px;
      font-size: 13px;
    }
    .sos-view-toggle {
      display: flex;
      gap: 6px;
      margin: 8px 0;
    }
    .sos-view-toggle .is-active {
      border-color: rgba(243, 213, 118, 0.5) !important;
      background: rgba(217, 184, 91, 0.15);
    }

    /* MX-APPT-5003G — founder-approved StoryForge V2 presentation.
       This skin is deliberately scoped to the Scheduler root. Classic remains
       the unchanged MX-APPT-5002 renderer over the same state and API client. */
    #schedule-root[data-appt-experience="storyforge"] {
      --sf-ink: #f7fbff;
      --sf-muted: #9fb3c8;
      --sf-panel: rgba(8, 26, 43, 0.94);
      --sf-panel-2: rgba(12, 38, 61, 0.92);
      --sf-edge: rgba(130, 185, 222, 0.2);
      --sf-cyan: #39d6ff;
      --sf-violet: #9277ff;
      --sf-red: #ff657d;
      display: block;
      min-width: 0;
      background:
        radial-gradient(circle at 82% 8%, rgba(57, 214, 255, 0.12), transparent 32rem),
        radial-gradient(circle at 18% 94%, rgba(146, 119, 255, 0.11), transparent 34rem),
        #061421;
      color: var(--sf-ink);
      overflow: visible;
    }
    #schedule-root[data-appt-experience="storyforge"] .sos-sidebar,
    #schedule-root[data-appt-experience="storyforge"] .sos-bg-layer { display: none !important; }
    #schedule-root[data-appt-experience="storyforge"] .sos-main {
      min-height: 100%;
      margin-left: 0;
      overflow: visible;
    }
    #schedule-root[data-appt-experience="storyforge"] .sos-content {
      width: 100%;
      max-width: none;
      padding: 0;
    }
    .sf-app { min-height: 100%; font-family: "Poppins", sans-serif; }
    .sf-topbar {
      position: sticky;
      top: 0;
      z-index: 18;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 76px;
      padding: 14px clamp(18px, 4vw, 52px);
      border-bottom: 1px solid var(--sf-edge);
      background: rgba(5, 18, 30, 0.94);
      backdrop-filter: blur(18px);
    }
    .sf-matrix-link,
    .sf-nav button,
    .sf-button,
    .sf-chip,
    .sf-option,
    .sf-day,
    .sf-time,
    .sf-row {
      min-height: 44px;
    }
    .sf-matrix-link {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 0 14px;
      border: 1px solid rgba(255, 204, 77, 0.34);
      border-radius: 999px;
      color: var(--gold2);
      font-weight: 700;
    }
    .sf-brand { min-width: 0; flex: 1; }
    .sf-brand b { display: block; font-size: clamp(18px, 2vw, 25px); letter-spacing: -0.04em; }
    .sf-brand span { color: var(--sf-muted); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; }
    .sf-exp {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--sf-edge);
      border-radius: 999px;
      background: rgba(255,255,255,.035);
    }
    .sf-exp button {
      min-height: 44px;
      padding: 0 14px;
      border-radius: 999px;
      background: transparent;
      color: var(--sf-muted);
      font-weight: 700;
    }
    .sf-exp button[aria-pressed="true"] {
      background: linear-gradient(135deg, var(--sf-cyan), var(--sf-violet));
      color: #04111d;
    }
    .sf-nav {
      position: sticky;
      top: 76px;
      z-index: 16;
      display: flex;
      gap: 6px;
      padding: 9px clamp(18px, 4vw, 52px);
      overflow-x: auto;
      border-bottom: 1px solid var(--sf-edge);
      background: rgba(6, 20, 33, 0.95);
    }
    .sf-nav button {
      flex: 0 0 auto;
      min-width: 44px;
      padding: 0 16px;
      border-radius: 10px;
      background: transparent;
      color: var(--sf-muted);
      font-weight: 700;
    }
    .sf-nav button[aria-current="page"] {
      background: linear-gradient(135deg, rgba(57,214,255,.2), rgba(146,119,255,.18));
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(57,214,255,.32);
    }
    .sf-main { width: min(1180px, 100%); margin: 0 auto; padding: clamp(24px, 5vw, 62px) clamp(16px, 4vw, 42px) 96px; }
    .sf-intro { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 18px; align-items: end; margin-bottom: 24px; }
    .sf-kicker { color: var(--sf-cyan); font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    .sf-intro h1 { margin: 7px 0 8px; max-width: 820px; font-size: clamp(34px, 6vw, 70px); line-height: .98; letter-spacing: -.055em; }
    .sf-intro h1 em { color: var(--sf-cyan); font-style: normal; }
    .sf-intro p { max-width: 720px; color: var(--sf-muted); }
    .sf-panel {
      border: 1px solid var(--sf-edge);
      border-radius: 22px;
      background: linear-gradient(155deg, var(--sf-panel-2), var(--sf-panel));
      box-shadow: 0 22px 58px rgba(0,0,0,.24);
    }
    .sf-pad { padding: clamp(18px, 3vw, 30px); }
    .sf-home-grid { display: grid; grid-template-columns: minmax(0,1.2fr) minmax(300px,.8fr); gap: 18px; }
    .sf-discovery { position: relative; padding: clamp(20px, 4vw, 36px); overflow: visible; }
    .sf-prompt { display: block; margin-bottom: 14px; font-size: clamp(22px, 3.3vw, 38px); font-weight: 700; letter-spacing: -.04em; }
    .sf-combobox {
      width: 100%;
      min-height: 58px !important;
      padding: 14px 18px !important;
      border: 1px solid rgba(57,214,255,.42) !important;
      border-radius: 15px !important;
      background: rgba(3,15,26,.78) !important;
      color: #fff;
      font-size: 17px !important;
    }
    .sf-listbox {
      position: absolute;
      z-index: 22;
      top: calc(100% - 24px);
      right: clamp(20px, 4vw, 36px);
      left: clamp(20px, 4vw, 36px);
      max-height: min(460px, 62vh);
      padding: 8px;
      overflow-y: auto;
      border: 1px solid rgba(57,214,255,.32);
      border-radius: 16px;
      background: #071a2b;
      box-shadow: 0 30px 80px rgba(0,0,0,.6);
    }
    .sf-group { padding: 10px 10px 6px; color: var(--sf-cyan); font-size: 11px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .sf-option {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 12px;
      width: 100%;
      padding: 12px;
      border-radius: 11px;
      background: transparent;
      color: #fff;
      text-align: left;
    }
    .sf-option:hover,
    .sf-option[aria-selected="true"] { background: rgba(57,214,255,.11); box-shadow: inset 0 0 0 1px rgba(57,214,255,.3); }
    .sf-option[aria-disabled="true"] { color: #b8c5d2; }
    .sf-option b,
    .sf-option small { display: block; }
    .sf-option small { margin-top: 3px; color: var(--sf-muted); }
    .sf-badge { align-self: center; padding: 5px 8px; border: 1px solid rgba(57,214,255,.28); border-radius: 999px; color: var(--sf-cyan); font-size: 11px; font-weight: 800; white-space: nowrap; }
    .sf-badge.bad { border-color: rgba(255,101,125,.35); color: #ff9aac; }
    .sf-next { padding: 24px; }
    .sf-next h2 { margin: 5px 0 14px; font-size: 24px; }
    .sf-next-time { font-size: 20px; font-weight: 800; }
    .sf-next p { margin: 5px 0; color: var(--sf-muted); }
    .sf-empty,
    .sf-error,
    .sf-notice { padding: 18px; border: 1px solid var(--sf-edge); border-radius: 14px; background: rgba(3,15,26,.45); }
    .sf-error { border-color: rgba(255,101,125,.5); color: #ffd4db; }
    .sf-notice { margin-bottom: 18px; }
    .sf-book { display: grid; gap: 16px; }
    .sf-stepper { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 18px; }
    .sf-step { padding: 13px; border: 1px solid var(--sf-edge); border-radius: 12px; color: var(--sf-muted); background: rgba(255,255,255,.025); }
    .sf-step.is-current { border-color: rgba(57,214,255,.5); color: #fff; }
    .sf-step.is-done { color: #9cffc7; }
    .sf-fieldset { display: grid; gap: 12px; padding: 20px; }
    .sf-fieldset h2 { margin: 0; font-size: 20px; }
    .sf-choices { display: grid; grid-template-columns: repeat(auto-fit,minmax(210px,1fr)); gap: 10px; }
    .sf-choice {
      min-height: 64px;
      padding: 13px 15px;
      border: 1px solid var(--sf-edge);
      border-radius: 13px;
      background: rgba(255,255,255,.03);
      color: #fff;
      text-align: left;
    }
    .sf-choice[aria-checked="true"] { border-color: var(--sf-cyan); background: rgba(57,214,255,.12); }
    .sf-choice[aria-disabled="true"] { opacity: .7; }
    .sf-choice b,
    .sf-choice small { display: block; }
    .sf-choice small { margin-top: 3px; color: var(--sf-muted); }
    .sf-weekbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .sf-days { display: grid; grid-template-columns: repeat(7,1fr); gap: 7px; margin: 16px 0; }
    .sf-day,
    .sf-time {
      padding: 9px;
      border: 1px solid var(--sf-edge);
      border-radius: 11px;
      background: rgba(255,255,255,.025);
      color: #fff;
    }
    .sf-day[aria-pressed="true"],
    .sf-time[aria-pressed="true"] { border-color: var(--sf-cyan); background: rgba(57,214,255,.14); }
    .sf-day b,
    .sf-day small { display: block; }
    .sf-day small { color: var(--sf-muted); }
    .sf-time-groups { display: grid; gap: 16px; }
    .sf-time-group h3 { margin: 0 0 8px; color: var(--sf-muted); font-size: 13px; text-transform: uppercase; letter-spacing: .1em; }
    .sf-times { display: grid; grid-template-columns: repeat(auto-fill,minmax(118px,1fr)); gap: 8px; }
    .sf-summary { margin-top: 15px; padding: 14px; border-left: 3px solid var(--sf-cyan); background: rgba(57,214,255,.07); }
    .sf-actions { position: sticky; bottom: 12px; z-index: 12; display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-top: 18px; padding: 12px; border: 1px solid var(--sf-edge); border-radius: 15px; background: rgba(5,18,30,.95); }
    .sf-button { padding: 0 17px; border: 1px solid var(--sf-edge); border-radius: 11px; background: rgba(255,255,255,.05); color: #fff; font-weight: 800; }
    .sf-button.primary { border: 0; background: linear-gradient(135deg,var(--sf-cyan),var(--sf-violet)); color: #04111d; }
    .sf-button.danger { border-color: rgba(255,101,125,.5); color: #ffadba; }
    .sf-button:disabled { cursor: not-allowed; opacity: .45; }
    .sf-review { display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; margin: 0; }
    .sf-review div { padding: 13px 0; border-bottom: 1px solid var(--sf-edge); }
    .sf-review dt { color: var(--sf-muted); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; }
    .sf-review dd { margin: 5px 0 0; font-weight: 700; }
    .sf-list { display: grid; gap: 10px; }
    .sf-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 15px; border: 1px solid var(--sf-edge); border-radius: 13px; background: rgba(255,255,255,.025); color: #fff; text-align: left; }
    .sf-row b,
    .sf-row small { display: block; }
    .sf-row small { margin-top: 4px; color: var(--sf-muted); }
    .sf-row-actions { display: flex; gap: 7px; flex-wrap: wrap; }
    .sf-row-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .sf-row-head h2 { margin: 0; }
    .sf-appointment { padding: 13px 0; border-top: 1px solid var(--sf-edge); }
    .sf-appointment:first-of-type { border-top: 0; }
    .sf-appointment b,
    .sf-appointment small { display: block; }
    .sf-appointment small { margin-top: 4px; color: var(--sf-muted); }
    .sf-settings-note { display: grid; gap: 10px; }
    .sf-dialog { width: min(560px,calc(100vw - 28px)); padding: 0; border: 1px solid rgba(255,101,125,.45); border-radius: 18px; background: #081d2f; color: #fff; }
    .sf-dialog::backdrop { background: rgba(0,8,16,.74); backdrop-filter: blur(5px); }
    .sf-dialog-inner { padding: 22px; }
    .sf-dialog-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 20px; }
    #schedule-root .sf-app :focus-visible { outline: 3px solid var(--sf-cyan); outline-offset: 3px; }
    .sf-sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .sf-offline { margin-bottom: 16px; border-color: rgba(255,204,77,.5); color: var(--gold2); }
    @media (max-width: 900px) {
      .sf-intro { grid-template-columns: 1fr; }
      .sf-home-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .sf-topbar { position: static; align-items: flex-start; flex-wrap: wrap; min-height: auto; }
      .sf-brand { order: -1; flex-basis: calc(100% - 120px); }
      .sf-matrix-link span { display: none; }
      .sf-nav { position: static; }
      .sf-listbox { position: static; max-height: 58vh; margin-top: 8px; }
      .sf-option { min-height: 60px; }
      .sf-days { grid-template-columns: repeat(4,1fr); }
      .sf-review { grid-template-columns: 1fr; }
      .sf-row { grid-template-columns: 1fr; }
      .sf-actions { bottom: 8px; }
    }
    @media (max-width: 390px) {
      .sf-main { padding-inline: 12px; }
      .sf-days { gap: 4px; }
      .sf-day { padding-inline: 5px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sf-app *, .sos-page-transition, .sos-step-slide-in, .sos-step-slide-out { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div id="schedule-root" data-mode="standalone" data-api-base="/api/scheduler"></div>

  <script>
    (function () {
      "use strict";

      var scheduler = window.MMEDScheduler || {};
      var refs = {};
      var EASTERN_TIMEZONE = "America/New_York";

      // Canonical source revision. The adapter reads this to decide which patch set applies:
      // a bundle without the marker is the pre-MX-APPT-5002 CDN artifact and still needs the
      // legacy patches; a bundle with it already carries those fixes at source.
      var MMED_SCHEDULER_SOURCE_REV = "MX-APPT-5003G";

      // MX-APPT-5002C item 2 — formatters hoisted to module scope.
      //
      // localDateKey() and easternTimeKey() each constructed a fresh Intl.DateTimeFormat on
      // every call, and slotForMatrixCell() called both once per slot per cell. At 108 slots
      // over a 22x7 grid that was ~33,000 constructions and 154 array sorts per render, which
      // measured at 766ms of synchronous main-thread work — paid again on every slot click,
      // every step change and every week navigation. Intl formatters are immutable and
      // timezone-pinned, so there is no reason to build more than one of each.
      var EASTERN_DATE_FORMAT = new Intl.DateTimeFormat("en-CA", {
        timeZone: EASTERN_TIMEZONE, year: "numeric", month: "2-digit", day: "2-digit"
      });
      var EASTERN_TIME_FORMAT = new Intl.DateTimeFormat("en-US", {
        timeZone: EASTERN_TIMEZONE, hour: "2-digit", minute: "2-digit", hour12: false
      });
      var EASTERN_DAY_LABEL_FORMAT = new Intl.DateTimeFormat([], {
        weekday: "short", month: "short", day: "numeric", timeZone: EASTERN_TIMEZONE
      });
      var BOOKING_DIVISIONS = [
        {
          id: "non-member",
          name: "Non-Member",
          meetingCopy: "After booking, you'll receive an email with your consultation details. Your Matrix Calendar will also show this appointment on the scheduled date.",
          visits: [
            { slug: "consult-non-member", aliases: ["non-member-consult"], label: "Consult: Non-Member", mentors: ["dr-brian", "dr-j"] }
          ]
        },
        {
          id: "mission-residency",
          name: "Mission Residency",
          meetingCopy: "After booking, you'll receive an email with your session link. Your Matrix Calendar will also show this appointment on the scheduled date.",
          visits: [
            { slug: "mission-residency-1-on-1-advising", label: "1-on-1 Advising", mentors: ["dr-brian", "dr-s"] },
            { slug: "mission-residency-personal-statement", label: "Personal Statement", mentors: ["dr-brian", "dr-s"] },
            { slug: "mission-residency-1-on-1-mock-iv", label: "1-on-1 Mock IV", mentors: ["dr-brian", "dr-s"] },
            { slug: "mission-residency-eras-application-review", label: "ERAS Application Review", mentors: ["dr-brian", "dr-s"] },
            { slug: "mission-residency-small-group-advising", label: "Small Group Advising", mentors: ["dr-brian", "dr-s"] },
            { slug: "mission-residency-open-door-office-hours", label: "Open Door Office Hours", mentors: ["dr-brian", "dr-s"] }
          ]
        },
        {
          id: "exam-prep",
          name: "Exam Prep",
          meetingCopy: "After booking, you'll receive an email with your session link. Your Matrix Calendar will also show this appointment on the scheduled date.",
          visits: [
            { slug: "exam-prep-1-on-1-advising", label: "1-on-1 Advising", mentors: ["dr-j", "sophia"] },
            { slug: "exam-prep-small-group", label: "Small Group", mentors: ["dr-j", "sophia"] }
          ]
        }
      ];

      scheduler.state = {
        route: "home",
        bookingStep: 1,
        mode: "standalone",
        apiBase: "/api/scheduler",
        timezone: EASTERN_TIMEZONE,
        csrfToken: "",
        accessToken: "",
        boot: null,
        bootError: "",
        notice: "",
        noticeError: false,
        loading: false,
        loadingError: "",
        loadingTransitionContext: "catalog",
        loadingTransitionStep: 0,
        loadingTransitionTimer: null,
        catalogLoading: false,
        appointmentsLoading: false,
        availabilityLoading: false,
        appointmentTypes: [],
        entitlements: null,
        providers: [],
        slots: [],
        appointmentTypeId: "",
        providerId: "",
        selectedSlotKey: "",
        division: "",
        upcoming: [],
        history: [],
        upcomingError: "",
        historyError: "",
        rescheduleAppointmentId: "",
        bookingState: "Draft",
        bookingSubmitting: false,
        bookingConfirmed: false,
        confirmedAppointment: null,
        confirmedMeeting: null,
        activeModal: "",
        date: nextDateValue(),
        intake: "",
        emailOptIn: true,
        smsOptIn: false,
        smsPhone: "",
        slotView: "week",
        experience: "storyforge",
        experiencePersistence: "unavailable",
        discoveryOpen: false,
        discoveryQuery: "",
        discoveryActive: 0,
        selectedDay: "",
        offline: typeof navigator !== "undefined" && navigator.onLine === false
      };

      function isLocalPreview() {
        return window.location && window.location.protocol === "file:";
      }

      function localPreviewAppointmentTypes() {
        return BOOKING_DIVISIONS.reduce(function (rows, division) {
          division.visits.forEach(function (visit) {
            rows.push({
              id: "preview-" + visit.slug,
              slug: visit.slug,
              name: visit.label,
              description: "",
              duration_minutes: 30,
              capacity: 1,
              group_enabled: false,
              meeting_mode: "manual",
              status: "active",
              active: true,
              entitlement: { status: "eligible", locked: false },
              metadata: { division: division.id },
              student_config: {
                instructions: "",
                intake_fields: [],
                payments: { required: false, mode: "none" },
                web_meetings: { provider: "manual", link_policy: "after_confirmation" }
              }
            });
          });
          return rows;
        }, []);
      }

      function localPreviewProviders() {
        return [
          { id: "preview-dr-brian", display_name: "Dr. Brian", name: "Dr. Brian", metadata: { provider_slug: "dr-brian" } },
          { id: "preview-dr-j", display_name: "Dr J", name: "Dr J", metadata: { provider_slug: "dr-j" } },
          { id: "preview-dr-s", display_name: "Dr S", name: "Dr S", metadata: { provider_slug: "dr-s" } },
          { id: "preview-sophia", display_name: "Sophia", name: "Sophia", metadata: { provider_slug: "sophia" } }
        ];
      }

      function localPreviewSlots() {
        var selected = new Date(scheduler.state.date + "T12:00:00.000Z");
        var slots = [];
        for (var offset = 1; offset <= 5; offset += 1) {
          var day = new Date(selected.getTime() + offset * 24 * 60 * 60 * 1000);
          if (day.getUTCDay() === 0 || day.getUTCDay() === 6) continue;
          ["11:00", "12:00", "13:00"].forEach(function (time) {
            var parts = time.split(":");
            var endHour = String(Math.min(23, Number(parts[0]) + 1)).padStart(2, "0");
            slots.push({
              id: "preview-slot-" + dateInputValue(day) + "-" + time,
              starts_at: dateInputValue(day) + "T" + time + ":00-04:00",
              ends_at: dateInputValue(day) + "T" + endHour + ":" + (parts[1] || "00") + ":00-04:00",
              provider_id: scheduler.state.providerId,
              appointment_type_id: scheduler.state.appointmentTypeId
            });
          });
        }
        return slots;
      }

      scheduler.components = {
        pageHeader: function (eyebrow, title, copy) {
          return [
            '<header class="sos-page-header">',
            '<span class="sos-eyebrow">' + escapeHTML(eyebrow) + "</span>",
            '<h1 class="sos-page-title">' + escapeHTML(title) + "</h1>",
            copy ? '<p class="sos-page-copy">' + escapeHTML(copy) + "</p>" : "",
            "</header>"
          ].join("");
        },

        statCard: function (value, label, tone, sublabel) {
          return [
            '<div class="sos-card sos-stat">',
            "<div>",
            '<span class="sos-stat-value" style="color:' + escapeAttr(tone || "var(--gold2)") + '">' + escapeHTML(value) + "</span>",
            '<span class="sos-stat-label">' + escapeHTML(label) + "</span>",
            sublabel ? '<span class="sos-stat-sub">' + escapeHTML(sublabel) + "</span>" : "",
            "</div>",
            "</div>"
          ].join("");
        },

        tracker: function (phase) {
          var phases = phase && Array.isArray(phase.phases) ? phase.phases : defaultSchedulePhase().phases;
          var currentIndex = phase && typeof phase.current_index === "number" ? phase.current_index : defaultSchedulePhase().current_index;
          var currentPhase = phases[currentIndex] || phases[0] || null;

          return [
            '<div class="sos-tracker-board sos-tracker sos-schedule-tracker" aria-label="Scheduler journey tracker">',
            '<div class="sos-tracker-top"><div>',
            '<div class="sos-tracker-title">Schedule<span>Journey</span></div>',
            '<div class="sos-tracker-copy">Completed segments turn green; your current booking step pulses orange.</div>',
            "</div></div>",
            '<div class="sos-tracker-labels" style="grid-template-columns:repeat(' + phases.length + ',1fr)">',
            phases.map(function (item) {
              return "<span>" + escapeHTML(item.name || item.id || "") + "</span>";
            }).join(""),
            "</div>",
            '<div class="sos-segment-bar sos-tracker-track" style="grid-template-columns:repeat(' + phases.length + ',1fr)">',
            phases.map(function (item, index) {
              var classes = ["sos-segment", "sos-tracker-segment"];
              // data-tracker-step allows clicking segments to jump to that step
              if (item.complete) {
                classes.push("is-complete");
              } else if (index === currentIndex) {
                classes.push("is-active");
              }
              return '<div class="' + classes.join(" ") + '" data-tracker-step="' + (index + 1) + '">' + (index + 1) + "</div>";
            }).join(""),
            "</div>",
            '<div class="sos-status-strip">Current step: <strong>' + escapeHTML(currentPhase ? currentPhase.name || currentPhase.id : "Assigned") + "</strong></div>",
            "</div>"
          ].join("");
        },

        loading: function (label) {
          return '<div class="sos-loading">' + escapeHTML(label || "Loading schedule data...") + "</div>";
        },

        slotGridLoading: function (options) {
          options = options || {};
          var step = loadingStep(options.context || scheduler.state.loadingTransitionContext || "catalog");
          var error = options.error || scheduler.state.loadingError;
          var title = error ? "Loading needs attention" : step.title;
          var message = error ? (scheduler.state.loadingError || "We could not finish loading appointment options.") : loadingMessage(step);
          var status = error ? "Needs attention" : "Loading";
          return [
            '<div class="sos-load-shell" data-sos-loading-shell aria-live="polite" role="status">',
            '<div class="sos-load-head">',
            "<div>",
            '<p class="sos-load-kicker" data-sos-load-kicker>' + escapeHTML(step.kicker || "Loading appointment options") + "</p>",
            '<h2 class="sos-load-title" data-sos-load-title>' + escapeHTML(title) + "</h2>",
            '<p class="sos-load-message" data-sos-load-message>' + escapeHTML(message) + "</p>",
            "</div>",
            '<div class="sos-load-progress">',
            '<div class="sos-load-meta"><span data-sos-load-state>' + escapeHTML(status) + '</span></div>',
            '<div class="sos-load-track"><div class="sos-load-fill"></div></div>',
            "</div>",
            "</div>",
            slotSkeletonMarkup(),
            error ? loadingErrorMarkup() : '<div class="sos-load-foot"><span class="sos-pill sos-tier-medium">Eastern / New York</span></div>',
            "</div>"
          ].join("");
        },

        empty: function (title, copy) {
          return [
            '<div class="sos-empty sos-empty-rich">',
            '<div class="sos-empty-icon">Sc</div>',
            '<h3>' + escapeHTML(title) + "</h3>",
            '<p>' + escapeHTML(copy || "") + "</p>",
            "</div>"
          ].join("");
        }
      };

      scheduler.api = {
        request: function (path, options) {
          options = options || {};
          var headers = {
            Accept: "application/json"
          };
          if (options.body) {
            headers["Content-Type"] = "application/json";
          }
          if (scheduler.state.csrfToken) {
            headers["x-mmhq-csrf"] = scheduler.state.csrfToken;
          }
          if (scheduler.state.accessToken) {
            headers.Authorization = "Bearer " + scheduler.state.accessToken;
          }
          var requestBody = options.body ? JSON.stringify(options.body) : undefined;

          function attempt(number) {
            var controller = typeof AbortController === "function" ? new AbortController() : null;
            var timer = controller ? window.setTimeout(function () { controller.abort(); }, 10000) : null;
            return fetch(scheduler.state.apiBase + path, {
              method: options.method || "GET",
              headers: headers,
              body: requestBody,
              credentials: "same-origin",
              signal: controller ? controller.signal : undefined
            }).then(function (response) {
              return response.json().catch(function () {
                return {};
              }).then(function (payload) {
                return response.ok ? payload : Object.assign({ ok: false, status: response.status }, payload);
              });
            }).catch(function (error) {
              return {
                ok: false,
                error: error && error.name === "AbortError" ? "request_timeout" : "network_error",
                message: error && error.name === "AbortError" ?
                  "The scheduling service took too long to respond." :
                  "We could not reach the scheduling service."
              };
            }).then(function (result) {
              if (number === 0 && !result.ok && (result.error === "network_error" ||
                result.error === "request_timeout" || Number(result.status || 0) >= 500)) {
                return attempt(1);
              }
              return result;
            }).finally(function () {
              if (timer) window.clearTimeout(timer);
            });
          }

          return attempt(0);
        },

        get: function (path) {
          return this.request(path);
        },

        post: function (path, body) {
          return this.request(path, { method: "POST", body: body || {} });
        }
      };

      scheduler.mount = function (config) {
        config = config || {};
        stopLoadingTransition();
        refs.root = typeof config.target === "string" ? document.querySelector(config.target) : config.target;
        if (!refs.root) {
          refs.root = document.getElementById("schedule-root");
        }
        if (!refs.root) {
          return;
        }

        scheduler.state.mode = config.mode || refs.root.getAttribute("data-mode") || "standalone";
        scheduler.state.apiBase = config.apiBase || refs.root.getAttribute("data-api-base") || "/api/scheduler";

        if (scheduler.state.mode === "embedded") {
          refs.content = refs.root;
          refs.root.classList.add("sos-schedule-embedded");
        } else {
          refs.root.innerHTML = standaloneShell();
          refs.sidebar = refs.root.querySelector("[data-scheduler-sidebar]");
          refs.content = refs.root.querySelector("[data-scheduler-content]");
        }

        scheduler.router.start();
        scheduler.bootstrap();
      };

      scheduler.router = {
        start: function () {
          if (scheduler.state.mode === "standalone") {
            window.addEventListener("hashchange", scheduler.router.route);
            scheduler.router.route();
          } else {
            scheduler.render.page(scheduler.state.route);
          }
        },

        route: function () {
          var route = window.location.hash.replace(/^#\/?/, "") || scheduler.state.route || "book";
          var allowed = ["home", "book", "upcoming", "history", "settings"];
          if (allowed.indexOf(route) === -1) {
            route = "book";
          }
          scheduler.state.route = route;
          scheduler.render.sidebar();
          scheduler.render.page(route);
        },

        go: function (route) {
          if (scheduler.state.mode === "standalone") {
            window.location.hash = route;
          } else {
            scheduler.state.route = route;
            scheduler.render.page(route);
          }
        }
      };

      scheduler.bootstrap = function () {
        scheduler.state.loading = true;
        scheduler.state.loadingError = "";
        startLoadingTransition("catalog");
        scheduler.render.page(scheduler.state.route);
        // MX-APPT-5002D item 4 — bootstrap and appointment-types are independent reads, so
        // they go out together instead of one after the other. /appointment-types does not
        // consume anything bootstrap returns, so this removes a full round trip from the time
        // to a usable booking surface without changing either request.
        loadAuthSession().then(function () {
          scheduler.state.catalogLoading = true;
          return Promise.all([
            scheduler.api.get("/bootstrap"),
            loadAppointmentTypes()
          ]);
        }).then(function (results) {
          var boot = results[0];
          scheduler.state.boot = boot.ok ? boot.data : null;
          scheduler.state.entitlements = boot.ok && boot.data && boot.data.config ? boot.data.config.entitlements || scheduler.state.entitlements : scheduler.state.entitlements;
          scheduler.state.bootError = boot.ok || isLocalPreview() ? "" : boot.message || boot.error || "Scheduler is not available yet.";
          scheduler.state.catalogLoading = false;
          scheduler.render.sidebar();
          return loadAll();
        }).then(function () {
          scheduler.state.loading = false;
          stopLoadingTransition();
          scheduler.render.sidebar();
          scheduler.render.page(scheduler.state.route);
        }).catch(function (error) {
          scheduler.state.loading = false;
          scheduler.state.catalogLoading = false;
          scheduler.state.appointmentsLoading = false;
          scheduler.state.loadingError = error && error.message ? error.message : "Scheduler data did not load. Please retry.";
          stopLoadingTransition();
          scheduler.render.page(scheduler.state.route);
        });
      };

      scheduler.render = {
        sidebar: function () {
          if (!refs.sidebar) {
            return;
          }
          refs.sidebar.innerHTML = [
            '<div class="sos-brand">',
            '<div class="sos-brand-mark">MM</div>',
            '<div class="sos-brand-title">Matrix<small>MissionMed</small></div>',
            "</div>",
            '<div class="sos-nav-section">',
            '<div class="sos-nav-label">Planning</div>',
            '<ul class="sos-nav-list">',
            navLink("book", "Book", "Bk", ""),
            navLink("upcoming", "Upcoming", "Up", scheduler.state.upcoming.length),
            navLink("history", "History", "Hi", scheduler.state.history.length),
            "</ul>",
            "</div>",
            '<div class="sos-nav-section">',
            '<div class="sos-nav-label">Account</div>',
            '<ul class="sos-nav-list">',
            '<li><span class="sos-nav-link"><span class="sos-nav-icon">TZ</span><span>' + escapeHTML(scheduler.state.timezone) + "</span></span></li>",
            "</ul>",
            "</div>",
            '<div class="sos-sidebar-footer">',
            '<div class="sos-panel-copy">' + escapeHTML(sidebarStatus()) + "</div>",
            "</div>"
          ].join("");

          refs.sidebar.querySelectorAll("[data-route]").forEach(function (link) {
            link.addEventListener("click", function (event) {
              event.preventDefault();
              scheduler.router.go(link.getAttribute("data-route"));
            });
          });
        },

        page: function (route) {
          if (!refs.content) {
            return;
          }
          if (scheduler.state.loading || scheduler.state.loadingError) {
            refs.content.innerHTML = [
              '<section class="sos-page">',
              scheduler.components.pageHeader("Planning", "Book a Session", "Select your division, choose a mentor, then reserve a published time."),
              scheduler.components.tracker(defaultSchedulePhase()),
              scheduler.components.slotGridLoading({ context: scheduler.state.loadingTransitionContext || "catalog", error: scheduler.state.loadingError }),
              "</section>"
            ].join("");
            bindLoadingControls();
            return;
          }
          if (route === "upcoming") {
            renderUpcoming();
          } else if (route === "history") {
            renderHistory();
          } else {
            renderBook();
          }
          var page = refs.content.querySelector(".sos-page");
          if (page) {
            page.classList.remove("sos-page-transition");
            void page.offsetWidth;
            page.classList.add("sos-page-transition");
          }
          bindCurrentView();
        }
      };

      function renderBookingStepOnly() {
        var flow = refs.content ? refs.content.querySelector(".sos-book-flow") : null;
        if (!flow) {
          scheduler.render.page(scheduler.state.route);
          return;
        }
        flow.innerHTML = activeBookingStepMarkup();
        flow.classList.remove("sos-page-transition");
        void flow.offsetWidth;
        flow.classList.add("sos-page-transition");
        bindCurrentView();
      }

      function standaloneShell() {
        return [
          '<aside class="sos-sidebar" data-scheduler-sidebar></aside>',
          '<main class="sos-main">',
          '<div class="sos-bg-layer"><div class="sos-bg sos-bg-a"></div><div class="sos-bg sos-bg-b"></div><div class="sos-bg sos-bg-c"></div></div>',
          '<div class="sos-content" data-scheduler-content></div>',
          "</main>"
        ].join("");
      }

      function renderBook() {

      function confirmedMeetingUrl(appointment, meeting) {
        var nested = appointment && appointment.meeting ? appointment.meeting : {};
        var candidates = [
          meeting && meeting.meeting_url,
          meeting && meeting.meetingUrl,
          meeting && meeting.join_url,
          meeting && meeting.joinUrl,
          meeting && meeting.webex_url,
          meeting && meeting.webexUrl,
          meeting && meeting.zoom_url,
          meeting && meeting.zoomUrl,
          appointment && appointment.meeting_url,
          appointment && appointment.meetingUrl,
          appointment && appointment.join_url,
          appointment && appointment.joinUrl,
          appointment && appointment.webex_url,
          appointment && appointment.webexUrl,
          appointment && appointment.zoom_url,
          appointment && appointment.zoomUrl,
          nested && nested.meeting_url,
          nested && nested.join_url,
          nested && nested.webex_url,
          nested && nested.zoom_url
        ];
        for (var i = 0; i < candidates.length; i += 1) {
          var url = String(candidates[i] || "").trim();
          if (/^https?:\/\//i.test(url)) {
            return url;
          }
        }
        return "";
      }

      function confirmedMeetingMarkup(meetingUrl) {
        if (meetingUrl) {
          return [

        ].join("");

      function calendarEventDetails(appointment, meetingUrl) {
        var type = selectedAppointmentType();
        var provider = selectedProvider();
        var slot = selectedSlot();
        var start = appointment.start_at || appointment.startAt || (slot ? slotStart(slot) : "");
        var duration = appointment.duration_minutes || appointment.duration || (type ? type.duration_minutes || type.duration || 60 : 60);
        var end = appointment.end_at || appointment.endAt || addMinutesIso(start, duration);
        var typeName = appointment.appointment_type_name || selectedVisitLabel() || (type ? type.name || type.title || type.id : "MissionMed appointment");
        var providerName = appointment.provider_name || (provider ? provider.display_name || provider.name || provider.id : "MissionMed provider");
        var title = typeName + " with " + providerName;
        var details = "Your MissionMed appointment is confirmed and has been added to Matrix Calendar.";
        if (meetingUrl) {
          details += "\n\nSession link: " + meetingUrl;
        }
        return {
          title: title,
          type: typeName,
          provider: providerName,
          start: start,
          end: end,
          durationLabel: String(duration || 60) + " minutes",
          location: meetingUrl || "MissionMed Matrix",
          details: details
        };
      }

      function googleCalendarHref(event) {
        var dates = calendarUtcStamp(event.start) + "/" + calendarUtcStamp(event.end);
        var pairs = [
          ["action", "TEMPLATE"],
          ["text", event.title],
          ["dates", dates],
          ["details", event.details],
          ["location", event.location]
        ];
        return "https://calendar.google.com/calendar/render?" + pairs.map(function (pair) {
          return encodeURIComponent(pair[0]) + "=" + encodeURIComponent(pair[1] || "");
        }).join("&");
      }

      function icsCalendarHref(event, appointment) {
        var uid = String(appointment.id || appointment.appointment_id || "missionmed-session-" + Date.now());
        var lines = [
          "BEGIN:VCALENDAR",
          "VERSION:2.0",
          "PRODID:-//MissionMed//Scheduler//EN",
          "BEGIN:VEVENT",
          "UID:" + escapeIcs(uid) + "@missionmedinstitute.com",
          "DTSTAMP:" + calendarUtcStamp(new Date().toISOString()),
          "SUMMARY:" + escapeIcs(event.title),
          "DESCRIPTION:" + escapeIcs(event.details),
          "LOCATION:" + escapeIcs(event.location)
        ];
        if (event.start) {
          lines.push("DTSTART:" + calendarUtcStamp(event.start));
        }
        if (event.end) {
          lines.push("DTEND:" + calendarUtcStamp(event.end));
        }
        lines.push("END:VEVENT", "END:VCALENDAR");
        return "data:text/calendar;charset=utf-8," + encodeURIComponent(lines.join("\r\n"));
      }

      function addMinutesIso(value, minutes) {
        if (!value) {
          return "";
        }
        var date = new Date(value);
        if (Number.isNaN(date.getTime())) {
          return "";
        }
        return new Date(date.getTime() + (Number(minutes || 60) * 60000)).toISOString();
      }

      function calendarUtcStamp(value) {
        if (!value) {
          return "";
        }
        var date = new Date(value);
        if (Number.isNaN(date.getTime())) {
          return "";
        }
        return date.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}Z$/, "Z");
      }

      function escapeIcs(value) {
        return String(value == null ? "" : value)
          .replace(/\\/g, "\\\\")
          .replace(/\n/g, "\\n")
          .replace(/,/g, "\\,")
          .replace(/;/g, "\\;");
      }

          '<div class="sos-field"><label for="schedule-intake">Notes</label><textarea id="schedule-intake" name="intake" placeholder="Anything you want your mentor to know before the session">' + escapeHTML(scheduler.state.intake) + "</textarea></div>",
