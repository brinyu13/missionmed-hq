        function renderStoryHome() {
          var rows = storyDiscoveryRows();
          return [
            storyIntro("MissionMed Appointments", escapeHTML(storyGreeting()) +
              ".", "Choose what you need. Appointments will show only live Scheduler options and preserve the service's eligibility decision."),
            storyNotice(),
            '<div class="sf-home-grid">',
            '<section class="sf-panel sf-discovery">',
            '<label class="sf-prompt" id="sf-discovery-label" for="sf-discovery-input">What would you like to book an appointment for?</label>',
            '<input class="sf-combobox" id="sf-discovery-input" type="search" role="combobox" aria-autocomplete="list" aria-haspopup="listbox" aria-expanded="' +
              (scheduler.state.discoveryOpen ? "true" : "false") +
              '" aria-controls="sf-discovery-list" aria-labelledby="sf-discovery-label" aria-activedescendant="' +
              (scheduler.state.discoveryOpen && rows.length ? "sf-option-" + Math.min(scheduler.state.discoveryActive, rows.length - 1) : "") +
              '" value="' + escapeAttr(scheduler.state.discoveryQuery) +
              '" placeholder="Search advising, mock interview, personal statement…">',
            '<span class="sf-sr" aria-live="polite">' + escapeHTML(rows.length + " appointment types found") + "</span>",
            storyDiscoveryList(),
            "</section>",
            storyNextAppointment(),
            "</div>",
            '<div class="sf-home-grid">',
            storyHomeScheduleList((scheduler.state.upcoming || []).slice(1), "Also upcoming", "upcoming", "No additional upcoming appointments."),
            storyHomeScheduleList(scheduler.state.history || [], "Recent history", "history", "No appointment history yet."),
            "</div>"
          ].join("");
        }

        function storyStepper() {
          var labels = ["Details", "Time", "Confirm"];
          return '<ol class="sf-stepper" aria-label="Booking steps">' + labels.map(function (label, index) {
            var step = index + 1;
            var state = step < scheduler.state.bookingStep ? "is-done" : step === scheduler.state.bookingStep ? "is-current" : "";
            return '<li class="sf-step ' + state + '"' + (step === scheduler.state.bookingStep ? ' aria-current="step"' : "") +
              '><b>' + (step < scheduler.state.bookingStep ? "✓ " : step + " · ") + escapeHTML(label) + "</b></li>";
          }).join("") + "</ol>";
        }

        function storyDetails() {
          var divisions = visibleBookingDivisions();
          var types = visitTypeOptions();
          var type = selectedAppointmentType();
          return [
            '<section class="sf-panel sf-fieldset">',
            "<h2>1 · Program</h2>",
            '<div class="sf-choices" role="radiogroup" aria-label="Program">',
            divisions.map(function (division) {
              return '<button type="button" class="sf-choice" role="radio" aria-checked="' +
                (scheduler.state.division === division.id ? "true" : "false") +
                '" data-sf-action="division" data-value="' + escapeAttr(division.id) +
                '"><b>' + escapeHTML(division.name) + "</b></button>";
            }).join(""),
            "</div></section>",
            scheduler.state.division ? [
              '<section class="sf-panel sf-fieldset"><h2>2 · Appointment type</h2>',
              types.length ? '<div class="sf-choices" role="radiogroup" aria-label="Appointment type">' +
                types.map(function (option) {
                  var unavailable = storyUnavailable(option.type);
                  return '<button type="button" class="sf-choice" role="radio" aria-checked="' +
                    (scheduler.state.appointmentTypeId === option.type.id ? "true" : "false") +
                    '" aria-disabled="' + (unavailable ? "true" : "false") +
                    '" data-sf-action="type" data-value="' + escapeAttr(option.type.id) +
                    '"><b>' + escapeHTML(option.label) + '</b><small>' +
                    escapeHTML(unavailable ? storyUnavailableMessage(option.type) : (option.type.description || storyTypeStatus(option.type))) +
                    "</small></button>";
                }).join("") + "</div>" : '<div class="sf-empty">No configured appointment types are available in this program.</div>',
              "</section>"
            ].join("") : "",
            type ? [
              '<section class="sf-panel sf-fieldset"><h2>3 · Mentor</h2>',
              scheduler.state.providers.length ? '<div class="sf-choices" role="radiogroup" aria-label="Mentor">' +
                scheduler.state.providers.map(function (provider) {
                  return '<button type="button" class="sf-choice" role="radio" aria-checked="' +
                    (scheduler.state.providerId === provider.id ? "true" : "false") +
                    '" data-sf-action="provider" data-value="' + escapeAttr(provider.id) +
                    '"><b>' + escapeHTML(provider.display_name || provider.name) +
                    '</b><small>' + escapeHTML(provider.role || "MissionMed mentor") + "</small></button>";

              "</section>"

              (!(scheduler.state.division && scheduler.state.appointmentTypeId && scheduler.state.providerId && !storyUnavailable(type)) ? " disabled" : "") +
              ">Continue to times</button></div>"
          ].join("");

        function storyWeekKeys() {
          return weekDays().map(function (day) { return localDateKey(day); });
        }

        function storyOpenSlotsForDay(key) {
          return scheduler.state.slots.filter(function (slot) {
            return localDateKey(slotStart(slot)) === key;
          });
        }

        function storyTimeStep() {
          if (scheduler.state.availabilityLoading) return storyLoading("Loading live availability");
          if (scheduler.state.noticeError) return storyError("Availability did not load", scheduler.state.notice, "retry-availability");
          var days = storyWeekKeys();
          var counts = {};
          days.forEach(function (day) {
            counts[day] = storyOpenSlotsForDay(day).filter(function (slot) { return slot.available !== false; }).length;
          });
          if (!scheduler.state.selectedDay || days.indexOf(scheduler.state.selectedDay) === -1) {
            scheduler.state.selectedDay = days.filter(function (day) { return counts[day] > 0; })[0] || days[0];
          }
          var daySlots = storyOpenSlotsForDay(scheduler.state.selectedDay);
          var groups = [
            ["Morning", function (hour) { return hour < 12; }],
            ["Afternoon", function (hour) { return hour >= 12 && hour < 17; }],
            ["Evening", function (hour) { return hour >= 17; }]
          ];
          var slot = selectedSlot();
          return [
            '<section class="sf-panel sf-pad">',
            '<div class="sf-weekbar"><button type="button" class="sf-button" data-sf-action="prev-week">← Previous</button><b>' +
              escapeHTML(formatDate(days[0]) + " – " + formatDate(days[6])) +
              '</b><button type="button" class="sf-button" data-sf-action="next-week">Next →</button></div>',
            '<div class="sf-days" role="group" aria-label="Choose a day">',
            days.map(function (day) {
              return '<button type="button" class="sf-day" data-sf-action="day" data-value="' +
                escapeAttr(day) + '" aria-pressed="' + (scheduler.state.selectedDay === day ? "true" : "false") +
                '"><b>' + escapeHTML(formatDate(day + "T12:00:00-04:00")) + '</b><small>' +
                escapeHTML(counts[day] ? counts[day] + " open" : "No openings") + "</small></button>";
            }).join(""),
            "</div>",
            daySlots.length ? '<div class="sf-time-groups">' + groups.map(function (group) {
              var slots = daySlots.filter(function (item) {
                return group[1](parseInt(easternTimeKey(slotStart(item)).split(":")[0], 10));
              });
              if (!slots.length) return "";
              return '<section class="sf-time-group"><h3>' + group[0] + '</h3><div class="sf-times" role="group" aria-label="' +
                group[0] + ' times">' + slots.map(function (item) {
                var key = slotKey(item);
                var unavailable = item.available === false;
                return '<button type="button" class="sf-time" data-sf-action="slot" data-slot-key="' +
                  escapeAttr(key) + '" aria-pressed="' + (scheduler.state.selectedSlotKey === key ? "true" : "false") +
                  '" aria-label="' + escapeAttr(formatDateTime(slotStart(item)) + " Eastern" + (unavailable ? ", unavailable" : ", available")) +
                  '"' + (unavailable ? " disabled" : "") + '><b>' + escapeHTML(formatTime(slotStart(item))) +
                  '</b><small>' + (unavailable ? "Taken" : "Open") + "</small></button>";
              }).join("") + "</div></section>";
            }).join("") + "</div>" :
              '<div class="sf-empty"><strong>No openings this day.</strong><p>Choose another day or look ahead for the next available week.</p><button type="button" class="sf-button" data-sf-action="next-available">Next available ›</button></div>',
            slot ? '<div class="sf-summary" role="status"><strong>Selected:</strong> ' +
              escapeHTML(formatDateTime(slotStart(slot)) + " ET · " + (selectedProvider() ? selectedProvider().display_name || selectedProvider().name : "")) +
              "</div>" : "",
            '<div class="sf-actions"><button type="button" class="sf-button" data-sf-action="previous-step">Back</button><button type="button" class="sf-button primary" data-sf-action="next-step"' +
              (slot ? "" : " disabled") + ">Review appointment</button></div>",
            "</section>"
          ].join("");
        }

        function storyReview() {

          var provider = selectedProvider();

          var meetingConfig = type.student_config && type.student_config.web_meetings ? type.student_config.web_meetings : {};
          var rows = [
            ["Program", storyDivisionName(type.division)],
            ["Appointment", type.name || type.slug],
            ["Mentor", provider.display_name || provider.name],
            ["Date and time", formatDateTime(slotStart(slot)) + " ET"],
            ["Duration", String(type.duration_minutes || "") + " minutes"],

          ];

            '<section class="sf-panel sf-pad">',
            "<h2>Review and confirm</h2>",
            '<dl class="sf-review">',

              (scheduler.state.smsOptIn ? "checked" : "") + "></label>",
            scheduler.state.smsOptIn ? '<div class="sos-field"><label for="schedule-sms-phone">Reminder phone</label><input id="schedule-sms-phone" type="tel" autocomplete="tel" value="' +
              escapeAttr(scheduler.state.smsPhone) + '"></div>' : "",
            storyNotice(),
            '<div class="sf-actions"><button type="button" class="sf-button" data-sf-action="previous-step">Back</button><button type="button" class="sf-button primary" data-sf-action="confirm-booking" aria-busy="' +
              (scheduler.state.bookingSubmitting ? "true" : "false") + '"' +
              (scheduler.state.bookingSubmitting ? " disabled" : "") + ">" +
              (scheduler.state.bookingSubmitting ? "Saving your appointment…" :
                (scheduler.state.rescheduleAppointmentId ? "Confirm new time" : "Confirm appointment")) +
              "</button></div>",
            "</section>"
          ].join("");

        function storyConfirmation() {

              '<div class="sf-notice">Your meeting link is not available yet. It will appear only when the live service returns one.</div>',
            '<div class="sf-actions"><button type="button" class="sf-button" data-sf-action="reset-booking">Book another</button><button type="button" class="sf-button primary" data-sf-action="route" data-route="upcoming">View appointments</button></div>',
            "</section>"
          ].join("");
        }

        function storyAppointmentList(history) {
          var rows = history ? scheduler.state.history : scheduler.state.upcoming;
          var error = history ? scheduler.state.historyError : scheduler.state.upcomingError;
          if (scheduler.state.appointmentsLoading) return storyLoading("Loading appointments");

          if (!rows.length) return '<div class="sf-empty">No ' + (history ? "appointment history" : "upcoming appointments") + ".</div>";
          return '<div class="sf-list">' + rows.map(function (appointment) {
            var id = appointment.id || appointment.appointment_id || "";
            var meetingUrl = appointment.meeting_url || appointment.join_url || "";
            return [
              '<article class="sf-row">',
              "<div><b>" + escapeHTML(appointment.appointment_type_name || "Appointment") + "</b><small>" +
                escapeHTML(formatDateTime(appointment.start_at || appointment.startAt) + " ET · " +
                  (appointment.provider_name || "MissionMed mentor")) + "</small></div>",
              history ? "" : '<div class="sf-row-actions">' +
                (meetingUrl ? '<a class="sf-button primary" href="' + escapeAttr(meetingUrl) + '" target="_blank" rel="noopener">Join</a>' : "") +
                (canUseAppointmentAction("reschedule", appointment) ? '<button type="button" class="sf-button" data-sf-action="reschedule" data-appointment-id="' + escapeAttr(id) + '">Reschedule</button>' : "") +
                (canUseAppointmentAction("cancel", appointment) ? '<button type="button" class="sf-button danger" data-sf-action="cancel" data-appointment-id="' + escapeAttr(id) + '">Cancel</button>' : "") + '</div>',
              "</article>"
            ].join("");
          }).join("") + "</div>";
        }

        function renderStoryList(history) {
          return [
            storyIntro("Appointments", history ? "Appointment <em>history</em>." : "Your <em>upcoming</em> appointments.",
              history ? "Completed and canceled sessions remain separate from active bookings." :
                "Join, reschedule, or cancel only through capabilities returned by the live service."),
            storyNotice(),
            '<section class="sf-panel sf-pad">',
            storyAppointmentList(history),
            "</section>"
          ].join("");
        }

        function renderStorySettings() {
          return [
            storyIntro("Settings", "Appointment <em>experience</em>.", "Classic and StoryForge use the same live Scheduler state."),
            '<section class="sf-panel sf-pad sf-settings-note">',
            "<h2>Experience preference</h2>",
            '<div class="sf-error" role="status"><strong>Not saved yet</strong><p>The required server-backed preference and emergency Classic override share a MissionMed Hub path currently owned by another active release. No localStorage or browser-only preference has been substituted.</p></div>',
            '<div class="sf-exp" role="group" aria-label="Temporary experience preview">',
            '<button type="button" data-sf-action="experience" data-value="classic" aria-pressed="false">Preview Classic</button>',
            '<button type="button" aria-pressed="true">StoryForge</button>',
            "</div>",
            "<p>Switching for this open page preserves every current selection but is not claimed as persistence.</p>",
            "</section>"
          ].join("");
        }

        function renderClassicSettings() {
          if (!refs.content) return;
          refs.content.innerHTML = [
            '<section class="sos-page">',
            scheduler.components.pageHeader("Settings", "Appointment Experience", "Classic and StoryForge use the same live Scheduler state."),
            '<div class="sos-card sos-card-pad">',
            '<div class="sos-panel-title">Experience preference</div>',
            '<div class="sos-notice is-error" role="status"><strong>Not saved yet</strong><span>The required server-backed preference and emergency Classic override share a MissionMed Hub path currently owned by another active release. No localStorage or browser-only preference has been substituted.</span></div>',
            '<div class="sos-form-actions"><button type="button" class="sos-btn sos-btn-primary" data-classic-action="storyforge">Preview StoryForge</button></div>',
            '<p class="sos-panel-copy">Switching for this open page preserves every current selection but is not claimed as persistence.</p>',
            "</div>",
            "</section>"
          ].join("");
          var switcher = refs.content.querySelector('[data-classic-action="storyforge"]');
          if (switcher) {
            switcher.addEventListener("click", function () {
              scheduler.state.experience = "storyforge";
              scheduler.render.sidebar();
              scheduler.render.page(scheduler.state.route);
            });
          }
        }

        function storyBody(route) {
          if (scheduler.state.loading || scheduler.state.loadingError) {
            return scheduler.state.loadingError ?
              storyError("Appointments could not start", scheduler.state.loadingError, "retry-bootstrap") :
              storyLoading("Starting Appointments");
          }
          if (route === "home") return renderStoryHome();
          if (route === "upcoming") return renderStoryList(false);
          if (route === "history") return renderStoryList(true);
          if (route === "settings") return renderStorySettings();
          return renderStoryBook();
        }

        function renderStoryForge(route) {
          if (!refs.content) return;
          refs.root.setAttribute("data-appt-experience", "storyforge");
          var active = document.activeElement;
          var focusKey = active && active.getAttribute ? active.getAttribute("data-sf-focus") : "";
          var selectionStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
          refs.content.innerHTML = storyChrome(route, storyBody(route));
          bindStoryForge();
          if (focusKey) {
            var restored = refs.content.querySelector('[data-sf-focus="' + cssEscape(focusKey) + '"]');
            if (restored) {
              restored.focus();
              if (selectionStart !== null && typeof restored.setSelectionRange === "function") {
                restored.setSelectionRange(selectionStart, selectionStart);
              }
            }
          }
        }

        function selectDiscoveredType(typeId) {
          var type = scheduler.state.appointmentTypes.filter(function (candidate) {
            return String(candidate.id) === String(typeId);
          })[0];
          if (!type) return;
          if (storyUnavailable(type)) {
            setNotice(storyUnavailableMessage(type), true);
            scheduler.state.discoveryOpen = true;
            renderStoryForge("home");
            return;
          }
          scheduler.state.division = type.division;
          scheduler.state.appointmentTypeId = type.id;
          scheduler.state.providerId = "";
          scheduler.state.providers = [];
          scheduler.state.slots = [];
          scheduler.state.selectedSlotKey = "";
          scheduler.state.bookingStep = 1;
          scheduler.state.discoveryOpen = false;
          scheduler.state.route = "book";
          setNotice("", false);
          renderStoryForge("book");
          loadProviders();
        }

        function shiftDiscovery(delta, edge) {
          var rows = storyDiscoveryRows();
          if (!rows.length) return;
          scheduler.state.discoveryOpen = true;
          if (edge === "home") scheduler.state.discoveryActive = 0;
          else if (edge === "end") scheduler.state.discoveryActive = rows.length - 1;
          else scheduler.state.discoveryActive = (scheduler.state.discoveryActive + delta + rows.length) % rows.length;
          renderStoryForge("home");
          var input = refs.content.querySelector("#sf-discovery-input");
          if (input) input.focus();
        }

        function openCancelDialog(appointmentId, trigger) {
          var appointment = findAppointmentById(appointmentId);
          var dialog = refs.content.parentNode.querySelector("[data-sf-dialog]") || refs.root.querySelector("[data-sf-dialog]");
          if (!dialog || !appointment) return;
          dialog.innerHTML = [
            '<div class="sf-dialog-inner">',
            '<div class="sf-kicker">Cancel appointment</div>',
            "<h2>Cancel " + escapeHTML(appointment.appointment_type_name || "this appointment") + "?</h2>",
            "<p>" + escapeHTML(formatDateTime(appointment.start_at || appointment.startAt) + " ET · " +
              (appointment.provider_name || "MissionMed mentor")) + "</p>",
            "<p>The time is released immediately. You would need to book a new time.</p>",
            '<div class="sf-dialog-actions"><button type="button" class="sf-button" data-sf-dialog-action="keep" autofocus>Keep appointment</button><button type="button" class="sf-button danger" data-sf-dialog-action="confirm">Cancel appointment</button></div>',
            "</div>"
          ].join("");
          dialog.addEventListener("close", function () { if (trigger) trigger.focus(); }, { once: true });
          dialog.querySelector('[data-sf-dialog-action="keep"]').addEventListener("click", function () { dialog.close(); });
          dialog.querySelector('[data-sf-dialog-action="confirm"]').addEventListener("click", function () {
            dialog.close();
            cancelAppointment(appointmentId);
          });
          dialog.showModal();
        }

        function bindStoryForge() {
          if (!refs.content) return;
          refs.content.querySelectorAll("[data-sf-action]").forEach(function (control) {
            control.addEventListener("click", function () {
              var action = control.getAttribute("data-sf-action");
              var value = control.getAttribute("data-value") || "";
              if (action === "route") {
                scheduler.router.go(control.getAttribute("data-route") || "home");
              } else if (action === "experience" && value === "classic") {
                scheduler.state.experience = "classic";
                if (scheduler.state.route === "home" || scheduler.state.route === "settings") scheduler.state.route = "book";
                scheduler.render.sidebar();
                scheduler.render.page(scheduler.state.route);
              } else if (action === "discover-type") {
                selectDiscoveredType(control.getAttribute("data-type-id") || "");
              } else if (action === "division") {
                scheduler.state.division = value;
                scheduler.state.appointmentTypeId = "";
                scheduler.state.providerId = "";
                scheduler.state.providers = [];
                scheduler.state.slots = [];
                scheduler.state.selectedSlotKey = "";
                renderStoryForge("book");
              } else if (action === "type") {
                var type = scheduler.state.appointmentTypes.filter(function (candidate) { return candidate.id === value; })[0];
                if (storyUnavailable(type)) {
                  setNotice(storyUnavailableMessage(type), true);
                  renderStoryForge("book");
                } else {
                  scheduler.state.appointmentTypeId = value;
                  scheduler.state.providerId = "";
                  scheduler.state.providers = [];
                  scheduler.state.slots = [];
                  scheduler.state.selectedSlotKey = "";
                  setNotice("", false);
                  renderStoryForge("book");
                  loadProviders();
                }
              } else if (action === "provider") {
                scheduler.state.providerId = value;
                scheduler.state.slots = [];
                scheduler.state.selectedSlotKey = "";
                renderStoryForge("book");
              } else if (action === "next-step") {
                if (scheduler.state.bookingStep === 1) {
                  if (!scheduler.state.division || !scheduler.state.appointmentTypeId || !scheduler.state.providerId || storyUnavailable(selectedAppointmentType())) return;
                  scheduler.state.bookingStep = 2;
                  setNotice("", false);
                  loadAvailability();
                } else if (scheduler.state.bookingStep === 2 && selectedSlot()) {
                  scheduler.state.bookingStep = 3;
                  setNotice("", false);
                  renderStoryForge("book");
                }
              } else if (action === "previous-step") {
                scheduler.state.bookingStep = Math.max(1, scheduler.state.bookingStep - 1);
                setNotice("", false);
                renderStoryForge("book");
              } else if (action === "day") {
                scheduler.state.selectedDay = value;
                renderStoryForge("book");
              } else if (action === "slot") {
                scheduler.state.selectedSlotKey = control.getAttribute("data-slot-key") || "";
                var chosen = selectedSlot();
                if (chosen) {
                  scheduler.state.providerId = String(chosen.provider_id || chosen.providerId || scheduler.state.providerId);
                  scheduler.state.appointmentTypeId = String(chosen.appointment_type_id || chosen.appointmentTypeId || scheduler.state.appointmentTypeId);
                }
                renderStoryForge("book");
              } else if (action === "prev-week" || action === "next-week") {
                var anchor = new Date(scheduler.state.date + "T12:00:00.000Z");
                anchor.setUTCDate(anchor.getUTCDate() + (action === "prev-week" ? -7 : 7));
                scheduler.state.date = dateInputValue(anchor);
                scheduler.state.selectedDay = "";
                loadAvailability();
              } else if (action === "next-available") {
                var attempts = 0;
                var probe = function () {
                  attempts += 1;
                  var anchor = new Date(scheduler.state.date + "T12:00:00.000Z");
                  anchor.setUTCDate(anchor.getUTCDate() + 7);
                  scheduler.state.date = dateInputValue(anchor);
                  scheduler.state.selectedDay = "";
                  return loadAvailability().then(function () {
                    if (scheduler.state.slots.some(function (slot) { return slot.available !== false; })) return;
                    if (attempts < 8) return probe();
                    setNotice("No openings were found in the next 8 weeks for this mentor.", false);
                    renderStoryForge("book");
                  });
                };
                probe();
              } else if (action === "confirm-booking") {
                readFormState();
                submitBookingFromButton();
              } else if (action === "reset-booking") {
                scheduler.state.bookingConfirmed = false;
                scheduler.state.confirmedAppointment = null;
                scheduler.state.confirmedMeeting = null;
                scheduler.state.bookingState = "Draft";
                scheduler.state.bookingSubmitting = false;
                scheduler.state.selectedSlotKey = "";
                scheduler.state.bookingStep = 1;
                setNotice("", false);
                renderStoryForge("book");
              } else if (action === "reschedule") {
                startReschedule(control.getAttribute("data-appointment-id") || "");
              } else if (action === "cancel") {
                openCancelDialog(control.getAttribute("data-appointment-id") || "", control);
              } else if (action === "retry-bootstrap") {
                scheduler.bootstrap();
              } else if (action === "retry-upcoming") {
                loadUpcoming().then(function () { renderStoryForge(scheduler.state.route); });
              } else if (action === "retry-history") {
                loadHistory().then(function () { renderStoryForge(scheduler.state.route); });
              } else if (action === "retry-providers") {
                loadProviders();
              } else if (action === "retry-availability") {
                loadAvailability();
              }
            });
          });

          var discovery = refs.content.querySelector("#sf-discovery-input");
          if (discovery) {
            discovery.setAttribute("data-sf-focus", "discovery");
            discovery.addEventListener("focus", function () {
              if (suppressDiscoveryFocusOpen) {
                suppressDiscoveryFocusOpen = false;
                return;
              }
              if (!scheduler.state.discoveryOpen) {
                scheduler.state.discoveryOpen = true;
                renderStoryForge("home");
                var next = refs.content.querySelector("#sf-discovery-input");
                if (next) next.focus();
              }
            });
            discovery.addEventListener("click", function () {
              if (!scheduler.state.discoveryOpen) {
                scheduler.state.discoveryOpen = true;
                renderStoryForge("home");
                var next = refs.content.querySelector("#sf-discovery-input");
                if (next) next.focus();
              }
            });
            discovery.addEventListener("input", function () {
              scheduler.state.discoveryQuery = discovery.value;
              scheduler.state.discoveryOpen = true;
              scheduler.state.discoveryActive = 0;
              renderStoryForge("home");
            });
            discovery.addEventListener("keydown", function (event) {
              if (event.key === "ArrowDown" || event.key === "ArrowUp") {
                event.preventDefault();
                shiftDiscovery(event.key === "ArrowDown" ? 1 : -1);
              } else if (event.key === "Home" || event.key === "End") {
                event.preventDefault();
                shiftDiscovery(0, event.key.toLowerCase());
              } else if (event.key === "Enter") {
                var rows = storyDiscoveryRows();
                if (rows.length) {
                  event.preventDefault();
                  selectDiscoveredType(rows[Math.min(scheduler.state.discoveryActive, rows.length - 1)].id);
                }
              } else if (event.key === "Escape") {
                event.preventDefault();
                if (scheduler.state.discoveryOpen) scheduler.state.discoveryOpen = false;
                else scheduler.state.discoveryQuery = "";
                suppressDiscoveryFocusOpen = true;
                renderStoryForge("home");
                var restored = refs.content.querySelector("#sf-discovery-input");
                if (restored) restored.focus();
              } else if (event.key === "Tab") {
                scheduler.state.discoveryOpen = false;
              }
            });
          }

          var intake = refs.content.querySelector("#schedule-intake");
          if (intake) intake.addEventListener("input", function () { scheduler.state.intake = intake.value; });
          var email = refs.content.querySelector("#schedule-email-opt-in");
          if (email) email.addEventListener("change", function () { scheduler.state.emailOptIn = email.checked; });
          var sms = refs.content.querySelector("#schedule-sms-opt-in");
          if (sms) sms.addEventListener("change", function () {
            scheduler.state.smsOptIn = sms.checked;
            if (!sms.checked) scheduler.state.smsPhone = "";
            renderStoryForge("book");
          });
          var phone = refs.content.querySelector("#schedule-sms-phone");
          if (phone) phone.addEventListener("input", function () { scheduler.state.smsPhone = phone.value; });

          refs.content.querySelectorAll(".sf-days, .sf-times").forEach(function (group) {
            group.addEventListener("keydown", function (event) {
              if (["ArrowRight", "ArrowDown", "ArrowLeft", "ArrowUp", "Home", "End"].indexOf(event.key) === -1) return;
              var controls = Array.prototype.slice.call(group.querySelectorAll("button:not(:disabled)"));
              var index = controls.indexOf(document.activeElement);
              if (index === -1 || !controls.length) return;
              event.preventDefault();
              if (event.key === "Home") index = 0;
              else if (event.key === "End") index = controls.length - 1;
              else index = (index + (event.key === "ArrowRight" || event.key === "ArrowDown" ? 1 : -1) + controls.length) % controls.length;
              controls[index].focus();
            });
          });

          if (!discoveryPointerBound) {
            discoveryPointerBound = true;
            document.addEventListener("pointerdown", function (event) {
              if (!scheduler.state.discoveryOpen) return;
              var active = refs.content && refs.content.querySelector(".sf-discovery");
              if (active && !active.contains(event.target)) {
                scheduler.state.discoveryOpen = false;
                renderStoryForge(scheduler.state.route);
              }
            });
          }
        }

        scheduler.render.sidebar = function () {
          if (scheduler.state.experience === "storyforge") {
            if (refs.sidebar) refs.sidebar.innerHTML = "";
            return;
          }
          refs.root.setAttribute("data-appt-experience", "classic");
          classicSidebar();
          if (!refs.sidebar) return;
          var accountNav = refs.sidebar.querySelectorAll(".sos-nav-list")[1];
          if (accountNav) {
            accountNav.insertAdjacentHTML("beforeend", navLink("settings", "Settings", "Se", ""));
            var settingsLink = accountNav.querySelector('[data-route="settings"]');
            if (settingsLink) {
              settingsLink.addEventListener("click", function (event) {
                event.preventDefault();
                scheduler.router.go("settings");
              });
            }
          }
          var footer = refs.sidebar.querySelector(".sos-sidebar-footer");
          if (footer) {
            footer.insertAdjacentHTML("afterbegin", '<button type="button" class="sos-btn" data-classic-action="storyforge">Use StoryForge</button>');
            footer.querySelector('[data-classic-action="storyforge"]').addEventListener("click", function () {
              scheduler.state.experience = "storyforge";
              scheduler.render.sidebar();
              scheduler.render.page(scheduler.state.route);
            });
          }
        };

        scheduler.render.page = function (route) {
          route = route || scheduler.state.route || "home";
          if (scheduler.state.experience === "storyforge") {
            renderStoryForge(route);
            return;
          }
          refs.root.setAttribute("data-appt-experience", "classic");
          if (route === "settings") {
            renderClassicSettings();
            return;
          }
          classicPage(route === "home" ? "book" : route);
        };

        window.addEventListener("online", function () {
          scheduler.state.offline = false;
          scheduler.render.page(scheduler.state.route);
        });
        window.addEventListener("offline", function () {
          scheduler.state.offline = true;
          scheduler.render.page(scheduler.state.route);
        });
      }

      installStoryForgeExperience();

      window.MMEDScheduler = scheduler;

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", function () {
          scheduler.mount();
        });
      } else {
        scheduler.mount();
      }
    }());
  </script>
</body>
</html>
