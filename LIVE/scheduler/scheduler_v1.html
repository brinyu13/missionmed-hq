          '<label class="sos-compact-check" for="schedule-email-opt-in"><span>Email reminder</span><input type="checkbox" id="schedule-email-opt-in" ' + (scheduler.state.emailOptIn ? "checked" : "") + '></label>',
          '<label class="sos-compact-check" for="schedule-sms-opt-in"><span>Text reminder</span><input type="checkbox" id="schedule-sms-opt-in" ' + (scheduler.state.smsOptIn ? "checked" : "") + '></label>',
          scheduler.state.smsOptIn ? '<div class="sos-field"><label for="schedule-sms-phone">Reminder phone</label><input class="sos-input" id="schedule-sms-phone" name="sms_phone" type="tel" autocomplete="tel" value="' + escapeAttr(scheduler.state.smsPhone) + '" placeholder="Optional phone number"></div>' : "",
          payment.required ? '<div class="sos-notice"><strong>Payment required</strong><span>Paid visit types wait for server-verified Stripe confirmation before booking.</span></div>' : "",
          "</div>",
          "</div>"
        ].join("");
      }

      function inputType(fieldType) {
        if (["email", "date", "number", "tel", "phone"].indexOf(fieldType) >= 0) return fieldType === "phone" ? "tel" : fieldType;
        return "text";
      }

      function capacityLabel(type) {
        if (!type) return "Set by visit type";
        var config = type.student_config && type.student_config.capacity ? type.student_config.capacity : {};
        var count = config.capacity || type.capacity || 1;
        return (type.group_enabled || config.mode === "group") ? "Group, " + count + " seats" : "Individual";
      }

      function meetingLabel(type) {
        if (!type) return "Link appears after confirmation";
        var meeting = type.student_config && type.student_config.web_meetings ? type.student_config.web_meetings : {};
        var provider = meeting.provider || type.meeting_mode || "manual";
        if (provider === "none") return "No meeting link";
        if (provider === "manual") return "Manual link after confirmation";
        return provider.replace("_", " ") + " after confirmation";
      }

      function paymentLabel(type) {
        if (!type) return "No payment step";
        var payment = type.student_config && type.student_config.payments ? type.student_config.payments : {};
        if (payment.required) return payment.status === "configured" ? "Payment required" : "Payment required, not configured";
        if (payment.mode === "optional") return "Optional payment";
        return "No payment required";
      }

      function reminderLabel() {
        if (scheduler.state.smsOptIn) return "Email and SMS";
        if (scheduler.state.emailOptIn) return "Email";
        return "Off";
      }

      function selectedDivision() {
        return BOOKING_DIVISIONS.find(function (division) {
          return division.id === scheduler.state.division;
        }) || null;
      }

      function visibleBookingDivisions() {
        var available = scheduler.state.entitlements && Array.isArray(scheduler.state.entitlements.available_divisions)
          ? scheduler.state.entitlements.available_divisions
          : [];
        if (!available.length) {
          return BOOKING_DIVISIONS;
        }
        var allowed = new Set(available);
        return BOOKING_DIVISIONS.filter(function (division) {
          return allowed.has(division.id) || hasDivisionTypes(division);
        });
      }

      function hasDivisionTypes(division) {
        return division.visits.some(function (visit) {
          return Boolean(appointmentTypeByVisit(visit, division));
        });
      }

      function selectedDivisionName() {
        var division = selectedDivision();
        return division ? division.name : "";
      }

      function selectedVisitConfig() {
        var division = selectedDivision();
        if (!division) return null;
        var type = selectedAppointmentType();
        return division.visits.find(function (visit) {
          return type && appointmentTypeMatchesVisit(type, visit, division);
        }) || null;
      }

      function selectedVisitLabel() {
        var visit = selectedVisitConfig();
        return visit ? visit.label : "";
      }

      function visitTypeOptions() {
        var division = selectedDivision();
        if (!division) return [];
        return division.visits.map(function (visit) {
          var type = appointmentTypeByVisit(visit, division);
          return type ? { label: visit.label, visit: visit, type: type } : null;
        }).filter(Boolean);
      }

      function isTypeLocked(type) {
        if (!type || !type.division) return true;
        var entitlement = type.entitlement || {};
        var status = String(entitlement.status || "").toLowerCase();
        return entitlement.locked === true || status === "rule_missing" ||
          status === "ineligible" || status === "unavailable" ||
          status === "denied";
      }

      function canUseAppointmentAction(action, appointment) {
        var key = "can_" + action;
        var rowCapabilities = appointment && appointment.capabilities ? appointment.capabilities : {};
        if (typeof rowCapabilities[key] === "boolean") return rowCapabilities[key];
        if (typeof rowCapabilities[action] === "boolean") return rowCapabilities[action];
        var features = scheduler.state.boot && scheduler.state.boot.features ? scheduler.state.boot.features : {};
        return features[key] === true;
      }

      function entitlementSuffix(type) {
        var entitlement = type && type.entitlement ? type.entitlement : {};
        if (entitlement.status === "eligible") return " · included";
        if (entitlement.status === "server_facts_pending") return " · enrollment checked at booking";
        return "";
      }

      function mentorOptions() {
        var visit = selectedVisitConfig();
        if (!visit) return [];
        return visit.mentors.map(function (slug) {
          var provider = providerBySlug(slug);
          if (!provider) return null;
          return {
            label: provider.display_name || provider.name || mentorNameFromSlug(slug),
            provider: provider,
            availableSoon: slug === "dr-s" || slug === "sophia"
          };
        }).filter(Boolean);
      }

      function appointmentTypeBySlug(slug) {
        return scheduler.state.appointmentTypes.find(function (row) {
          return appointmentTypeSlugCandidates(row).some(function (candidate) {
            return normalizeSlug(candidate) === normalizeSlug(slug);
          });
        }) || null;
      }

      function appointmentTypeByVisit(visit, division) {
        return scheduler.state.appointmentTypes.find(function (row) {
          return appointmentTypeMatchesVisit(row, visit, division);
        }) || null;
      }

      function appointmentTypeMatchesVisit(row, visit, division) {
        var visitCandidates = visitSlugCandidates(visit).map(normalizeSlug).filter(Boolean);
        var rowCandidates = appointmentTypeSlugCandidates(row).map(normalizeSlug).filter(Boolean);
        if (rowCandidates.some(function (candidate) { return visitCandidates.indexOf(candidate) >= 0; })) {
          return true;
        }
        var visitLabel = normalizeSlug(visit && visit.label);
        var rowLabels = appointmentTypeLabelCandidates(row).map(normalizeSlug).filter(Boolean);
        return Boolean(visitLabel && rowLabels.indexOf(visitLabel) >= 0 && appointmentTypeDivisionMatches(row, division));
      }

      function visitSlugCandidates(visit) {
        return [visit && visit.slug].concat(Array.isArray(visit && visit.aliases) ? visit.aliases : []).filter(Boolean);
      }

      function appointmentTypeSlugCandidates(row) {
        var metadata = row && row.metadata && typeof row.metadata === "object" ? row.metadata : {};
        var config = row && row.student_config && typeof row.student_config === "object" ? row.student_config : {};
        return [
          row && row.slug,
          row && row.appointment_type_slug,
          row && row.appointmentTypeSlug,
          row && row.type_slug,
          metadata.slug,
          metadata.appointment_type_slug,
          config.slug,
          config.appointment_type_slug
        ].filter(Boolean);
      }

      function appointmentTypeLabelCandidates(row) {
        return [row && row.label, row && row.title, row && row.name, row && row.display_name].filter(Boolean);
      }

      function appointmentTypeDivisionMatches(row, division) {
        if (!division) return true;
        var metadata = row && row.metadata && typeof row.metadata === "object" ? row.metadata : {};
        var config = row && row.student_config && typeof row.student_config === "object" ? row.student_config : {};
        var candidates = [
          row && row.division,
          row && row.division_key,
          row && row.division_slug,
          row && row.category,
          metadata.division,
          metadata.division_key,
          metadata.category,
          config.division,
          config.division_key
        ].map(normalizeSlug).filter(Boolean);
        if (!candidates.length) return true;
        var divisionKeys = [division.id, division.name].map(normalizeSlug);
        return candidates.some(function (candidate) {
          return divisionKeys.indexOf(candidate) >= 0;
        });
      }

      function normalizeSlug(value) {
        return String(value || "")
          .toLowerCase()
          .replace(/&/g, " and ")
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "");
      }

      function providerBySlug(slug) {
        return scheduler.state.providers.find(function (provider) {
          return providerSlug(provider) === String(slug || "");
        }) || null;
      }

      function providerSlug(provider) {
        var metadata = provider && provider.metadata && typeof provider.metadata === "object" ? provider.metadata : {};
        var explicit = metadata.provider_slug || metadata.slug || "";
        if (explicit) return String(explicit).trim();
        return String(provider && (provider.slug || provider.display_name || provider.name || "") || "")
          .toLowerCase()
          .replace(/dr\.?\s*/g, "dr-")
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "");
      }

      function mentorNameFromSlug(slug) {
        if (slug === "dr-brian") return "Dr. Brian";
        if (slug === "dr-j") return "Dr J";
        if (slug === "dr-s") return "Dr S";
        if (slug === "sophia") return "Sophia";
        return "Mentor";
      }

      function meetingExpectationCopy() {
        var division = selectedDivision();
        return division ? division.meetingCopy : "After booking, you'll receive an email with your session link. Your Matrix Calendar will also show this appointment on the scheduled date.";
      }

      function initials(value) {
        var words = String(value || "").replace(/[^A-Za-z0-9 ]/g, " ").split(/\s+/).filter(Boolean);
        if (!words.length) return "MM";
        if (words[0].toLowerCase() === "dr" && words[1]) return ("D" + words[1][0]).toUpperCase();
        return words.slice(0, 2).map(function (word) { return word[0]; }).join("").toUpperCase();
      }

      function stepperMarkup(phase) {
        return '<div class="sos-sched-stepper">' + phase.phases.map(function (item, index) {
          var classes = ["sos-sched-step"];
          if (item.complete) {
            classes.push("is-complete");
          } else if (index === phase.current_index) {
            classes.push("is-active");
          }
          return '<div class="' + classes.join(" ") + '"><strong>' + escapeHTML(item.name) + '</strong><span>' + escapeHTML(stepHint(item.id)) + "</span></div>";
        }).join("") + "</div>";
      }

      function stepHint(id) {
        if (id === "details") return "Division and mentor";
        if (id === "time") return "Published openings";
        return "Review and send";
      }

      // MX-APPT-5002D item 2 + MX-APPT-5002E item 9.
      //
      // Performance: the cell loop used to call slotForMatrixCell() per cell, and that
      // re-sorted the whole slot array and linear-scanned it, calling localDateKey() and
      // easternTimeKey() — each of which built a fresh Intl.DateTimeFormat — on every slot.
      // The dataset is now indexed once per render and every cell is a single map hit.
      //
      // Accessibility: the grid emitted role="grid" with gridcells but no role="row" layer,
      // so the row/column structure was not exposed. Slot buttons announced only "Open", with
      // no date, time, timezone or availability. Both are fixed here; 44px targets and the
      // focus-visible treatment are in the stylesheet.
      function weekGridMarkup() {
        var days = weekDays();
        var slots = sortedSlots();
        var index = buildSlotIndex(slots);
        var rows = matrixTimeRows(index);
        var hasSlots = slots.length > 0;
        var dayKeys = days.map(dateInputValue);
        var dayLabels = days.map(function (day) { return EASTERN_DAY_LABEL_FORMAT.format(day); });
        return [
          '<div class="sos-week-nav">',
          '<button class="sos-btn sos-btn-sm" type="button" data-action="prev-week" aria-label="Previous week">&larr;</button>',
          '<span class="sos-week-label">' + weekLabel() + '</span>',
          '<button class="sos-btn sos-btn-sm" type="button" data-action="next-week" aria-label="Next week">&rarr;</button>',
          '</div>',
          '<div class="sos-sched-matrix-wrap">',
          '<div class="sos-sched-week" aria-label="Available appointment times, Eastern time" role="grid">',
          '<div class="sos-sched-row" role="row">',
          '<div class="sos-sched-time-label" role="columnheader">Time</div>',
          dayLabels.map(function (label) {
            return '<div class="sos-sched-time-label" role="columnheader">' + escapeHTML(label) + '</div>';
          }).join(""),
          '</div>',
          rows.map(function (row) {
            return '<div class="sos-sched-row" role="row">' +
              '<div class="sos-sched-time-label" role="rowheader">' + escapeHTML(row.label) + '</div>' +
              dayKeys.map(function (dateKey, dayIndex) {
                var slot = index.cells[dateKey + "|" + row.key] || null;
                var isSelected = Boolean(slot) && scheduler.state.selectedSlotKey === slotKey(slot);
                var isReserved = Boolean(slot) && matrixSlotReserved(slot);
                var cellClasses = ["sos-sched-grid-cell"];
                if (slot) cellClasses.push(isReserved ? "is-reserved" : "is-open");
                if (isSelected) cellClasses.push("is-selected");
                var when = dayLabels[dayIndex] + " at " + row.label + " Eastern time";
                var inner;
                if (!slot) {
                  inner = '<div class="sos-sched-empty" role="presentation"></div>';
                } else if (isReserved) {
                  inner = '<div class="sos-sched-reserved-slot" aria-label="' +
                    escapeAttr(when + ", unavailable") + '">Reserved</div>';
                } else {
                  inner = '<button class="sos-sched-open-slot" type="button" data-slot-key="' +
                    escapeAttr(slotKey(slot)) + '" aria-pressed="' + String(isSelected) + '" aria-label="' +
                    escapeAttr(when + ", " + (isSelected ? "selected" : "available")) + '">' +
                    escapeHTML(isSelected ? "Selected" : "Open") + '</button>';
                }
                return '<div class="' + cellClasses.join(" ") + '" role="gridcell">' + inner + '</div>';
              }).join("") +
              '</div>';
          }).join(""),
          '</div>',
          '</div>',
          '<div class="sos-sched-legend"><span class="sos-pill good">Open slot</span><span class="sos-pill sos-tier-medium">Selected slot</span><span class="sos-pill">Unavailable</span></div>',
          hasSlots ? "" : '<div class="sos-notice"><strong>No published slots loaded yet.</strong><span>Use Refresh or try a different mentor if openings do not appear.</span></div>'
        ].join("");
      }

      // MX-APPT-5002E item 9 — put keyboard focus back on the slot the student just chose,
      // after the re-render has replaced the node they were standing on.
      function restoreSlotFocus(slotKeyValue) {
        if (!slotKeyValue || !refs.content) {
          return;
        }
        var selector = '[data-slot-key="' + String(slotKeyValue).replace(/"/g, '\\"') + '"]';
        var next = refs.content.querySelector(selector);
        if (next && typeof next.focus === "function") {
          next.focus({ preventScroll: true });
        }
      }

      function selectedSlotSummaryMarkup() {
        var slot = selectedSlot();
        if (!slot) {
          return '<div class="sos-notice"><strong>Pick an open block.</strong><span>Select any Open slot in the weekly grid to continue.</span></div>';
        }
        return [
          '<div class="sos-slot-selected-summary">',
          '<span class="sos-nav-icon">✓</span>',
          '<div><strong>' + escapeHTML(formatDateTime(slotStart(slot))) + '</strong>',
          '<span>' + escapeHTML(selectedProviderName(slot)) + " · " + escapeHTML(selectedAppointmentType() ? selectedAppointmentType().title || selectedAppointmentType().label || "Selected visit" : "Selected visit") + '</span></div>',
          '</div>'
        ].join("");
      }

      // Does the server consider this slot taken? The availability endpoint returns an
      // `available` boolean; older payload shapes used a status string. Both are honoured.
      // Folded in from adapter patches P02/P03, which previously injected this at runtime.
      function matrixSlotReserved(slot) {
        if (!slot) {
          return false;
        }
        if (slot.available === false || slot.isAvailable === false) {
          return true;
        }
        var status = String((slot.status || slot.state || slot.availability_status || slot.availabilityStatus) || "").toLowerCase();
        return status.indexOf("reserv") >= 0 || status.indexOf("book") >= 0 || status.indexOf("held") >= 0 || status.indexOf("unavailable") >= 0;
      }

      // MX-APPT-5002D item 2 — build the cell lookup once per availability dataset.
      //
      // Key is "YYYY-MM-DD|HH:MM" in Eastern time, matching what the grid asks for. Input is
      // already sorted, and first-key-wins reproduces exactly what the old linear scan returned
      // (the earliest slot at that date and time), so this is a pure performance change.
      // The distinct time keys fall out of the same pass, so building rows costs nothing extra.
      function buildSlotIndex(slots) {
        var cells = {};
        var timeKeys = {};
        for (var i = 0; i < slots.length; i += 1) {
          var start = slotStart(slots[i]);
          if (!start) {
            continue;
          }
          var timeKey = easternTimeKey(start);
          timeKeys[timeKey] = true;
          var cellKey = localDateKey(start) + "|" + timeKey;
          if (!cells[cellKey]) {
            cells[cellKey] = slots[i];
          }
        }
        return { cells: cells, timeKeys: Object.keys(timeKeys).sort() };
      }

      // Rows are derived from the slots that actually exist, not from a fixed 08:00-20:00
      // ladder — an empty row is a row of empty cells the student has to scan past. Folded in
      // from adapter patch P01, which previously made this same change at runtime.
      // Accepts a prebuilt index so a render does not pay for a second pass over the slots.
      function matrixTimeRows(index) {
        var keys = (index || buildSlotIndex(sortedSlots())).timeKeys;
        return keys.map(function (key) {
          return { key: key, label: matrixTimeLabel(key) };
        });
      }

      // Retained for callers outside the grid render path. The grid itself now reads the
      // index directly rather than calling this per cell.
      function slotForMatrixCell(dateKey, timeKey) {
        var index = buildSlotIndex(sortedSlots());
        return index.cells[dateKey + "|" + timeKey] || null;
      }

      function nextAvailableMarkup() {
        var nextSlots = sortedSlots().slice(0, 3);
        if (!nextSlots.length) {
          return '<div class="sos-notice"><strong>No available slots are published for this mentor yet.</strong><span>Try a different mentor or check back soon.</span></div>';
        }
        return [
          '<div class="sos-sched-next">',
          '<div class="sos-panel-title">Next available</div>',
          '<div class="sos-sched-next-row">',
          nextSlots.map(function (slot) {
            var key = slotKey(slot);
            return '<button class="sos-btn" type="button" data-slot-key="' + escapeAttr(key) + '">' + escapeHTML(formatDate(slotStart(slot)) + " " + formatTime(slotStart(slot))) + "</button>";
          }).join(""),
          "</div>",
          "</div>"
        ].join("");
      }

      function slotsMarkup() {
        var daySlots = slotsForDate(scheduler.state.date);
        if (!daySlots.length) {
          return scheduler.components.empty("No available slots are published for this mentor yet.", "Try a different day or mentor, or check back soon.");
        }
        return daySlots.map(function (slot) {
          var key = slotKey(slot);
          return [
            '<button type="button" class="sos-sched-slot" data-slot-key="' + escapeAttr(key) + '" aria-pressed="' + String(scheduler.state.selectedSlotKey === key) + '">',
            "<strong>" + escapeHTML(formatTime(slot.startAt || slot.start_at)) + "</strong>",
            "<span>" + escapeHTML(formatDate(slot.startAt || slot.start_at)) + "</span>",
            "<span>" + escapeHTML(selectedProviderName(slot)) + "</span>",
            "</button>"
          ].join("");
        }).join("");
      }

      // MX-APPT-5002C items 6 and 8.
      //
      // item 6: an error argument, so a failed request renders as a failure with a retry
      // rather than as "you have no appointments".
      //
      // item 8: Join and Reschedule were inert <button>s with no handler and no capability
      // behind them. Join is now rendered only when the row actually carries a meeting URL,
      // as a link that opens it. Reschedule is kept and wired — the backend supports it
      // (features.can_reschedule, RPC mm_scheduler_reschedule_appointment) — and starts a
      // real reschedule flow instead of doing nothing.
      function listMarkup(rows, emptyTitle, emptyCopy, history, errorMessage) {
        if (errorMessage) {
          return listErrorMarkup(errorMessage, history);
        }
        if (!rows.length) {
          return scheduler.components.empty(emptyTitle, emptyCopy);
        }
        return '<div class="sos-sched-list">' + rows.map(function (row) {
          var appointmentId = row.id || row.appointment_id || row.appointmentId || "";
          var actions = "";
          if (!history) {
            var buttons = [];
            if (row.meeting_url) {
              buttons.push('<a class="sos-btn" href="' + escapeAttr(row.meeting_url) + '" target="_blank" rel="noopener">Join</a>');
            }
            if (canUseAppointmentAction("reschedule", row)) {
              buttons.push('<button class="sos-btn" type="button" data-action="reschedule-appointment" data-appointment-id="' +
                escapeAttr(appointmentId) + '">Reschedule</button>');
            }
            if (canUseAppointmentAction("cancel", row)) {
              buttons.push('<button class="sos-btn" type="button" data-action="cancel-appointment" data-appointment-id="' +
                escapeAttr(appointmentId) + '">Cancel</button>');
            }
            actions = '<div class="sos-form-actions">' + buttons.join("") + "</div>";
          }
          return [
            '<article class="sos-sched-item">',
            "<strong>" + escapeHTML(formatDateTime(row.start_at || row.startAt)) + "</strong>",
            "<span>Status: " + escapeHTML(row.status || "booked") + "</span>",
            row.provider_name ? "<span>Provider: " + escapeHTML(row.provider_name) + "</span>" : "",
            row.appointment_type_name ? "<span>Visit type: " + escapeHTML(row.appointment_type_name) + "</span>" : "",
            row.meeting_url ? '<span>Meeting: <a href="' + escapeAttr(row.meeting_url) + '" target="_blank" rel="noopener">Open link</a></span>' : '<span>Meeting: link appears after confirmation</span>',
            actions,
            "</article>"
          ].join("");
        }).join("") + "</div>";
      }

      function listErrorMarkup(message, history) {
        return [
          '<div class="sos-notice is-error" role="alert">',
          "<strong>We could not load your appointments.</strong>",
          "<span>" + escapeHTML(message) + "</span>",
          '<span>This is a problem loading the list, not a sign that your appointments were cancelled.</span>',
          '<div class="sos-form-actions"><button class="sos-btn" type="button" data-action="' +
            (history ? "retry-history" : "retry-upcoming") + '">Try again</button></div>',
          "</div>"
        ].join("");
      }

      function compactListMarkup(rows, emptyText) {
        if (!rows.length) {
          return '<div class="sos-empty">' + escapeHTML(emptyText) + "</div>";
        }
        return '<div class="sos-sched-mini-list">' + rows.slice(0, 3).map(function (row) {
          return [
            '<article class="sos-sched-mini-item">',
            '<div><strong>' + escapeHTML(formatDateTime(row.start_at || row.startAt)) + '</strong><span>' + escapeHTML(row.appointment_type_name || row.provider_name || row.status || "Scheduled") + "</span></div>",
            '<span class="sos-pill sos-tier-high">' + escapeHTML(row.status || "Booked") + "</span>",
            "</article>"
          ].join("");
        }).join("") + "</div>";
      }

      function tabsMarkup() {
        return [
          '<nav class="sos-tabs" aria-label="Scheduler views">',
          tabButton("book", "Book"),
          tabButton("upcoming", "Upcoming"),
          tabButton("history", "History"),
          "</nav>"
        ].join("");
      }

      function tabButton(route, label) {
        return '<button class="sos-tab" type="button" data-route="' + escapeAttr(route) + '" aria-current="' + String(scheduler.state.route === route) + '">' + escapeHTML(label) + "</button>";
      }

      function statsGrid() {
        return [
          '<div class="sos-grid sos-grid-stats">',
          scheduler.components.statCard(String(scheduler.state.appointmentTypes.length), "Visit Types", "var(--blue2)", "From scheduler API"),
          scheduler.components.statCard(String(scheduler.state.providers.length), "Providers", "var(--gold2)", "Mapped server-side"),
          scheduler.components.statCard(String(scheduler.state.slots.length), "Slots", "var(--green)", "Current search"),
          scheduler.components.statCard(String(scheduler.state.upcoming.length), "Upcoming", "var(--orange2)", "Student scoped"),
          "</div>"
        ].join("");
      }

      function noticeMarkup() {
        var message = scheduler.state.notice || scheduler.state.bootError;
        if (!message) {
          return "";
        }
        return '<div class="sos-banner ' + (scheduler.state.noticeError || scheduler.state.bootError ? "is-error" : "") + '">' + escapeHTML(friendlyMessage(message)) + "</div>";
      }

      // MX-APPT-5002C item 3 — one honest state per thing we are actually waiting for.
      //
      // This used to be a five-entry script walked by a 950ms timer with hardcoded
      // 12/34/58/82/96 percentages, so the UI always spent ~3.8s pretending to make progress
      // regardless of how fast the server answered. It manufactured latency the product did
      // not have. There is now no percentage, no timer and no invented sequence: the copy
      // describes the request that is genuinely outstanding, and the bar is indeterminate.
      function loadingSteps() {
        return {
          catalog: { title: "Loading appointment options", message: "Checking the appointment types available to this account.", kicker: "Appointment options" },
          availability: { title: "Checking mentor availability", message: safeAppointmentSearchSubject, kicker: "Published openings" }
        };
      }

      function loadingStep(context) {
        var steps = loadingSteps();
        return steps[context] || steps.catalog;
      }

      function loadingMessage(step) {
        return typeof step.message === "function" ? step.message() : step.message;
      }

      function safeAppointmentSearchSubject() {
        var provider = selectedProvider();
        var name = provider ? provider.display_name || provider.name || provider.title || "" : "";
        name = String(name || "").replace(/[^\w\s.'-]/g, "").replace(/\s+/g, " ").trim();
        var match = name.match(/^Dr\.?\s+(.+)$/i);
        if (match && match[1]) {
          var parts = match[1].trim().split(/\s+/);
          var last = parts.length ? parts[parts.length - 1] : "";
          if (last) {
            return "Searching available appointments for Dr. " + last;
          }
        }
        return "Searching available appointments for your account";
      }

      // MX-APPT-5002C item 3 — no timer. The loading state now changes only when the thing
      // it describes actually changes. Kept as a function because callers pair it with
      // stopLoadingTransition() around every request; it just no longer invents progress.
      function startLoadingTransition(context) {
        scheduler.state.loadingTransitionContext = context || "catalog";
        stopLoadingTransition();
        if (refs.content) {
          updateLoadingTransitionDom();
        }
      }

      function updateLoadingTransitionDom() {
        if (!refs.content) {
          return false;
        }
        var shell = refs.content.querySelector("[data-sos-loading-shell]");
        if (!shell) {
          return false;
        }
        var step = loadingStep(scheduler.state.loadingTransitionContext || "catalog");
        var error = scheduler.state.loadingError;
        var title = error ? "Loading needs attention" : step.title;
        var message = error ? (scheduler.state.loadingError || "We could not finish loading appointment options.") : loadingMessage(step);
        var state = error ? "Needs attention" : "Loading";
        setText(shell.querySelector("[data-sos-load-kicker]"), step.kicker || "Loading appointment options");
        setText(shell.querySelector("[data-sos-load-title]"), title);
        setText(shell.querySelector("[data-sos-load-message]"), message);
        setText(shell.querySelector("[data-sos-load-state]"), state);
        return true;
      }

      function setText(node, value) {
        if (node) {
          node.textContent = value || "";
        }
      }

      function stopLoadingTransition() {
        if (scheduler.state.loadingTransitionTimer) {
          window.clearInterval(scheduler.state.loadingTransitionTimer);
          scheduler.state.loadingTransitionTimer = null;
        }
      }

      // MX-APPT-5002C item 3 — the skeleton no longer lights cells up as the fake progress
      // advanced. It is a neutral placeholder; it must not imply that specific slots were found.
      function slotSkeletonMarkup() {
        var days = ["Mon", "Tue", "Wed", "Thu", "Fri"];
        return [
          '<div class="sos-slot-skeleton" aria-hidden="true">',
          days.map(function (day, dayIndex) {
            var lines = ['<div class="sos-slot-skeleton-day"><h3>' + escapeHTML(day) + "</h3>"];
            for (var i = 0; i < 4; i += 1) {
              lines.push('<div class="sos-slot-skeleton-line" data-sos-skeleton-line data-day-index="' + escapeAttr(dayIndex) + '" data-slot-index="' + escapeAttr(i) + '"></div>');
            }
            lines.push("</div>");
            return lines.join("");
          }).join(""),
          "</div>"
        ].join("");
      }

      function loadingErrorMarkup() {
        return [
          '<div class="sos-load-error">',

          "</div>"
        ].join("");
      }

      function clickFeedback(element) {
        element.style.transform = "scale(0.95)";
        element.style.transition = "transform 0.1s ease";
        setTimeout(function() {
          element.style.transform = "";
          element.style.transition = "";
        }, 150);
        try {
          var ctx = window._mmAudioCtx || (window._mmAudioCtx = new (window.AudioContext || window.webkitAudioContext)());
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.value = 880;
          gain.gain.value = 0.08;
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.04);
        } catch(e) {}
      }

      function confirmFeedback(element) {
        element.style.boxShadow = "0 0 30px rgba(54, 192, 113, 0.5)";
        setTimeout(function() { element.style.boxShadow = ""; }, 600);
        try {
          var ctx = window._mmAudioCtx || (window._mmAudioCtx = new (window.AudioContext || window.webkitAudioContext)());
          [523, 659, 784].forEach(function(freq, i) {
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = freq;
            gain.gain.value = 0.06;
            osc.start(ctx.currentTime + i * 0.08);
            osc.stop(ctx.currentTime + i * 0.08 + 0.12);
          });
        } catch(e) {}
      }

      // MX-APPT-5002C item 7 — confirmation before a destructive, irreversible action.
      // Names the specific appointment so the student can tell which one they are cancelling.
      function confirmCancelAppointment(appointmentId) {
        var row = findAppointmentById(appointmentId);
        var when = row ? formatDateTime(row.start_at || row.startAt) : "";
        var who = row && row.provider_name ? " with " + row.provider_name : "";
        var lines = [
          when ? "Cancel your appointment on " + when + who + "?" : "Cancel this appointment?",
          "",
          "This cannot be undone. You would need to book a new time."
        ];
        try {
          return window.confirm(lines.join("\n"));
        } catch (error) {
          return true;
        }
      }

      function findAppointmentById(appointmentId) {
        var wanted = String(appointmentId || "");
        var pools = [scheduler.state.upcoming || [], scheduler.state.history || []];
        for (var p = 0; p < pools.length; p += 1) {
          for (var i = 0; i < pools[p].length; i += 1) {
            var row = pools[p][i];
            var id = String(row.id || row.appointment_id || row.appointmentId || "");
            if (id && id === wanted) {
              return row;
            }
          }
        }
        return null;
      }

      // MX-APPT-5002C item 8 — Reschedule is wired rather than deleted, because the backend
      // supports it: bootstrap reports features.can_reschedule, and POST /api/scheduler/reschedule
      // dispatches to mm_scheduler_reschedule_appointment, which requires idempotency_key,
      // appointment_id, start_at and end_at (verified against the RPC definition).
      //
      // The student picks a new time through the normal booking surface; only the final
      // request differs. POST /book is untouched.
      function startReschedule(appointmentId) {
        var row = findAppointmentById(appointmentId);
        if (!row) {
          setNotice("We could not identify that appointment. Refresh and try again.", true);
          scheduler.render.page(scheduler.state.route);
          return;
        }
        scheduler.state.rescheduleAppointmentId = String(row.id || row.appointment_id || row.appointmentId || "");
        scheduler.state.selectedSlotKey = "";
        scheduler.state.bookingConfirmed = false;
        var typeId = row.appointment_type_id || row.appointmentTypeId || "";
        var providerId = row.provider_id || row.providerId || "";
        if (typeId) { scheduler.state.appointmentTypeId = typeId; }
        if (providerId) { scheduler.state.providerId = providerId; }
        scheduler.state.bookingStep = 2;
        setNotice("Choose a new time for this appointment. Your original time stays booked until you confirm.", false);
        scheduler.router.go("book");
        loadAvailability();
      }

      function cancelReschedule() {
        scheduler.state.rescheduleAppointmentId = "";
      }

      function cancelAppointment(appointmentId) {
        appointmentId = String(appointmentId || "").trim();
        if (!appointmentId) {
          setNotice("We could not identify that appointment. Refresh and try again.", true);
          scheduler.render.page(scheduler.state.route);
          return;
        }
        setNotice("Canceling appointment...", false);
        scheduler.render.page(scheduler.state.route);
        scheduler.api.post("/cancel", {
          appointment_id: appointmentId,
          idempotency_key: "student-cancel-" + Date.now() + "-" + Math.random().toString(16).slice(2),
          reason: "student_cancelled_from_scheduler"
        }).then(function (result) {
          if (!result.ok) {
            setNotice(result.message || "We could not cancel this appointment yet.", true);
            return null;
          }
          setNotice("Appointment canceled.", false);
          return Promise.all([loadUpcoming(), loadHistory()]);
        }).then(function () {
          scheduler.render.sidebar();
          scheduler.render.page(scheduler.state.route);
        });
      }

        if (key === "appointment-type") {

      function loadAuthSession() {
        return fetchSchedulerAuthSession().then(function (payload) {
          if (payload && payload.authenticated) {
            applySchedulerAuthPayload(payload);
            return payload;
          }
          return exchangeSchedulerWordPressSession(payload);
        }).then(function (payload) {
          if (payload && payload.authenticated) {
            applySchedulerAuthPayload(payload);
            return payload;
          }
          if (window.MMEDSchedulerAuthHandoff && window.MMEDSchedulerAuthHandoff(payload)) {
            return new Promise(function () {});
          }
          scheduler.state.csrfToken = "";
          scheduler.state.accessToken = "";
          return payload || {};
        }).catch(function () {
          scheduler.state.csrfToken = "";
          scheduler.state.accessToken = "";
          return {};
        });
      }

      function fetchSchedulerAuthSession() {
        return fetch("/api/auth/session?mm_scheduler_exchange=1&audience=scheduler", {
          credentials: "same-origin",
          cache: "no-store",
          headers: { Accept: "application/json" }
        }).then(function (response) {
          return response.json().catch(function () {
            return {};
          });
        });
      }

      function exchangeSchedulerWordPressSession(previousPayload) {
        return fetch("/api/auth/exchange", {
          method: "POST",
          credentials: "same-origin",
          cache: "no-store",
          headers: {
            Accept: "application/json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ audience: "scheduler" })
        }).then(function (response) {
          return response.json().catch(function () {
            return {};
          }).then(function (payload) {
            if (response.ok && payload && payload.authenticated) {
              return payload;
            }
            return payload && Object.keys(payload).length ? payload : previousPayload;
          });
        }).catch(function () {
          return previousPayload || {};
        });
      }

      function applySchedulerAuthPayload(payload) {
        scheduler.state.csrfToken = payload.csrfToken || "";
        scheduler.state.accessToken = payload.accessToken || "";
        if (payload.user) {
          scheduler.state.boot = Object.assign({}, scheduler.state.boot || {}, {
            user: {
              id: payload.user.id,
              display_name: payload.user.displayName || payload.user.display_name || "",
              email: payload.user.email || "",
              roles: payload.user.roles || []
            }
          });
        }
      }

      // MX-APPT-5002D item 4 — the booking surface goes usable first.
      //
      // Appointment types are already loaded by this point (in parallel with /bootstrap), so
      // paint immediately. The upcoming and history lists are not needed to book anything, so
      // they are deferred rather than raced against the catalog for connections. They still
      // resolve on their own and re-render the sidebar and either list route when they land.
      function loadAll() {
        scheduler.state.catalogLoading = false;
        scheduler.state.loading = false;
        stopLoadingTransition();
        scheduler.render.page(scheduler.state.route);

        scheduler.state.appointmentsLoading = true;
        return Promise.all([loadUpcoming(), loadHistory()]).then(function () {
          scheduler.state.appointmentsLoading = false;
          scheduler.render.sidebar();
          if (scheduler.state.route === "upcoming" || scheduler.state.route === "history") {
            scheduler.render.page(scheduler.state.route);
          }
        });
      }

      function loadAppointmentTypes() {
        return scheduler.api.get("/appointment-types").then(function (result) {
          scheduler.state.appointmentTypes = result.ok ? result.data.types || [] : (isLocalPreview() ? localPreviewAppointmentTypes() : []);
          scheduler.state.entitlements = result.ok ? result.data.entitlements || scheduler.state.entitlements : scheduler.state.entitlements;
          if (!result.ok) {
            setNotice(isLocalPreview() ? "" : "We could not load appointment options yet. Please refresh Scheduler, or contact MissionMed if this continues.", !isLocalPreview());
          }
        });
      }

      function loadProviders() {
        readFormState();
        if (!scheduler.state.appointmentTypeId) {
          scheduler.state.providers = [];
          renderBookingStepOnly();
          return Promise.resolve();
        }
        var query = new URLSearchParams();
        if (scheduler.state.appointmentTypeId) {
          query.set("appointment_type_id", scheduler.state.appointmentTypeId);
        }
        return scheduler.api.get("/providers?" + query.toString()).then(function (result) {
          scheduler.state.providers = result.ok ? result.data.providers || [] : (isLocalPreview() ? localPreviewProviders() : []);
          if (!result.ok) {
            setNotice(isLocalPreview() ? "" : "We could not load providers yet. Try again after the scheduler server is connected.", !isLocalPreview());
          }
          renderBookingStepOnly();
        });
      }

      function loadAvailability() {
        readFormState();
        if (!scheduler.state.appointmentTypeId || !scheduler.state.providerId) {
          scheduler.state.slots = [];
          scheduler.state.selectedSlotKey = "";
          scheduler.state.availabilityLoading = false;
          stopLoadingTransition();
          scheduler.render.page(scheduler.state.route);
          return Promise.resolve();
        }
        scheduler.state.availabilityLoading = true;
        scheduler.state.selectedSlotKey = "";
        startLoadingTransition("availability");
        scheduler.render.page(scheduler.state.route);
        var query = buildAvailabilityQuery();
        return scheduler.api.get("/availability?" + query.toString()).then(function (result) {
          scheduler.state.slots = result.ok ? result.data.slots || [] : (isLocalPreview() ? localPreviewSlots() : []);
          scheduler.state.selectedSlotKey = "";
          if (!result.ok) {
            setNotice(isLocalPreview() ? "" : "We could not load available times yet. Try again or contact support if this continues.", !isLocalPreview());
          }
        }).catch(function () {
          scheduler.state.slots = [];
          scheduler.state.selectedSlotKey = "";
          setNotice("We could not load available times yet. Try again or contact support if this continues.", true);
        }).then(function () {
          scheduler.state.availabilityLoading = false;
          stopLoadingTransition();
          scheduler.render.page(scheduler.state.route);
        });
      }

      // MX-APPT-5002C item 1 — the request window must cover the week the grid renders.
      //
      // This used to ask for state.date-1d .. state.date+8d while weekDays() renders
      // Sunday..Saturday of the week containing state.date. For a landing date on weekday d
      // (0=Sunday) every day from Sunday to state.date-2 was never fetched, so those columns
      // rendered permanently empty: 2 lost columns landing on a Wednesday, 5 on a Saturday.
      //
      // Derive the window from weekDays() itself so the two can no longer drift apart. The
      // one-day padding either side absorbs the Eastern/UTC offset — weekDays() entries are
      // anchored at T12:00Z, and the grid buckets slots by Eastern date. Over-fetching is
      // harmless (a slot outside the rendered week maps to no cell); under-fetching was the bug.
      function buildAvailabilityQuery() {
        var days = weekDays();
        var start = new Date(days[0].getTime() - 24 * 60 * 60 * 1000);
        var end = new Date(days[6].getTime() + 24 * 60 * 60 * 1000);
        var query = new URLSearchParams({
          start_date: start.toISOString(),
          end_date: end.toISOString(),
          timezone: scheduler.state.timezone
        });
        if (scheduler.state.appointmentTypeId) {
          query.set("appointment_type_id", scheduler.state.appointmentTypeId);
        }
        if (scheduler.state.providerId) {
          query.set("provider_id", scheduler.state.providerId);
        }
        return query;
      }

      function removeSlotFromAvailability(slot) {
        var key = slot ? slotKey(slot) : scheduler.state.selectedSlotKey;
        if (!key) return;
        scheduler.state.slots = scheduler.state.slots.filter(function (candidate) {
          return slotKey(candidate) !== key;
        });
        if (scheduler.state.selectedSlotKey === key) {
          scheduler.state.selectedSlotKey = "";
        }
      }

      function refreshAvailabilityAfterBooking(slot) {
        removeSlotFromAvailability(slot);
        if (!scheduler.state.appointmentTypeId || !scheduler.state.providerId) {
          return Promise.resolve();
        }
        return scheduler.api.get("/availability?" + buildAvailabilityQuery().toString()).then(function (result) {
          if (result.ok) {
            scheduler.state.slots = result.data.slots || [];
            removeSlotFromAvailability(slot);
          }
        }).catch(function () {
          removeSlotFromAvailability(slot);
        });
      }

      // MX-APPT-5002C item 6 — a failed request is not an empty list.
      //
      // These used to collapse any failure to [], so an API outage rendered "No upcoming
      // appointments" and a student with a session booked for tomorrow was told they had
      // none. Failure is now recorded separately and rendered as an error the student can act on.
      function loadUpcoming() {
        return scheduler.api.get("/my-appointments").then(function (result) {
          if (result.ok) {
            scheduler.state.upcoming = result.data.appointments || [];
            scheduler.state.upcomingError = "";
          } else {
            scheduler.state.upcoming = [];
            scheduler.state.upcomingError = friendlyMessage(result.message) || "We could not load your upcoming appointments.";
          }
        });
      }

      function loadHistory() {
        return scheduler.api.get("/my-appointment-history").then(function (result) {
          if (result.ok) {
            scheduler.state.history = result.data.appointments || [];
            scheduler.state.historyError = "";
          } else {
            scheduler.state.history = [];
            scheduler.state.historyError = friendlyMessage(result.message) || "We could not load your appointment history.";
          }
        });
      }

      function submitBooking(event) {
        event.preventDefault();
        return submitBookingCore();
      }

      function submitBookingFromButton() {
        return submitBookingCore();
      }

      function submitBookingCore() {
        if (scheduler.state.bookingSubmitting) {
          return;
        }
        if (scheduler.state.bookingConfirmed) {
          setNotice("This session is already booked. Use Book another session if you need a different time.", false);
          scheduler.render.page(scheduler.state.route);
          return;
        }
        readFormState();
        var slot = selectedSlot();
        var type = selectedAppointmentType();
        if (isTypeLocked(type)) {
          setNotice("This visit type needs a matching MissionMed enrollment before booking.", true);
          scheduler.render.page(scheduler.state.route);
          return;
        }
        if (!slot) {
          setNotice("Choose a time before confirming.", true);
          scheduler.render.page(scheduler.state.route);
          return;
        }
        var requiredMissing = missingRequiredIntake(type);
        if (requiredMissing.length) {
          setNotice("Please answer the required intake questions before confirming: " + requiredMissing.join(", ") + ".", true);
          scheduler.render.page(scheduler.state.route);
          return;
        }
        if (paymentRequired(type)) {
          setNotice("This visit type requires server-verified payment. The Stripe test adapter is not configured in this preview, so booking is blocked safely.", true);
          scheduler.render.page(scheduler.state.route);
          return;
        }
        scheduler.state.bookingSubmitting = true;
        scheduler.state.bookingState = "Sending";
        scheduler.render.page(scheduler.state.route);
        // MX-APPT-5002C item 8 — when a reschedule is in progress the same slot choice is sent
        // to /reschedule instead. The /book branch below is byte-for-byte what it always was;
        // the reschedule payload carries exactly the fields
        // mm_scheduler_reschedule_appointment requires.
        var rescheduleId = scheduler.state.rescheduleAppointmentId || "";
        var bookingRequest = rescheduleId
          ? scheduler.api.post("/reschedule", {
              idempotency_key: "student-reschedule-" + Date.now() + "-" + Math.random().toString(16).slice(2),
              appointment_id: rescheduleId,
              provider_id: slot.provider_id || slot.providerId || scheduler.state.providerId,
              start_at: slot.startAt || slot.start_at,
              end_at: slot.endAt || slot.end_at,
              timezone: scheduler.state.timezone
            })
          : scheduler.api.post("/book", {
              idempotency_key: "student-" + Date.now() + "-" + Math.random().toString(16).slice(2),
              appointment_type_id: slot.appointment_type_id || slot.appointmentTypeId || scheduler.state.appointmentTypeId,
              provider_id: slot.provider_id || slot.providerId || scheduler.state.providerId,
              start_at: slot.startAt || slot.start_at,
              end_at: slot.endAt || slot.end_at,
              timezone: scheduler.state.timezone,
              intake_answers: collectIntakeAnswers(),
              email_opt_in: scheduler.state.emailOptIn,
              sms_opt_in: scheduler.state.smsOptIn,
              sms_phone: scheduler.state.smsOptIn ? scheduler.state.smsPhone : ""
            });

        bookingRequest.then(function (result) {
          if (result.ok && rescheduleId) {
            cancelReschedule();
          }
          scheduler.state.bookingSubmitting = false;
          scheduler.state.bookingState = result.ok ? "Confirmed" : "Blocked";
          if (!result.ok) {
            scheduler.state.bookingConfirmed = false;
            scheduler.state.confirmedAppointment = null;
            scheduler.state.confirmedMeeting = null;
            scheduler.state.activeModal = "";
            if (isProviderConflict(result)) {
              removeSlotFromAvailability(slot);
              scheduler.state.bookingStep = 2;
            }
            if (isFullDayConflict(result)) {
              scheduler.state.activeModal = "full-day";
              scheduler.state.bookingStep = 2;
              setNotice("", false);
              return refreshAvailabilityAfterBooking(slot);
            }
            setNotice(friendlyBookingMessage(result), true);
            if (isProviderConflict(result)) {
              return refreshAvailabilityAfterBooking(slot);
            }
          } else {
            var data = result.data || {};
            var appointment = data.appointment || (data.result && data.result.appointment) || {};
            var meeting = data.integrations ? data.integrations.meeting || {} : {};
            scheduler.state.bookingConfirmed = true;
            scheduler.state.confirmedAppointment = appointment;
            scheduler.state.confirmedMeeting = meeting;
            scheduler.state.activeModal = "booking-success";
            scheduler.state.bookingStep = 3;
            scheduler.state.selectedSlotKey = "";
            setNotice("", false);
            return Promise.all([loadUpcoming(), refreshAvailabilityAfterBooking(slot)]);
          }
        }).catch(function (error) {
          scheduler.state.bookingSubmitting = false;
          if (scheduler.state.bookingConfirmed) {
            setNotice("Session booked. Your upcoming list could not refresh yet, but the confirmation is complete.", false);
          } else {
            scheduler.state.bookingState = "Blocked";
            if (isFullDayConflict(error)) {
              scheduler.state.activeModal = "full-day";
              scheduler.state.bookingStep = 2;
              setNotice("", false);
            } else {
              scheduler.state.activeModal = "";
              setNotice(friendlyBookingMessage(error), true);
            }
          }
        }).then(function () {
          scheduler.render.sidebar();
          scheduler.render.page(scheduler.state.route);
        });
      }

      function isProviderConflict(value) {
        return /provider_conflict|overlaps an existing provider appointment/i.test(bookingErrorText(value));
      }

      function isFullDayConflict(value) {
        return /scheduler_daily_limit_reached|daily[_ -]?limit|day is full|full day|this day is full|max(?:imum)?(?: number of)? students|maximum allowed 360|maximum.*reserved/i.test(bookingErrorText(value));
      }

      function bookingErrorText(value) {
        return [
          value && value.error,
          value && value.code,
          value && value.message,
          value && value.details && value.details.error,
          value && value.details && value.details.code,
          value && value.details && value.details.message,
          value && value.details && value.details.reason,
          value && value.body,
          value && value.statusText
        ].join(" ");
      }

      function friendlyBookingMessage(value) {
        if (isFullDayConflict(value)) {
          return "The maximum number of students have already reserved appointments for this day. Please choose another available day or time.";
        }
        if (isProviderConflict(value)) {
          return "That time was just booked. Please choose another opening.";
        }
        var message = value && value.message ? value.message : value && value.error ? value.error : "Booking could not be confirmed.";
        return friendlyMessage(message) || "Booking could not be confirmed.";
      }

      function readFormState() {
        var divisionSelect = refs.content ? refs.content.querySelector("#schedule-division") : null;
        var typeSelect = refs.content ? refs.content.querySelector("#schedule-appointment-type") : null;
        var providerSelect = refs.content ? refs.content.querySelector("#schedule-provider") : null;
        var dateInput = refs.content ? refs.content.querySelector("#schedule-date") : null;
        var intake = refs.content ? refs.content.querySelector("#schedule-intake") : null;
        var emailOptIn = refs.content ? refs.content.querySelector("#schedule-email-opt-in") : null;
        var smsOptIn = refs.content ? refs.content.querySelector("#schedule-sms-opt-in") : null;
        var smsPhone = refs.content ? refs.content.querySelector("#schedule-sms-phone") : null;
        if (divisionSelect) {
          scheduler.state.division = divisionSelect.value;
        }
        if (typeSelect) {
          scheduler.state.appointmentTypeId = typeSelect.value;
        }
        if (providerSelect) {
          scheduler.state.providerId = providerSelect.value;
        }
        if (dateInput) {
          scheduler.state.date = dateInput.value || scheduler.state.date;
        }
        if (intake) {
          scheduler.state.intake = intake.value || "";
        }
        if (emailOptIn) {
          scheduler.state.emailOptIn = emailOptIn.checked;
        }
        if (smsOptIn) {
          scheduler.state.smsOptIn = smsOptIn.checked;
        }
        if (smsPhone) {
          scheduler.state.smsPhone = smsPhone.value || "";
        }
      }

      function collectIntakeAnswers() {
        var answers = [{ field_key: "student_notes", answer_text: scheduler.state.intake }];
        if (scheduler.state.smsOptIn) {
          answers.push({ field_key: "sms_reminder_opt_in", answer_text: "yes" });
          if (String(scheduler.state.smsPhone || "").trim()) {
            answers.push({ field_key: "sms_reminder_phone", answer_text: String(scheduler.state.smsPhone || "").trim() });
          }
        }
        if (!refs.content) return answers;
        refs.content.querySelectorAll("[data-intake-field]").forEach(function (field) {
          answers.push({
            field_key: field.getAttribute("data-intake-field") || "",
            answer_text: field.value || ""
          });
        });
        return answers;
      }

      function missingRequiredIntake(type) {
        if (!refs.content) return [];
        return studentIntakeFields(type)
          .filter(function (field) { return field.required === true; })
          .filter(function (field) {
            var input = refs.content.querySelector('[data-intake-field="' + cssEscape(field.field_key || field.id || "") + '"]');
            return !input || !String(input.value || "").trim();
          })
          .map(function (field) { return field.label || field.field_key || "Required field"; });
      }

      function paymentRequired(type) {
        var payment = type && type.student_config && type.student_config.payments ? type.student_config.payments : {};
        return payment.required === true || payment.mode === "required";
      }

      function setNotice(message, isError) {
        scheduler.state.notice = message || "";
        scheduler.state.noticeError = Boolean(isError);
      }

      function selectedSlot() {
        for (var i = 0; i < scheduler.state.slots.length; i += 1) {
          if (slotKey(scheduler.state.slots[i]) === scheduler.state.selectedSlotKey) {
            return scheduler.state.slots[i];
          }
        }
        return null;
      }

      function selectedAppointmentType() {
        return scheduler.state.appointmentTypes.find(function (row) {
          return String(row.id) === String(scheduler.state.appointmentTypeId || "");
        }) || null;
      }

      function selectedProvider() {
        return scheduler.state.providers.find(function (row) {
          return String(row.id) === String(scheduler.state.providerId || "");
        }) || null;
      }

      function selectedProviderName(slot) {
        var provider = scheduler.state.providers.find(function (row) {
          return String(row.id) === String(slot.provider_id || slot.providerId || scheduler.state.providerId || "");
        });
        return provider ? provider.display_name || provider.name || provider.id : "Provider";
      }

      function sortedSlots() {
        return scheduler.state.slots.slice().sort(function (a, b) {
          return new Date(slotStart(a)).getTime() - new Date(slotStart(b)).getTime();
        });
      }

      function slotsForDate(key) {
        return sortedSlots().filter(function (slot) {
          return localDateKey(slotStart(slot)) === key;
        });
      }

      function weekDays() {
        var d = new Date(scheduler.state.date + "T12:00:00.000Z");
        var day = d.getDay();
        var sun = new Date(d.getTime() - day * 86400000);
        return Array.from({ length: 7 }, function(_, i) {
          return new Date(sun.getTime() + i * 86400000);
        });
      }

      function weekLabel() {
        var days = weekDays();
        var fmt = new Intl.DateTimeFormat([], { month: "short", day: "numeric", timeZone: EASTERN_TIMEZONE });
        return fmt.format(days[0]) + " - " + fmt.format(days[6]);
      }

      function scheduleTrackerPhase() {
        var phases = [
          { name: "Select Details", id: "details", complete: Boolean(scheduler.state.division && scheduler.state.appointmentTypeId && scheduler.state.providerId) },
          { name: "Choose Time Slot", id: "time", complete: Boolean(scheduler.state.selectedSlotKey) },
          { name: "Review & Confirm", id: "confirm", complete: scheduler.state.bookingState === "Confirmed" }
        ];
        return { phases: phases, current_index: Math.max(0, Math.min(2, Number(scheduler.state.bookingStep || 1) - 1)) };
      }

      function upcomingTrackerPhase() {
        return {
          phases: [
            { name: "Booked", id: "booked", complete: scheduler.state.upcoming.length > 0 },
            { name: "Prepare", id: "prepare", complete: false },
            { name: "Attend", id: "attend", complete: false },
            { name: "Follow Up", id: "followup", complete: false }
          ],
          current_index: scheduler.state.upcoming.length > 0 ? 1 : 0
        };
      }

      function historyTrackerPhase() {
        return {
          phases: [
            { name: "Scheduled", id: "scheduled", complete: true },
            { name: "Completed", id: "completed", complete: scheduler.state.history.length > 0 },
            { name: "Outcome", id: "outcome", complete: false },
            { name: "Next Step", id: "next", complete: false }
          ],
          current_index: scheduler.state.history.length > 0 ? 2 : 1
        };
      }

      function defaultSchedulePhase() {
        return {
          phases: [
            { name: "Select Details", id: "details", complete: false },
            { name: "Choose Time Slot", id: "time", complete: false },
            { name: "Review & Confirm", id: "confirm", complete: false }
          ],
          current_index: 0
        };
      }

      function navLink(route, label, icon, badge) {
        var active = scheduler.state.route === route ? " is-active" : "";
        var badgeHtml = badge !== "" && badge !== null && badge !== undefined ? '<span class="sos-nav-badge">' + escapeHTML(String(badge)) + "</span>" : "";
        return [
          "<li>",
          '<a class="sos-nav-link' + active + '" href="#' + escapeAttr(route) + '" data-route="' + escapeAttr(route) + '">',
          '<span class="sos-nav-icon">' + escapeHTML(icon) + "</span>",
          "<span>" + escapeHTML(label) + "</span>",
          badgeHtml,
          "</a>",
          "</li>"
        ].join("");
      }

      function sidebarStatus() {
        if (scheduler.state.boot && scheduler.state.boot.user) {
          return scheduler.state.boot.user.display_name || scheduler.state.boot.user.email || "Scheduler ready";
        }
        return scheduler.state.bootError || "Checking session";
      }

      function slotKey(slot) {
        return [
          String(slot.providerId || slot.provider_id || scheduler.state.providerId || ""),
          String(slot.appointmentTypeId || slot.appointment_type_id || scheduler.state.appointmentTypeId || ""),
          String(slot.startAt || slot.start_at || ""),
          String(slot.endAt || slot.end_at || "")
        ].join("|");
      }

      function slotStart(slot) {
        return String(slot.startAt || slot.start_at || "");
      }

      function nextDateValue() {
        return new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString().slice(0, 10);
      }

      function localDateKey(value) {
        if (!value) {
          return "";
        }
        var parts = EASTERN_DATE_FORMAT.formatToParts(new Date(value)).reduce(function (acc, part) {
          acc[part.type] = part.value;
          return acc;
        }, {});
        return [parts.year, parts.month, parts.day].join("-");
      }

      function dateInputValue(value) {
        return localDateKey(value);
      }

      function formatDateTime(value) {
        if (!value) {
          return "Time pending";
        }
        return new Intl.DateTimeFormat([], { dateStyle: "medium", timeStyle: "short", timeZone: EASTERN_TIMEZONE }).format(new Date(value));
      }

      function formatTime(value) {
        if (!value) {
          return "Time";
        }
        return new Intl.DateTimeFormat([], { timeStyle: "short", timeZone: EASTERN_TIMEZONE }).format(new Date(value));
      }

      function easternTimeKey(value) {
        if (!value) {
          return "00:00";
        }
        var parts = EASTERN_TIME_FORMAT.formatToParts(new Date(value)).reduce(function (acc, part) {
          acc[part.type] = part.value;
          return acc;
        }, {});
        var hour = parts.hour === "24" ? "00" : parts.hour;
        return String(hour || "00").padStart(2, "0") + ":" + String(parts.minute || "00").padStart(2, "0");
      }

      function matrixTimeLabel(key) {
        var pieces = String(key || "00:00").split(":");
        var hour = parseInt(pieces[0], 10) || 0;
        var minute = parseInt(pieces[1], 10) || 0;
        var date = new Date(Date.UTC(2026, 0, 1, hour, minute, 0));
        return new Intl.DateTimeFormat([], { hour: "numeric", minute: "2-digit", timeZone: "UTC" }).format(date);
      }

      function formatDate(value) {
        if (!value) {
          return "Date";
        }
        return new Intl.DateTimeFormat([], { weekday: "short", month: "short", day: "numeric", timeZone: EASTERN_TIMEZONE }).format(new Date(value));
      }

      // MX-APPT-5002C item 5 — this branch shipped a development message to production.
      // Live students hitting any network, auth or routing error were told the Scheduler was
      // "not connected in this local preview" and to "try again after the local server is
      // running", which is meaningless to them and reads as if the product is broken.
      // Replaced with language that is true in production and still actionable.
      function friendlyMessage(message) {
        var text = String(message || "");
        if (/failed to fetch|network|not available|auth|session|route|api/i.test(text)) {
          return "We could not reach the scheduling service. Check your connection and try again — if this keeps happening, contact support.";
        }
        return text;
      }

      function escapeHTML(value) {
        return String(value == null ? "" : value).replace(/[&<>"']/g, function (character) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          }[character];
        });
      }

      function escapeAttr(value) {
        return escapeHTML(value).replace(/`/g, "&#096;");
      }

      function cssEscape(value) {
        if (window.CSS && typeof window.CSS.escape === "function") {
          return window.CSS.escape(String(value || ""));
        }
        return String(value || "").replace(/["\\]/g, "\\$&");
      }

      /* ==================================================================
         MX-APPT-5003G — StoryForge V2 renderer

         This renderer is presentation-only. It consumes the exact state,
         selectors, and request functions used by Classic. No appointment,
         entitlement, authentication, provider, or meeting truth is invented.
         ================================================================== */
      function installStoryForgeExperience() {
        var classicPage = scheduler.render.page;
        var classicSidebar = scheduler.render.sidebar;
        var discoveryPointerBound = false;
        var suppressDiscoveryFocusOpen = false;

        function storyUnavailable(type) {
          var entitlement = type && type.entitlement ? type.entitlement : {};
          var status = String(entitlement.status || "").toLowerCase();
          return !type || !type.division || entitlement.locked === true ||
            status === "rule_missing" || status === "ineligible" ||
            status === "unavailable" || status === "denied";
        }

        function storyUnavailableMessage(type) {
          var entitlement = type && type.entitlement ? type.entitlement : {};
          return entitlement.message || entitlement.reason ||
            "This appointment type is not available for this account.";
        }

        function storyDivisionName(value) {
          var divisions = BOOKING_DIVISIONS.filter(function (division) {
            return division.id === value;
          });
          return divisions.length ? divisions[0].name : "Not configured";
        }

        function storyTypeStatus(type) {
          var entitlement = type && type.entitlement ? type.entitlement : {};
          var status = String(entitlement.status || "").toLowerCase();
          if (status === "rule_missing" || !type.division) return "Not configured";
          if (entitlement.locked === true || status === "ineligible") return "Unavailable";
          return "Available";
        }

        function storyFirstName() {
          var user = scheduler.state.boot && scheduler.state.boot.user ? scheduler.state.boot.user : {};
          var name = String(user.display_name || user.displayName || "").trim();
          return name ? name.split(/\s+/)[0] : "there";
        }

        function storyGreeting() {
          var parts = new Intl.DateTimeFormat("en-US", {
            hour: "2-digit",
            hour12: false,
            timeZone: EASTERN_TIMEZONE
          }).formatToParts(new Date());
          var hourPart = parts.filter(function (part) { return part.type === "hour"; })[0];
          var hour = parseInt(hourPart ? hourPart.value : "12", 10);
          var period = hour < 12 ? "morning" : hour < 17 ? "afternoon" : "evening";
          return "Good " + period + ", " + storyFirstName();
        }

        function storyDuration(type) {
          var value = type && (type.duration_minutes || type.durationMinutes || type.duration);
          var minutes = Number(value || 0);
          return minutes > 0 ? minutes + " min" : "";
        }

        function storyNav(route) {
          var items = [
            ["home", "Home"],
            ["book", "Book"],
            ["upcoming", "Upcoming"],
            ["history", "History"],
            ["settings", "Settings"]
          ];
          return [
            '<nav class="sf-nav" aria-label="Appointments navigation">',
            items.map(function (item) {
              return '<button type="button" data-sf-action="route" data-route="' +
                escapeAttr(item[0]) + '" aria-current="' +
                (route === item[0] ? "page" : "false") + '">' +
                escapeHTML(item[1]) + "</button>";
            }).join(""),
            "</nav>"
          ].join("");
        }

        function storyChrome(route, body) {
          return [
            '<section class="sf-app">',
            '<header class="sf-topbar">',
            '<a class="sf-matrix-link" href="#dashboard"><b aria-hidden="true">←</b><span>Matrix</span></a>',
            '<div class="sf-brand"><b>MissionMed // Appointments</b><span>Planning · Eastern time</span></div>',
            '<div class="sf-exp" role="group" aria-label="Appointment experience">',
            '<button type="button" data-sf-action="experience" data-value="classic" aria-pressed="false">Classic</button>',
            '<button type="button" aria-pressed="true">StoryForge</button>',
            "</div>",
            "</header>",
            storyNav(route),
            '<main class="sf-main" id="sf-main" tabindex="-1">',
            scheduler.state.offline ? '<div class="sf-notice sf-offline" role="status"><strong>You are offline.</strong> Reconnect before loading or saving appointment data.</div>' : "",
            body,
            "</main>",
            '<dialog class="sf-dialog" data-sf-dialog></dialog>',
            "</section>"
          ].join("");
        }

        function storyIntro(kicker, title, copy, action) {
          return [
            '<header class="sf-intro"><div>',
            '<div class="sf-kicker">' + escapeHTML(kicker) + "</div>",
            "<h1>" + title + "</h1>",
            copy ? "<p>" + escapeHTML(copy) + "</p>" : "",
            "</div>",
            action || "",
            "</header>"
          ].join("");
        }

        function storyNotice() {
          if (!scheduler.state.notice) return "";
          return '<div class="' + (scheduler.state.noticeError ? "sf-error" : "sf-notice") +
            '" role="' + (scheduler.state.noticeError ? "alert" : "status") + '">' +
            escapeHTML(friendlyMessage(scheduler.state.notice)) + "</div>";
        }

        function storyLoading(label) {
          return '<div class="sf-panel sf-pad" role="status" aria-live="polite"><strong>' +
            escapeHTML(label) + '</strong><p class="sos-panel-copy">One moment while Appointments checks the live Scheduler service.</p></div>';
        }

        function storyError(title, message, action) {
          return '<div class="sf-error" role="alert"><strong>' + escapeHTML(title) +
            "</strong><p>" + escapeHTML(friendlyMessage(message)) + "</p>" +
            (action ? '<button type="button" class="sf-button" data-sf-action="' +
              escapeAttr(action) + '">Try again</button>' : "") + "</div>";
        }

        function storyDiscoveryRows() {
          var query = String(scheduler.state.discoveryQuery || "").toLowerCase().trim();
          return scheduler.state.appointmentTypes.filter(function (type) {
            if (type.active === false || type.status === "inactive") return false;
            if (!query) return true;
            var haystack = [
              type.name,
              type.slug,
              type.description,
              type.division,
              storyDivisionName(type.division),
              type.format
            ].join(" ").toLowerCase();
            return query.split(/\s+/).every(function (token) {
              return haystack.indexOf(token) !== -1;
            });
          });
        }

        function storyDiscoveryList() {
          if (!scheduler.state.discoveryOpen) return "";
          var rows = storyDiscoveryRows();
          if (!rows.length) {
            return '<div class="sf-listbox" id="sf-discovery-list" role="listbox"><div class="sf-empty">No appointment types match this search.</div></div>';
          }
          var order = [];
          var available = scheduler.state.entitlements && Array.isArray(scheduler.state.entitlements.available_divisions)
            ? scheduler.state.entitlements.available_divisions : [];
          available.concat(["mission-residency", "exam-prep", "non-member", ""]).forEach(function (division) {
            if (order.indexOf(division) === -1 && rows.some(function (type) {
              return String(type.division || "") === division;
            })) order.push(division);
          });
          return [
            '<div class="sf-listbox" id="sf-discovery-list" role="listbox" aria-label="Appointment types">',
            order.map(function (division) {
              var group = rows.filter(function (type) {
                return String(type.division || "") === division;
              });
              return [
                '<div class="sf-group" role="presentation">' +
                  escapeHTML(division ? storyDivisionName(division) : "Not configured") + "</div>",
                group.map(function (type) {
                  var index = rows.indexOf(type);
                  var unavailable = storyUnavailable(type);
                  return [
                    '<button type="button" class="sf-option" role="option" id="sf-option-' +
                      escapeAttr(String(index)) + '" aria-selected="' +
                      (scheduler.state.discoveryActive === index ? "true" : "false") +
                      '" aria-disabled="' + (unavailable ? "true" : "false") +
                      '" data-sf-action="discover-type" data-type-id="' + escapeAttr(type.id) + '">',
                    "<span><b>" + escapeHTML(type.name || type.slug) + "</b><small>" +
                      escapeHTML([storyDuration(type), type.description || storyUnavailableMessage(type)].filter(Boolean).join(" · ")) + "</small></span>",
                    '<span class="sf-badge' + (unavailable ? " bad" : "") + '">' +
                      escapeHTML(storyTypeStatus(type)) + "</span>",
                    "</button>"
                  ].join("");
                }).join("")
              ].join("");
            }).join(""),
            "</div>"
          ].join("");
        }

        function storyNextAppointment() {
          if (scheduler.state.appointmentsLoading) return storyLoading("Loading your next appointment");
          if (scheduler.state.upcomingError) return storyError("Your appointments did not load", scheduler.state.upcomingError, "retry-upcoming");
          var appointment = scheduler.state.upcoming && scheduler.state.upcoming[0];
          if (!appointment) {
            return '<article class="sf-panel sf-next"><div class="sf-kicker">Your schedule</div><h2>No upcoming appointments</h2><p>When the Scheduler confirms a booking, it will appear here.</p></article>';
          }

          return [
            '<article class="sf-panel sf-next">',
            '<div class="sf-kicker">Next appointment</div>',
            "<h2>" + escapeHTML(appointment.appointment_type_name || "Appointment") + "</h2>",
            '<div class="sf-next-time">' + escapeHTML(formatDateTime(appointment.start_at || appointment.startAt)) + " ET</div>",
            "<p>" + escapeHTML(appointment.provider_name || "MissionMed mentor") + "</p>",
            meeting ? '<a class="sf-button primary" href="' + escapeAttr(meeting) + '" target="_blank" rel="noopener">Join session</a>' : "",
            "</article>"
          ].join("");
        }

        function storyHomeScheduleList(rows, title, route, emptyCopy) {
          return [
            '<section class="sf-panel sf-pad">',
            '<div class="sf-row-head"><h2>' + escapeHTML(title) + '</h2><button type="button" class="sf-button" data-sf-action="route" data-route="' +
              escapeAttr(route) + '">View all</button></div>',

            "</section>"
          ].join("");
