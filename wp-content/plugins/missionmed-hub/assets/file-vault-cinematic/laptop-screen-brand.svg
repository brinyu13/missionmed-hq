<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 667">
  <!-- Founder-supplied original PNG, embedded unchanged. Coordinates align to hero.webp. -->
  <defs>
    <clipPath id="screen"><path d="M882 127 L1280 108 L1230 387 L844 343Z"/></clipPath>
    <filter id="illumination" x="-15%" y="-30%" width="130%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d4e9ff" stop-opacity=".025"/><stop offset=".5" stop-color="#d4e9ff" stop-opacity="0"/></linearGradient>
    <image id="brand" width="300" height="77" transform="matrix(1.13 .035 -.15 .92 894 207)" xlink:href="data:image/png;base64,"/>
  </defs>
  <g clip-path="url(#screen)">
    <use xlink:href="#brand" opacity=".32" filter="url(#illumination)"/>
    <use xlink:href="#brand" opacity=".96"/>
    <path d="M882 127 L1280 108 L1230 387 L844 343Z" fill="url(#glass)"/>
  </g>
</svg>
