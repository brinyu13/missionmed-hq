<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Dr J Drills LIVE</title>
  <style>
    :root {
      --page: #030611;
      --panel: #080d1f;
      --panel-strong: #0f1934;
      --line: rgba(148, 163, 184, 0.28);
      --text: #f8fafc;
      --muted: #a8b5d1;
      --gold: #facc15;
      --blue: #2563eb;
      --red: #dc2626;
      --green: #22c55e;
    }

    * {
      box-sizing: border-box;
    }

    body.mmed-team-challenge-enabled #mmed108-sync {
      display: none !important;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .shell {
      display: block;
      min-width: 0;
    }

    .mm-drill {
      min-height: 100vh;
      padding: 10px;
    }

    .mm-drill .app {
      display: grid;
      grid-template-columns: minmax(210px, 300px) minmax(0, 1fr) minmax(210px, 300px);
      grid-template-rows: auto minmax(0, 1fr);
      gap: 10px;
      width: 100%;
      min-height: calc(100vh - 20px);
      max-width: 1920px;
      margin: 0 auto;
    }

    .brand-header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-width: 0;
      min-height: 58px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #091126;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.35);
    }

    .brand-logo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-logo {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      border: 1px solid rgba(250, 204, 21, 0.55);
      border-radius: 7px;
      background: #111827;
      color: var(--gold);
      font-size: 19px;
      font-weight: 950;
    }

    .brand-copy {
      min-width: 0;
    }

    .mode-badge {
      display: block;
      overflow: hidden;
      color: var(--gold);
      font-size: 23px;
      font-weight: 950;
      line-height: 1.05;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .brand-copy small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
      text-transform: uppercase;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #bbf7d0;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .header-right::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      content: "";
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.7);
    }

    .center-column {
      display: grid;
      grid-template-rows: minmax(440px, 1fr) auto;
      gap: 10px;
      min-width: 0;
      min-height: 0;
    }

    .player-shell {
      display: grid;
      grid-template-rows: 32px minmax(0, 1fr);
      min-width: 0;
      min-height: 440px;
      overflow: hidden;
      border: 1px solid rgba(250, 204, 21, 0.32);
      border-radius: 8px;
      background: #050814;
      box-shadow: 0 20px 58px rgba(0, 0, 0, 0.42);
    }

    .player-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
      padding: 0 11px;
      border-bottom: 1px solid var(--line);
      background: #0d142a;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .player-topbar [data-room-state-meta] {
      color: #bbf7d0;
    }

    .live-stage {
      position: relative;
      display: grid;
      min-width: 0;
      min-height: 390px;
      overflow: hidden;
      background: #080808;
    }

    .legacy-live-main {
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 100%;
      padding: 28px;
      text-align: center;
    }

    .live-lockup {
      display: grid;
      justify-items: center;
      gap: 10px;
      max-width: 620px;
    }

    .live-lockup span {
      color: var(--gold);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .live-lockup h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .live-lockup p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    #leftPanel,
    #rightPanel {
      min-width: 0;
    }

    @media (max-width: 1099px) {
      .mm-drill .app {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        grid-template-rows: auto auto auto;
      }

      .brand-header,
      .center-column {
        grid-column: 1 / -1;
      }

      .center-column {
        grid-row: 3;
      }
    }

    @media (max-width: 560px) {
      .mm-drill {
        padding: 6px;
      }

      .mm-drill .app {
        gap: 6px;
      }

      .mode-badge {
        font-size: 18px;
      }

      .brand-copy small {
        font-size: 9px;
      }

      .header-right {
        display: none;
      }

      .player-shell {
        min-height: 300px;
      }

      .live-stage {
        min-height: 254px;
      }
    }
  </style>
</head>
<body>
  <section id="legacyShell" class="shell legacy is-active" aria-label="Dr J Drills LIVE team room">
    <div class="mm-drill">
      <div class="app">
        <header class="brand-header">
          <div class="brand-logo-wrap">
            <div class="brand-logo" aria-hidden="true">M</div>
            <div class="brand-copy">
              <strong class="mode-badge">Dr J Drills LIVE</strong>
              <small>Live Team Challenge</small>
            </div>
          </div>
          <div class="header-right team-connection-state" data-connection-state data-state="connected">Connected</div>
        </header>

        <aside id="leftPanel" aria-label="Blue team score"></aside>

        <main class="center-column">
          <section id="playerShell" class="player-shell" aria-label="Live room stage">
            <div class="player-topbar">
              <span data-room-state-label>Checking room</span>
              <span data-room-state-meta>WAITING</span>
            </div>
            <div class="live-stage" data-live-stage>
              <div class="legacy-live-main">
                <div class="live-lockup">
                  <span>Dr J Drills LIVE</span>
                  <h1>Checking the room...</h1>
                  <p>Keep this page open while the current session loads.</p>
                </div>
              </div>
            </div>
          </section>
        </main>

        <aside id="rightPanel" aria-label="Red team score"></aside>
      </div>
    </div>
  </section>
</body>
</html>
