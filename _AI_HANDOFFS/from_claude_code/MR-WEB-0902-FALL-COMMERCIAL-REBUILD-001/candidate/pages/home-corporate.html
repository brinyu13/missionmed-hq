<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MissionMed Institute — corporate homepage seasonal layer (candidate V2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/mm-visual.css">
</head>
<body class="mmv">

<div id="campaign"></div>

<!-- ============================================================ seasonal Mission Residency route -->
<section class="v-env v-env--deep" data-insert="1">
  <div class="v-wrap">
    <span class="v-eyebrow">Mission Residency · Fall 2026</span>
    <div class="v-split">
      <div>
        <h2 id="season-h">It is interview season.</h2>
        <p class="v-lede" id="season-p"></p>
        <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:28px" id="season-cta"></div>
        <p class="v-meta" style="margin-top:18px" id="season-meta"></p>
      </div>
      <figure class="v-split__media js-reveal" style="margin:0">
        <img id="season-img" alt="A real MissionMed group mentorship session, with students on a live video call" loading="lazy" decoding="async">
        <figcaption class="v-split__badge">
          <b>Mission Residency</b>
          <span>Live interview preparation</span>
        </figcaption>
      </figure>
    </div>
  </div>
</section>

<!-- ============================================================ three divisions -->
<section class="v-env v-env--dark" data-insert="2">
  <div class="v-wrap">
    <span class="v-eyebrow">MissionMed Institute</span>
    <h2>Three divisions.<br>One institute.</h2>
    <p class="v-lede" style="margin-bottom:40px">
      Mission Residency carries the visual priority during interview season. ExamPrep and
      Mission&nbsp;Clinicals remain first-class divisions.
    </p>
    <div class="v-divband" id="divisions"></div>
  </div>
</section>

<script src="../js/campaign-state.js"></script>
<script src="../js/mm-visual.js"></script>
<script src="../js/mm-boot.js"></script>
<script>
MMBoot(function (cfg, state) {
  var V = MMVisual, C = MMCampaign;
  V.mountChrome('home');
  document.getElementById('campaign').appendChild(V.campaignBar(cfg, state));
  document.getElementById('season-img').src = V.ASSETS.classShot;

  // The seasonal band adapts to campaign state, so it never goes stale and never
  // makes a claim the truth gate has not cleared.
  var h = document.getElementById('season-h'),
      p = document.getElementById('season-p'),
      cta = document.getElementById('season-cta'),
      meta = document.getElementById('season-meta');

  if (state.showCampaignBanner) {
    h.textContent = 'Fall Access Week is open.';
    p.innerHTML = 'Interview season is here. Mission Residency prepares IMGs, DOs and reapplicants ' +
      'for residency interviews — and launch tuition runs through September 12. ' +
      'IV Prep Complete is <b style="color:var(--v-ink)">' +
      C.money(C.priceFor(cfg, 'iv_prep_complete', state, 'card')) + '</b> this week.';
    meta.textContent = 'Standard tuition applies from September 13.';
  } else if (state.showEnrollCtas) {
    h.textContent = 'It is interview season.';
    p.textContent = 'Mission Residency prepares IMGs, DOs and reapplicants for residency interviews — ' +
      'the framework, Signature Mock Interviews, and support that runs through the whole season.';
    meta.textContent = '';
  } else {
    h.textContent = 'It is interview season.';
    p.textContent = 'Mission Residency prepares IMGs, DOs and reapplicants for residency interviews. ' +
      'Enrollment is not open at the moment — tell us you are applying and we will be in touch.';
    meta.textContent = '';
  }

  // ONE route out of this band, and it goes to the division page. The corporate
  // homepage does not try to sell Complete itself.
  var go = V.el('a', { class: 'v-btn v-btn--gold', href: 'mission-residency.html', text: 'Explore Mission Residency' });
  go.addEventListener('click', function () { V.track('seasonal_band_to_division', { division: 'mission_residency', state: state.key }); });
  cta.appendChild(go);
  cta.appendChild(V.el('a', { class: 'v-btn v-btn--glass', href: '#divisions', text: 'See all three divisions' }));

  // ---- three divisions. Mission Residency is prioritised, not exclusive.
  var DIV = [
    { key: 'mission_residency', name: 'Mission Residency', tag: 'In season now', now: true,
      desc: 'Boutique, high-touch residency interview preparation with Signature Mock Interviews and full-season support.',
      href: 'mission-residency.html', go: 'Explore Mission Residency' },
    { key: 'examprep', name: "Dr J's Exam Prep", tag: 'Division', now: false,
      desc: 'USMLE and COMLEX preparation with live drills and Dr. Jastrzembski.',
      href: 'https://missionmedinstitute.com/examprep/', go: 'Visit ExamPrep' },
    { key: 'mission_clinicals', name: 'Mission: Clinicals', tag: 'Division', now: false,
      desc: 'US clinical experience, placed with precision.',
      href: 'https://missionmedinstitute.com/usce/', go: 'Visit Mission: Clinicals' }
  ];
  var band = document.getElementById('divisions');
  DIV.forEach(function (d) {
    var a = V.el('a', { class: 'v-div js-reveal' + (d.now ? ' v-div--now' : ''), href: d.href,
      html: '<div class="v-div__body">' +
              '<span class="v-div__tag">' + d.tag + '</span>' +
              '<h3 class="v-div__name">' + d.name + '</h3>' +
              '<p class="v-div__desc">' + d.desc + '</p>' +
              '<span class="v-div__go">' + d.go + ' &rarr;</span>' +
            '</div>' });
    a.addEventListener('click', function () { V.track('division_click', { division: d.key }); });
    band.appendChild(a);
  });

  V.initMotion();
});
</script>
</body>
</html>
