<style>
/* Page 5979 is the USCE application wrapper. Other pages remain unchanged. */
html:has(body.page-id-5979) {
  height: 100dvh;
  min-height: 0;
  overflow: hidden;
}
html:has(body.page-id-5979.admin-bar) {
  height: calc(100dvh - 32px);
}
body.page-id-5979 {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #0b1526;
}
body.page-id-5979 > #mm-l5-header {
  flex: 0 0 auto;
}
body.page-id-5979 > .mm-footer,
body.page-id-5979 > #mm107-hero {
  display: none !important;
}
body.page-id-5979 > .mm-usce-admin-launcher {
  flex: 1 1 0;
  width: 100%;
  height: auto;
  min-height: 0;
  overflow: hidden;
  background: #0b1526;
}
body.page-id-5979 .mm-usce-admin-launcher iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
  background: #0b1526;
}
@media (max-width: 782px) {
  html:has(body.page-id-5979.admin-bar) {
    height: calc(100dvh - 46px);
  }
}
</style>
<div class="mm-usce-admin-launcher">
  <iframe
    src="https://cdn.missionmedinstitute.com/html-system/LIVE/usce_admin.html"
    title="MissionMed USCE Admin"
    loading="eager"
    referrerpolicy="strict-origin-when-cross-origin"
    allow="clipboard-read; clipboard-write">
  </iframe>
</div>
<script>
/* Only the nonsecret canonical conversation ID crosses the existing app boundary.
   The Clinicals API still requires the existing administrator session. */
(function(){
  var ids=new URLSearchParams(window.location.search).getAll('conversation');
  if(ids.length!==1 || !/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(ids[0])) return;
  var frame=document.querySelector('.mm-usce-admin-launcher iframe[title="MissionMed USCE Admin"]');
  if(!frame) return;
  var target=new URL('https://cdn.missionmedinstitute.com/html-system/LIVE/usce_admin.html');
  target.searchParams.set('conversation',ids[0].toLowerCase());
  frame.src=target.href;
})();
</script>
