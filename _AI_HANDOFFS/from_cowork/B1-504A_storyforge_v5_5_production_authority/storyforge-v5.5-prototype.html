<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;0,800;0,900;1,700;1,800;1,900&family=Rajdhani:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<title>StoryForge V5.5 · MissionMed</title>
<style>

/* ============ STORYFORGE · CAM v2 EVOLVED TOKENS ============ */
:root{
  --bg:#0a0d14; --bg2:#0f1522; --card:#121927; --card2:#161f31; --edge:#243046; --edge2:#31405c;
  --tx:#e9eefb; --dim:#7e8ba6; --mid:#aab8d1;
  --em:#ffb340; --em2:#ff7a3d; --cy:#39d6ff; --vi:#8a7dff; --gd:#ffd76a; --gn:#4ade9d; --rd:#ff5470;
  --disp:'Archivo',system-ui,sans-serif; --num:'Rajdhani',sans-serif; --voice:'Lora',Georgia,serif;
  --accent:var(--em); --accent2:var(--em2); --accentGlow:255,179,64;
  --hdr:60px;
}
body[data-role="advisor"]{--accent:#39d6ff;--accent2:#5a8dff;--accentGlow:57,214,255}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--disp);overflow:hidden}
button{cursor:pointer;font-family:inherit;border:0;background:none;color:inherit}
::selection{background:var(--em);color:#000}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--edge);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ============ AMBIENT ENVIRONMENT ============ */
#bgfx{position:fixed;inset:0;z-index:0}
.aur{position:fixed;z-index:0;pointer-events:none;filter:blur(90px);opacity:.5;border-radius:50%;will-change:transform}
.aur.a{width:56vw;height:56vw;left:-16vw;top:-22vw;background:radial-gradient(circle,rgba(255,122,61,.16),rgba(255,122,61,0) 65%);animation:drift1 46s ease-in-out infinite alternate}
.aur.b{width:64vw;height:64vw;right:-22vw;bottom:-30vw;background:radial-gradient(circle,rgba(90,77,208,.20),rgba(90,77,208,0) 65%);animation:drift2 58s ease-in-out infinite alternate}
.aur.c{width:38vw;height:38vw;right:6vw;top:-14vw;background:radial-gradient(circle,rgba(57,214,255,.10),rgba(57,214,255,0) 65%);animation:drift3 52s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(9vw,7vw) scale(1.12)}}
@keyframes drift2{to{transform:translate(-8vw,-9vw) scale(1.08)}}
@keyframes drift3{to{transform:translate(-6vw,8vw) scale(1.18)}}
.vg{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 38%,transparent 46%,rgba(3,5,9,.72))}
@media (prefers-reduced-motion:reduce){
  .aur{animation:none!important}
  *,*:before,*:after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
}

/* ============ SHELL ============ */
header{position:fixed;top:0;left:0;right:0;height:var(--hdr);z-index:70;display:flex;align-items:center;gap:20px;padding:0 22px;
  background:linear-gradient(180deg,rgba(10,13,20,.92),rgba(10,13,20,.62));border-bottom:1px solid var(--edge);backdrop-filter:blur(10px)}
.logo{font-weight:900;font-style:italic;font-size:21px;transform:skewX(-4deg);white-space:nowrap;letter-spacing:-.01em;cursor:pointer;user-select:none}
.logo b{color:var(--accent);font-style:italic;transition:color .3s}
.logoSub{font-family:var(--num);font-size:8.5px;font-weight:700;letter-spacing:.26em;color:var(--dim);margin-top:-3px;transform:skewX(-4deg);text-transform:uppercase}
nav.top{display:flex;gap:4px;margin-left:6px}
.ntab{font-family:var(--num);font-weight:700;font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);padding:8px 16px;border-radius:8px;transition:.18s;position:relative}
.ntab:hover{color:#fff;background:rgba(36,48,70,.55)}
.ntab.on{color:var(--accent)}
.ntab.on:after{content:"";position:absolute;left:16px;right:16px;bottom:2px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.hSearch{margin-left:auto;display:flex;align-items:center;gap:8px;background:rgba(15,21,34,.85);border:1px solid var(--edge);border-radius:10px;padding:7px 12px;width:min(300px,26vw);transition:.18s;cursor:text}
.hSearch:focus-within{border-color:var(--cy);box-shadow:0 0 0 1px rgba(57,214,255,.3)}
.hSearch svg{flex:none;opacity:.55}
.hSearch input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--tx);font-family:var(--disp);font-size:13.5px}
.hSearch .kbd{font-family:var(--num);font-size:10px;font-weight:700;color:var(--dim);border:1px solid var(--edge2);border-radius:4px;padding:1px 6px}
.btnCatch{display:flex;align-items:center;gap:9px;padding:10px 22px;font-weight:800;font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;
  clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);background:linear-gradient(90deg,var(--em),var(--em2));color:#140b00;transition:.18s;white-space:nowrap}
.btnCatch:hover{transform:scale(1.045);filter:brightness(1.12);box-shadow:0 8px 30px rgba(255,150,60,.35)}
.rolePill{display:flex;align-items:center;gap:8px;border:1px solid var(--edge);background:rgba(15,21,34,.85);border-radius:999px;padding:4px;cursor:pointer;position:relative}
.rolePill .pp{display:flex;align-items:center;gap:7px;padding:4px 12px 4px 5px;border-radius:999px;font-family:var(--num);font-weight:700;font-size:11.5px;letter-spacing:.08em;color:var(--dim);transition:.18s}
.rolePill .pp.on{background:linear-gradient(90deg,rgba(var(--accentGlow),.22),rgba(var(--accentGlow),.08));color:var(--tx)}
.avc{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:11px;flex:none}
.avc.stu{background:linear-gradient(150deg,#ffb340,#ff7a3d);color:#161005}
.avc.adv{background:linear-gradient(150deg,#39d6ff,#5a8dff);color:#04121c}

/* Advisor banner */
#advBanner{position:fixed;top:var(--hdr);left:0;right:0;z-index:60;display:none;align-items:center;gap:12px;padding:7px 24px;
  background:linear-gradient(90deg,rgba(57,214,255,.13),rgba(90,141,255,.07));border-bottom:1px solid rgba(57,214,255,.25);backdrop-filter:blur(8px);
  font-family:var(--num);font-size:12px;font-weight:600;letter-spacing:.06em;color:#bfe9ff}
body[data-role="advisor"] #advBanner{display:flex}
#advBanner b{color:var(--cy)}

/* ============ MAIN VIEWS ============ */
main{position:fixed;inset:var(--hdr) 0 0 0;overflow-y:auto;overflow-x:hidden;z-index:10;scroll-behavior:smooth}
body[data-role="advisor"] main{top:calc(var(--hdr) + 32px)}
section[data-view]{display:none;min-height:100%;padding:34px clamp(18px,4.5vw,64px) 90px;max-width:1360px;margin:0 auto;animation:vin .4s cubic-bezier(.2,.9,.3,1.1)}
section.live{display:block}
@keyframes vin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 14px rgba(var(--accentGlow),.12)}50%{box-shadow:0 0 30px rgba(var(--accentGlow),.3)}}

/* Type */
.eyebrow{font-family:var(--num);font-size:11px;font-weight:700;letter-spacing:.34em;color:var(--dim);text-transform:uppercase}
.h1{font-size:clamp(26px,3.4vw,40px);font-weight:900;font-style:italic;transform:skewX(-3deg);letter-spacing:-.02em;line-height:1.06;text-shadow:0 2px 14px rgba(3,5,9,.7)}
.h1 em{color:var(--accent);font-style:italic}
.h2{font-size:19px;font-weight:900;font-style:italic;transform:skewX(-3deg);letter-spacing:-.01em}
.h2 em{color:var(--accent);font-style:italic}

/* ============ HOME ============ */
.homeHero{padding:7vh 0 40px;text-align:center;max-width:820px;margin:0 auto}
.greet{font-size:clamp(28px,4vw,46px);font-weight:900;font-style:italic;transform:skewX(-3deg);letter-spacing:-.02em;line-height:1.05;animation:rise .5s .05s both}
.greet em{color:var(--em);font-style:italic}
.greetSub{margin-top:12px;font-family:var(--voice);font-style:italic;font-size:16.5px;color:var(--mid);animation:rise .5s .14s both}
.heroCapture{margin:34px auto 0;max-width:660px;display:flex;align-items:center;gap:0;background:linear-gradient(160deg,rgba(19,25,39,.92),rgba(15,21,34,.88));
  border:1px solid var(--edge2);border-radius:16px;padding:8px 8px 8px 22px;cursor:text;transition:.22s;position:relative;animation:rise .5s .22s both, glowPulse 5.5s ease-in-out infinite}
.heroCapture:hover,.heroCapture:focus-within{border-color:rgba(255,179,64,.55);box-shadow:0 0 44px rgba(255,150,60,.22)}
.heroCapture .pfx{font-weight:900;font-style:italic;font-size:19px;color:var(--em);white-space:nowrap;transform:skewX(-3deg);margin-right:10px}
.heroCapture input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--tx);font-family:var(--disp);font-weight:600;font-size:18px;padding:10px 0}
.heroCapture input::placeholder{color:#5c6a86;font-weight:400}
.heroMic{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--edge);color:var(--mid);transition:.18s;margin-left:6px}
.heroMic:hover{background:var(--edge2);color:#fff}
.heroGo{flex:none;margin-left:6px;padding:13px 24px;font-weight:800;font-size:12px;letter-spacing:.2em;text-transform:uppercase;border-radius:11px;
  background:linear-gradient(90deg,var(--em),var(--em2));color:#140b00;transition:.18s}
.heroGo:hover{transform:scale(1.05);box-shadow:0 6px 24px rgba(255,150,60,.4)}
.sparkPrompt{margin:20px auto 0;max-width:660px;display:inline-flex;align-items:center;gap:10px;padding:9px 16px;border:1px dashed rgba(138,125,255,.45);border-radius:999px;
  color:var(--mid);font-size:13.5px;cursor:pointer;transition:.2s;animation:rise .5s .3s both;background:rgba(138,125,255,.06)}
.sparkPrompt:hover{border-color:var(--vi);color:#fff;background:rgba(138,125,255,.13)}
.sparkPrompt .tag{font-family:var(--num);font-size:10px;font-weight:700;letter-spacing:.24em;color:var(--vi);text-transform:uppercase}
.homeGrid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-top:26px}
@media(max-width:980px){.homeGrid{grid-template-columns:1fr}}

/* Panels */
.panel{background:linear-gradient(165deg,rgba(19,25,39,.9),rgba(15,20,33,.86));border:1px solid var(--edge);border-radius:16px;position:relative;overflow:hidden;backdrop-filter:blur(4px)}
.panel:before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--accentGlow),.45),transparent)}
.panel .pHead{display:flex;align-items:center;gap:12px;padding:16px 20px 0}
.panel .pBody{padding:14px 20px 20px}
.pMore{margin-left:auto;font-family:var(--num);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);transition:.15s}
.pMore:hover{color:var(--accent)}

/* Ember stat row */
.forgeStats{display:flex;gap:26px;flex-wrap:wrap;align-items:center}
.fstat{display:flex;flex-direction:column;gap:2px}
.fstat .n{font-family:var(--num);font-weight:700;font-size:30px;line-height:1;color:var(--tx)}
.fstat .n em{color:var(--accent);font-style:normal}
.fstat .l{font-family:var(--num);font-size:10px;font-weight:700;letter-spacing:.26em;color:var(--dim);text-transform:uppercase}

/* Story cards */
.cardRow{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.sCard{background:linear-gradient(168deg,var(--card),#101624);border:1px solid var(--edge);border-radius:14px;padding:16px 18px 14px;cursor:pointer;position:relative;overflow:hidden;
  transition:transform .22s cubic-bezier(.2,.9,.3,1.2),border-color .22s,box-shadow .22s;display:flex;flex-direction:column;gap:9px;min-height:158px}
.sCard:before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--hue,linear-gradient(90deg,var(--em),var(--em2)));opacity:.75}
.sCard:hover{transform:translateY(-4px);border-color:var(--edge2);box-shadow:0 14px 40px rgba(3,5,9,.6),0 0 24px rgba(var(--accentGlow),.09)}
.sCard.fresh{animation:glowPulse 4.5s ease-in-out infinite}
.sCard .pre{font-family:var(--num);font-size:9.5px;font-weight:700;letter-spacing:.3em;color:var(--dim);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.sCard .pre .dt{margin-left:auto;letter-spacing:.1em}
.sCard .ttl{font-weight:900;font-style:italic;font-size:16.5px;letter-spacing:-.01em;transform:skewX(-2deg);line-height:1.22}
.sCard .ttl span{color:var(--dim);font-weight:700;font-size:12px;display:block;margin-bottom:1px}
.sCard .exc{font-family:var(--voice);font-size:13px;color:var(--mid);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-style:italic}
.sCard .foot{margin-top:auto;display:flex;align-items:center;gap:10px}
.lockIco,.quillIco,.micIco{opacity:.75;flex:none}
.stageChip{font-family:var(--num);font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;padding:3px 9px;border-radius:4px;border:1px solid var(--edge2);color:var(--mid);margin-left:auto}
.stageChip.spark{color:var(--em);border-color:rgba(255,179,64,.45)}
.stageChip.shape{color:var(--cy);border-color:rgba(57,214,255,.4)}
.stageChip.forged{color:var(--gn);border-color:rgba(74,222,157,.45)}
.embers{display:flex;gap:3px;align-items:center}
.embers i{width:7px;height:7px;border-radius:50%;background:var(--edge2);transition:.15s}
.embers i.on{background:radial-gradient(circle at 35% 30%,#ffe9a8,var(--em) 65%);box-shadow:0 0 7px rgba(255,179,64,.7)}
.embers.pick i{width:15px;height:15px;cursor:pointer}
.embers.pick i:hover{transform:scale(1.25)}
.thDots{display:flex;gap:4px}
.thDots i{width:8px;height:8px;border-radius:3px;transform:rotate(45deg)}

/* Advisor feed */
.advNote{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(36,48,70,.6);cursor:pointer;transition:.15s;border-radius:8px}
.advNote:last-child{border-bottom:0}
.advNote:hover{background:rgba(57,214,255,.05)}
.advNote .txt{font-family:var(--voice);font-style:italic;font-size:13.5px;color:var(--mid);line-height:1.5}
.advNote .who{font-family:var(--num);font-size:10px;font-weight:700;letter-spacing:.2em;color:var(--cy);text-transform:uppercase;margin-bottom:3px}
.advNote .stRef{color:var(--tx);font-weight:700;font-style:normal;font-size:12.5px}

/* ============ LIBRARY ============ */
.libBar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 20px;padding:12px 16px;border:1px solid var(--edge);border-radius:14px;
  background:linear-gradient(90deg,rgba(10,13,20,.9),rgba(15,21,34,.72));position:relative;overflow:visible}
.seg{display:flex;background:rgba(15,21,34,.9);border:1px solid var(--edge);border-radius:9px;padding:3px;gap:2px}
.seg button{font-family:var(--num);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:6px 13px;border-radius:6px;transition:.15s}
.seg button:hover{color:#fff}
.seg button.on{color:#140b00;background:linear-gradient(90deg,var(--accent),var(--accent2))}
body[data-role="advisor"] .seg button.on{color:#04121c}
.thFilter{display:flex;gap:6px;flex-wrap:wrap}
.thChip{font-family:var(--num);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:5px 11px;border-radius:999px;border:1px solid var(--edge2);color:var(--mid);transition:.15s;display:flex;align-items:center;gap:6px}
.thChip i{width:7px;height:7px;border-radius:2px;transform:rotate(45deg);background:var(--hue,#888)}
.thChip:hover{color:#fff;border-color:var(--mid)}
.thChip.on{color:#0d1017;background:var(--hue,#888);border-color:transparent}
.thChip.on i{background:#0d1017}
.libGroup{margin-bottom:30px}
.libGroup .gTitle{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.libGroup .gTitle .cnt{font-family:var(--num);font-size:12px;font-weight:700;color:var(--dim)}
.emptyLib{text-align:center;padding:70px 20px;color:var(--dim)}
.emptyLib .big{font-size:20px;font-weight:900;font-style:italic;transform:skewX(-3deg);color:var(--mid);margin-bottom:8px}

/* ============ STORY ROOM ============ */
#room{position:fixed;inset:0;z-index:80;display:none;overflow-y:auto;background:rgba(6,8,13,.6);backdrop-filter:blur(3px)}
#room.open{display:block}
.roomSheet{min-height:100%;max-width:1150px;margin:0 auto;background:linear-gradient(175deg,#0e1420,#0a0d14 40%);border-left:1px solid var(--edge);border-right:1px solid var(--edge);
  padding:26px clamp(18px,4vw,54px) 80px;animation:sheetUp .38s cubic-bezier(.2,.9,.3,1.05)}
@keyframes sheetUp{from{opacity:0;transform:translateY(38px)}to{opacity:1;transform:none}}
.roomTop{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.backBtn{display:flex;align-items:center;gap:8px;font-family:var(--num);font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);padding:8px 14px;border:1px solid var(--edge);border-radius:9px;transition:.15s}
.backBtn:hover{color:#fff;border-color:var(--edge2)}
.roomTitleWrap{margin-bottom:6px}
.roomPre{font-family:var(--num);font-size:12px;font-weight:700;letter-spacing:.34em;color:var(--em);text-transform:uppercase;margin-bottom:4px}
.roomTitle{font-size:clamp(24px,3vw,36px);font-weight:900;font-style:italic;transform:skewX(-3deg);letter-spacing:-.02em;line-height:1.08;outline:none;border-radius:6px}
.roomTitle:focus{box-shadow:0 0 0 2px rgba(57,214,255,.4)}
.roomMeta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:14px 0 26px}
.roomGrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:26px;align-items:start}
@media(max-width:900px){.roomGrid{grid-template-columns:1fr}}
.voiceTabs{display:flex;gap:2px;background:rgba(15,21,34,.9);border:1px solid var(--edge);border-radius:9px;padding:3px;width:max-content;margin-bottom:14px}
.voiceTabs button{font-family:var(--num);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);padding:6px 14px;border-radius:6px;transition:.15s}
.voiceTabs button.on{color:#140b00;background:linear-gradient(90deg,var(--em),var(--em2))}
.storyProse{font-family:var(--voice);font-size:16.5px;line-height:1.75;color:#d6deef;white-space:pre-wrap;outline:none;border-radius:10px;padding:4px 6px;min-height:120px}
.storyProse:focus{box-shadow:0 0 0 2px rgba(57,214,255,.35);background:rgba(15,21,34,.5)}
.storyProse[data-empty="true"]:before{content:attr(data-ph);color:#54627e;font-style:italic}
.origNote{margin-top:10px;font-family:var(--num);font-size:10.5px;font-weight:600;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;display:flex;align-items:center;gap:7px}
.lessonBlock{margin-top:24px;padding:16px 20px;border-left:3px solid var(--gd);border-radius:0 12px 12px 0;background:linear-gradient(90deg,rgba(255,215,106,.07),rgba(255,215,106,.015))}
.lessonBlock .lbl{font-family:var(--num);font-size:10px;font-weight:700;letter-spacing:.3em;color:var(--gd);text-transform:uppercase;margin-bottom:6px}
.lessonTxt{font-family:var(--voice);font-style:italic;font-size:15.5px;color:#e8dfc0;line-height:1.6;outline:none;border-radius:6px}
.lessonTxt:focus{box-shadow:0 0 0 2px rgba(255,215,106,.35)}
.lessonTxt[data-empty="true"]:before{content:attr(data-ph);color:#8d8460}
.reflBlock{margin-top:26px}
.reflQ{border:1px dashed rgba(138,125,255,.4);border-radius:12px;padding:14px 18px;margin-bottom:12px;transition:.18s;background:rgba(138,125,255,.04)}
.reflQ .q{font-family:var(--voice);font-style:italic;font-size:14.5px;color:#c9c2f5}
.reflQ .a{margin-top:10px;font-family:var(--voice);font-size:14.5px;color:var(--mid);line-height:1.6;outline:none;border-radius:6px;min-height:22px}
.reflQ .a:focus{box-shadow:0 0 0 2px rgba(138,125,255,.35)}
.reflQ .a[data-empty="true"]:before{content:"Write a line or two — future-you will thank you.";color:#5b5f86;font-style:italic}
.reflQ .qTag{font-family:var(--num);font-size:9.5px;font-weight:700;letter-spacing:.26em;color:var(--vi);text-transform:uppercase;margin-bottom:5px}
.reflAdd{font-family:var(--num);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--vi);padding:8px 0;transition:.15s}

function fmtDT(t){const d=new Date(t);return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+' at '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}
function ago(isoD){const d=(TODAY-new Date(isoD.length>10?isoD:isoD+'T12:00:00'))/864e5;if(d<0)return'today';if(d<1)return'today';if(d<2)return'yesterday';if(d<7)return Math.round(d)+' days ago';if(d<30)return Math.round(d/7)+'w ago';if(d<365)return Math.round(d/30)+'mo ago';return Math.round(d/365*10)/10+'y ago'}

/* ---------- seed stories (Maya Chen, rising MS4, applying Sept 2026) ---------- */
let SID=0; const sid=()=>'s'+(++SID);
function mk(o){return Object.assign({id:sid(),prefix:true,polish:null,voice:false,shared:false,uses:[],refl:[],advisor:{assessment:null,notes:[],qids:[]},embers:0,themes:[],lesson:''},o)}
const STORIES=[
mk({t:'I Almost Quit',date:'2024-03-08',embers:5,themes:['resil','identity'],shared:false,
body:`Second semester of first year. I failed the renal exam by two points, my grandmother was in the hospital back in Fresno, and I sat in the parking garage for an hour because I couldn't make myself walk into small group. I actually opened the withdrawal paperwork on my laptop. What stopped me wasn't a pep talk. It was the memory of translating discharge instructions for my grandmother when I was fourteen, because nobody at that hospital spoke Spanish and I was the only one who could. I closed the form. I emailed my advisor instead. That was the hardest email I've ever written, and probably the most important.`,
lesson:'Wanting to leave and knowing why you stay can exist in the same hour. Asking for help was the turning point, not the failure.',
refl:[{q:'What did this cost you, and what did it give you?',a:'It cost me the story I told myself about being effortless. It gave me a reason I can say out loud.'}]}),
mk({t:'I Called My Mom From the Stairwell',date:'2025-05-02',embers:4,themes:['resil','identity'],shared:false,
body:`Dedicated Step 1 study period, week four. My practice scores had been flat for two weeks. I called my mom from the stairwell of the library because I didn't want anyone on the quiet floor to see me cry. She didn't say anything about medicine. She said, "Mija, you've been tired before." Then she told me about her first year cleaning offices at night while learning English. I went back upstairs and did two more blocks. My score didn't jump the next day. But I stopped treating tired like a diagnosis.`,
lesson:'Perspective is a resource I can borrow from people who love me. I do not have to generate all of it myself.'}),
mk({t:'I Missed the Murmur',date:'2024-11-19',embers:3,themes:['mistake','growth'],shared:true,
body:`Cardiology preceptorship, second year. Dr. Okafor asked what I heard. I said "regular rate and rhythm, no murmurs." She raised an eyebrow and had me listen again, then again, then moved my stethoscope two centimeters and there it was — a 3/6 systolic murmur I had been sliding right past. I felt my ears go hot. She said something I still think about: "You didn't miss it because you can't hear. You missed it because you had already decided the exam was normal before you started."`,
lesson:'I was auscultating to confirm, not to find. Deciding the answer in advance is the real error.',
advisor:{assessment:'developing',notes:[],qids:['q2']}}),
mk({t:'I Froze During Rounds',date:'2025-08-12',embers:4,themes:['mistake','growth'],shared:true,
body:`Second week of internal medicine, my first real rotation. The attending asked me for the overnight events on my patient — MY patient — and my mind just emptied. Total static. I had the numbers on my card. I had checked them twice at 5:40 that morning. But standing in that hallway with eight people looking at me, I couldn't produce a single sentence. The intern rescued me after maybe ten seconds that felt like a year. Afterward I hid in the stairwell and decided I wasn't built for this. Then I came back the next day and presented first, voluntarily, because I figured the fear would only grow if I fed it.`,
lesson:'Freezing once is not a verdict. The comeback the next morning mattered more than the freeze, and I chose it on purpose.',
refl:[{q:'What would you do differently now?',a:'I would say "let me start with overnight events" out loud — giving myself a runway sentence breaks the static.'}],
advisor:{assessment:'strong',notes:[{text:'This is a beautiful arc, Maya — the voluntary return the next morning is the story. Keep the stairwell detail; it earns the ending. This one is interview-ready.',date:'2026-07-20'}],qids:['q2','q7','q6']},uses:['iv']}),
mk({t:'The Nurse Saved Me',date:'2025-08-21',embers:3,themes:['team','growth'],shared:true,
body:`I was about to walk into room 12 to consent a patient for a paracentesis, script rehearsed. Rosa, the charge nurse, caught my sleeve at the door and said, "His wife died in this hospital last month. Fourth floor. Just so you know who you're talking to." Thirty seconds. It changed the entire conversation. I sat down instead of standing, and I asked about his wife before I asked about his belly. He signed the consent, but that's not really the point.`,
lesson:'The people who have been on the unit for twenty years hold context I cannot see in the chart. Asking them first is not weakness, it is competence.'}),
mk({t:'The Code Went Quiet',date:'2025-09-30',embers:5,themes:['patient','resil'],shared:true,
body:`My first code. Mr. Delgado, 71, the man I had interviewed that same morning about his garden — he grew tomatillos, he told me, real ones, not the sad grocery kind. At 4:12 pm his nurse hit the button. I did compressions in the second rotation. When the attending called it, the room emptied so fast, and I understood suddenly that everyone else had somewhere they had learned to put this. I didn't yet. My resident found me in the supply room afterward. She didn't tell me it gets easier. She said, "You'll build a place for it. Today you just have to carry it." Then she made me drink water and we went back to work.`,
lesson:'Grief in medicine is not a malfunction. Building a place for it is a skill, and I have started building mine.',
refl:[{q:'Who else was in the room, and what did they see?',a:'My resident saw me disappear into the supply closet and followed. What she modeled — following someone quietly — I have now done twice for classmates.'},{q:'If an interviewer pushed back on this story, what is the hard question?',a:''}],
advisor:{assessment:'strong',notes:[{text:'The tomatillos are what make this unforgettable. You honored him by remembering the morning conversation. Consider this for your personal statement if pediatrics does not end up as the opener.',date:'2026-06-28'}],qids:['q4','q6']}}),
mk({t:'The Family Thanked Me in Spanish',date:'2025-10-02',embers:5,themes:['patient','comm'],shared:true,
body:`Family medicine. The Herrera family had been in clinic three times for their son's asthma, and three times the plan had fallen apart at home. The visit was running behind and the interpreter line kept dropping. I asked my preceptor if I could just do the visit in Spanish. Twenty minutes later, Sra. Herrera was repeating the plan back to me — spacer, controller in the morning, rescue in the backpack, and the part nobody had caught before: they had been rinsing the spacer with a soap that made their son refuse it because of the taste. Three visits. That was the whole problem. Her husband shook my hand at the door and said, "Por fin alguien nos entendió." Finally, someone understood us.`,
lesson:'Language is clinical infrastructure. The problem was never adherence — it was that nobody could hear the actual barrier.',
advisor:{assessment:'signature',notes:[{text:'This is your signature story, Maya. It is your grandmother’s discharge papers, fifteen years later, from the other side of the desk. When you write the personal statement, start here.',date:'2026-06-28'},{text:'Small craft note: keep the exact Spanish quote. Do not translate it in the first sentence — let the reader wait one beat like the reader is in the room.',date:'2026-07-21'}],qids:['q4','q1','q10']},uses:['ps','iv']}),
mk({t:'I Disagreed With My Resident',date:'2025-11-14',embers:4,themes:['conflict','advoc'],shared:true,
body:`Surgery. Post-op day two, and Ms. Tran's urine output had been dropping all afternoon. My resident said we'd recheck in the morning; he had three consults stacked and I get it. But the trend line bothered me and I couldn't make it not bother me. I asked him — in the hallway, not in front of anyone — "Can you walk me through why we're comfortable waiting?" Not a challenge, an actual question. He stopped, pulled up the numbers, and went quiet for a second. We bolused her and called renal that night. He thanked me the next day, which he absolutely did not have to do. I learned you can hold your ground without raising your voice, and the phrasing of the question is the whole game.`,
lesson:'"Help me understand" opens doors that "I think you’re wrong" slams shut. Advocacy and respect are not opposites.',
advisor:{assessment:'strong',notes:[{text:'Perfect conflict story — you disagreed up the hierarchy, protected the relationship, and the patient won. Every program will ask for exactly this.',date:'2026-07-02'}],qids:['q3','q8','q11']},uses:['iv']}),
mk({t:'Leo Drew Me as a Superhero',date:'2025-12-05',embers:5,themes:['patient','identity'],shared:true,
body:`Peds. Leo, six years old, newly diagnosed diabetic, furious about all of it. He wouldn't let anyone near him with a glucometer without a fight. I started doing his checks with a routine: his stuffed dinosaur went first, every single time. Dino got the alcohol swab, Dino got the lancet mimed against his felt finger, Dino was very brave. By day three Leo was doing Dino's checks himself and narrating in a doctor voice. On discharge day his mom handed me a drawing: me, in a cape, holding a syringe like a sword, and Dino flying beside me. It's on my fridge. It will be on every fridge I ever own.`,
lesson:'Meeting a scared kid inside his own imagination was not a trick — it was the treatment. This is why pediatrics.',
advisor:{assessment:'strong',notes:[{text:'If you match peds, this opens your personal statement or closes it. The doctor-voice narration is the detail to protect.',date:'2026-07-21'}],qids:['q10','q4']},uses:['ps']}),
mk({t:'Mrs. Alvarez Remembered My Name',date:'2026-01-22',embers:4,themes:['patient','growth'],shared:true,
body:`Neurology. Mrs. Alvarez had post-stroke aphasia and mostly said "yes" and "no" and a phrase that meant everything and nothing: "you know, you know." I saw her every morning for two weeks, and mostly I just narrated what I was doing and let her squeeze my hand. On my last day, she looked at me, worked at it, really worked, and said "Ma-ya." My name. Her speech therapist teared up. I have gotten honors evaluations that meant less to me than those two syllables.`,
lesson:'Showing up daily is a clinical intervention. Presence compounds like interest.'}),
mk({t:'I Spoke Up About the Dose',date:'2026-03-17',embers:4,themes:['advoc','mistake'],shared:true,
body:`Medicine again, this time with a night team. The intern was putting in orders at 2 am and I noticed the enoxaparin dose hadn't been adjusted for the patient's renal function — I only knew because I had just written her creatinine on my card an hour before. I almost said nothing. He was busy, I was the student, and there was a decent chance I was wrong. I said it as a question: "Do we renally dose this here?" He checked, swore softly, and fixed it before signing. Nothing bad ever happened, which is exactly the point. The catches that matter are the ones where nothing ever happens.`,
lesson:'The two seconds of social awkwardness is the cheapest price safety will ever cost. Say the thing.',
advisor:{assessment:'strong',notes:[],qids:['q8','q11']},uses:['iv']}),
mk({t:'Two Floors Down on Match Day',date:'2026-03-20',prefix:false,embers:3,themes:['identity','growth'],shared:true,
body:`I watched Match Day from the balcony of the student center, two floors up from the envelopes. My resident from surgery — the one from the Ms. Tran night — matched into her first choice and screamed so loud the balcony shook. Next year that's me down there. I keep thinking about how much of what will be in my envelope is being decided right now, in ordinary weeks, on ordinary rotations, in moments nobody grades.`,
lesson:'The application season is not next year. It is every week I am living right now.'}),
mk({t:'I Ran the Family Meeting',date:'2026-07-10',embers:4,themes:['leader','comm'],shared:true,
body:`Sub-internship, week two. My attending was called to a rapid response ten minutes before a goals-of-care meeting with the Osei family, and she looked at me and said, "You know this patient best. Start without me." Four family members, a chaplain, and me. I used the setup she had taught me — ask what they understand first, then listen longer than is comfortable. By the time she arrived fifteen minutes later, the eldest daughter was holding my printed med list and we had already surfaced the thing that actually mattered: their father had told his pastor he was tired, and none of them had said it out loud to each other yet. My attending sat down and let me keep leading. Afterward she said, "That was a resident-level meeting." I wrote that down.`,
lesson:'Leadership on the wards is mostly preparation plus the nerve to start. The structure held even when I was terrified.'}),
mk({t:'The M1 Asked Me Everything',date:'2026-07-18',embers:2,themes:['leader','team'],shared:false,
body:`Free clinic Saturday. Got paired with an M1 who asked approximately four hundred questions and wrote down my answers like I was a real doctor. Weird feeling. Good weird. Should think about why teaching felt this energizing.`}),
mk({t:'I Could Not Find the Patient',date:'2026-07-24',embers:2,themes:['team'],shared:false,voice:true,
body:`Voice note, 0:47 — Okay so this morning I spent twenty-five minutes hunting for Mr. Park for pre-rounds. Not in his room, not in imaging, not in the family lounge. I was fully rehearsing how I'd explain losing an entire human being. He was in the CHAPEL. He goes every morning at six, the unit clerk knew, the night nurse knew, apparently everyone knew except the medical student. Note to self: the unit clerk knows everything. Bring her coffee.`}),

  stories:[
   mk({t:'I Held the Door Shut',date:'2026-06-12',embers:5,themes:['patient','resil'],shared:true,flag:'responded',respKind:'revised',respondedDate:'2026-07-24',
    polish:`Trauma bay, Saturday overnight. A father and his daughter from the same crash, two teams working, and a grandmother trying to push through the only door. My job, it turned out, was that door. I stood with my back against it and talked to her through the glass for forty minutes. I told her the name of every person working on her son. "There's Dr. Osei on the airway. That's Marcus, he's the best tech in this building. Rachel is running the meds." I counted the whole team for her, one by one — "there are nine people with him right now, and none of them have anywhere else to be." She stopped shaking somewhere around the fourth name. When it was over she pressed her palm flat against the glass and said, "You stayed." I used to think the door job was the job you got when you couldn't do anything else. It was the only job in that room only I could do — and she's the reason I know that.`,
    body:`Trauma bay, Saturday overnight. Two patients came in from the same crash — a father and his daughter — and the family kept trying to push into the bay while both teams worked. The charge nurse was running the board, everyone had a job, and mine, it turned out, was the door. I stood with my back against it and talked to the grandmother through the glass for forty minutes. I told her the names of every person working on her son. I counted the team out loud for her — "there are nine people with him right now." She stopped shaking somewhere around the fourth name. I used to think the door job was the job you got when you couldn't do anything else. It was the only job in that room only I could do.`,
    lesson:'In a crisis, the least clinical task in the room may be the most human one — and it still belongs to medicine.',
    advisor:{assessment:'strong',craft:{detail:3,stakes:3,turn:2,honest:2,lesson:3},notes:[{text:'Devon — the counting of the nine names is the strongest 15 seconds of your whole library. Rebuild the story so it lands there. Also: what did the grandmother say back? That belongs here.',date:'2026-07-19',seen:true}],qids:['q4','q6']},uses:['ps','iv']}),
   mk({t:'The Drunk Guy Was Right',date:'2026-07-22',embers:3,themes:['patient','growth'],shared:true,
    body:`Intoxicated frequent-flyer, 2 am, everyone rolling their eyes including me. He kept saying his chest felt "wrong, not the usual wrong." I almost charted it as baseline. His troponin wasn't baseline. NSTEMI. He knew his own body better drunk than I knew it sober with a monitor.`,
    lesson:'The patients everyone stops listening to are exactly the ones whose words carry the most unexamined signal.'}),
   mk({t:'I Dropped the Airway',date:'2026-04-03',embers:4,themes:['mistake','growth'],shared:true,
    body:`Sim lab, but it didn't feel like sim. I fumbled the bougie on the first pass, and instead of resetting calmly I rushed the second and made it worse. The attending stopped the whole scenario and had me narrate what my hands were doing. Naming each motion out loud fixed what hurrying had broken.`,
    lesson:'Slow is smooth. Narrating my own hands is now my reset ritual under pressure.',
    advisor:{assessment:'strong',notes:[{text:'Clean failure→system story. Interview-ready as your mistake answer.',date:'2026-05-02',seen:true}],qids:['q2','q7']},uses:['iv']}),
   mk({t:'Coach Called Me Coach',date:'2026-07-14',embers:2,themes:['leader','identity'],shared:true,
    body:`Ran the airway station for the new M3s. My old basketball coach used to say you don't know a thing until you can teach it slow. Felt him in the room.`}),
   mk({t:'The Waiting Room Sang',date:'2026-02-18',embers:4,themes:['patient','comm'],shared:true,
    body:`Six-hour waits, a full moon, and a choir group stuck in our waiting room after a bus breakdown. One of them started humming to calm an agitated patient, and the whole room followed. I stopped apologizing for the wait and just sat with a scared old man for five minutes while the room sang. Weirdest, best shift of my life.`,
    lesson:'You cannot always fix the system tonight. You can always lower the temperature of one room.',
    advisor:{assessment:'developing',notes:[],qids:['q4']}}),

  hist:[{d:'2026-07-08',t:'Signature confirmed: “The List of Questions”'},{d:'2026-06-20',t:'Interview set complete — 9 of 12 questions covered'}],
  stories:[
   mk({t:'The List of Questions',date:'2026-03-30',embers:5,themes:['patient','comm'],shared:true,body:`Mrs. Kaplan kept a folded list of questions in her robe pocket and was never given time to ask them. On my last day I asked to see the list. We got through all eleven. Question nine was "Am I dying?" Nobody had made space for it in six days of rounds.`,lesson:'Time is triaged like everything else — and questions are symptoms.',advisor:{assessment:'signature',craft:{detail:3,stakes:3,turn:3,honest:3,lesson:3},notes:[{text:'This is the one, Priya.',date:'2026-07-08',seen:true}],qids:['q4','q1','q9']},uses:['ps','iv']}),
   mk({t:'I Rounded on the Janitor',date:'2026-05-11',embers:4,themes:['identity','growth'],shared:true,body:`Mr. Okonkwo cleans the stepdown unit at 5 am and knows which patients slept badly better than the overnight intern does. I started asking him. My presentations got better. That's the whole story and I stand by it.`,lesson:'Information lives in the whole building, not just the chart.',advisor:{assessment:'strong',notes:[{text:'Great texture. Use in conversation, not on paper.',date:'2026-06-14',seen:true}],qids:['q1']},uses:['iv']}),
   mk({t:'The Insulin Sliding Scale Fight',date:'2026-01-19',embers:3,themes:['conflict','advoc'],shared:true,body:`I pushed back on a stale sliding scale order for a brittle diabetic, got it wrong in front of the team, learned the right answer, and came back the next day with the literature. The fellow said "good recovery" and meant it.`,lesson:'Being wrong loudly and correcting course publicly built more trust than being quietly right.',advisor:{assessment:'strong',notes:[],qids:['q3','q7']},uses:['iv']}),
   mk({t:'Grandfather’s Chart',date:'2025-11-02',embers:5,themes:['identity','resil'],shared:true,body:`My grandfather died in an ICU where nobody wrote down that he was a poet. I write one non-medical fact in every social history now. It changes how consultants walk into the room.`,lesson:'The social history is the patient. Everything else is the disease.',advisor:{assessment:'strong',notes:[],qids:['q10']},uses:['ps']}),

mkStu({id:'lucia',pro:'her',name:'Lucia Ramos',first:'Lucia',init:'LR',year:'MS4',spec:'General Surgery',cycle:'Applies Sept 2026',hue:'#ff6b8a',lastCapture:'2026-07-23',

   mk({t:'The Attending Apologized',date:'2026-07-23',embers:4,themes:['team','growth'],shared:true,body:`Dr. Yee snapped at me for a retraction error that was actually the resident's call, and then — in front of the whole team — came back and apologized. To a student. The room changed shape.`}),
   mk({t:'Abuela’s Hands',date:'2025-12-14',embers:5,themes:['identity'],shared:true,body:`My grandmother sewed wedding dresses for forty years. She examined my first suture card over her glasses like it was a hem, pointed at one, and said "esta" — that one. She was right about which one was best. Surgeons run in families in more ways than one.`,lesson:'Craft is my inheritance. Surgery is just its newest form.',advisor:{assessment:'strong',notes:[],qids:['q1','q10']},uses:['ps']}),

mkStu({id:'jordan',pro:'his',name:'Jordan Park',first:'Jordan',init:'JP',year:'MS3',spec:'Family Medicine',cycle:'Applies Sept 2027',hue:'#7ee0a3',lastCapture:'2026-07-25',

mkStu({id:'amara',pro:'her',name:'Amara Diallo',first:'Amara',init:'AD',year:'MS4',spec:'OB-GYN',cycle:'Applies Sept 2026',hue:'#ffd76a',lastCapture:'2026-07-18',

   mk({t:'Three Generations in the Room',date:'2026-04-22',embers:5,themes:['patient','identity'],shared:true,body:`A delivery where the patient's mother and grandmother were both present, and the grandmother had delivered her own children at home because the local hospital wouldn't take her. Three generations of one family's trust in medicine, repaired one birth at a time, and I got to be in the room.`,lesson:'Obstetrics is where medicine either earns back trust or loses it for a generation.',advisor:{assessment:'strong',notes:[],qids:['q10','q4']},uses:['ps']}),
   mk({t:'I Caught the Baby and the Mother',date:'2026-03-15',embers:5,themes:['patient','resil'],shared:true,body:`Postpartum hemorrhage, fast. My job was pressure and counting. Afterward the attending told me the resident she trusts most is the one who counts out loud. I count out loud now. Always.`,lesson:'Calm is a skill you can hear.',advisor:{assessment:'strong',notes:[],qids:['q6']},uses:['ps','iv']}),
   mk({t:'The Consent Was in Wolof',date:'2026-02-08',embers:4,themes:['comm','advoc'],shared:true,body:`A patient nodded through an English consent she did not understand. I stopped the line because my aunts nod like that. We got the interpreter. It took forty extra minutes and it was the most important thing I did that week.`,lesson:'A nod is not consent. Slowing down is advocacy.',advisor:{assessment:'strong',notes:[],qids:['q8','q11']},uses:['ps','iv']}),
   mk({t:'The Night Shift Braided Hair',date:'2026-01-12',embers:3,themes:['team','patient'],shared:true,body:`A teenager on bedrest for a month, miserable, hair matted from weeks in bed. Two nurses and I braided it at 3 am during a quiet stretch. Her mom cried when she saw it. Nothing about it was billable and everything about it was medicine.`,advisor:{assessment:'developing',notes:[],qids:[]}}),

<script>
/* ================= V2 MODEL ================= */
const MENTOR_NAME='Dr. Brian';
const STATUS={
 private:{label:'Private',hint:'Only you can see this. Submit it when you want feedback.',col:'st-private'},
 awaiting:{label:'Awaiting review',hint:'Submitted — your mentor hasn’t completed a review yet.',col:'st-awaiting'},
 in_review:{label:'In review',hint:'Your mentor is actively working on this story.',col:'st-in_review'},
 changes:{label:'Changes requested',hint:'Your mentor asked for a revision. Read the feedback and resubmit.',col:'st-changes'},
 reviewed:{label:'Reviewed',hint:'Your mentor completed a review of this story.',col:'st-reviewed'},
 approved:{label:'Approved',hint:'Ready to use in your application.',col:'st-approved'},
};
const BIRDS=[
 {id:'peacock',label:'Peacock',emo:'🦚',hue:'#8a7dff',hint:'Expressive, colorful, memorable in the room'},
 {id:'dove',label:'Dove',emo:'🕊️',hue:'#aab8d1',hint:'Warm, empathetic, patient-centered'},
 {id:'owl',label:'Owl',emo:'🦉',hue:'#ffb340',hint:'Analytical, careful, learns from error'},
 {id:'eagle',label:'Eagle',emo:'🦅',hue:'#4ade9d',hint:'Decisive, leads, takes ownership'},
];
const POSITIONS=[
 {id:'pd',label:'Program Director'},
 {id:'apd',label:'Associate Program Director'},
 {id:'faculty',label:'Faculty'},
 {id:'resident',label:'Resident'},
 {id:'behaviorist',label:'Behaviorist'},
];
const bird=id=>BIRDS.find(b=>b.id===id),pos=id=>POSITIONS.find(p=>p.id===id);
let NID=0;const NOTIFS=[];
let CQID=0; const CUSTOMQ=[]; /* custom interview questions: {id:'cq1',cat:'Custom',q:text} */
const allQ=()=>QBANK.concat(CUSTOMQ);
const qById=id=>allQ().find(q=>q.id===id);
function devState(s){const told=s.body&&s.body.split(/\s+/).length>=40;
  if(told&&s.lesson)return'Complete';if(told||s.lesson)return'In progress';return'Draft'}

/* ---- upgrade v1-shaped seed data to the v2 model ---- */
function T(date,h){return date+'T'+String(h).padStart(2,'0')+':00:00'}
function upgradeStory(st,s){
  s.selfScore=s.embers||0;delete s.embers;
  s.starStudent=s.selfScore===5;
  const A=s.advisor;
  s.mentorScore=A.assessment?({signature:5,strong:4,developing:3,raw:2}[A.assessment]||3):0;
  s.starMentor=A.assessment==='signature';
  s.revised=s.flag==='responded';
  if(!s.shared)s.status='private';
  else if(s.revised)s.status='awaiting';
  else if(A.assessment==='signature')s.status='approved';
  else if(A.assessment)s.status='reviewed';
  else if(A.notes.length)s.status='in_review';
  else s.status='awaiting';
  s.comments=A.notes.map(n=>({who:MENTOR_NAME,text:n.text,t:T(n.date,14),seen:n.seen!==false}));
  const qaT=A.notes.length?A.notes[A.notes.length-1].date:s.date;
  s.qa=(A.qids||[]).map(q=>({q,by:MENTOR_NAME,confirmed:true,sMentor:Math.max(3,s.mentorScore||4),sStudent:null,t:T(qaT,15)}))
    .concat((s.proposedQids||[]).map(q=>({q,by:st.first,confirmed:false,sStudent:3,sMentor:null,t:T(qaT,16)})));
  delete s.proposedQids;
  const bmap={leader:'eagle',advoc:'eagle',comm:'dove',patient:'dove',mistake:'owl',growth:'owl',team:'owl',identity:'peacock',resil:'peacock',conflict:'eagle'};
  s.birds=[...new Set(s.themes.map(t=>bmap[t]).filter(Boolean))].slice(0,2);
  const pmap={advoc:['pd'],conflict:['pd','apd'],leader:['pd','apd'],patient:['faculty','resident'],comm:['behaviorist'],identity:['pd'],mistake:['faculty'],growth:['resident'],team:['resident'],resil:['faculty']};
  s.positions=[...new Set(s.themes.flatMap(t=>pmap[t]||[]))].slice(0,3);
  const lastC=s.comments.length?s.comments[s.comments.length-1].t:null;
  s.ts={captured:T(s.date,9),studentUpdated:s.revised?T(s.respondedDate||s.date,11):T(s.date,9),
    submitted:s.status!=='private'?T(s.date,18):null,
    firstOpened:(A.notes.length||A.assessment)?T(s.comments[0]?s.comments[0].t.slice(0,10):s.date,13):null,
    lastReviewed:A.assessment?(lastC||T(s.date,15)):null,
    feedbackSent:lastC,
    feedbackOpened:null, /* set below only when it can be true and AFTER feedbackSent */
    studentResponded:s.revised?T(s.respondedDate||s.date,11):null,
    statusChanged:T(s.date,18)};
  if(lastC&&s.comments.every(c=>c.seen))s.ts.feedbackOpened=T(lastC.slice(0,10),21);
  s.reviewedBy=A.assessment?MENTOR_NAME:null;
  s.history=[{t:s.ts.captured,who:st.first,action:'Captured the story',detail:s.voice?'from a voice note':''}];
  if(s.ts.submitted)s.history.unshift({t:s.ts.submitted,who:st.first,action:'Submitted for review'});
  s.comments.forEach(c=>s.history.unshift({t:c.t,who:c.who,action:'Left feedback',detail:'“'+c.text.slice(0,60)+'…”'}));
  if(A.assessment)s.history.unshift({t:s.ts.lastReviewed,who:MENTOR_NAME,action:'Completed review',detail:'marked '+(s.revised?'Reviewed':STATUS[s.status].label)});
  s.qa.filter(x=>x.confirmed).forEach(x=>s.history.unshift({t:x.t,who:MENTOR_NAME,action:'Assigned an interview question',detail:qById(x.q)?'“'+qById(x.q).q+'”':''}));
  if(s.revised)s.history.unshift({t:s.ts.studentResponded,who:st.first,action:'Revised and resubmitted',detail:'after mentor feedback'});
  s.history.sort((a,b)=>b.t.localeCompare(a.t)); /* newest first, always */
}
const COHORT={maya:'Session A',devon:'Session A',priya:'Session B',sam:'Session C',lucia:'Session B',jordan:'Session C',amara:'Session A',tom:'Session C'};
STUDENTS.forEach(st=>{st.cohort=COHORT[st.id]||'Session C';st.stories.forEach(s=>upgradeStory(st,s))});

/* Dr. Chen — second authorized mentor, seeded activity for the activity feed */
(function(){const p=stuById('priya').stories[1];if(p){p.history.unshift({t:'2026-07-24T10:20:00',who:'Dr. Chen',action:'Left feedback',detail:'“The 5 am detail is the whole story — protect it.”'});
  p.comments.push({who:'Dr. Chen',text:'The 5 am detail is the whole story — protect it.',t:'2026-07-24T10:20:00',seen:true});}
  const l=stuById('lucia').stories[3];if(l){l.history.unshift({t:'2026-07-25T16:05:00',who:'Dr. Chen',action:'Updated the mentor score',detail:'4/5',prev:'3/5'});}
})();

/* Generated roster — demonstrates scale (22 students total) */
(function(){
 const names=['Elena Vasquez','Marcus Webb','Aisha Rahman','Kenji Sato','Grace Obi','Daniel Katz','Sofia Marino','Noah Lindgren','Fatima Zidane','Ryan O’Connell','Mei-Lin Zhao','Omar Haddad','Ivy Tran','Leo Fischer'];
 const specs=['Internal Medicine','Psychiatry','Anesthesiology','Radiology','Emergency Medicine','Pediatrics','Neurology','OB-GYN'];
 const hues=['#39d6ff','#ffb340','#8a7dff','#4ade9d','#ff6b8a','#ffd76a','#7ee0a3','#5cc8ff'];
 const seedTitles=[['I Stayed After the Shift','patient'],['The Question I Should Have Asked','mistake'],['My First Difficult Family','comm'],['The Resident Who Taught Me','team'],['I Found the Error','advoc'],['Why I Chose This','identity']];
 names.forEach((n,i)=>{
  const first=n.split(' ')[0];
  const stObj={id:'gen'+i,name:n,first,init:n.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase(),
   year:i%3===0?'MS4':'MS3',spec:specs[i%8],cycle:i%3===0?'Applies Sept 2026':'Applies Sept 2027',
   hue:hues[i%8],pro:PRONOUNS[['her','his','their'][i%3]],lastCapture:'2026-07-'+String(2+i).padStart(2,'0'),
   cohort:'Session '+['A','B','C'][i%3],hist:[],stories:[]};
  const nStories=1+(i%3);
  for(let j=0;j<nStories;j++){const tt=seedTitles[(i+j)%6];
   const s=mk({t:tt[0],date:'2026-0'+(5+(j%3))+'-'+String(3+i).padStart(2,'0'),embers:2+((i+j)%4),themes:[tt[1]],shared:true,
    body:'A '+stObj.year+' story from '+first+'’s '+stObj.spec.toLowerCase()+' experience — seeded to demonstrate scale. The full telling lives here with enough words to feel real when opened, including a beginning, a complication, and a moment where something changed for good.',
    lesson:(i+j)%2?'A lesson this student named in one honest sentence.':''});
   if((i+j)%4===1){s.advisor.assessment='strong';s.advisor.notes=[{text:'Good bones — tighten the opening.',date:'2026-07-'+String(4+i).padStart(2,'0'),seen:true}]}
   if((i+j)%4===2){s.advisor.notes=[{text:'Let’s talk about where this turns.',date:'2026-07-'+String(4+i).padStart(2,'0'),seen:true}]}
   stObj.stories.push(s);}
  stObj.stories.forEach(s=>upgradeStory(stObj,s));
  STUDENTS.push(stObj);
 });
})();

/* Maya's seed notifications (recent mentor feedback arrives unread) */
(function(){stuById('maya').stories.forEach(s=>{
  s.comments.forEach(c=>{if(c.t.slice(0,10)>='2026-07-15')c.seen=false});
  if(s.comments.some(c=>!c.seen))s.ts.feedbackOpened=null; /* unread feedback cannot have an opened timestamp */
  s.comments.filter(c=>!c.seen).forEach(c=>NOTIFS.push({id:'n'+(++NID),t:c.t,text:c.who+' left feedback on “'+titleOf(s)+'”.',storyId:s.id,read:false}));
});NOTIFS.sort((a,b)=>b.t.localeCompare(a.t))})();

/* ---- state ---- */
const S={role:'student',view:'home',roomId:null,roomTab:'orig',lib:{q:'',status:'',sort:'new',star:'',bird:'',pos:''},
 m:{cur:null,stuQ:'',cohort:'',stuSort:'attention',bucket:'awaiting',f:{q:'',sort:'new',filter:''},actF:{mentor:MENTOR_NAME,period:'week',cohort:'',type:''}},
 mentorAccess:true,qExpand:false};
const MENTOR={get cur(){return S.m.cur||STUDENTS[0]},set cur(v){S.m.cur=v}};
function curStories(){return S.role==='advisor'?MENTOR.cur.stories:STORIES}
function curFirst(){return S.role==='advisor'?MENTOR.cur.first:'Maya'}
function curPro(){return S.role==='advisor'?MENTOR.cur.pro:PRONOUNS.her}
function visible(){return S.role==='advisor'?MENTOR.cur.stories.filter(s=>s.status!=='private'):STORIES}
function shared(st){return st.stories.filter(s=>s.status!=='private')}
function findStory(id){for(const st of STUDENTS){const s=st.stories.find(x=>x.id===id);if(s)return{st,s}}return null}
function logHist(stu,txt){stu=stu||MENTOR.cur;stu.hist.unshift({d:iso(NOW()).slice(0,10),t:txt})}

/* ---- actions, history, notifications ---- */
function act(st,s,who,action,detail,prev){s.history.unshift({t:iso(NOW()),who,action,detail:detail||'',prev:prev||null});persist()}
function notify(st,s,text){if(st.id!=='maya')return; /* demo student inbox */
  const last=NOTIFS[0]; /* coalesce rapid actions on the same story: keep the newest, most actionable message */
  if(last&&!last.read&&last.storyId===s.id&&(NOW()-new Date(last.t))<5*60*1000){
    const isStatus=t=>/requested|reviewed|approved|started reviewing/.test(t);
    if(isStatus(last.text)&&!isStatus(text)){if(!last.text.includes('New feedback'))last.text+=' New feedback is attached.'}
    else last.text=text;
    last.t=iso(NOW());
  }else NOTIFS.unshift({id:'n'+(++NID),t:iso(NOW()),text,storyId:s.id,read:false});
  persist();renderRail()}
function setStatus(st,s,status,who){
  if(s.status===status)return;
  const prev=STATUS[s.status].label;s.status=status;s.ts.statusChanged=iso(NOW());
  if(status==='awaiting'&&who!==MENTOR_NAME){s.ts.submitted=s.ts.submitted||iso(NOW())}
  if(['changes','reviewed','approved'].includes(status)){s.ts.lastReviewed=iso(NOW());s.reviewedBy=who;s.revised=false} /* feedbackSent is stamped only by an actual comment */
  act(st,s,who,'Changed status to '+STATUS[status].label,'',prev);
  if(who===MENTOR_NAME||who==='Dr. Chen'){
    const msg={in_review:who+' started reviewing “'+titleOf(s)+'”.',changes:'Changes requested on “'+titleOf(s)+'”. Review '+who+'’s feedback.',
      reviewed:who+' reviewed “'+titleOf(s)+'” on '+fmtDT(NOW()) +'.',approved:'“'+titleOf(s)+'” was approved by '+who+'.'}[status];
    if(msg)notify(st,s,msg)}
  persist()}
function submitForReview(st,s){
  const was=s.status;s.status='awaiting';s.ts.submitted=s.ts.submitted||iso(NOW());s.ts.statusChanged=iso(NOW());s.ts.studentUpdated=iso(NOW());
  if(was==='changes'){s.revised=true;s.ts.studentResponded=iso(NOW());act(st,s,st.first,'Revised and resubmitted','after mentor feedback',STATUS[was].label)}
  else act(st,s,st.first,'Submitted for review','',STATUS[was].label);
  persist()}

/* ---- persistence (v2, guarded) ---- */
function persist(){try{localStorage.setItem('storyforge-v5',JSON.stringify({v:4,sid:SID,nid:NID,notifs:NOTIFS,customq:CUSTOMQ,
  students:STUDENTS.map(st=>({id:st.id,stories:st.stories,hist:st.hist,lastCapture:st.lastCapture}))}))}catch(e){}}
(function restore(){try{const raw=localStorage.getItem('storyforge-v5');if(!raw)return;const d=JSON.parse(raw);if(!d||d.v!==4)return;
  d.students.forEach(ds=>{const st=stuById(ds.id);if(!st)return;
    if(st.id==='maya'){STORIES.length=0;ds.stories.forEach(s=>STORIES.push(s))}else st.stories=ds.stories;
    st.hist=ds.hist||st.hist;st.lastCapture=ds.lastCapture||st.lastCapture});
  SID=Math.max(SID,d.sid||0);NID=Math.max(NID,d.nid||0);
  NOTIFS.length=0;(d.notifs||[]).forEach(n=>NOTIFS.push(n));
  CUSTOMQ.length=0;(d.customq||[]).forEach(q=>{CUSTOMQ.push(q)});CQID=CUSTOMQ.length;
}catch(e){}})();
function resetDemo(){try{localStorage.removeItem('storyforge-v5')}catch(e){};location.reload()}

/* ---- ported v1 systems (unchanged behavior) ---- */
function titleOf(s){return s.prefix?('The One Where '+s.t):s.t}
/* v2 ambient engine removed — superseded by the V5 environment engine below */
let toastT;
function toast(msg,ico){
  const te=document.querySelector('#teach');if(te&&te.classList.contains('open'))return; /* never float toasts over a projected classroom screen */
  const t=$('#toast');t.innerHTML='<span class="tico">'+(ico||'🔥')+'</span><span>'+msg+'</span>';t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3600)}
function burst(x,y){const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;if(rm)return;
  for(let i=0;i<26;i++){const e=document.createElement('div');e.className='burst';
    const a=Math.random()*Math.PI*2,d=40+Math.random()*110;
    e.style.cssText='left:'+x+'px;top:'+y+'px;background:'+(Math.random()>.4?'#ffb340':'#39d6ff')+';--dx:'+Math.cos(a)*d+'px;--dy:'+(Math.sin(a)*d-40)+'px;animation:bfly '+(0.6+Math.random()*.5)+'s ease-out forwards';
    document.body.appendChild(e);setTimeout(()=>e.remove(),1200);}}
function typeIn(el,text){let i=0;const iv=setInterval(()=>{el.value=text.slice(0,i);i+=3;if(i>text.length+3)clearInterval(iv)},18)}
function fixBannerOffset(){const m=$('#main');m.style.top=S.role==='advisor'?(60+$('#advBanner').offsetHeight)+'px':''}

function stChipHTML(s){return `<span class="stChip ${STATUS[s.status].col}" title="${esc(STATUS[s.status].hint)}">${STATUS[s.status].label}${s.revised&&s.status==='awaiting'?' · revised':''}</span>`}
function scoreTag(label,val,none){return `<span class="scoreTag ${val?'':'none'}" title="${label}">${label}: ${val?'<b>'+val+'</b>/5':none||'—'}</span>`}
function birdMini(s){return s.birds.length?`<span class="birdMini" title="${s.birds.map(b=>bird(b).label).join(', ')}">${s.birds.map(b=>bird(b).emo).join('')}</span>`:''}
function scorePickHTML(id,val,cls,lbl){return `<div class="scorePick ${cls||''}" data-sp="${id}">${[1,2,3,4,5].map(n=>`<button data-n="${n}" class="${val>=n?'on':''}">${n}</button>`).join('')}<span class="spv">${val?val+'/5':'not rated'}${lbl?' · '+lbl:''}</span></div>`}
function excerptOf(s){return (s.polish||s.body||'').replace(/^Voice note[^—]*—\s*/,'').slice(0,160)}

function libFiltered(){
  const L=S.lib;const q=L.q.trim().toLowerCase();
  let list=STORIES.filter(s=>{
    if(L.status&&s.status!==L.status)return false;
    if(L.star==='me'&&!s.starStudent)return false;
    if(L.star==='mentor'&&!s.starMentor)return false;
    if(L.bird&&!s.birds.includes(L.bird))return false;
    if(L.pos&&!s.positions.includes(L.pos))return false;
    if(q&&!(titleOf(s)+' '+s.body+' '+(s.lesson||'')).toLowerCase().includes(q))return false;
    return true});
  const sorts={new:(a,b)=>b.ts.studentUpdated.localeCompare(a.ts.studentUpdated),old:(a,b)=>a.ts.studentUpdated.localeCompare(b.ts.studentUpdated),
    myscore:(a,b)=>b.selfScore-a.selfScore,mentorscore:(a,b)=>b.mentorScore-a.mentorScore,title:(a,b)=>a.t.localeCompare(b.t)};
  return [...list].sort(sorts[L.sort]||sorts.new);
}

    const ns=$('#noteSend');if(ns)ns.onclick=()=>{const t=$('#noteTxt').value.trim();if(!t)return;
      s.comments.push({who:MENTOR_NAME,text:t,t:iso(NOW()),seen:false});s.ts.feedbackSent=iso(NOW());
      act(st,s,MENTOR_NAME,'Left feedback','“'+t.slice(0,60)+'…”');notify(st,s,MENTOR_NAME+' left feedback on “'+titleOf(s)+'”.');
      renderRoom();toast('Feedback sent. '+(st.id==='maya'?st.first+' gets a notification immediately.':st.first+' will be notified.'))};
    const as_=$('#askSend');if(as_)as_.onclick=()=>{const t=$('#askTxt').value.trim();if(!t)return;
      s.refl.push({q:t,a:'',from:'mentor',date:iso(NOW()).slice(0,10),seen:false});
      act(st,s,MENTOR_NAME,'Asked a question','“'+t.slice(0,60)+'”');notify(st,s,MENTOR_NAME+' asked you a question about “'+titleOf(s)+'”.');
      renderRoom();toast('Question sent to '+st.first+'.')};
    const mp=$('[data-sp="mentor"]');if(mp)mp.onclick=e=>{const b=e.target.closest('button');if(!b)return;
      const prev=s.mentorScore;s.mentorScore=+b.dataset.n===s.mentorScore?0:+b.dataset.n;
      act(st,s,MENTOR_NAME,'Updated the mentor score',s.mentorScore+'/5',prev?prev+'/5':null);
      if(s.mentorScore)notify(st,s,MENTOR_NAME+' updated the score on “'+titleOf(s)+'” to '+s.mentorScore+'/5.');renderRoom()};
    const mt=$('[data-star2="mentor"]');if(mt)mt.onclick=()=>{s.starMentor=!s.starMentor;

  $$('[data-bird]').forEach(b=>b.onclick=()=>{const id=b.dataset.bird;const who=adv?MENTOR_NAME:st.first;

    act(st,s,who,'Updated bird type',s.birds.map(x=>bird(x).label).join(', ')||'none',was.map(x=>bird(x).label).join(', ')||'none');
    if(adv)notify(st,s,MENTOR_NAME+' updated classifications on “'+titleOf(s)+'”.');renderRoom()});
  $$('[data-pos]').forEach(b=>b.onclick=()=>{const id=b.dataset.pos;const who=adv?MENTOR_NAME:st.first;
    const was=[...s.positions];s.positions=s.positions.includes(id)?s.positions.filter(x=>x!==id):[...s.positions,id];
    act(st,s,who,'Updated “ideal for” positions',s.positions.map(x=>pos(x).label).join(', ')||'none',was.map(x=>pos(x).label).join(', ')||'none');

  $$('[data-use]').forEach(b=>b.onclick=()=>{const u=b.dataset.use;

    else{s.uses=s.uses.includes(u)?s.uses.filter(x=>x!==u):[...s.uses,u];act(st,s,st.first,'Updated “where it could serve”');renderRoom()}});
  persist();
}

function mentorActs(){const out=[];STUDENTS.forEach(st=>st.stories.forEach(s=>s.history.forEach(h=>{

  }

        <span><b>${a.h.who}</b> — ${a.h.action}${a.h.detail?' · '+esc(a.h.detail):''} on <b>“${esc(titleOf(a.s))}”</b> · ${a.st.name} (${a.st.cohort})${a.h.prev?` <span class="prev" style="font-style:italic;color:var(--dim)">was: ${esc(a.h.prev)}</span>`:''}</span></div>`).join('')||'<div class="stageHint">No mentor actions in this period.</div>'}

  $('#afMentor').onchange=e=>{A.mentor=e.target.value;render()};
  $('#afStudent').onchange=e=>{A.student=e.target.value;render()};
  $('#afCohort').onchange=e=>{A.cohort=e.target.value;render()};
  $('#afType').onchange=e=>{A.type=e.target.value;render()};
  $('#afPeriod').onchange=e=>{A.period=e.target.value;render()};
  const af=$('#afFrom');if(af)af.onchange=e=>{A.from=e.target.value;render()};
  const at=$('#afTo');if(at)at.onchange=e=>{A.to=e.target.value;render()};
  $$('#main [data-fr]').forEach(el=>el.onclick=()=>{const f=findStory(el.dataset.fr);if(f){MENTOR.cur=f.st;openRoom(f.s.id)}});

<script>
/* ================= CAPTURE (ported v1, v2 model on save) ================= */
const cap=$('#capture');
let capState=null,capDraft=null;
const QTHEME={q1:'identity',q2:'mistake',q3:'conflict',q4:'patient',q5:'leader',q6:'resil',q7:'growth',q8:'advoc',q9:'comm',q10:'identity',q11:'advoc',q12:'growth'};
function openCapture(opt){opt=opt||{};if(S.role==='advisor'){toast('Capture belongs to the student — switch to Student View to add a story.');return}
  const d=capDraft||{};
  capState={themes:d.themes?[...d.themes]:[],selfScore:d.selfScore||0,voice:d.voice||false,rec:false,recT:0,recTimer:null,
    qid:opt.qid||d.qid||null,prefix:d.prefix!==undefined?d.prefix:true};
  opt.title=opt.title||d.title||'';opt.body=d.body||'';opt.lesson=d.lesson||'';opt.prompt=opt.prompt||d.prompt||null;
  if(capState.qid&&!opt.prompt){const qb=QBANK.find(x=>x.id===capState.qid);if(qb)opt.prompt=qb.q}
  capState.prompt=opt.prompt;
  cap.innerHTML=`<div class="capSheet">
    <button class="capClose" id="capClose"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <div class="capKicker">＋ New story — save it before it fades</div>
    ${opt.prompt?`<div style="margin-bottom:14px;font-family:var(--voice);font-style:italic;color:var(--vi);font-size:14px">Prompt: “${esc(opt.prompt)}”</div>`:''}
    ${(d.title||d.body)?'<div style="margin-bottom:12px;font-family:var(--num);font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gn)">✓ Draft restored — nothing was lost</div>':''}
    <div class="capTitleRow">
      <span class="capPre ${capState.prefix?'':'off'}" id="capPre" title="Tap to drop the prefix">The One Where</span>
      <input id="capTitle" placeholder="…what happened?" autocomplete="off" value="${esc(opt.title)}">
    </div>
    <div class="capHint">Name it the way you’d bring it up with a friend. If the title makes you smile or wince, it’s right.</div>
    <div class="capTellWrap">
      <textarea id="capBody" placeholder="Tell it like you’d tell a trusted person. Messy is perfect — this version stays yours forever.">${esc(opt.body)}</textarea>
      <div class="micBar">
        <button class="micBtn" id="capMic"><span class="rdot"></span><span id="micLbl">Record a voice note</span></button>
        <div class="wave" id="wave">${Array.from({length:14},(_,i)=>'<i style="animation-delay:'+(i*.07)+'s"></i>').join('')}</div>
        <span class="micTime" id="micTime">0:00</span>
      </div>
    </div>
    <div class="capMore ${(opt.lesson||capState.themes.length||capState.selfScore)?'open':''}" id="capMore">
      <div class="capMoreHead" id="capMoreHead"><span class="car">▸</span> Add more now — or skip all of it and just save</div>
      <div class="capMoreBody">
        <div class="capField"><div class="fl">What did it teach you?</div><input id="capLesson" placeholder="One honest sentence is plenty…" value="${esc(opt.lesson)}"></div>
        <div class="capField"><div class="fl">My rating — how much does it matter to you?</div>${scorePickHTML('cap',capState.selfScore,'','')}</div>
        <div class="capField"><div class="fl">Feels like</div><div class="thFilter" id="capThemes">${THEMES.map(t=>`<button class="thChip ${capState.themes.includes(t.id)?'on':''}" data-ct="${t.id}" style="--hue:${t.hue}"><i></i>${t.label}</button>`).join('')}</div></div>
      </div>
    </div>
    <div class="capActions">
      <button class="btnSave" id="capSave" disabled>Save story</button>
      <span class="capNote">Saved private. Submit it for review whenever you’re ready.</span>
      <div class="privNote">🔒 Only you can see it</div>
    </div>
  </div>`;
  cap.classList.add('open');
  const title=$('#capTitle'),body=$('#capBody'),save=$('#capSave'),pre=$('#capPre');
  const sync=()=>{save.disabled=!title.value.trim()};title.oninput=sync;sync();
  setTimeout(()=>title.focus(),60);
  pre.onclick=()=>{pre.classList.toggle('off');capState.prefix=!pre.classList.contains('off')};
  $('#capClose').onclick=closeCapture;
  cap.onmousedown=e=>{if(e.target===cap)closeCapture()};
  $('#capMoreHead').onclick=()=>$('#capMore').classList.toggle('open');
  const cp=$('[data-sp="cap"]');if(cp)cp.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    capState.selfScore=+b.dataset.n===capState.selfScore?0:+b.dataset.n;
    $$('[data-sp="cap"] button').forEach(x=>x.classList.toggle('on',+x.dataset.n<=capState.selfScore));
    $('[data-sp="cap"] .spv').textContent=capState.selfScore?capState.selfScore+'/5':'not rated'};
  $$('[data-ct]').forEach(c=>c.onclick=()=>{const id=c.dataset.ct;
    capState.themes=capState.themes.includes(id)?capState.themes.filter(x=>x!==id):[...capState.themes,id];c.classList.toggle('on')});
  const mic=$('#capMic'),micLbl=$('#micLbl'),micTime=$('#micTime'),wave=$('#wave');
  mic.onclick=()=>{
    if(!capState.rec){capState.rec=true;capState.voice=true;capState.recT=0;mic.classList.add('rec');micLbl.textContent='Listening… tap to finish';
      micTime.style.display='inline';wave.classList.add('on');
      capState.recTimer=setInterval(()=>{capState.recT++;micTime.textContent=Math.floor(capState.recT/60)+':'+String(capState.recT%60).padStart(2,'0')},1000);
    }else{clearInterval(capState.recTimer);capState.rec=false;mic.classList.remove('rec');wave.classList.remove('on');micTime.style.display='none';
      micLbl.textContent='Transcribing…';const secs=Math.max(capState.recT,1);
      setTimeout(()=>{micLbl.textContent='Voice note attached ✓';
        const stamp='Voice note, 0:'+String(secs).padStart(2,'0')+' — ';
        const demo='(Prototype: in the real product, your spoken words appear here as live transcript, kept in your own voice.)';
        if(!body.value.trim())typeIn(body,stamp+demo);else body.value=stamp+body.value;},1200)}};
  save.onclick=()=>{
    const st=stuById('maya');
    const s=mk({t:title.value.trim(),prefix:capState.prefix!==false,date:iso(NOW()).slice(0,10),
      body:body.value.trim(),lesson:$('#capLesson').value.trim(),embers:capState.selfScore,
      themes:[...capState.themes],voice:capState.voice,shared:false});
    upgradeStory(st,s);
    s.ts.captured=iso(NOW());s.ts.studentUpdated=iso(NOW());
    s.history=[{t:iso(NOW()),who:'Maya',action:'Captured the story',detail:s.voice?'from a voice note':''}];
    if(capState.voice)s.audio={dur:Math.max(capState.recT||42,6)};
    if(capState.qid){s.qa=[{q:capState.qid,by:'Maya',confirmed:false,sStudent:3,sMentor:null,t:iso(NOW()),fups:[],why:''}];
      const th=QTHEME[capState.qid];if(th&&!s.themes.includes(th))s.themes.push(th)}
    STORIES.unshift(s);capDraft=null;persist();
    const r=save.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2);
    title.value='';body.value='';$('#capLesson').value='';
    closeCapture();S.view=capState&&capState.qid?'prep':'home';S.view=s.qa.length?'prep':'home';render();
    toast('Saved. “'+esc(titleOf(s)).slice(0,60)+'” is private until you submit it for review.');
  };
}
function closeCapture(){
  if(capState&&capState.recTimer)clearInterval(capState.recTimer);
  const t=$('#capTitle'),b=$('#capBody'),l=$('#capLesson');
  if(capState&&(t&&t.value.trim()||b&&b.value.trim())){
    capDraft={title:t?t.value:'',body:b?b.value:'',lesson:l?l.value:'',themes:[...capState.themes],
      selfScore:capState.selfScore,voice:capState.voice,prefix:capState.prefix,qid:capState.qid,prompt:capState.prompt};
    toast('Draft kept, nothing lost — reopen “New Story” to continue.');
  }else if(capState){capDraft=null}
  cap.classList.remove('open');cap.innerHTML='';capState=null;
}

/* ================= QUICK REVIEW DRAWER ================= */
const quick=$('#quick');
let QCTX=null;
function openQuick(id,listIds){const ids=listIds&&listIds.length?listIds:[id];
  QCTX={ids,i:Math.max(0,ids.indexOf(id))};renderQuick();quick.classList.add('open')}
function closeQuick(){quick.classList.remove('open');quick.innerHTML='';QCTX=null}
function renderQuick(){
  if(!QCTX)return;const id=QCTX.ids[QCTX.i];const f=findStory(id);if(!f){closeQuick();return}
  const {st,s}=f;const adv=S.role==='advisor';
  if(adv&&!s.ts.firstOpened){s.ts.firstOpened=iso(NOW());act(st,s,MENTOR_NAME,'Opened the story','first mentor open — status unchanged')}
  quick.innerHTML=`<div class="drawer">
    <div class="drHead">
      <div style="flex:1;min-width:0">
        <div class="eyebrow" style="margin-bottom:5px">Quick review${adv?' · '+st.name:''} · ${QCTX.i+1} of ${QCTX.ids.length}</div>
        <div class="h2" style="transform:none">${s.prefix?'<span style="color:var(--dim);font-size:12px;display:block">The One Where</span>':''}${esc(s.t)}</div>
        <div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">${stChipHTML(s)}${birdMini(s)}<span class="scoreTag">${devState(s)}</span></div>
      </div>
      <button class="drClose" id="qClose">✕</button>
    </div>
    <div class="drBody">
      <div class="drSec"><div class="dsLbl">The story</div><div class="drExc">${esc(s.polish||s.body)}</div>
        ${s.lesson?`<div style="margin-top:8px;font-family:var(--voice);font-style:italic;font-size:13px;color:#e8dfc0">Lesson: “${esc(s.lesson)}”</div>`:''}</div>
      <div class="drSec"><div class="dsLbl">Review status ${adv?'<span style="letter-spacing:0;text-transform:none;font-weight:600">— one click, saved with your name and time</span>':''}</div>
        ${adv?`<div class="statusRow">${['in_review','changes','reviewed','approved'].map(k=>`<button data-qst="${k}" class="${s.status===k?'on '+STATUS[k].col:''}">${STATUS[k].label}</button>`).join('')}</div>`
        :(s.status==='private'?'<button class="noteSend" id="qSubmit" style="background:linear-gradient(90deg,var(--em),var(--em2));color:#140b00">Submit for review</button>'
         :s.status==='changes'?'<button class="noteSend" id="qSubmit">Resubmit for review</button>'
         :`<div class="stageHint">${STATUS[s.status].hint}</div>`)}
        <div style="margin-top:10px">${tsLines(s)}</div></div>
      <div class="drSec"><div class="dsLbl">${adv?'Your score (mentor)':'My rating <span style="letter-spacing:0;text-transform:none;font-weight:600">— how much this story matters to me</span>'}</div>
        ${adv?scorePickHTML('qm',s.mentorScore,'cy'):scorePickHTML('qs',s.selfScore)}
        <div style="margin-top:8px;font-size:12px;color:var(--dim)">${adv?st.first+'’s own rating: '+(s.selfScore?s.selfScore+'/5':'not rated'):'Mentor score: '+(s.mentorScore?s.mentorScore+'/5'+(s.reviewedBy?' by '+s.reviewedBy:''):'not scored yet')}</div>
        <div style="margin-top:10px;display:flex;align-items:center;gap:10px">
          <button class="starBtn ${adv?'mentor':''} ${(adv?s.starMentor:s.starStudent)?'on':''}" id="qStar" style="font-size:20px">★</button>
          <span style="font-size:12.5px;color:var(--mid)">${adv?'Your mentor star (independent of the student’s)':'Star this story'}</span>
        </div></div>
      <div class="drSec"><div class="dsLbl">Classification</div>
        <div class="classChips" style="margin-bottom:10px">${BIRDS.map(b=>`<button class="cChip ${s.birds.includes(b.id)?'on':''}" data-qbird="${b.id}" style="--chue:${b.hue}" title="${b.hint}">${b.emo} ${b.label}</button>`).join('')}</div>
        <div class="classChips">${POSITIONS.map(p=>`<button class="cChip ${s.positions.includes(p.id)?'on':''}" data-qpos="${p.id}">${p.label}</button>`).join('')}</div></div>
      <div class="drSec"><div class="dsLbl">Interview questions (${s.qa.length}) <button class="pMore" id="qQa" style="margin-left:auto">Assign ▸</button></div>
        ${s.qa.slice(0,4).map(x=>{const q=qById(x.q);return q?`<div style="font-size:12.5px;color:var(--mid);padding:3px 0">${x.confirmed?'✓':'◌'} ${esc(q.q)} <span style="color:var(--dim)">· self ${x.sStudent?x.sStudent+'/5':'—'} · mentor ${x.sMentor?x.sMentor+'/5':'—'}</span></div>`:''}).join('')||'<div class="stageHint">None yet.</div>'}</div>
      ${adv?`<div class="drSec"><div class="dsLbl">Leave feedback</div>
        <div class="noteCompose" style="display:block"><textarea id="qNote" placeholder="Feedback for ${st.first} — sent the moment you click…"></textarea><button class="noteSend" id="qNoteSend">Send feedback</button></div></div>`
      :`<div class="drSec"><div class="dsLbl">Mentor feedback</div>
        ${s.comments.map(c=>`<div class="noteItem"><div class="nt">“${esc(c.text)}”</div><div class="nd">${c.who} · ${fmtDT(c.t)}</div></div>`).join('')||'<div class="stageHint">No written feedback yet.</div>'}</div>`}
    </div>
    <div class="drFoot">
      <button class="rowBtn" id="qPrev" ${QCTX.i===0?'disabled':''}>‹ Previous</button>

      <span style="flex:1"></span>
      <button class="rowBtn pri" id="qFull">Open full review</button>

  quick.onmousedown=e=>{if(e.target===quick)closeQuick()};
  $('#qClose').onclick=closeQuick;
  $('#qPrev').onclick=()=>{if(QCTX.i>0){QCTX.i--;renderQuick()}};
  $('#qNext').onclick=()=>{if(QCTX.i<QCTX.ids.length-1){QCTX.i++;renderQuick()}};
  $('#qFull').onclick=()=>{closeQuick();openRoom(s.id)};
  $('#qQa').onclick=()=>openQad(s.id);
  const qsb=$('#qSubmit');if(qsb)qsb.onclick=()=>{submitForReview(st,s);renderQuick();toast('Submitted for review on '+fmtDT(NOW())+'.')};
  $$('[data-qst]').forEach(b=>b.onclick=()=>{setStatus(st,s,b.dataset.qst,MENTOR_NAME);renderQuick();render();
    toast('“'+STATUS[b.dataset.qst].label+'” saved — '+MENTOR_NAME+', '+fmtDT(NOW())+'.')});
  const qm=$('[data-sp="qm"]');if(qm)qm.onclick=e=>{const b=e.target.closest('button');if(!b)return;

  $$('[data-qbird]').forEach(b=>b.onclick=()=>{const idb=b.dataset.qbird;const who=adv?MENTOR_NAME:st.first;

  $$('[data-qpos]').forEach(b=>b.onclick=()=>{const idp=b.dataset.qpos;const who=adv?MENTOR_NAME:st.first;
    const was=[...s.positions];s.positions=s.positions.includes(idp)?s.positions.filter(x=>x!==idp):[...s.positions,idp];
    act(st,s,who,'Updated “ideal for” positions',s.positions.map(x=>pos(x).label).join(', ')||'none',was.map(x=>pos(x).label).join(', ')||'none');
    if(adv)notify(st,s,MENTOR_NAME+' updated classifications on “'+titleOf(s)+'”.');renderQuick()});
  const qns=$('#qNoteSend');if(qns)qns.onclick=()=>{const t=$('#qNote').value.trim();if(!t)return;

    act(st,s,MENTOR_NAME,'Left feedback','“'+t.slice(0,60)+'…”');notify(st,s,MENTOR_NAME+' left feedback on “'+titleOf(s)+'”.');
