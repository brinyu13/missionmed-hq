/* ================= ASSIGN INTERVIEW QUESTIONS DRAWER ================= */
const qad=$('#qad');
let QAD=null;
function openQad(storyId){QAD={storyId,q:'',delta:{assigned:0,scored:0}};renderQad();qad.classList.add('open')}
function closeQad(){
  if(QAD){const f=findStory(QAD.storyId);
    if(f&&S.role==='advisor'){
      if(QAD.delta.assigned>0)notify(f.st,f.s,MENTOR_NAME+' assigned “'+titleOf(f.s)+'” to '+QAD.delta.assigned+' interview question'+(QAD.delta.assigned>1?'s':'')+'.');
      else if(QAD.delta.scored>0)notify(f.st,f.s,MENTOR_NAME+' updated question strength scores on “'+titleOf(f.s)+'”.')}}
  qad.classList.remove('open');qad.innerHTML='';QAD=null;
  if(QCTX)renderQuick();else if(room.classList.contains('open'))renderRoom();else render();
}
function renderQad(){
  const f=findStory(QAD.storyId);if(!f)return;const {st,s}=f;const adv=S.role==='advisor';
  const q=QAD.q.trim().toLowerCase();
  const cats=[...new Set(allQ().map(x=>x.cat))];
  qad.innerHTML=`<div class="drawer">
    <div class="drHead">
      <div style="flex:1"><div class="eyebrow" style="margin-bottom:5px">Assign interview questions</div>
        <div class="h2" style="transform:none">“${esc(s.t)}”</div>
        <div style="margin-top:6px;font-size:12px;color:var(--dim)">Pick every question this story could answer, then score how well it answers each one — a story can be 5/5 for one question and 2/5 for another.</div></div>
      <button class="drClose" id="qadClose">✕</button>
    </div>
    <div class="drBody">
      <input type="text" id="qadQ" placeholder="Search questions…" value="${esc(QAD.q)}" style="width:100%;background:#0f1522;border:1px solid var(--edge);border-radius:9px;color:var(--tx);font-family:var(--disp);font-size:13px;padding:9px 12px;outline:none;margin-bottom:14px">
      ${cats.map(cat=>{
        const qs=allQ().filter(x=>x.cat===cat&&(!q||x.q.toLowerCase().includes(q)));if(!qs.length)return'';
        return `<div class="drSec"><div class="dsLbl">${cat}</div>
        ${qs.map(qb=>{const x=s.qa.find(y=>y.q===qb.id);
          return `<div class="qaRow ${x?'sel':''}">
            <div class="qaTop" data-qtog="${qb.id}"><span class="qaCk">✓</span>
              <div style="flex:1"><div class="qq2">${esc(qb.q)}</div>
              ${x?`<div class="qaHist">${x.confirmed?'Assigned':'Suggested'} by ${x.by} · ${fmtD(x.t.slice(0,10))}${!x.confirmed?' · not yet confirmed by a mentor':''}</div>`:''}</div>
              ${x&&!x.confirmed?`<span class="qaState" style="color:var(--vi)">suggested</span>`:x?'<span class="qaState" style="color:var(--gn)">assigned</span>':''}</div>
            ${x?`<div class="qaCtl">
              <span class="fLbl">Strength — this story vs this question</span>
              ${adv?`<div class="scorePick cy" data-qsc="${qb.id}" style="--n:1">${[1,2,3,4,5].map(n=>`<button data-n="${n}" class="${(x.sMentor||0)>=n?'on':''}">${n}</button>`).join('')}<span class="spv">mentor ${x.sMentor?x.sMentor+'/5':'—'}</span></div>
                <span style="font-size:11.5px;color:var(--dim)">self: ${x.sStudent?x.sStudent+'/5':'—'}</span>
                ${!x.confirmed?`<button class="rowBtn pri" data-qconf="${qb.id}">Confirm</button>`:''}`
              :`<div class="scorePick" data-qsc="${qb.id}">${[1,2,3,4,5].map(n=>`<button data-n="${n}" class="${(x.sStudent||0)>=n?'on':''}">${n}</button>`).join('')}<span class="spv">self ${x.sStudent?x.sStudent+'/5':'—'}</span></div>
                <span style="font-size:11.5px;color:var(--dim)">mentor: ${x.sMentor?x.sMentor+'/5':'—'}</span>`}
            </div>`:''}
          </div>`}).join('')}</div>`}).join('')}
      <div class="drSec"><div class="dsLbl">Add a custom question</div>
        <div class="askRow"><input id="qadCustom" placeholder="Type a question not in the library…"><button class="noteSend" id="qadAdd">Add</button></div></div>
    </div>
    <div class="drFoot"><span style="font-size:12px;color:var(--dim)">${s.qa.length} question${s.qa.length===1?'':'s'} on this story · every change is saved instantly and logged</span>
      <button class="rowBtn pri" id="qadDone" style="margin-left:auto">Done</button></div>
  </div>`;
  qad.onmousedown=e=>{if(e.target===qad)closeQad()};
  $('#qadClose').onclick=$('#qadDone').onclick=closeQad;
  $('#qadQ').oninput=e=>{QAD.q=e.target.value;renderQad();const v=$('#qadQ');if(v){v.focus();v.setSelectionRange(v.value.length,v.value.length)}};
  $$('[data-qtog]').forEach(el=>el.onclick=e=>{const qid=el.dataset.qtog;const i=s.qa.findIndex(y=>y.q===qid);const qb=qById(qid);
    if(i>=0&&!e.target.closest('.qaCk'))return; /* removing is deliberate: only the checkbox unassigns */
    if(i>=0){const was=s.qa[i];s.qa.splice(i,1);
      act(st,s,S.role==='advisor'?MENTOR_NAME:st.first,'Removed an interview question','“'+qb.q.slice(0,50)+'”',was.confirmed?'was assigned':'was suggested');
      toast('Question removed — its strength scores were cleared with it.')}
    else{if(S.role==='advisor'){s.qa.push({q:qid,by:MENTOR_NAME,confirmed:true,sMentor:null,sStudent:null,t:iso(NOW())});QAD.delta.assigned++;
        act(st,s,MENTOR_NAME,'Assigned an interview question','“'+qb.q.slice(0,50)+'”')}
      else{s.qa.push({q:qid,by:st.first,confirmed:false,sStudent:null,sMentor:null,t:iso(NOW())});
        act(st,s,st.first,'Suggested an interview question','“'+qb.q.slice(0,50)+'” — awaiting mentor confirmation')}}
    persist();renderQad()});
  $$('[data-qsc]').forEach(el=>el.onclick=e=>{const b=e.target.closest('button');if(!b)return;e.stopPropagation();
    const x=s.qa.find(y=>y.q===el.dataset.qsc);if(!x)return;const qb=qById(el.dataset.qsc);const n=+b.dataset.n;
    if(S.role==='advisor'){const prev=x.sMentor;x.sMentor=n===x.sMentor?null:n;QAD.delta.scored++;
      act(st,s,MENTOR_NAME,'Scored a question strength','“'+qb.q.slice(0,40)+'” → '+(x.sMentor?x.sMentor+'/5':'cleared'),prev?prev+'/5':null)}
    else{const prev=x.sStudent;x.sStudent=n===x.sStudent?null:n;
      act(st,s,st.first,'Scored a question strength (self)','“'+qb.q.slice(0,40)+'” → '+(x.sStudent?x.sStudent+'/5':'cleared'),prev?prev+'/5':null)}
    persist();renderQad()});
  $$('[data-qconf]').forEach(b=>b.onclick=e=>{e.stopPropagation();const x=s.qa.find(y=>y.q===b.dataset.qconf);if(!x)return;
    x.confirmed=true;const qb=qById(x.q);QAD.delta.assigned++;
    act(st,s,MENTOR_NAME,'Confirmed a suggested question','“'+qb.q.slice(0,50)+'” — suggested by '+x.by);persist();renderQad()});
  $('#qadAdd').onclick=()=>{const t=$('#qadCustom').value.trim();if(!t)return;
    const cq={id:'cq'+(++CQID),cat:'Custom',q:t};CUSTOMQ.push(cq);
    if(S.role==='advisor'){s.qa.push({q:cq.id,by:MENTOR_NAME,confirmed:true,sMentor:null,sStudent:null,t:iso(NOW())});QAD.delta.assigned++;
      act(st,s,MENTOR_NAME,'Added a custom question','“'+t.slice(0,50)+'”')}
    else{s.qa.push({q:cq.id,by:st.first,confirmed:false,sStudent:null,sMentor:null,t:iso(NOW())});
      act(st,s,st.first,'Suggested a custom question','“'+t.slice(0,50)+'”')}
    persist();renderQad()};
}
</script>
<script>
/* ================= TEACHING MODE (ported + live review actions) ================= */
const teachEl=$('#teach');
let TEACH=null;
function teachPool(){const out=[];STUDENTS.forEach(st=>st.stories.filter(s=>s.status!=='private'&&s.body).forEach(s=>out.push({st,s})));return out}
function openTeach(stuId,storyId,anon){
  const pool=teachPool();
  let a=pool.find(p=>storyId?p.s.id===storyId:(p.st.id===stuId&&p.s.mentorScore>=4))||pool.find(p=>p.st.id===stuId)||pool[0];
  TEACH={a,b:null,anon:anon===undefined?true:!!anon};
  teachEl.classList.add('open');renderTeach();
}
function closeTeach(){TEACH=null;teachEl.classList.remove('open');teachEl.innerHTML='';render()}
function teachColHTML(p,side){
  const s=p.s;const craft=s.advisor.craft=s.advisor.craft||{};
  const who=TEACH.anon?('Story '+side):(p.st.name+' · '+p.st.year+' · '+p.st.spec);
  const score=CRAFT.reduce((a,c)=>a+(craft[c.id]||0),0);
  return `<div class="tCol">
    <div class="tWho">${who} · ${STATUS[s.status].label}${s.mentorScore?' · Mentor score '+s.mentorScore+'/5':''}</div>
    ${s.prefix?'<div class="tPre">The One Where</div>':''}
    <div class="tTtl">${esc(s.t)}</div>
    <div class="tBody">${esc(s.polish??s.body)}</div>
    ${s.lesson?`<div class="tLesson">“${esc(s.lesson)}”</div>`:''}
    <div class="anatomy">
      <div class="aHead">Story anatomy · ${score}/15</div>
      <div class="aSub">Score it live — segments light as you teach why this story works.</div>
      ${CRAFT.map(c=>`<div class="aDim"><span class="al">${c.label}</span>
        <span class="segs" data-side="${side}" data-dim="${c.id}">${[1,2,3].map(n=>`<i class="${(craft[c.id]||0)>=n?'lit':''}" data-n="${n}"></i>`).join('')}</span>
        <span class="tScore">${craft[c.id]||0}</span></div><div class="tHint">${c.hint}</div>`).join('')}
    </div>
    <div class="tActs">
      <span class="fLbl">Live actions</span>
      <div class="statusRow">${['in_review','changes','reviewed','approved'].map(k=>`<button data-tst="${side}:${k}" class="${s.status===k?'on '+STATUS[k].col:''}">${STATUS[k].label}</button>`).join('')}</div>
      <div class="scorePick cy" data-tsc="${side}">${[1,2,3,4,5].map(n=>`<button data-n="${n}" class="${s.mentorScore>=n?'on':''}">${n}</button>`).join('')}<span class="spv">mentor ${s.mentorScore?s.mentorScore+'/5':'—'}</span></div>
      <button class="starBtn mentor ${s.starMentor?'on':''}" data-tstar="${side}" style="font-size:19px">★</button>
      <button class="rowBtn" data-tqa="${side}">Assign questions</button>
      <div class="askRow" style="flex:1;min-width:220px"><input data-tcm="${side}" placeholder="Comment — saves to the story, notifies the student…"><button class="noteSend" data-tcms="${side}">Send</button></div>
    </div>
  </div>`;
}
function renderTeach(){
  const pool=teachPool();
  const opts=sel=>pool.map(p=>`<option value="${p.s.id}" ${sel&&sel.s.id===p.s.id?'selected':''}>${TEACH.anon?'Story — '+titleOf(p.s).slice(0,42):p.st.first+' — '+titleOf(p.s).slice(0,38)}</option>`).join('');
  teachEl.innerHTML=`
  <div class="tBar">
    <div class="tTitle">Teaching <em>Mode</em></div>
    <select class="tSel" id="tSelA">${opts(TEACH.a)}</select>
    <select class="tSel" id="tSelB"><option value="">+ Compare with…</option>${opts(TEACH.b)}</select>
    <div class="tglRow"><div class="tgl ${TEACH.anon?'on':''}" id="tAnon"><i></i></div> Hide names<span style="color:var(--dim);letter-spacing:.06em;text-transform:none;font-weight:600">— on by default for class</span></div>
    <button class="btnGhost" id="tExit" style="margin-left:auto">Exit Teaching Mode</button>
  </div>
  <div class="teachGrid ${TEACH.b?'two':''}">
    ${teachColHTML(TEACH.a,'A')}
    ${TEACH.b?teachColHTML(TEACH.b,'B'):''}
  </div>`;
  const find=id=>teachPool().find(p=>p.s.id===id);
  const colOf=side=>side==='A'?TEACH.a:TEACH.b;
  $('#tSelA').onchange=e=>{TEACH.a=find(e.target.value);renderTeach()};
  $('#tSelB').onchange=e=>{TEACH.b=e.target.value?find(e.target.value):null;renderTeach()};
  $('#tAnon').onclick=()=>{TEACH.anon=!TEACH.anon;renderTeach()};
  $('#tExit').onclick=closeTeach;
  $$('#teach .segs i').forEach(seg=>seg.onclick=()=>{
    const wrap=seg.parentElement,p=colOf(wrap.dataset.side),dim=wrap.dataset.dim,n=+seg.dataset.n;if(!p)return;
    p.s.advisor.craft=p.s.advisor.craft||{};p.s.advisor.craft[dim]=p.s.advisor.craft[dim]===n?n-1:n;persist();renderTeach()});
  $$('[data-tst]').forEach(b=>b.onclick=()=>{const[side,k]=b.dataset.tst.split(':');const p=colOf(side);if(!p)return;
    setStatus(p.st,p.s,k,MENTOR_NAME);renderTeach();toast('“'+STATUS[k].label+'” saved for '+(TEACH.anon?'this story':p.st.first)+' — logged with your name.')});
  $$('[data-tsc]').forEach(el=>el.onclick=e=>{const b=e.target.closest('button');if(!b)return;const p=colOf(el.dataset.tsc);if(!p)return;
    const prev=p.s.mentorScore;p.s.mentorScore=+b.dataset.n===p.s.mentorScore?0:+b.dataset.n;
    act(p.st,p.s,MENTOR_NAME,'Updated the mentor score',p.s.mentorScore+'/5',prev?prev+'/5':null);
    if(p.s.mentorScore)notify(p.st,p.s,MENTOR_NAME+' updated the score on “'+titleOf(p.s)+'” to '+p.s.mentorScore+'/5.');renderTeach()});
  $$('[data-tstar]').forEach(b=>b.onclick=()=>{const p=colOf(b.dataset.tstar);if(!p)return;
    p.s.starMentor=!p.s.starMentor;act(p.st,p.s,MENTOR_NAME,p.s.starMentor?'Starred the story':'Removed mentor star');
    if(p.s.starMentor)notify(p.st,p.s,MENTOR_NAME+' starred “'+titleOf(p.s)+'”.');renderTeach()});
  $$('[data-tqa]').forEach(b=>b.onclick=()=>{const p=colOf(b.dataset.tqa);if(p)openQad(p.s.id)});
  $$('[data-tcms]').forEach(b=>b.onclick=()=>{const side=b.dataset.tcms;const p=colOf(side);const inp=$('[data-tcm="'+side+'"]');
    const t=inp.value.trim();if(!t||!p)return;
    p.s.comments.push({who:MENTOR_NAME,text:t,t:iso(NOW()),seen:false});p.s.ts.feedbackSent=iso(NOW());
    act(p.st,p.s,MENTOR_NAME,'Left feedback','“'+t.slice(0,60)+'…”');notify(p.st,p.s,MENTOR_NAME+' left feedback on “'+titleOf(p.s)+'”.');
    inp.value='';toast('Comment saved to the story record — student is notified.')});
}

/* ================= 1:1 SESSION (ported) ================= */
const seshEl=$('#sesh');
let SESH=null;
function sessionAgenda(st){
  const out=[];
  shared(st).forEach(s=>{const b=bucketOf(s);
    if(b==='revised')out.push({label:'Re-review the revision of “'+titleOf(s)+'”',s:s.id});
    else if(b==='awaiting')out.push({label:'First review: “'+titleOf(s)+'”',s:s.id});
    else if(b==='waiting')out.push({label:'Walk through requested changes on “'+titleOf(s)+'”',s:s.id});
    else if(!s.mentorScore)out.push({label:'Score “'+titleOf(s)+'”',s:s.id})});
  const conf=q=>shared(st).some(s=>s.qa.some(x=>x.q===q.id));
  const gaps=QBANK.filter(q=>!conf(q)).length;
  if(gaps)out.push({label:gaps+' interview questions still have no story',go:'prep'});
  return out.slice(0,6).map(a=>({...a,done:false}));
}
function startSesh(st){SESH={st,agenda:sessionAgenda(st),exp:false};document.body.classList.add('seshOn');renderSesh();
  toast('1:1 session started with '+st.first+'. Work the agenda in any order; tap the circle when an item is covered.')}
function renderSesh(){
  if(!SESH){seshEl.classList.remove('on');document.body.classList.remove('seshOn');fixBannerOffset();return}
  seshEl.classList.add('on');seshEl.classList.toggle('exp',!!SESH.exp);
  const done=SESH.agenda.filter(a=>a.done).length;
  seshEl.innerHTML=`<span class="sLbl">1:1 · ${SESH.st.name}</span>
    <button class="agSum" id="agSum">Agenda ${done}/${SESH.agenda.length} ${SESH.exp?'▾':'▴'}</button>
    <div class="agWrap">${SESH.agenda.map((a,i)=>`<button class="agChip ${a.done?'done':''}" data-ag="${i}" title="Click to open · tap the circle when covered"><i class="agCk">${a.done?'✓':''}</i>${a.label.slice(0,46)}${a.label.length>46?'…':''}</button>`).join('')}</div>
    <button class="endBtn" id="seshEnd">End session</button>`;
  $('#agSum').onclick=()=>{SESH.exp=!SESH.exp;renderSesh()};
  $$('#sesh .agChip').forEach(c=>{c.onclick=e=>{const a=SESH.agenda[+c.dataset.ag];
    if(e.target.closest('.agCk')){a.done=!a.done;renderSesh();return}
    MENTOR.cur=SESH.st;
    if(a.s)openQuick(a.s,SESH.agenda.filter(x=>x.s).map(x=>x.s));else{S.view='prep';render()}}});
  $('#seshEnd').onclick=()=>{const done=SESH.agenda.filter(a=>a.done).length;
    logHist(SESH.st,'1:1 session with '+MENTOR_NAME+' — covered '+done+' of '+SESH.agenda.length+' agenda items');
    persist();toast('Session logged to '+SESH.st.first+'’s coaching history — '+done+' of '+SESH.agenda.length+' items covered.');
    SESH=null;renderSesh();closeQuick();if(room.classList.contains('open'))closeRoom();S.view='mhome';render()};
  fixBannerOffset();
}

/* ================= JUMP / SEARCH PALETTE (mentor) ================= */
const pal=$('#pal');
let palSel=0;
function openPal(){if(S.role!=='advisor')return;palSel=0;pal.classList.add('open');renderPal('');setTimeout(()=>{const i=$('#palIn');if(i)i.focus()},40)}
function closePal(){pal.classList.remove('open');pal.innerHTML=''}
function palList(q){q=q.toLowerCase();
  const unrev=st=>shared(st).filter(s=>['awaiting','revised'].includes(bucketOf(s))).length;
  return [...STUDENTS].sort((a,b)=>unrev(b)-unrev(a)).filter(st=>!q||(st.name+' '+st.spec+' '+st.year+' '+st.cohort).toLowerCase().includes(q)).slice(0,8)}
function palStories(q){if(!q.trim())return[];q=q.toLowerCase();
  return teachPool().filter(p=>(titleOf(p.s)+' '+p.s.body+' '+(p.s.lesson||'')).toLowerCase().includes(q)).slice(0,5)}
function palPick(i){const list=palList($('#palIn').value),stories=palStories($('#palIn').value);
  if(i<list.length){MENTOR.cur=list[i];S.view='mstudent';render()}
  else{const p=stories[i-list.length];if(!p)return;MENTOR.cur=p.st;S.view='mstudent';render();openRoom(p.s.id)}closePal()}
function renderPal(q){
  const list=palList(q),stories=palStories(q),total=list.length+stories.length;
  if(palSel>=total)palSel=Math.max(0,total-1);
  const unrev=st=>shared(st).filter(s=>['awaiting','revised'].includes(bucketOf(s))).length;
  pal.innerHTML=`<div class="palBox"><input id="palIn" placeholder="Jump to a student — or search every submitted story…" value="${esc(q)}" autocomplete="off">
    ${list.map((st,i)=>`<div class="palItem ${i===palSel?'sel':''}" data-pi="${i}">
      <span class="stuAv" style="width:30px;height:30px;font-size:11px;background:${st.hue}">${st.init}</span>
      <span class="pn">${st.name}</span><span class="pm">${st.cohort} · ${st.spec}<br>${unrev(st)?'<span class="attn">'+unrev(st)+' to review</span>':'nothing waiting'}</span></div>`).join('')}
    ${stories.length?'<div class="palSec">Stories · every student</div>':''}
    ${stories.map((p,j)=>{const i=list.length+j;return `<div class="palItem ${i===palSel?'sel':''}" data-pi="${i}">
      <span class="stuAv" style="width:30px;height:30px;font-size:11px;background:${p.st.hue}">${p.st.init}</span>
      <span class="pn" style="font-size:13.5px">${esc(titleOf(p.s))}</span><span class="pm">${p.st.first}</span></div>`}).join('')}
    ${total?'':'<div class="deskClear">No student or submitted story matches.</div>'}
  </div>`;
  const inp=$('#palIn');
  inp.oninput=()=>{palSel=0;renderPal(inp.value);const v=$('#palIn');if(v){v.focus();v.setSelectionRange(v.value.length,v.value.length)}};
  inp.onkeydown=e=>{const t=palList(inp.value).length+palStories(inp.value).length;
    if(e.key==='ArrowDown'){e.preventDefault();palSel=Math.min(palSel+1,t-1);renderPal(inp.value);$('#palIn').focus()}
    if(e.key==='ArrowUp'){e.preventDefault();palSel=Math.max(palSel-1,0);renderPal(inp.value);$('#palIn').focus()}
    if(e.key==='Enter'&&t)palPick(palSel)};
  pal.onmousedown=e=>{if(e.target===pal)closePal()};
  $$('[data-pi]').forEach(el=>el.onclick=()=>palPick(+el.dataset.pi));
}

/* ================= KEYBOARD + BOOT ================= */
document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||document.activeElement.isContentEditable;
  if(e.key==='Escape'){
    if(pal.classList.contains('open')){closePal();return}
    if(qad&&qad.classList.contains('open')){closeQad();return}
    if(quick.classList.contains('open')){closeQuick();return}
    if(teachEl.classList.contains('open')){closeTeach();return}
    if(typing&&cap.classList.contains('open')){document.activeElement.blur();return}
    if(cap.classList.contains('open')){closeCapture();return}
    if(room.classList.contains('open')){closeRoom();return}
    return}
  if(typing)return;
  if(e.key==='/'){e.preventDefault();if(S.role==='advisor')openPal();else $('#omni').focus()}
  if((e.key==='n'||e.key==='N')&&S.role==='student'){e.preventDefault();openCapture()}
  if((e.key==='k'||e.key==='K')&&S.role==='advisor'){e.preventDefault();openPal()}
});
render();
</script>
<style>
/* ============ V5 REFINEMENT LAYER ============ */
/* the environment canvas must actually fill the viewport — inset:0 alone does not stretch a replaced element */
#bgfx{width:100%;height:100%}

/* --- Typography: italics reserved for authentic quotes, story titles, and rare emphasis --- */
.exc,.greetSub,.stageHint,.capHint,.capNote,.qq,.qq2,.nw,.attnLine,.aSub,.tHint,
.emptyLib div,.qaHist,.lessonTxt,.sTxt span,.reflQ .q,.reflQ .a,.drExc,.advNote .txt,.ba2,.fDesc{font-style:normal!important}
.h2,.si,.bigAction .ba1,.sName,.emptyLib .big,.tTitle,.covRing~div .h2,.sRow .rTitle,.sRow .rTitle .pre,.pTtl,.shortItem .si{font-style:normal!important;transform:none!important}
.h2 em,.bigAction .ba1 em,.tTitle em{font-style:normal}
.greetSub{font-family:var(--disp);font-size:15px;color:var(--mid)}
.sRow .rSub .exc{color:#93a2bd}

/* --- Five-position stoplight score dots --- */
.sdWrap{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.sdWrap .sdK{font-family:var(--num);font-weight:700;font-size:9px;color:var(--dim);width:13px;height:13px;border:1px solid var(--edge2);border-radius:4px;display:grid;place-items:center;margin-right:2px;font-style:normal}
.sdWrap.mentor .sdK{color:var(--cy);border-color:rgba(57,214,255,.45)}
.sdot{width:9px;height:9px;border-radius:50%;background:transparent;border:1.5px solid var(--edge2);font-style:normal;display:inline-block}
.sdWrap.mentor .sdot{border-radius:3px}
.sdot.on{border-color:transparent;box-shadow:0 0 6px rgba(255,255,255,.12)}
.sdWrap .sdN{font-family:var(--num);font-weight:700;font-size:10.5px;color:var(--mid);margin-left:3px;font-style:normal}
.scorePick button.on{background:var(--spc,linear-gradient(160deg,var(--gd),#e0b64e))}

/* --- Story row: the lesson travels with the story --- */
.rLessonLine{display:flex;align-items:baseline;gap:8px;margin-top:5px;min-width:0}

function setBG(id){BG.mode=id;try{localStorage.setItem('storyforge-bg',id)}catch(e){};window.__bgKick();

/* ================= V5 · STOPLIGHT SCORE DOTS ================= */
const SCOL=['','#ff5470','#ff7a3d','#ffd76a','#a8e05f','#4ade9d'];
function dots(val,kind,label){val=val||0;const c=SCOL[val];
  const txt=label+': '+(val?val+' of 5':'not scored');
  return `<span class="sdWrap ${kind}" role="img" title="${txt}" aria-label="${txt}"><i class="sdK" title="${kind==='mentor'?'Mentor score':'Student’s own rating'}">${kind==='mentor'?'M':'S'}</i>${[1,2,3,4,5].map(n=>`<i class="sdot ${n<=val?'on':''}" style="${n<=val?'background:'+c:''}"></i>`).join('')}<i class="sdN">${val||'–'}</i></span>`}

/* ================= V5 · ORIGINAL AUDIO (simulated playback) ================= */
let AUD={id:null,t:0,timer:null};
function stopAud(){if(AUD.timer)clearInterval(AUD.timer);AUD={id:null,t:0,timer:null}}
function audioCardHTML(s,compact){if(!s.audio)return'';
  const d=s.audio.dur,mm=x=>Math.floor(x/60)+':'+String(Math.floor(x%60)).padStart(2,'0');
  return `<div class="audioCard" data-aud="${s.id}" ${compact?'style="margin:10px 0 4px;padding:9px 12px"':''}>
    <button class="audPlay" data-audp="${s.id}" title="Play the original recording">▶</button>
    <div class="audBody">
      <div class="audLbl">Original audio · preserved forever <span>— your spoken telling, separate from any later editing</span></div>
      <div class="audTrack" ><i data-audf="${s.id}"></i></div>
      ${compact?'':`<div class="audWave">${Array.from({length:46},(_,i)=>`<i style="height:${4+Math.abs(Math.sin(i*1.7))*12}px"></i>`).join('')}</div>`}
    </div>
    <div class="audTime"><span data-audt="${s.id}">0:00</span> / ${mm(d)}</div>
  </div>`}
function wireAudio(){
  $$('[data-audp]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.audp;const f=findStory(id);if(!f||!f.s.audio)return;
    if(AUD.id===id){stopAud();b.textContent='▶';return}
    stopAud();AUD.id=id;b.textContent='❚❚';
    const d=f.s.audio.dur;
    AUD.timer=setInterval(()=>{AUD.t+=.25;if(AUD.t>=d){AUD.t=d;stopAud();const bb=document.querySelector('[data-audp="'+id+'"]');if(bb)bb.textContent='▶'}
      const fill=document.querySelector('[data-audf="'+id+'"]');if(fill)fill.style.width=(AUD.t/d*100)+'%';
      const tt=document.querySelector('[data-audt="'+id+'"]');if(tt)tt.textContent=Math.floor(AUD.t/60)+':'+String(Math.floor(AUD.t%60)).padStart(2,'0');
      const wave=b.closest('.audioCard');if(wave)[...wave.querySelectorAll('.audWave i')].forEach((w,i)=>w.classList.toggle('hot',i/46<=AUD.t/d));
    },250)});
}

/* ================= V5 · STORY ROW override (dots + lesson + audio) ================= */
function rowHTML(s,opts){opts=opts||{};const hue=s.themes[0]?TH(s.themes[0]).hue:'#31405c';

        ${opts.who?`<span>·</span><span style="color:var(--cy)">${opts.who}</span>`:''}</div>
      <div class="rLessonLine">${s.lesson
        ?`<span class="lTag">Lesson</span><span class="lTxt" title="${esc(s.lesson)}">${esc(s.lesson)}</span>`

    </div>

      ${birdMini(s)}

      ${dots(s.selfScore,'student',S.role==='advisor'?'Student’s own rating':'My rating')}

      ${S.role==='advisor'&&s.status!=='private'
        ?`<select class="rowStatusSel ${STATUS[s.status].col}" data-rst="${s.id}" title="One-click status — saved with your name and time">
            <option value="">${STATUS[s.status].label}${s.revised&&s.status==='awaiting'?' · revised':''}</option>
            ${['in_review','changes','reviewed','approved'].filter(k=>k!==s.status).map(k=>`<option value="${k}">→ ${STATUS[k].label}</option>`).join('')}
          </select>`
        :stChipHTML(s)}
      <button class="rowBtn" data-qr2="${s.id}" title="Fast ${S.role==='advisor'?'review':'look'} in a centered popup — the library stays behind it">${S.role==='advisor'?'Quick review':'Quick look'}</button>
      <button class="rowBtn pri" data-fr="${s.id}" title="The complete story workspace">${S.role==='advisor'?'Full review':'Open story'}</button>
    </div>
  </div>`}
</script>
<script>
/* ================= V5 · INTERVIEW INTELLIGENCE ================= */
const FAMS=[

 {id:'redflag',label:'Red Flag',ico:'⚑',hue:'#ff7a3d',desc:'Scores, gaps, weaknesses — answer without flinching.'},
 {id:'personal',label:'Personal',ico:'◉',hue:'#8a7dff',desc:'Who you are outside the hospital.'},
 {id:'custom',label:'Custom',ico:'✎',hue:'#aab8d1',desc:'Questions written for this student specifically.'},
];
const famOf=q=>FAMS.find(f=>f.id===(q.fam||'custom'))||FAMS[6];
const FAMOF={q1:'core',q2:'behavioral',q3:'behavioral',q4:'clinical',q5:'behavioral',q6:'behavioral',q7:'behavioral',q8:'clinical',q9:'behavioral',q10:'core',q11:'behavioral',q12:'redflag'};

 {id:'q13',fam:'core',q:'Why our program?',src:'MissionMed'},
 {id:'q14',fam:'core',q:'Where do you see yourself in ten years?',src:'MissionMed'},

 {id:'q16',fam:'clinical',q:'Walk me through a challenging clinical decision you were part of.',src:'MissionMed'},
 {id:'q17',fam:'clinical',q:'Tell me about a time you were wrong about a patient.',src:'MissionMed'},
 {id:'q18',fam:'clinical',q:'Describe a time you escalated care. How did you know it was time?',src:'MissionMed'},
 {id:'q19',fam:'cv',q:'I see you volunteered at a free clinic — tell me more about that.',src:'MissionMed'},
 {id:'q20',fam:'cv',q:'Tell me about your research. What was your actual contribution?',src:'MissionMed'},
 {id:'q21',fam:'cv',q:'Which rotation surprised you most, and why?',src:'MissionMed'},
 {id:'q22',fam:'redflag',q:'Your Step 2 score is below our average. What happened?',src:'MissionMed'},
 {id:'q23',fam:'redflag',q:'I noticed a gap in your third year. Walk me through it.',src:'MissionMed'},
 {id:'q24',fam:'personal',q:'What do you do outside of medicine?',src:'MissionMed'},
 {id:'q25',fam:'personal',q:'Who is your hero, and why?',src:'MissionMed'},
 {id:'q26',fam:'personal',q:'What will you do when medicine disappoints you?',src:'MissionMed'}
);
QBANK.forEach(q=>q.cat=famOf(q).label);

/* pair helpers: the score, why, and follow-ups belong to the story–question relationship */
function pairsFor(st,qid){return st.stories.filter(s=>s.status!=='private'||S.role==='student').map(s=>({s,x:s.qa.find(y=>y.q===qid)})).filter(p=>p.x)}
function ensurePairFields(x){x.fups=x.fups||[];x.why=x.why||'';return x}
function qStateOf(st,qb){const ps=pairsFor(st,qb.id);if(!ps.length)return'none';
  const pref=(st.qpref||{})[qb.id];const conf=ps.some(p=>p.x.confirmed&&(p.x.sMentor||0)>=3);
  return(pref&&conf)?'ready':'progress'}
const qStateLabel={ready:'Ready',progress:'In progress',none:'No story yet'};
function famStories(st,fam){const map={core:['identity','growth'],behavioral:['mistake','conflict','leader','team','growth','resil','comm'],clinical:['patient','advoc','mistake'],cv:['identity','leader','team'],redflag:['resil','growth','mistake'],personal:['identity','resil'],custom:[]};
  return st.stories.filter(s=>s.status!=='private'&&s.themes.some(t=>(map[fam]||[]).includes(t)))}

/* ---- V5 seeds: audio, preferred stories, pair follow-ups, coaching ---- */
(function(){

      x.why='It shows composure and humanity in the same story — and it ends with a skill I built, not a wound.';

      x.why='A mistake with a same-week comeback I chose on purpose — growth they can verify.';
      x.fups=[

        {id:'f6',q:'What would you tell an M3 who freezes on rounds?',src:'student',clinical:false,prepared:false,note:''}]}}
  if(dose){maya.qpref.q8=dose.id;

      x.fups=[
        {id:'f7',q:'What is the correct enoxaparin adjustment for renal impairment?',src:'mentor',clinical:true,prepared:false,note:''},
        {id:'f8',q:'Why did you frame it as a question instead of a statement?',src:'mentor',clinical:false,prepared:true,note:'Preserves the hierarchy while forcing the recheck — safety without confrontation.'}]}}
})();

/* ---- AI follow-up suggestions (simulated; production contract: specialized models) ---- */
function aiSuggest(s,qb){
  const clinical=qb.fam==='clinical'||s.themes.includes('patient')||/dose|code|patient|diagnos|clinic|murmur|rhythm|consent/i.test(s.body);
  const base=clinical?[
    {q:'What was your differential at that moment, and what moved you off it?',why:'Faculty will test whether the reasoning was yours.'},
    {q:'What would you have done if the senior had disagreed with you?',why:'Probes escalation judgment behind the story.'},
    {q:'What does the evidence say about the choice that was made?',why:'Turns the anecdote into a knowledge check.'},
    {q:'Looking back, was the care medically optimal? What would you change?',why:'Tests honesty plus clinical growth.'},
  ]:[
    {q:'What did the other people in that room think of how you handled it?',why:'Interviewers triangulate self-reports.'},
    {q:'When has the same weakness shown up somewhere else?',why:'One story becomes a pattern question.'},
    {q:'What did it cost you — and would you pay it again?',why:'Probes values under the anecdote.'},
    {q:'How does this show up in how you’ll work as an intern?',why:'Connects the story to residency behavior.'},
  ];
  return {clinical,list:base};
}

/* ================= INTERVIEW PREP (landing) ================= */
function renderPrep(){
  const st=S.role==='advisor'?MENTOR.cur:stuById('maya');
  const P=S.prepF=S.prepF||{fam:'',q:'',st:''};
  const questions=allQ().map(qb=>({qb,state:qStateOf(st,qb),pairs:pairsFor(st,qb.id)}));
  const ready=questions.filter(x=>x.state==='ready').length,prog=questions.filter(x=>x.state==='progress').length;

      <div style="margin-left:auto;display:flex;gap:10px;flex-wrap:wrap">

      ${FAMS.filter(f=>f.id!=='custom'||allQ().some(q=>!q.fam)).map(f=>{

      const fupsP=x.pairs.reduce((a,p)=>a+(p.x.fups||[]).filter(u=>u.prepared).length,0),fupsT=x.pairs.reduce((a,p)=>a+(p.x.fups||[]).length,0);

      ${fupsT?`<span class="scoreTag" title="Follow-up questions prepared">${fupsP}/${fupsT} follow-ups</span>`:''}
      <span class="qiSt ${x.state}">${qStateLabel[x.state]}</span>

  $$('[data-qshop]').forEach(r=>r.onclick=()=>{S.qid=r.dataset.qshop;S.view='qshop';render()});

  main.innerHTML=`<section data-view="qshop" class="live">

        ${pairs.map(p=>{const isPref=pref===p.s.id;return `<div class="pairCard ${isPref?'pref':''}">

          </div>
          <div class="pairCtl">
            <span class="fLbl">Strength for this question</span>
            ${dots(p.x.sStudent,'student','Student strength for this pairing')}
            ${dots(p.x.sMentor,'mentor','Mentor strength for this pairing')}
            <div class="scorePick ${adv?'cy':''}" data-pstr="${p.s.id}">${[1,2,3,4,5].map(n=>{const cur=adv?p.x.sMentor:p.x.sStudent;return `<button data-n="${n}" class="${(cur||0)>=n?'on':''}" style="${(cur||0)>=n?'background:'+SCOL[cur]:''}" title="Set ${adv?'mentor':'your'} strength to ${n}">${n}</button>`}).join('')}</div>
            <span class="confTag" style="color:${p.x.confirmed?'var(--gn)':'var(--vi)'}">${p.x.confirmed?'✓ Confirmed by mentor':'◌ '+(p.x.by===st.first?'Suggested by '+st.first:'Assigned by '+p.x.by)+(adv?'':' — awaiting confirmation')}</span>
            ${adv&&!p.x.confirmed?`<button class="rowBtn pri" data-pconf="${p.s.id}">Confirm</button><button class="rowBtn" data-prej="${p.s.id}">Reject</button>`:''}
          </div>
          <div class="pairWhy" contenteditable="true" spellcheck="false" data-why="${p.s.id}" data-ph="Why this story works for this question — one or two sentences…" data-empty="${p.x.why?'false':'true'}">${esc(p.x.why)}</div>
        </div>`}).join('')||'<div class="stageHint">No story is assigned to this question yet. Use “Assign a story”.</div>'}
        ${sugg.length?`<div class="dsLbl" style="margin:14px 0 8px;font-family:var(--num);font-size:10px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--dim)">Could also answer this</div>
          ${sugg.map(s=>`<div class="shortItem"><span class="si">${esc(titleOf(s))}</span>${dots(s.mentorScore,'mentor','Overall mentor score')}<button class="rowBtn" data-passign="${s.id}" style="margin-left:auto">+ Assign</button></div>`).join('')}`:''}
        </div>
      </div>
      <div class="panel"><div class="pHead"><div class="h2">Coaching <em>notes</em></div></div>
        <div class="pBody">
          ${coach.map(cn=>`<div class="noteItem"><div class="nt">“${esc(cn.text)}”</div><div class="nd">${cn.who} · ${fmtDT(cn.t)}</div></div>`).join('')||'<div class="stageHint">No coaching notes on this question yet.</div>'}
          ${adv?`<div class="askRow" style="margin-top:10px"><input id="wsCoach" placeholder="Coach ${st.first} on this question…"><button class="noteSend" id="wsCoachSend">Add</button></div>`:''}
        </div>
      </div>
      <div class="panel" style="margin-top:18px"><div class="pHead"><div class="h2">Gaps to <em>close</em></div></div>
        <div class="pBody"><div class="gapChecklist">${gaps.map(g=>`<div class="gc ${g.ok?'done':''}"><i>${g.ok?'✓':'○'}</i>${g.txt}</div>`).join('')}</div></div>
      </div>
    </div>
    <div>
      ${focusPair?(()=>{const ai=aiSuggest(focusPair.s,qb);const fups=focusPair.x.fups||[];
        return `<div class="nnqPanel ${ai.clinical?'clinical':''}">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px">
          <div class="h2" style="font-size:16px">Next natural <em>questions</em></div>
          ${ai.clinical?'<span class="srcB clin" title="This is a clinical story — follow-ups anticipate what a physician interviewer will actually probe">✚ Clinical mode</span>':''}
        </div>
        <div style="font-size:12px;color:var(--dim);line-height:1.5;margin-bottom:10px">Your answer creates the interviewer’s next question. Map them here, prepare each one, and you become difficult to surprise.</div>
        ${pairs.length>1?`<select class="tSel" id="fupStory" style="max-width:100%;margin-bottom:12px">${pairs.map(p=>`<option value="${p.s.id}" ${focusPair.s.id===p.s.id?'selected':''}>Follow-ups for: ${titleOf(p.s).slice(0,44)}</option>`).join('')}</select>`
          :`<div class="fLbl" style="margin-bottom:10px">For: ${esc(titleOf(focusPair.s))}</div>`}
        ${fups.map((u,i)=>`<div class="fupRow ${u.prepared?'prep':''}">
          <div class="fTop">
            <span class="fupCk" data-fprep="${i}" title="${u.prepared?'Prepared — click to unmark':'Click when you can answer this cold'}">✓</span>
            <span class="fupQ" contenteditable="true" spellcheck="false" data-fq="${i}">${esc(u.q)}</span>
            <span class="srcB ${u.src}" title="${u.src==='ai'?'Accepted from AI suggestions':'Added by '+(u.src==='mentor'?MENTOR_NAME:st.first)}">${u.src==='ai'?'AI':u.src==='mentor'?'DB':'You'}</span>
            ${u.clinical?'<span class="srcB clin" title="Clinical follow-up — tests medical substance">✚</span>':''}
          </div>
          <div class="fupNote" contenteditable="true" spellcheck="false" data-fnote="${i}" data-empty="${u.note?'false':'true'}">${esc(u.note)}</div>
          <div class="fupTools"><button data-fup2="${i}" title="Move up">↑</button><button data-fdown="${i}" title="Move down">↓</button><button data-fdel="${i}" style="color:var(--rd)">Remove</button></div>
        </div>`).join('')||'<div class="stageHint" style="margin-bottom:8px">None mapped yet — add the questions your answer will invite.</div>'}
        <div class="askRow"><input id="fupAdd" placeholder="Add a follow-up question the interviewer might ask…"><button class="noteSend" id="fupAddBtn">Add</button></div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap">
          <button class="rowBtn ${AIon?'pri':''}" id="aiBtn" ${AIon?'':'disabled'}>✦ Suggest follow-ups (AI)</button>
          <div class="tglRow" style="font-size:9.5px"><div class="tgl ${AIon?'on':''}" id="aiTgl" style="width:36px;height:20px"><i style="width:14px;height:14px"></i></div> AI suggestions ${AIon?'on':'off'}</div>
        </div>
        <div id="aiTrayWrap">${S.aiTray&&S.aiTray.qid===qb.id&&S.aiTray.sid===focusPair.s.id?renderAiTray(ai,focusPair,st,qb):''}</div>
        <div style="margin-top:12px;font-size:10.5px;color:var(--dim);line-height:1.5">${ai.clinical
          ?'✚ Clinical mode: suggestions anticipate reasoning, differential, escalation, and evidence questions. In production this uses a specialized, medically-trained model — never a generic one. Suggestions here are illustrative.'
          :'AI suggestions are optional and never authoritative — you review, edit, accept, or dismiss each one. Simulated in this prototype.'}</div>
      </div>`})():'<div class="nnqPanel"><div class="stageHint">Assign a story first — follow-ups belong to a specific story-and-question answer.</div></div>'}
    </div>
    </div>
  </section>`;
  wireQShop(st,qb,pairs,focusPair);
}
function renderAiTray(ai,focusPair,st,qb){
  const existing=(focusPair.x.fups||[]).map(u=>u.q.toLowerCase());
  const list=ai.list.filter(sg=>!existing.includes(sg.q.toLowerCase()));
  return `<div class="aiTray ${ai.clinical?'clinical':''}">
    <div class="fLbl" style="margin-bottom:6px">${ai.clinical?'✚ Clinical AI suggestions':'✦ AI suggestions'} — review each one</div>
    ${list.map((sg,i)=>`<div class="aiSug"><div class="aq">${esc(sg.q)}</div><div class="awhy">Why it matters: ${esc(sg.why)}</div>
      <div class="aBtns"><button class="acc" data-aacc="${i}">Accept</button><button data-aedit="${i}">Accept & edit</button><button data-adis="${i}">Dismiss</button></div></div>`).join('')||'<div class="stageHint">Every current suggestion has been reviewed.</div>'}
  </div>`}
function wireQShop(st,qb,pairs,focusPair){
  const adv=S.role==='advisor';
  $('#wsAssign').onclick=()=>{const target=focusPair?focusPair.s:st.stories.find(s=>s.status!=='private');
    if(target)openQad(target.id);else toast('No submitted stories yet to assign.')};
  const wc=$('#wsCapture');if(wc)wc.onclick=()=>openCapture({prompt:qb.q,qid:qb.id});
  $$('[data-fr]').forEach(b=>b.onclick=()=>openRoom(b.dataset.fr));
  $$('[data-pref]').forEach(b=>b.onclick=()=>{st.qpref[qb.id]=b.dataset.pref;const s=st.stories.find(x=>x.id===b.dataset.pref);
    act(st,s,adv?MENTOR_NAME:st.first,'Set preferred story for a question','“'+qb.q.slice(0,50)+'”');
    if(adv)notify(st,s,MENTOR_NAME+' set “'+titleOf(s)+'” as the preferred answer for an interview question.');
    S.fupStory=b.dataset.pref;persist();render()});
  $$('[data-pstr]').forEach(el=>el.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    const p=pairs.find(x=>x.s.id===el.dataset.pstr);if(!p)return;const n=+b.dataset.n;
    if(adv){const prev=p.x.sMentor;p.x.sMentor=n===p.x.sMentor?null:n;
      act(st,p.s,MENTOR_NAME,'Scored a question strength','“'+qb.q.slice(0,40)+'” → '+(p.x.sMentor?p.x.sMentor+'/5':'cleared'),prev?prev+'/5':null);
      if(p.x.sMentor)notify(st,p.s,MENTOR_NAME+' scored “'+titleOf(p.s)+'” '+p.x.sMentor+'/5 for an interview question.')}
    else{const prev=p.x.sStudent;p.x.sStudent=n===p.x.sStudent?null:n;
      act(st,p.s,st.first,'Scored a question strength (self)','“'+qb.q.slice(0,40)+'” → '+(p.x.sStudent?p.x.sStudent+'/5':'cleared'),prev?prev+'/5':null)}
    persist();render()});
  $$('[data-pconf]').forEach(b=>b.onclick=()=>{const p=pairs.find(x=>x.s.id===b.dataset.pconf);if(!p)return;
    p.x.confirmed=true;act(st,p.s,MENTOR_NAME,'Confirmed a suggested question','“'+qb.q.slice(0,50)+'” — suggested by '+p.x.by);
    notify(st,p.s,MENTOR_NAME+' confirmed “'+titleOf(p.s)+'” as an answer for an interview question.');persist();render()});
  $$('[data-prej]').forEach(b=>b.onclick=()=>{const p=pairs.find(x=>x.s.id===b.dataset.prej);if(!p)return;
    const i=p.s.qa.findIndex(y=>y.q===qb.id);if(i>=0)p.s.qa.splice(i,1);
    act(st,p.s,MENTOR_NAME,'Rejected a suggested question mapping','“'+qb.q.slice(0,50)+'”','was suggested by '+p.x.by);
    notify(st,p.s,MENTOR_NAME+' suggested a different story for an interview question — see the workshop.');persist();render()});
  $$('[data-passign]').forEach(b=>b.onclick=()=>{const s=st.stories.find(x=>x.id===b.dataset.passign);if(!s)return;
    s.qa.push(ensurePairFields({q:qb.id,by:adv?MENTOR_NAME:st.first,confirmed:adv,sStudent:null,sMentor:null,t:iso(NOW())}));
    act(st,s,adv?MENTOR_NAME:st.first,adv?'Assigned an interview question':'Suggested an interview question','“'+qb.q.slice(0,50)+'”');
    if(adv)notify(st,s,MENTOR_NAME+' assigned “'+titleOf(s)+'” to an interview question.');persist();render()});
  $$('[data-why]').forEach(el=>{el.oninput=()=>{el.dataset.empty=el.textContent.trim()?'false':'true'};
    el.onblur=()=>{const p=pairs.find(x=>x.s.id===el.dataset.why);if(!p)return;const v=el.textContent.trim();
      if(v!==p.x.why){p.x.why=v;act(st,p.s,adv?MENTOR_NAME:st.first,'Updated why-this-story-works','“'+qb.q.slice(0,40)+'”');persist()}}});
  const cs=$('#wsCoachSend');if(cs)cs.onclick=()=>{const t=$('#wsCoach').value.trim();if(!t)return;
    st.qcoach[qb.id]=st.qcoach[qb.id]||[];st.qcoach[qb.id].push({who:MENTOR_NAME,text:t,t:iso(NOW())});
    const s=focusPair?focusPair.s:null;if(s){act(st,s,MENTOR_NAME,'Added a coaching note on a question','“'+qb.q.slice(0,40)+'”');notify(st,s,MENTOR_NAME+' added a coaching note on an interview question.')}
    persist();render()};
  const fsSel=$('#fupStory');if(fsSel)fsSel.onchange=e=>{S.fupStory=e.target.value;S.aiTray=null;render()};
  /* follow-ups */
  const fups=()=>focusPair.x.fups;
  const logF=(action,detail)=>{act(st,focusPair.s,adv?MENTOR_NAME:st.first,action,detail)};
  $$('[data-fprep]').forEach(el=>el.onclick=()=>{const u=fups()[+el.dataset.fprep];u.prepared=!u.prepared;persist();render()});
  $$('[data-fq]').forEach(el=>{el.onblur=()=>{const u=fups()[+el.dataset.fq];const v=el.textContent.trim();
    if(v&&v!==u.q){u.q=v;logF('Edited a follow-up question','“'+v.slice(0,50)+'”');persist()}}});
  $$('[data-fnote]').forEach(el=>{el.oninput=()=>{el.dataset.empty=el.textContent.trim()?'false':'true'};
    el.onblur=()=>{const u=fups()[+el.dataset.fnote];u.note=el.textContent.trim();persist()}});
  $$('[data-fdel]').forEach(el=>el.onclick=()=>{const i=+el.dataset.fdel;const u=fups()[i];fups().splice(i,1);
    logF('Removed a follow-up question','“'+u.q.slice(0,50)+'”');persist();render()});
  $$('[data-fup2]').forEach(el=>el.onclick=()=>{const i=+el.dataset.fup2;if(i>0){const a=fups();[a[i-1],a[i]]=[a[i],a[i-1]];persist();render()}});
  $$('[data-fdown]').forEach(el=>el.onclick=()=>{const i=+el.dataset.fdown;const a=fups();if(i<a.length-1){[a[i+1],a[i]]=[a[i],a[i+1]];persist();render()}});
  const fab=$('#fupAddBtn');if(fab)fab.onclick=()=>{const v=$('#fupAdd').value.trim();if(!v||!focusPair)return;
    const ai=aiSuggest(focusPair.s,qb);
    fups().push({id:'f'+Math.floor(performance.now()),q:v,src:adv?'mentor':'student',clinical:ai.clinical&&/dose|differential|rhythm|manage|evidence|diagnos|exam|lab/i.test(v),prepared:false,note:''});
    logF(adv?'Added a follow-up question':'Added a follow-up question (self)','“'+v.slice(0,50)+'”');
    if(adv)notify(st,focusPair.s,MENTOR_NAME+' added follow-up questions to prepare on “'+titleOf(focusPair.s)+'”.');
    persist();render()};
  const at=$('#aiTgl');if(at)at.onclick=()=>{S.aiOn=S.aiOn===false?true:false;S.aiTray=null;render()};
  const ab=$('#aiBtn');if(ab)ab.onclick=()=>{S.aiTray={qid:qb.id,sid:focusPair.s.id};render()};
  const ai=focusPair?aiSuggest(focusPair.s,qb):null;
  if(ai){const existing=(focusPair.x.fups||[]).map(u=>u.q.toLowerCase());const list=ai.list.filter(sg=>!existing.includes(sg.q.toLowerCase()));
    $$('[data-aacc]').forEach(b=>b.onclick=()=>{const sg=list[+b.dataset.aacc];
      fups().push({id:'f'+Math.floor(performance.now()),q:sg.q,src:'ai',clinical:ai.clinical,prepared:false,note:''});
      logF('Accepted an AI-suggested follow-up','“'+sg.q.slice(0,50)+'”');persist();render()});
    $$('[data-aedit]').forEach(b=>b.onclick=()=>{const sg=list[+b.dataset.aedit];
      fups().push({id:'f'+Math.floor(performance.now()),q:sg.q,src:'ai',clinical:ai.clinical,prepared:false,note:''});
      persist();render();setTimeout(()=>{const els=$$('[data-fq]');const last=els[els.length-1];if(last){last.focus();document.execCommand&&document.execCommand('selectAll',false,null)}},60)});
    $$('[data-adis]').forEach(b=>b.onclick=()=>{b.closest('.aiSug').remove()});}
}
</script>
<script>
/* ================= QUESTION LIBRARY (browse · manage · import) ================= */
function renderQLib(){
  const st=S.role==='advisor'?MENTOR.cur:stuById('maya');
  const L=S.qlibF=S.qlibF||{q:'',fam:'',src:''};
  let list=allQ().filter(q=>{
    if(L.fam&&(q.fam||'custom')!==L.fam)return false;
    if(L.src&&(q.src||(q.id.startsWith('cq')?'Custom':'MissionMed'))!==L.src)return false;
    if(L.q&&!q.q.toLowerCase().includes(L.q.toLowerCase()))return false;return true});
  const useCount=qid=>st.stories.filter(s=>s.qa.some(x=>x.q===qid)).length;
  const srcOf=q=>q.src||(q.id.startsWith('cq')?'Custom':'MissionMed');
  const groups=FAMS.filter(f=>list.some(q=>(q.fam||'custom')===f.id));
  main.innerHTML=`<section data-view="qlib" class="live">
    <button class="backBtn" data-nav="prep" style="margin-bottom:14px">‹ Interview Prep</button>
    <div class="eyebrow">MissionMed Question Library</div>
    <div class="h1" style="margin-top:8px">${allQ().length} questions, <em>one shared library</em>.</div>
    <div style="margin-top:8px;font-size:13px;color:var(--mid);max-width:720px">Institutional MissionMed questions, mentor-written questions, and student-specific customs live side by side, always labeled by source. Assign from any story or workshop; manage and import here.</div>
    <div class="listBar">
      <input type="text" id="qlQ" placeholder="Search the library…" value="${esc(L.q)}">
      <select id="qlFam"><option value="">Family: all</option>${FAMS.map(f=>`<option value="${f.id}" ${L.fam===f.id?'selected':''}>${f.label}</option>`).join('')}</select>
      <select id="qlSrc"><option value="">Source: all</option><option ${L.src==='MissionMed'?'selected':''}>MissionMed</option><option ${L.src==='Custom'?'selected':''}>Custom</option></select>
      <span class="countNote">${list.length} of ${allQ().length}</span>
    </div>
    ${S.role==='advisor'?`<div class="impBox">
      <div class="h2" style="margin-bottom:6px">Import <em>questions</em></div>
      <div style="font-size:12px;color:var(--dim);margin-bottom:9px">Paste from any document or spreadsheet — one question per line, optionally “question | family”. Imported questions are reviewed below before they become part of the shared library. Duplicates are flagged, never silently added.</div>
      <textarea id="impTxt" placeholder="Tell me about a time you received difficult feedback. | Behavioral&#10;Why this specialty?&#10;Describe a patient who changed how you practice. | Clinical"></textarea>
      <div style="display:flex;gap:10px;margin-top:9px;align-items:center">
        <button class="noteSend" id="impParse">Review before adding</button>
        <button class="rowBtn" id="impSample">Use sample paste</button>
      </div>
      <div id="impReview"></div>
    </div>`:''}
    <div style="display:flex;gap:10px;align-items:center;margin:14px 0">
      <input type="text" id="qlAdd" placeholder="${S.role==='advisor'?'Add a single question to the shared library…':'Add a custom question for your own prep…'}" style="flex:1;background:#0f1522;border:1px solid var(--edge);border-radius:9px;color:var(--tx);font-family:var(--disp);font-size:13px;padding:9px 12px;outline:none">
      <select id="qlAddFam">${FAMS.map(f=>`<option value="${f.id}">${f.label}</option>`).join('')}</select>
      <button class="noteSend" id="qlAddBtn">Add</button>
    </div>
    ${groups.map(f=>`<div class="libGroup"><div class="gTitle"><div class="h2" style="color:${f.hue}">${f.ico} ${f.label}</div><span class="cnt">${list.filter(q=>(q.fam||'custom')===f.id).length}</span></div>
      ${list.filter(q=>(q.fam||'custom')===f.id).map(q=>`<div class="qlibRow">
        <span class="qt">“${esc(q.q)}”</span>
        <span class="srcB ${srcOf(q)==='MissionMed'?'mentor':'student'}" title="Source">${srcOf(q)}</span>
        <span class="scoreTag" title="Stories of ${st.first}’s assigned to it">${useCount(q.id)} assigned</span>
        <button class="rowBtn pri" data-qshop="${q.id}">Open workshop</button>
      </div>`).join('')}</div>`).join('')}
  </section>`;
  $('#qlQ').oninput=e=>{L.q=e.target.value;render();const v=$('#qlQ');if(v){v.focus();v.setSelectionRange(v.value.length,v.value.length)}};
  $('#qlFam').onchange=e=>{L.fam=e.target.value;render()};
  $('#qlSrc').onchange=e=>{L.src=e.target.value;render()};
  $$('[data-qshop]').forEach(b=>b.onclick=()=>{S.qid=b.dataset.qshop;S.view='qshop';render()});
  $('#qlAddBtn').onclick=()=>{const t=$('#qlAdd').value.trim();if(!t)return;const fam=$('#qlAddFam').value;
    CUSTOMQ.push({id:'cq'+(++CQID),cat:famOf({fam}).label,fam,q:t,src:S.role==='advisor'?'Custom':'Custom'});
    logHist(st,(S.role==='advisor'?MENTOR_NAME:st.first)+' added a question to the library: “'+t.slice(0,50)+'”');
    persist();render();toast('Added to the library under '+famOf({fam}).label+'.')};
  const norm=t=>t.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
  const near=(a,b)=>{const A=new Set(norm(a).split(' ')),B=new Set(norm(b).split(' '));let o=0;A.forEach(w=>{if(B.has(w))o++});return o/Math.max(A.size,B.size)>=.75};
  const is_=$('#impSample');if(is_)is_.onclick=()=>{$('#impTxt').value='Tell me about a time you received difficult feedback. | Behavioral\nWhy this specialty?\nDescribe a patient encounter that changed how you will practice. | Clinical\nWhat questions do you have for us? | Core & Common\nTell me about a time you made a mistake. | Behavioral'};
  const ip=$('#impParse');if(ip)ip.onclick=()=>{
    const lines=$('#impTxt').value.split('\n').map(l=>l.trim()).filter(Boolean);
    if(!lines.length){toast('Paste at least one question first.');return}
    S.impRows=lines.map((l,i)=>{const[qtext,famName]=l.split('|').map(x=>x&&x.trim());
      const fam=(FAMS.find(f=>famName&&f.label.toLowerCase()===famName.toLowerCase())||FAMS.find(f=>/patient|clinical/i.test(qtext)?f.id==='clinical':/time you|conflict|team/i.test(qtext)?f.id==='behavioral':f.id==='core')).id;
      const dup=allQ().find(x=>near(x.q,qtext));
      return {i,q:qtext,fam,dup:dup?dup.q:null,skip:!!dup}});
    renderImpReview(st)};
}
function renderImpReview(st){
  const wrap=$('#impReview');if(!wrap)return;
  wrap.innerHTML=`<div style="margin-top:14px">
    <div class="fLbl" style="margin-bottom:8px">Review ${S.impRows.length} parsed question${S.impRows.length===1?'':'s'} — nothing is added until you confirm</div>
    ${S.impRows.map(r=>`<div class="impRow ${r.dup?'dup':''}">
      <input type="checkbox" data-impck="${r.i}" ${r.skip?'':'checked'}>
      <span class="it">${esc(r.q)}${r.dup?`<br><span class="dupWarn">⚠ Possible duplicate of “${esc(r.dup.slice(0,60))}” — unchecked by default</span>`:''}</span>
      <select data-impfam="${r.i}">${FAMS.map(f=>`<option value="${f.id}" ${r.fam===f.id?'selected':''}>${f.label}</option>`).join('')}</select>
    </div>`).join('')}
    <button class="noteSend" id="impConfirm" style="margin-top:8px">Add selected to the shared library</button></div>`;
  $$('[data-impfam]').forEach(s2=>s2.onchange=e=>{S.impRows[+s2.dataset.impfam].fam=e.target.value});

function renderQuick(){

  const {st,s}=f;const adv=S.role==='advisor';

  quick.innerHTML=`
  <button class="qNavSide prev" id="qPrevS" ${QCTX.i===0?'disabled':''} title="Previous story">‹</button>

        <div class="qkLesson ${s.lesson?'':'none'}"><div class="lbl">What this story taught ${adv?curPro().obj:'you'}</div>
          <div class="tx">${s.lesson?'“'+esc(s.lesson)+'”':'No lesson written yet — it’s the most important line in the story. Open the full story to add it.'}</div></div></div>
      <div class="drSec"><div class="dsLbl">Review status ${adv?'<span style="letter-spacing:0;text-transform:none;font-weight:600">— one click, saved with your name and time</span>':''}</div>
        ${adv?`<div class="statusRow">${['in_review','changes','reviewed','approved'].map(k=>`<button data-qst="${k}" class="${s.status===k?'on '+STATUS[k].col:''}">${STATUS[k].label}</button>`).join('')}</div>`
        :(s.status==='private'?'<button class="noteSend" id="qSubmit" style="background:linear-gradient(90deg,var(--em),var(--em2));color:#140b00">Submit for review</button>'
         :s.status==='changes'?'<button class="noteSend" id="qSubmit">Resubmit for review</button>'
         :`<div class="stageHint">${STATUS[s.status].hint}</div>`)}
        <div style="margin-top:10px">${tsLines(s)}</div></div>
      <div class="drSec"><div class="dsLbl">${adv?'Your score (mentor)':'My rating — how much this story matters to me'}</div>
        ${adv?scorePickHTML('qm',s.mentorScore,'cy'):scorePickHTML('qs',s.selfScore)}
        <div style="margin-top:10px;display:flex;align-items:center;gap:10px">
          <button class="starBtn ${adv?'mentor':''} ${(adv?s.starMentor:s.starStudent)?'on':''}" id="qStar" style="font-size:20px">★</button>

  $$('[data-qbird]').forEach(b=>b.onclick=()=>{const idb=b.dataset.qbird;const who=adv?MENTOR_NAME:st.first;

  $$('[data-qpos]').forEach(b=>b.onclick=()=>{const idp=b.dataset.qpos;const who=adv?MENTOR_NAME:st.first;

<script>
/* ================= V5.5 · PHASE FLAGS (controlled activation & rollback) =================
   Phase 1  voice capture & transcription — ships first, independently.
   Phase 2  Socratic co-pilot — mentor-only preview; students never interact with AI.
   Phase 3  student-facing intelligence — LOCKED; no exposure path exists in this build.
   In production these map to WordPress-role-gated feature flags on the StoryForge API,
   changeable without a deploy, logged to the existing audit tables. */
const F55D={voice:'all',socratic:'preview'};
let F55=(function(){try{return Object.assign({},F55D,JSON.parse(localStorage.getItem('storyforge-v55-flags')||'{}'))}catch(e){return Object.assign({},F55D)}})();
function f55save(){try{localStorage.setItem('storyforge-v55-flags',JSON.stringify(F55))}catch(e){}}
const voiceOn=()=>F55.voice!=='off';
const socraticOn=()=>F55.socratic==='preview';
let AUDIT55=(function(){try{return JSON.parse(localStorage.getItem('storyforge-v55-audit')||'[]')}catch(e){return[]}})();
function audit55(txt){AUDIT55.unshift({t:iso(NOW()),who:MENTOR_NAME,txt});AUDIT55=AUDIT55.slice(0,24);
  try{localStorage.setItem('storyforge-v55-audit',JSON.stringify(AUDIT55))}catch(e){}}
const _reset55=resetDemo;resetDemo=function(){['storyforge-v55-flags','storyforge-v55-audit','storyforge-v55-capdraft','storyforge-v55-hint'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});_reset55()};

<script>
/* ================= V5.5 · TRANSCRIPTION BOUNDARY =================
   The product talks to a small adapter, never to a vendor:
     engine = { kind, start(), pause(), resume(), stop() }
     callbacks = { started(kind), interim(text), final(text), fail(reason) }
   In production the adapter fronts MissionMed's existing Drills/Daily Rounds
   transcription pipeline first; providers can be swapped, compared privately,
   or failed-over behind this boundary without touching StoryForge.
   In this prototype: a live browser engine is tried when available and
   permitted; otherwise a scripted demo dictation streams with identical
   interim→final behavior so every state can be evaluated anywhere. */
const SIM_SCRIPT=[
 "Okay, so — this morning on rounds we had a patient, Mr. Ellison, seventy-two, post-op day three from a wipple,",
 "and his pressures had been soft all night. The intern wanted to give more fluid.",
 "Something about his belly exam bothered me, so I said it out loud — his drain output had tripled since midnight.",
 "The senior stopped, looked, and we got a stat C B C and a lack tate.",
 "His hemoglobin had dropped two grams. He went back to the O R within the hour.",
 "Nobody said good catch out loud. The room going quiet when the attending made the call — that was the good catch."
];
const SIM_SCRIPT2=[
 "And the thing I keep coming back to is that I almost didn't say it,",
 "because I'm the student, and the number was right there on my card, and saying it cost me two seconds of feeling stupid.",
 "Two seconds. That's the whole price of safety, apparently."
];
const MEDLEX=[
 [/\bwipple\b/gi,'Whipple'],
 [/\black tate\b/gi,'lactate'],
 [/\bC B C\b/g,'CBC'],
 [/\bO R\b/g,'OR'],
 [/\ben ox a parin\b/gi,'enoxaparin'],
 [/\blas ix\b/gi,'Lasix'],
 [/\bmet op rolol\b/gi,'metoprolol'],
 [/\btrop onin\b/gi,'troponin']
];
function makeSimEngine(cb){
  let script=SIM_SCRIPT.slice(),idx=0,widx=0,timer=null,extended=false;
  function tick(){
    const sent=script[idx];
    if(!sent){
      if(!extended){extended=true;script=script.concat(SIM_SCRIPT2);return}
      return; /* script exhausted — the mic keeps "listening" in silence */
    }
    const words=sent.split(' ');
    widx+=1+((idx+widx)%3===0?1:0);
    if(widx>=words.length){cb.final(sent);idx++;widx=0;cb.interim('')}
    else cb.interim(words.slice(0,widx).join(' '));
  }
  return{kind:'sim',
    start(){cb.started('sim');timer=setInterval(tick,300)},
    pause(){clearInterval(timer);timer=null},
    resume(){if(!timer)timer=setInterval(tick,300)},
    stop(){clearInterval(timer);timer=null;
      if(widx>0&&script[idx]){cb.final(script[idx].split(' ').slice(0,widx).join(' ')+'—');cb.interim('')}}
  };
}
function makeSpeechEngine(cb){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return null;
  let r,ok=false,stopped=false,paused=false,startT=null;
  try{r=new SR()}catch(e){return null}
  r.continuous=true;r.interimResults=true;r.lang='en-US';
  r.onstart=()=>{ok=true;clearTimeout(startT);cb.started('live')};
  r.onresult=e=>{let fin='',inter='';
    for(let i=e.resultIndex;i<e.results.length;i++){const res=e.results[i];
      if(res.isFinal)fin+=res[0].transcript+' ';else inter+=res[0].transcript}
    if(fin.trim())cb.final(fin.trim());
    cb.interim(inter.trim())};
  r.onerror=e=>{if(!ok||['not-allowed','service-not-allowed','network','audio-capture'].includes(e.error)){
    clearTimeout(startT);stopped=true;try{r.abort()}catch(_){};cb.fail(e.error||'error')}};
  r.onend=()=>{if(!stopped&&!paused&&ok){try{r.start()}catch(e){}}};
  return{kind:'live',
    start(){startT=setTimeout(()=>{if(!ok){stopped=true;try{r.abort()}catch(_){};cb.fail('timeout')}},2600);
      try{r.start()}catch(e){clearTimeout(startT);cb.fail('start')}},
    pause(){paused=true;try{r.stop()}catch(e){}},
    resume(){paused=false;try{r.start()}catch(e){}},
    stop(){stopped=true;try{r.stop()}catch(e){}}
  };
}
function startTranscriber(cb){
  /* try the live engine; fall back to demo dictation on any failure, silently and mid-flight */
  let fellBack=false;
  const wrapped={started:cb.started,interim:cb.interim,final:cb.final,
    fail(){if(fellBack)return;fellBack=true;
      const sim=makeSimEngine({started:cb.started,interim:cb.interim,final:cb.final,fail(){}});
      cb.swap(sim);sim.start()}};
  let eng=makeSpeechEngine(wrapped);
  if(!eng){fellBack=true;eng=makeSimEngine(wrapped)}
  eng.start();return eng;
}
/* durable capture draft — survives a closed laptop, a dropped call, a refresh */
const V55DKEY='storyforge-v55-capdraft';
const v55draft={
  load(){try{return JSON.parse(localStorage.getItem(V55DKEY)||'null')}catch(e){return null}},
  save(o){try{localStorage.setItem(V55DKEY,JSON.stringify(o))}catch(e){}},
  clear(){try{localStorage.removeItem(V55DKEY)}catch(e){}}
};
</script>
<script>
/* ================= V5.5 · CAPTURE — one surface, two ways in =================
   Typing is untouched. Speaking streams into the same textarea the student
   would have typed into: "StoryForge can now type while I talk." */
const MIC_SVG='<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v5a4 4 0 0 0 4 4zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.94V22h2v-3.06A8 8 0 0 0 20 11h-2z"/></svg>';
function mmss(t){return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}
function openCapture(opt){opt=opt||{};
  if(S.role==='advisor'){toast('Capture belongs to the student — switch to Student View to add a story.');return}
  const dd=(opt.recover?v55draft.load():null)||( !opt.fresh?v55draft.load():null )||{};
  capState={themes:dd.themes?dd.themes.slice():[],selfScore:dd.selfScore||0,voice:!!dd.voice,rec:false,paused:false,
    recT:dd.recT||0,sessT:0,anchor:0,engine:null,engineKind:null,qid:opt.qid||dd.qid||null,
    prefix:dd.prefix!==undefined?dd.prefix:true,timer:null,saveTimer:null,visHandler:null,recovered:!!opt.recover};
  opt.title=opt.title||dd.title||'';
  opt.body=(dd.body||'')+(dd.ghost?((dd.body?' ':'')+dd.ghost):''); /* words still in flight at the interruption are kept too */
  opt.lesson=dd.lesson||'';opt.prompt=opt.prompt||dd.prompt||null;

      :(hadDraft?'<div style="margin-bottom:12px;font-family:var(--num);font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gn)">✓ Draft restored — nothing was lost</div>':'')}
    <div class="capTitleRow">
      <span class="capPre ${capState.prefix?'':'off'}" id="capPre" title="Tap to drop the prefix">The One Where</span>
      <input id="capTitle" placeholder="…what happened?" autocomplete="off" value="${esc(opt.title)}">
    </div>
    <div class="capHint">Name it the way you’d bring it up with a friend. If the title makes you smile or wince, it’s right.</div>
    <div class="capTellWrap">
      <textarea id="capBody" placeholder="${voiceOn()?'Tell it like you’d tell a trusted person — type it, or tap Speak below and StoryForge types while you talk.':'Tell it like you’d tell a trusted person. Messy is perfect — this version stays yours forever.'}">${esc(opt.body)}</textarea>
    </div>
    ${voiceOn()?'<div class="voxDock idle" id="voxDock"></div>':''}
    <div class="capMore ${(opt.lesson||capState.themes.length||capState.selfScore)?'open':''}" id="capMore">
      <div class="capMoreHead" id="capMoreHead"><span class="car">▸</span> Add more now — or skip all of it and just save</div>
      <div class="capMoreBody">
        <div class="capField"><div class="fl">What did it teach you?</div><input id="capLesson" placeholder="One honest sentence is plenty…" value="${esc(opt.lesson)}"></div>
        <div class="capField"><div class="fl">My rating — how much does it matter to you?</div>${scorePickHTML('cap',capState.selfScore,'','')}</div>
        <div class="capField"><div class="fl">Feels like</div><div class="thFilter" id="capThemes">${THEMES.map(t=>`<button class="thChip ${capState.themes.includes(t.id)?'on':''}" data-ct="${t.id}" style="--hue:${t.hue}"><i></i>${t.label}</button>`).join('')}</div></div>
      </div>
    </div>
    <div class="capActions">
      <button class="btnSave" id="capSave" disabled>Save story</button>
      <span class="capNote">Saved private. Submit it for review whenever you’re ready.</span>
      <div class="privNote">🔒 Only you can see it</div>
    </div>
  </div>`;
  cap.classList.add('open');
  const title=$('#capTitle'),body=$('#capBody'),save=$('#capSave'),pre=$('#capPre');
  const sync=()=>{save.disabled=!title.value.trim()};title.oninput=sync;sync();
  if(!opt.rec)setTimeout(()=>title.focus(),60);
  pre.onclick=()=>{pre.classList.toggle('off');capState.prefix=!pre.classList.contains('off')};
  $('#capClose').onclick=closeCapture;
  cap.onmousedown=e=>{if(e.target===cap)closeCapture()};
  $('#capMoreHead').onclick=()=>$('#capMore').classList.toggle('open');
  const cp=$('[data-sp="cap"]');if(cp)cp.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    capState.selfScore=+b.dataset.n===capState.selfScore?0:+b.dataset.n;
    $$('[data-sp="cap"] button').forEach(x=>x.classList.toggle('on',+x.dataset.n<=capState.selfScore));
    $('[data-sp="cap"] .spv').textContent=capState.selfScore?capState.selfScore+'/5':'not rated'};
  $$('[data-ct]').forEach(c=>c.onclick=()=>{const id=c.dataset.ct;
    capState.themes=capState.themes.includes(id)?capState.themes.filter(x=>x!==id):[...capState.themes,id];c.classList.toggle('on')});

  /* ---- durable autosave: every 2s, plus on every finalized chunk ---- */
  function saveDraft(inProgress){
    const t=$('#capTitle'),b=$('#capBody'),l=$('#capLesson');if(!capState)return;
    if(!(t&&(t.value.trim()||b.value.trim()||capState.ghost))){return}
    v55draft.save({title:t.value,body:b.value,ghost:capState.ghost||'',lesson:l?l.value:'',themes:capState.themes.slice(),
      selfScore:capState.selfScore,voice:capState.voice,prefix:capState.prefix,qid:capState.qid,prompt:capState.prompt,
      recT:capState.recT,inProgress:!!inProgress,t:iso(NOW())});
  }
  capState.saveDraft=saveDraft;
  capState.saveTimer=setInterval(()=>saveDraft(true),2000);

  /* ---- the voice system ---- */
  const dock=$('#voxDock');
  function insertFinal(chunk){chunk=(chunk||'').trim();if(!chunk)return;
    /* overlap-merge: real and simulated engines can finalize text whose opening
       words were already visible (or committed) as interim — append only what's new */
    const v=body.value;
    const nrm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();

  function medFlags(){const region=body.value.slice(capState.anchor);
    return MEDLEX.filter(([re])=>{re.lastIndex=0;return re.test(region)}).map(([re,to])=>{re.lastIndex=0;
      return {re,to,from:(body.value.slice(capState.anchor).match(re)||[''])[0]}})}
  function renderDock(mode){if(!dock)return;dock.className='voxDock '+mode;
    if(mode==='idle'){dock.innerHTML=`<div class="voxRow">
      <button class="voxMain" id="voxGo"><span class="rdot"></span>${MIC_SVG} Speak it — StoryForge types while you talk</button>
      <span class="voxState">Typing always works too. You can do both in the same story.</span></div>`;
      $('#voxGo').onclick=startRec;return}

      <span class="voxState">Getting your microphone ready…</span></div>`;return}
    if(mode==='rec'||mode==='paused'){
      dock.innerHTML=`<div class="voxRow">
        <span class="voxTimer" id="voxTime">${mode==='paused'?'❚❚ ':''}<span class="rdot"></span>${mmss(capState.recT)}</span>
        <div class="voxWave">${Array.from({length:13},(_,i)=>'<i style="animation-delay:'+(i*.07)+'s"></i>').join('')}</div>
        ${mode==='rec'?'<button class="voxBtn" id="voxPause">❚❚ Pause</button>':'<button class="voxBtn" id="voxResume">▶ Resume</button>'}
        <button class="voxBtn done" id="voxDone">✓ Done</button>
        <button class="voxBtn warn" id="voxDiscard">✕ Discard</button>
        <span class="voxTag ${capState.engineKind==='live'?'live':'sim'}">${capState.engineKind==='live'?'Live transcription':'Demo dictation — simulated'}</span>
      </div>
      <div class="voxGhost" id="voxGhost"></div>
      <div class="voxState" id="voxNote">${mode==='paused'
        ?'<b>Paused'+(capState.autoPaused?' automatically when you switched away':'')+' — nothing lost.</b> Resume when you’re ready, or press Done to review.'
        :'<b>Listening.</b> Your words appear in the story above as you talk — pause any time, edit anything after.'}</div>`;
      const vp=$('#voxPause');if(vp)vp.onclick=()=>pauseRec(false);
      const vr=$('#voxResume');if(vr)vr.onclick=resumeRec;
      $('#voxDone').onclick=stopRec;$('#voxDiscard').onclick=discardRec;
      const g=$('#voxGhost');if(g)g.textContent=capState.ghost||'';
      return}
    if(mode==='review'){
      const flags=medFlags();
      dock.innerHTML=`<div class="voxRow">
        <span class="voxTimer" style="color:var(--gn)">✓ ${mmss(capState.recT)}</span>
        <span class="voxState" style="flex:1;min-width:180px"><b>Captured.</b> The transcript above is yours — read it once, fix anything, then save.${title.value.trim()?'':' <b>Name it above to save.</b>'}</span>
        <button class="voxBtn" id="voxMore">${MIC_SVG} Record more</button>
        <button class="voxBtn warn" id="voxDiscard2">✕ Discard this recording</button>
        <span class="voxTag ${capState.engineKind==='live'?'live':'sim'}">${capState.engineKind==='live'?'Live transcription':'Demo dictation — simulated'}</span>
      </div>
      ${flags.length?`<div class="voxChips" id="voxChips"><span class="ckLbl">Transcript check</span>

    /* the in-flight gray line stays visible while paused; it joins the story
       when the engine finalizes it on resume or finish — never lost, never doubled */
    renderDock('paused');saveDraft(true)}
  function resumeRec(){if(!capState.rec||!capState.paused)return;
    capState.paused=false;capState.autoPaused=false;
    if(capState.engine)capState.engine.resume();renderDock('rec')}
  function stopRec(){if(!capState.rec)return;
    if(capState.engine)capState.engine.stop();capState.engine=null;
    if(capState.ghost){const g=capState.ghost;clearGhost();insertFinal(g)}
    capState.rec=false;capState.paused=false;clearInterval(capState.timer);capState.timer=null;
    renderDock('review');saveDraft(true);sync()}
  function discardRec(){
    const hadWords=body.value.length>capState.anchor;
    if(capState.engine){capState.engine.stop();capState.engine=null}
    capState.rec=false;capState.paused=false;clearInterval(capState.timer);capState.timer=null;
    body.value=body.value.slice(0,capState.anchor);
    capState.recT=Math.max(0,capState.recT-capState.sessT);capState.sessT=0;capState.ghost='';
    if(capState.recT===0&&!body.value.trim())capState.voice=false;
    renderDock('idle');saveDraft(true);
    toast(hadWords?'Recording discarded — the words from that take were removed. Typed text stays.':'Recording discarded.')}
  capState.stopRec=stopRec;
  if(dock)renderDock(capState.recovered&&capState.voice&&body.value.trim()?'review':'idle');
  /* interruption safety: switching apps mid-recording auto-pauses instead of losing audio focus silently */
  capState.visHandler=()=>{if(document.hidden&&capState&&capState.rec&&!capState.paused)pauseRec(true)};
  document.addEventListener('visibilitychange',capState.visHandler);
  if(opt.rec&&voiceOn())setTimeout(startRec,350);

  save.onclick=()=>{
    if(capState.rec)stopRec();
    const st=stuById('maya');
    const s=mk({t:title.value.trim(),prefix:capState.prefix!==false,date:iso(NOW()).slice(0,10),
      body:body.value.trim(),lesson:$('#capLesson').value.trim(),embers:capState.selfScore,
      themes:[...capState.themes],voice:capState.voice,shared:false});
    upgradeStory(st,s);
    s.ts.captured=iso(NOW());s.ts.studentUpdated=iso(NOW());
    s.history=[{t:iso(NOW()),who:'Maya',action:'Captured the story',detail:s.voice?'spoken — transcript reviewed before saving':''}];
    if(capState.voice)s.audio={dur:Math.max(capState.recT||42,6)};
    if(capState.qid){s.qa=[{q:capState.qid,by:'Maya',confirmed:false,sStudent:3,sMentor:null,t:iso(NOW()),fups:[],why:''}];
      const th=QTHEME[capState.qid];if(th&&!s.themes.includes(th))s.themes.push(th)}
    STORIES.unshift(s);v55draft.clear();persist();
    const r=save.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2);
    const wasQ=!!capState.qid;
    title.value='';body.value='';$('#capLesson').value='';
    closeCapture();S.view=wasQ?'prep':'home';render();
    toast('Saved. “'+esc(titleOf(s)).slice(0,60)+'” is private until you submit it for review.');
  };
}
function closeCapture(){
  if(capState){
    if(capState.engine){try{capState.engine.stop()}catch(e){}}
    if(capState.timer)clearInterval(capState.timer);
    if(capState.saveTimer)clearInterval(capState.saveTimer);
    if(capState.visHandler)document.removeEventListener('visibilitychange',capState.visHandler);
    const t=$('#capTitle'),b=$('#capBody');
    if(capState.ghost&&b){b.value=(b.value?b.value+' ':'')+capState.ghost;capState.ghost=''}
    if(t&&(t.value.trim()||(b&&b.value.trim()))){
      capState.saveDraft&&capState.saveDraft(false);
      toast('Draft kept, nothing lost — reopen “New Story” to continue.')}
    else v55draft.clear();
  }
  cap.classList.remove('open');cap.innerHTML='';capState=null;
}
</script>

<script>
/* ================= V5.5 · HOME — the mic keeps its promise =================
   In V5 the hero mic opened capture and did nothing else. Now it opens capture
   with recording already starting — the fastest path from memory to transcript. */
const _renderHome55=renderHome;
renderHome=function(){_renderHome55();
  const mic=$('#heroMic');if(!mic)return;
  if(!voiceOn()){mic.style.display='none';return}
  mic.style.display='';
