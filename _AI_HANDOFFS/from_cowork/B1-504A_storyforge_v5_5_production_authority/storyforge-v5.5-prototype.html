</script>
<script>
/* ================= V5.5 · PHASE 2 — SOCRATIC CO-PILOT (mentor-only preview) =================
   Foundation rules, enforced by construction:
   · visible only in Mentor View, only when the Phase 2 flag is on;
   · it drafts questions — it never sends, scores, or judges;
   · anything sent goes through the mentor's existing "ask" mechanism, as the mentor;
   · students never see AI, never talk to AI, and cannot tell which questions began as drafts.
   Simulated here; production routes through MissionMed's model gateway behind this same
   review-then-send gate, so Phase 2 ships without touching the student experience. */
const SOC_POOL={
 mistake:[
  {q:'What did you believe in the moment before you realized you were wrong — and what would have challenged that belief sooner?',why:'Separates the error from the reasoning habit underneath it.'},
  {q:'Who else knew, or almost knew? What kept the information from moving faster?',why:'Turns a personal mistake into a systems insight — interviewers reward that shift.'}],
 patient:[
  {q:'What did this patient teach you that no textbook could — and where has it changed what you do since?',why:'Moves the story from moving to formative.'},
  {q:'What do you know about this patient that never made it into the chart?',why:'The unchartable detail is usually the story’s proof of presence.'}],
 leader:[
  {q:'What would have happened if you had done nothing — and how do you know?',why:'Tests whether the leadership was real or narrated.'},
  {q:'What did leading cost you in that moment?',why:'Cost is what separates leadership stories from participation stories.'}],
 conflict:[
  {q:'What was the other person protecting? Tell the story once from their side.',why:'The strongest conflict answers hold both positions honestly.'},
  {q:'Where is the line between persistence and stubbornness here — and how did you know which side you were on?',why:'Pre-empts the interviewer’s natural pushback.'}],
 comm:[
  {q:'What did you choose not to say — and why was that the right call?',why:'Restraint is the hardest communication skill to evidence.'}],
 team:[
  {q:'Who was invisible in this story the first time you told it?',why:'Rebalancing credit deepens the telling and the teller.'}],
 resil:[
  {q:'What resource did you actually draw on to get through this — and can you reach it on purpose next time?',why:'Turns survival into a repeatable skill.'}],
 growth:[
  {q:'What can you do today that the person at the start of this story couldn’t?',why:'Makes the growth concrete and verifiable.'}],
 identity:[
  {q:'If this story is evidence of who you’re becoming, what exactly is it evidence of?',why:'Forces the thesis sentence the personal statement will need.'}],
 advoc:[
  {q:'How did you weigh the risk of speaking up against the risk of staying quiet?',why:'Shows judgment, not just courage.'}],
 generic:[
  {q:'What is the hardest question an interviewer could ask about this story — and what is your honest answer?',why:'Finds the soft spot before an interviewer does.'},
  {q:'Which single sentence here is doing the most work — and what happens if you open with it?',why:'A craft question that usually restructures the telling.'},
  {q:'What did this cost you that the story doesn’t admit yet?',why:'The admitted cost is what makes reflection read as honest.'}]
};
const SOCDIS={};
function socraticFor(s){
  const asked=(s.refl||[]).map(r=>r.q);
  const dism=SOCDIS[s.id]||[];
  const pool=[];(s.themes||[]).forEach(t=>(SOC_POOL[t]||[]).forEach(q=>pool.push(q)));
  SOC_POOL.generic.forEach(q=>pool.push(q));
  const seen=new Set(),out=[];
  for(const q of pool){if(seen.has(q.q)||asked.includes(q.q)||dism.includes(q.q))continue;
    seen.add(q.q);out.push(q);if(out.length===3)break}
  return out;
}
function injectSocratic(){
  if(S.role!=='advisor'||!socraticOn())return;
  const f=findStory(S.roomId);if(!f)return;const{st,s}=f;
  if(s.status==='private')return;
  if(room.querySelector('#socCard'))return;
  const rail=room.querySelectorAll('.roomGrid>div')[1];if(!rail)return;
  const items=socraticFor(s);
  const card=document.createElement('div');card.className='railCard socCard';card.id='socCard';
  card.innerHTML=`
    <div class="rLbl">Socratic co-pilot <span class="socPrev">Preview · mentor-only</span></div>
    <div class="socSub">Drafts questions only you can see. Nothing reaches ${esc(st.first)} unless you send it — and it arrives <b>as you</b>, editable first. ${esc(st.first)} never sees AI.</div>
    ${items.map((q,i)=>`<div class="socQ">
      <div class="sq">“${esc(q.q)}”</div>
      <div class="swhy">Why this question: ${esc(q.why)}</div>
      <div class="sBtns"><button class="ask" data-socask="${i}">Ask as-is</button><button data-socedit="${i}">Edit first</button><button data-socdis="${i}">Dismiss</button></div>
    </div>`).join('')||'<div class="stageHint">Every current draft was asked or dismissed. New drafts appear as the story evolves.</div>'}
    <div class="socFoot">Simulated in this prototype. In production, drafts come from MissionMed’s coaching model through this same review-then-send gate — mentor judgment stays the product.</div>`;
  const cards=[...rail.querySelectorAll('.railCard')];
  const fb=cards.find(c=>/Mentor feedback/.test(c.textContent));
  rail.insertBefore(card,fb||null);
  card.querySelectorAll('[data-socask]').forEach(b=>b.onclick=()=>{const q=items[+b.dataset.socask];
    s.refl.push({q:q.q,a:'',from:'mentor',date:iso(NOW()).slice(0,10),seen:false});
    act(st,s,MENTOR_NAME,'Asked a question','“'+q.q.slice(0,60)+'”');
    notify(st,s,MENTOR_NAME+' asked you a question about “'+titleOf(s)+'”.');
    renderRoom();toast('Sent as your question — '+st.first+' sees it as coming from you.')});
  card.querySelectorAll('[data-socedit]').forEach(b=>b.onclick=()=>{const q=items[+b.dataset.socedit];
    const inp=$('#askTxt');if(!inp)return;inp.value=q.q;inp.focus();
    inp.scrollIntoView({block:'center',behavior:'smooth'});
    toast('Draft placed in your ask box — edit it, then Ask. It sends as you.')});
  card.querySelectorAll('[data-socdis]').forEach(b=>b.onclick=()=>{const q=items[+b.dataset.socdis];
    (SOCDIS[s.id]=SOCDIS[s.id]||[]).push(q.q);renderRoom()});
}
const _renderRoom55=renderRoom;
renderRoom=function(){_renderRoom55();injectSocratic()};
</script>
<script>
/* ================= V5.5 · PHASE 3 — RELEASE CONTROLS (controlled exposure, proven) ================= */
function injectRelease(){
  if(!S.mentorAccess||S.role!=='advisor')return; /* administrator surface — Student View stays exactly the student's product */
  const sec=main.querySelector('section[data-view="settings"]');if(!sec)return;
  if(sec.querySelector('#relPanel'))return;
  const first=sec.querySelector('.panel');if(!first)return;
  const vLbl={all:'Everyone in the pilot',cohortA:'Session A cohort only',off:'Off — instant rollback'};
  const p=document.createElement('div');p.className='panel';p.id='relPanel';p.style.marginTop='18px';
  p.innerHTML=`
    <div class="pHead"><div class="h2">Release <em>controls</em> · StoryForge V5.5</div>
      <span class="cohortChip" style="margin-left:auto" title="In production this panel is WordPress administrator-only">Founder / administrator</span></div>
    <div class="pBody">
      <div style="font-size:12px;color:var(--dim);margin-bottom:4px;line-height:1.5">Each phase ships, activates, and rolls back independently — no deploy, no redesign, every change stamped. Students only ever see what a phase explicitly exposes.</div>
      <div class="relRow">
        <span class="relChip ${F55.voice==='off'?'off':F55.voice==='cohortA'?'scoped':'live'}">${F55.voice==='off'?'OFF':F55.voice==='cohortA'?'Scoped':'LIVE'}</span>
        <div class="relBody"><b>Phase 1 · Voice capture &amp; transcription</b>
          <span>Speaking becomes a first-class capture method inside the existing New Story flow. No AI in the student experience — capture and transcription only.</span>
          <span class="relNote">Maya Chen is in Session A — with cohort scoping she keeps voice capture while it stays off for everyone else. Switching to Off reverts the product to typing-only instantly.</span></div>
        <div class="relCtl"><select id="relVoice">
          ${['all','cohortA','off'].map(v=>`<option value="${v}" ${F55.voice===v?'selected':''}>${vLbl[v]}</option>`).join('')}
        </select></div>
      </div>
      <div class="relRow">
        <span class="relChip ${socraticOn()?'scoped':'off'}">${socraticOn()?'Mentor preview':'OFF'}</span>
        <div class="relBody"><b>Phase 2 · Socratic co-pilot</b>
          <span>Drafts deepening questions privately for mentors inside Full Review. Mentors edit and send as themselves; students never see or talk to AI.</span>
          <span class="relNote">No student exposure path exists in this phase — the flag gates a mentor-view panel only.</span></div>
        <div class="relCtl"><div class="tgl ${socraticOn()?'on':''}" id="relSoc"><i></i></div></div>
      </div>
      <div class="relRow">
        <span class="relChip locked">LOCKED</span>
        <div class="relBody"><b>Phase 3 · Student-facing intelligence</b>
          <span>Reserved. No student-facing AI exists in this build and no toggle can enable it — unlocking requires a founder decision and a new release with its own review.</span></div>
        <div class="relCtl"><div class="tgl" style="opacity:.3;pointer-events:none"><i></i></div></div>
      </div>
      <div class="relAudit">
        <div class="fLbl" style="margin-bottom:6px">Change log — every flip is stamped</div>
        ${AUDIT55.slice(0,5).map(a=>`<div class="ra"><span class="rt">${fmtDT(a.t)}</span><span><b>${esc(a.who)}</b> — ${esc(a.txt)}</span></div>`).join('')||'<div class="ra"><span class="rt">—</span><span>No release changes yet this session.</span></div>'}
      </div>
    </div>`;
  first.after(p);
  $('#relVoice').onchange=e=>{F55.voice=e.target.value;f55save();
    audit55('Phase 1 voice capture → '+vLbl[F55.voice]);
    toast(F55.voice==='off'?'Voice capture rolled back — capture is typing-only again, instantly.':'Voice capture: '+vLbl[F55.voice]+'.','⚑');render()};
  $('#relSoc').onclick=()=>{F55.socratic=socraticOn()?'off':'preview';f55save();
    audit55('Phase 2 Socratic co-pilot → '+(socraticOn()?'mentor preview on':'off'));
    toast(socraticOn()?'Socratic co-pilot on — mentor preview only.':'Socratic co-pilot off.','⚑');render()};
}
const _renderSettings55=renderSettings;
renderSettings=function(){_renderSettings55();injectRelease()};
</script>
<script>
/* ================= V5.5 · BOOT — recovery first, discovery second ================= */
(function boot55(){
  render(); /* apply V5.5 patches to the initial view */
  const d=v55draft.load();
  if(d&&d.inProgress&&(d.title||d.body||d.ghost)&&S.role==='student'){
    setTimeout(()=>{openCapture({recover:true})},700);
  }else if(voiceOn()&&S.role==='student'){

      if(!seen&&!cap.classList.contains('open'))toast('New in StoryForge — tap the mic and it types while you talk.','🎙')},1300);
  }
