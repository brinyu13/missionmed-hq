<style>

#lawstrip{

.law.warn{color:var(--warn); border-color:#5a4310;}

.famnote{color:var(--neutral); font-size:13px; margin:6px 0 18px; max-width:960px;}
.famnote b{color:var(--ink2);}

.opt{

  radial-gradient(120% 90% at 50% 0%, #232b3a 0%, #151a24 55%, #10141d 100%);}

/* ---------- INSTRUMENT SHARED ---------- */

.corr.ok{color:var(--ok);} .corr.warn{color:var(--warn);} .corr.bad{color:var(--bad);} .corr.dim{color:var(--neutral);}

/* scenario bar */
#scen{display:flex; gap:6px; flex-wrap:wrap; margin:10px 0 4px;}

/* selection tray */
#tray{
  position:fixed; right:18px; bottom:18px; z-index:120; width:320px;

#trayfoot button.ghost{background:transparent; border:1px solid var(--line2); color:var(--ink2);}
/* hero blocks */
.hero{

.hero h1{font-size:30px; font-weight:900; letter-spacing:.01em;}
.hero h1 b{color:var(--gold);}

.hero .picks{display:flex; flex-wrap:wrap; gap:6px; margin-top:14px;}
.pickchip{font-size:10.5px; font-weight:800; letter-spacing:.06em; color:var(--ink2);

.pickchip b{color:var(--gold);}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}

.mapbox{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:18px;}
.mapbox h3{font-size:13px; letter-spacing:.12em; font-weight:900; color:var(--gold); margin-bottom:10px;}
.flow{display:flex; flex-direction:column; gap:6px;}
.fstep{display:flex; align-items:center; gap:10px; background:var(--card2); border:1px solid var(--line);

.fstep .n{width:20px; height:20px; border-radius:50%; background:var(--sel); color:#fff; font-size:10px;

.note{background:#171408; border:1px solid #4a3a10; border-radius:10px; padding:10px 14px;
  color:#E8BE6A; font-size:12px; font-weight:600; margin:10px 0;}
.note.blue{background:#0d1524; border-color:#22406e; color:#7FA6EF;}
kbd{background:var(--card2); border:1px solid var(--line2); border-radius:4px; padding:1px 6px; font-size:10.5px;}
h5.sub{font-size:11px; letter-spacing:.14em; color:var(--neutral); margin:20px 0 8px; font-weight:800;}
[data-lab]{display:none !important;}
body[data-density="LAB"] [data-lab]{display:flex !important;}
canvas{display:block;}

<script>
/* ============================================================
   IV PREP ON-CALL — AAA DESIGN SHOWROOM ENGINE
   Ticket Y1-Y2-CAM-V6-3490 · Fable 5
   Honors: 3471C signal contract IDs · 3472 instrument grammar lock
   ============================================================ */
'use strict';
/* ---------- GLOBAL UI STATE ---------- */
const UI = { density:'STANDARD', role:'STUDENT', state:'LIVE' };
document.querySelectorAll('#gctrl .seg button').forEach(b=>{
  b.addEventListener('click',()=>{
    const k = Object.keys(b.dataset)[0];
    UI[k]=b.dataset[k];
    b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    document.body.dataset[k]=b.dataset[k];
  });
});
/* ---------- SYNTHETIC TELEMETRY (SessionClock) ---------- */
const SIM = {
  t:0, scenario:'IDLE', scenT:0, phase:'OPEN',
  level:.58, p10:.48, p90:.68, pitchLo:-3.2, pitchHi:3.4, pitchCur:0,
  pace:.48, paceTarget:[.34,.62],
  cad:'NATURAL',            // EVEN | NATURAL | CHAOTIC
  hands:{ L:{x:-.34,y:.30,vis:true}, R:{x:.30,y:.28,vis:true} },
  frame:{cx:0, cy:0, size:1},
  warm:72, comp:74, congr:'ALIGNED',
  contributors:{ 'HANDS VISIBLE':88,'OPERATING ZONE':81,'SPACE VS BASELINE':76,'ILLUSTRATOR RATE':72,'GESTURE HOLDS':70 },
  vvContrib:{ 'PITCH VARIATION':96,'VOLUME VARIATION':61,'PACE VARIATION':91,'CADENCE VARIATION':89 },
  pitchAvail:true, rHandAvail:true, windowFill:1, speaking:true,
};
const lerp=(a,b,k)=>a+(b-a)*k;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const noise=(t,s)=>Math.sin(t*1.7+s)*.5+Math.sin(t*.63+s*2.7)*.35+Math.sin(t*3.1+s*.4)*.15;
/* Scenario scripts: each is fn(ts) mutating SIM. ts = seconds since scenario start */
const SCEN = {
  IDLE(ts){
    SIM.phase = ['OPEN','ENUMERATE','PROVE-STORY','CLOSE'][Math.floor(ts/9)%4];
    SIM.level = .58 + noise(ts,1)*.07;
    SIM.p10 = SIM.level-.11+noise(ts,9)*.02; SIM.p90 = SIM.level+.11+noise(ts,4)*.02;
    SIM.pitchLo=-3.4+noise(ts,2); SIM.pitchHi=3.5+noise(ts,5);
    SIM.pitchCur = noise(ts*1.9,3)*3.4;
    SIM.pace=.5+noise(ts,7)*.09;
    SIM.paceTarget = SIM.phase==='PROVE-STORY' ? [.20,.50] : SIM.phase==='CLOSE' ? [.55,.80] : [.34,.62];
    SIM.cad='NATURAL';
    SIM.hands.L={x:-.30+noise(ts,11)*.16, y:.26+noise(ts,13)*.13, vis:true};
    SIM.hands.R={x:.30+noise(ts,17)*.18, y:.24+noise(ts,19)*.15, vis:true};
    SIM.frame={cx:noise(ts,23)*.03, cy:noise(ts,29)*.02, size:1+noise(ts,31)*.03};
    SIM.warm=72+noise(ts,37)*5; SIM.comp=74+noise(ts,41)*5;
    SIM.vvContrib['VOLUME VARIATION']=61; SIM.pitchAvail=true; SIM.rHandAvail=true;
    SIM.windowFill=1; SIM.congr='ALIGNED';
  },
  S1(ts){ /* voice too quiet -> correction -> recovery -> lock */
    SCEN.IDLE(ts); SIM.phase='OPEN';
    if(ts<4){ SIM.level=.34+noise(ts,1)*.015; }
    else if(ts<9){ SIM.level=lerp(.34,.58,(ts-4)/5)+noise(ts,1)*.012; }
    else { SIM.level=.58+noise(ts,1)*.02; }
    SIM.p10=SIM.level-.08; SIM.p90=SIM.level+.08;
    if(ts>15) restartScen();
  },
  S2(ts){ /* pace acceleration, phase-aware moving arc */
    SCEN.IDLE(ts);
    SIM.phase = ts<8?'OPEN' : ts<20?'ENUMERATE' : 'PROVE-STORY';
    SIM.paceTarget = SIM.phase==='PROVE-STORY' ? [.20,.50] : SIM.phase==='ENUMERATE' ? [.40,.72] : [.34,.62];
    if(ts<20) SIM.pace=.5+noise(ts,7)*.05;
    else if(ts<24) SIM.pace=lerp(.5,.86,(ts-20)/4);
    else if(ts<32) SIM.pace=.86+noise(ts,7)*.03;
    else SIM.pace=lerp(.86,.42,Math.min(1,(ts-32)/5));
    if(ts>40) restartScen();
  },
  S3(ts){ /* right hand lost -> coverage honesty */
    SCEN.IDLE(ts);
    SIM.rHandAvail = !(ts>10 && ts<22);
    SIM.hands.R.vis = SIM.rHandAvail;
    if(ts>30) restartScen();
  },
  S4(ts){ /* loud monotone — decisive scenario */
    SCEN.IDLE(ts); SIM.phase='PROVE-STORY';
    SIM.level=.60+noise(ts,1)*.012;
    SIM.p10=SIM.level-.02; SIM.p90=SIM.level+.02;          // collapsed bracket
    SIM.pitchLo=-.8; SIM.pitchHi=.9; SIM.pitchCur=noise(ts*2,3)*.7; // <2 st
    SIM.pace=.5+noise(ts,7)*.02;
    SIM.vvContrib['VOLUME VARIATION']=34+noise(ts,5)*3;
    SIM.vvContrib['PITCH VARIATION']=38+noise(ts,6)*3;
    if(ts>18) restartScen();
  },
  S5(ts){ /* cadence: metronomic -> natural -> chaotic */
    SCEN.IDLE(ts);
    SIM.cad = ts<14?'EVEN' : ts<26?'NATURAL' : 'CHAOTIC';
    if(ts>36) restartScen();
  },
  S6(ts){ /* film room replay — handled by film demo (POST) */
    SCEN.IDLE(ts);
    SIM.pitchAvail = !(ts%60>22 && ts%60<31);
  },
  SD(ts){ /* natural vs interview suppression (Scenario D) */
    SCEN.IDLE(ts);
    const k=(Math.sin(ts*.5)+1)/2; // oscillate suppression for the fingerprint demo
    SIM.hands.L={x:-.14-k*.02+noise(ts,11)*.05, y:.34+noise(ts,13)*.05, vis:true};
    SIM.hands.R={x:.13+noise(ts,17)*.05, y:.33+noise(ts,19)*.05, vis:true};
    SIM.pitchLo=-1.4; SIM.pitchHi=1.5;
  },
  SB(ts){ /* personable, lower authority */
    SCEN.IDLE(ts); SIM.warm=86+noise(ts,3)*3; SIM.comp=48+noise(ts,5)*4;
  },
  SC(ts){ /* polished but cold */
    SCEN.IDLE(ts); SIM.warm=42+noise(ts,3)*4; SIM.comp=88+noise(ts,5)*3;
  },
  SE(ts){ /* strong congruence beat every 6s */
    SCEN.IDLE(ts);
    const beat=(ts%6)<0.9;
    SIM.congr = beat?'CONVERGE':'ALIGNED';
    if(beat){ SIM.level=.72; SIM.pitchCur=4.5; SIM.hands.R.y=.55; }
  },
  SVV(ts){ /* volume variation recovers -> master responds (contributor→master law) */
    SCEN.IDLE(ts); SIM.phase='PROVE-STORY';
    let vv;
    if(ts<5) vv=61; else if(ts<15) vv=lerp(61,84,(ts-5)/10); else vv=84+noise(ts,5)*2;
    SIM.vvContrib['VOLUME VARIATION']=vv;
    const spread=lerp(.04,.24,(vv-34)/56);
    SIM.p10=SIM.level-spread/2; SIM.p90=SIM.level+spread/2;
    if(ts>22) restartScen();
  },
};
let scenStart=performance.now()/1000;

/* ---------- COMPOSITE LAW (3472 §8.1) ---------- */
function compositeMaster(contribs, avail){
  const vals=Object.entries(contribs).filter(([k])=>!avail||avail[k]!==false).map(([,v])=>v);
  if(!vals.length) return {master:0,cov:0,limiting:null};
  const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
  const weakest=Math.min(...vals);
  const master=Math.min(mean, weakest+15);         // headroom 15 [CALIBRATE]
  const bucket=Math.round(master/5)*5;             // buckets of 5
  let limiting=null;
  for(const [k,v] of Object.entries(contribs)) if(v===weakest) limiting=k;
  return {master:bucket, raw:master, mean, weakest, limiting,
          cov:vals.length, tot:Object.keys(contribs).length};
}

/* ---- 3 · SPEAKING PACE — five-zone dial with moving phase arc ---- */
function paceDial(el){
  el.innerHTML=`
  <div class="inst" style="align-items:center;">
    <div class="irow" style="width:100%"><span class="ititle">SPEAKING PACE</span><span class="istate" data-r="ph" style="color:var(--info)"></span></div>
    <svg data-r="svg" viewBox="0 0 240 150" style="flex:1; max-height:78%; width:100%;"></svg>
    <div class="corr" data-r="corr" style="font-size:22px;">HOLD PACE</div>
  </div>`;
  const svg=el.querySelector('[data-r=svg]'), ph=el.querySelector('[data-r=ph]'), corr=el.querySelector('[data-r=corr]');
  const cx=120, cy=132, r1=78, r2=104;
  const a0=-200, a1=20; // 220 degrees
  const zones=[[0,.12,'PAUSE','#4a5468'],[.12,.34,'SLOW','#7d8aa3'],[.34,.62,'CRUISE','#2FA84F'],[.62,.80,'ENERGIZE','#F5A623'],[.80,1,'TOO FAST','#D93B3B']];
  const P=(ang,rad)=>[cx+rad*Math.cos(ang*Math.PI/180), cy+rad*Math.sin(ang*Math.PI/180)];
  const arc=(f0,f1,rI,rO)=>{ const s0=a0+(a1-a0)*f0, s1=a0+(a1-a0)*f1;
    const [x0,y0]=P(s0,rO),[x1,y1]=P(s1,rO),[x2,y2]=P(s1,rI),[x3,y3]=P(s0,rI);
    const lg=(s1-s0)>180?1:0;
    return `M${x0},${y0} A${rO},${rO} 0 ${lg} 1 ${x1},${y1} L${x2},${y2} A${rI},${rI} 0 ${lg} 0 ${x3},${y3} Z`; };
  let html='';
  zones.forEach(z=>{ html+=`<path d="${arc(z[0],z[1],r1,r2)}" fill="${z[3]}22" stroke="${z[3]}" stroke-width="1.4"/>`;
    const mid=a0+(a1-a0)*(z[0]+z[1])/2, [tx,ty]=P(mid,r2+14);
    html+=`<text x="${tx}" y="${ty}" fill="#D7DEE8" font-size="8.5" font-weight="800" text-anchor="middle" letter-spacing=".08em">${z[2]}</text>`;});
  html+=`<path data-r="tgt" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".9"/>`;
  html+=`<line data-r="needle" x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy-r1+6}" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>`;
  html+=`<circle cx="${cx}" cy="${cy}" r="9" fill="#D7DEE8"/>`;
  svg.innerHTML=html;
  const tgt=svg.querySelector('[data-r=tgt]'), needle=svg.querySelector('[data-r=needle]');
  const arcLine=(f0,f1,rad)=>{ const s0=a0+(a1-a0)*f0, s1=a0+(a1-a0)*f1;
    const [x0,y0]=P(s0,rad),[x1,y1]=P(s1,rad); return `M${x0},${y0} A${rad},${rad} 0 0 1 ${x1},${y1}`; };
  let shownPace=SIM.pace;
  return { update(){
    shownPace=lerp(shownPace,SIM.pace,.12);
    const ang=a0+(a1-a0)*clamp(shownPace,0,1);
    const [nx,ny]=P(ang,r1-4);
    needle.setAttribute('x2',nx); needle.setAttribute('y2',ny);
    tgt.setAttribute('d',arcLine(SIM.paceTarget[0],SIM.paceTarget[1],(r1+r2)/2));
    ph.textContent='PHASE · '+SIM.phase;
    const inT=shownPace>=SIM.paceTarget[0]&&shownPace<=SIM.paceTarget[1];
    let t='HOLD PACE',c='ok';
    if(shownPace>SIM.paceTarget[1]+.02){t='SLOW DOWN';c=shownPace>.8?'bad':'warn';}
    else if(shownPace<SIM.paceTarget[0]-.02){t='PICK IT UP';c='warn';}
    corr.textContent=t; corr.className='corr '+c; corr.style.fontSize='22px';
    tgt.setAttribute('stroke', inT? 'var(--ok)':'#FFFFFF');
  }};
}

/* ---- 5 · CADENCE — phrase-spacing rail vs even-grid ghost ---- */
function cadenceRail(el){
  el.innerHTML=`
  <div class="inst">
    <div class="irow"><span class="ititle">CADENCE</span><span class="istate" data-r="st"></span></div>
    <div data-r="rail" style="flex:1; position:relative; background:#12161f; border:1px solid var(--line); border-radius:8px; margin:12px 0; overflow:hidden;"></div>
    <div class="corr" data-r="corr" style="font-size:20px;">NATURAL RHYTHM</div>
  </div>`;
  const rail=el.querySelector('[data-r=rail]'), corr=el.querySelector('[data-r=corr]'), st=el.querySelector('[data-r=st]');
  return { update(now){
    const W=rail.clientWidth, H=rail.clientHeight;
    let html='';
    for(let i=0;i<12;i++){ const gx=(i/12)*100;
      html+=`<div style="position:absolute; left:${gx}%; top:0; bottom:0; width:1px; background:#232b3a;"></div>`; }
    const mode=SIM.cad; let x=4; let i=0;
    const scroll=(now*26)%60;
    x-=scroll;
    while(x<W){
      let w,gap;
      if(mode==='EVEN'){ w=44; gap=16; }
      else if(mode==='NATURAL'){ w=30+((i*37)%42); gap=8+((i*23)%26); }
      else { w=8+((i*61)%74); gap=2+((i*47)%52); }
      const onGrid = mode==='EVEN';
      html+=`<div style="position:absolute; left:${x}px; top:26%; height:48%; width:${w}px; border-radius:5px;
        background:${onGrid?'#7a5c17':'#2E6BE6'}; opacity:.92;"></div>`;
      x+=w+gap; i++;
    }
    rail.innerHTML=html;
    if(mode==='EVEN'){ corr.textContent='TOO EVEN — BREAK THE RHYTHM'; corr.className='corr warn';
      st.textContent='OVER-REGULAR DELIVERY PATTERN'; st.style.color='var(--warn)'; }
    else if(mode==='CHAOTIC'){ corr.textContent='UNEVEN — FIND A PATTERN'; corr.className='corr bad';
      st.textContent='SPACING CHAOTIC'; st.style.color='var(--bad)'; }
    else { corr.textContent='NATURAL RHYTHM'; corr.className='corr ok';
      st.textContent='HEALTHY IRREGULARITY'; st.style.color='var(--ok)'; }
    corr.style.fontSize='20px';
  }};
}

  let lastT='GOOD — HOLD', lastSwitch=0;

      html+=corner('top:12px; left:12px','VOICE',states[0]&&states[1],SIM.level*100);
      html+=corner('top:12px; right:12px','PACE',states[2],SIM.pace*100);
      html+=corner('bottom:12px; left:12px','HANDS',states[3],states[3]?82:30);
      html+=corner('bottom:12px; right:12px','FRAMING',states[4],states[4]?90:44);
      if(lvl==='COACHING') html+=bigCard();
    }
    if(hud==='HUD3'){
      const strip=(lbl,ok,active)=>`<div style="flex:${active?2.6:1}; background:${active?'#141b2b':'#0f141f'}; border:1px solid ${active?cc.c:'var(--line2)'}; border-radius:8px; padding:5px 8px; transition:flex .3s;">

/* ---- ADMIN — composite arithmetic inspector ---- */
function adminInspector(el){
  el.innerHTML=`
  <div style="position:absolute; inset:0; display:flex; gap:10px; padding:12px;">
    <div style="flex:1.4; display:flex; flex-direction:column; gap:6px;">
      <div style="font-size:9px; font-weight:800; letter-spacing:.12em; color:var(--neutral);">COMPOSITE ARITHMETIC — WHY THE MASTER MOVED (3472 §8.1)</div>
      <div data-r="math" style="flex:1; background:#0d1119; border:1px solid var(--line); border-radius:10px; padding:12px; font-family:ui-monospace,Menlo,monospace; font-size:11.5px; line-height:1.8; color:var(--ink2);"></div>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
      <div style="font-size:9px; font-weight:800; letter-spacing:.12em; color:var(--neutral);">DETECTOR STATE · THRESHOLDS EXPOSED [CALIBRATE]</div>
      <div data-r="det" style="flex:1; background:#0d1119; border:1px solid var(--line); border-radius:10px; padding:10px; font-size:10px; overflow:auto;"></div>
    </div>
  </div>`;
  const math=el.querySelector('[data-r=math]'), det=el.querySelector('[data-r=det]');
  return { update(){
    const c=SIM.vvContrib, res=compositeMaster(c);
    math.innerHTML=
`VOCAL VARIETY (master)
 contributors  ${Object.entries(c).map(([k,v])=>`\n   ${k.padEnd(20,' ')} ${String(Math.round(v)).padStart(3)}`).join('')}
 mean          ${res.mean.toFixed(1)}
 weakest       ${Math.round(res.weakest)}  ← <span style="color:var(--warn)">${res.limiting}</span>
 cap           min(mean, weakest + 15) = ${res.raw.toFixed(1)}
 bucket(5)     <b style="color:${res.master>=80?'var(--ok)':'var(--warn)'}; font-size:15px;">${res.master}</b>
 rule          three strong contributors can never hide one weak one`;
    const rows=[['audio.dbfs','OK',.97],['voice.levelSpread','OK',.91],['voice.f0',SIM.pitchAvail?'OK':'UNAVAILABLE',SIM.pitchAvail?.84:0],
      ['speech.rate','OK',.78],['cadence.intervals','OK',.72],['hands.L','OK',.93],['hands.R',SIM.hands.R.vis?'OK':'UNAVAILABLE',SIM.hands.R.vis?.9:0],
      ['face.box','OK',.96],['phase.contract','MANUAL',.5]];
    det.innerHTML=rows.map(r=>`<div style="display:flex; justify-content:space-between; padding:3px 2px; border-bottom:1px solid #161c28;">
      <span style="font-family:ui-monospace,monospace; color:var(--neutral);">${r[0]}</span>
      <span style="font-weight:800; color:${r[1]==='OK'?'var(--ok)':r[1]==='MANUAL'?'var(--info)':'var(--warn)'};">${r[1]} · ${r[2]?r[2].toFixed(2):'—'}</span></div>`).join('');
  }};
}

{fid:'CD', name:'26 · DELIVERY CONGRUENCE', b:['t','l72','71C'],

 options:[
  {id:'CDLOCK', name:'Aligned Channel Lanes — live convergence', star:1, wide:1, demo:congruenceLanes, th:'tall', noselect:1,

{group:'FINGERPRINT & OPPORTUNITIES'},

 note:'The strongest product idea in the brief, with direct experimental license (gesture space contracts under status pressure — replicated across two languages). Framed as <b>"this is your range — you have more than you are using"</b>, never "you are nervous." Baseline capture is unscored, instrument-free, 60–90s of casual storytelling; baselines expire at 90 days.',

{fid:'GO', name:'SEMANTIC GESTURE OPPORTUNITIES', b:['t','n'],
 note:'Post/Film-Room only, ≤4 per answer, labeled <b>GESTURE OPPORTUNITY</b>, never "MISSED", never a live penalty, never a score input. Flagship case: transcript announces "three things…", no enumeration detected → clickable marker replays the exact moment. Fairness gate: ships only above an ASR word-error-rate threshold.',
 options:[
  {id:'GO1', name:'Timeline Opportunity Chips', star:1, desc:'Amber chips on the Film Room OPPORTUNITIES lane; click → seek −2s, transcript line + hand lanes shown together; Mentor decides whether enumeration would have helped.', thumb:T.lanes(4)},
  {id:'GO2', name:'Post-Answer Card Stack', desc:'Up to 3 opportunity cards after the answer, swipeable, each with a replay chip. Faster loop; competes with the one-thing-to-fix card.', thumb:T.cards(['OPP · ENUM 00:47','OPP · CONTRAST 01:12','OPP · EMPHASIS 01:44'],0)},
  {id:'GO3', name:'Mentor Queue', desc:'Opportunities land in the Mentor\'s queue only; the Mentor forwards the ones worth teaching. Maximum pedagogy control, slower feedback.', thumb:T.rows([{f:1,l:'MENTOR REVIEW QUEUE (3)',r:3}])},
  {id:'GO4', name:'Micro-Mission Generator', desc:'Each accepted opportunity becomes a 90-second drill ("rebuild that answer\'s list with enumeration"). Closes the loop from evidence to practice.', thumb:T.steps(['OPPORTUNITY','REPLAY','90s MISSION'])},
 ]},
{group:'FILM ROOM & REVIEW'},
{fid:'FILM', name:'31 · FILM ROOM', b:['t','l72','n'],
 note:'Flagship. Evidence, not verdict: every claim clickable to its source frame; the COVERAGE lane is mandatory; a gap never renders like a measured zero. The live demo answers WHEN · WHAT ELSE · WHERE TO CLICK on one shared clock — including the 9s PITCH — UNAVAILABLE outage and the R-hand loss.',
 options:[
  {id:'FILMLOCK', name:'FILM1 — Theater (Threadline Flight Recorder)', star:1, wide:1, demo:filmRoom, th:'xl', noselect:1,

  {id:'FILM2', name:'Split Court', desc:'Video left, vertical lane stack right — reads like a chart review. Better for long answers; weaker shared-clock feel.', thumb:T.cols([{f:1,l:'VIDEO'},{f:1,l:'LANES',r:6}])},
  {id:'FILM3', name:'Broadcast Booth', desc:'Big video, lower-third lanes, commentary-style coaching cards. Most cinematic; fewest simultaneous lanes.', thumb:T.rows([{f:1.6,l:'VIDEO'},{f:.6,l:'LOWER-THIRD LANES'}])},
  {id:'FILM4', name:'Evidence Desk', desc:'Chips-first: a sortable table of every event; video is the sidecar. Mentor/Admin power view.', thumb:T.cols([{f:1.4,l:'EVENT TABLE',r:5},{f:.8,l:'VIDEO'}])},
  {id:'FILM5', name:'Compare Room', desc:'Before/after synchronized playback of the same question, tracks phase-aligned. The improvement-proof machine; pairs with Personal Best.', thumb:T.cols([{f:1,l:'ATTEMPT 1'},{f:1,l:'ATTEMPT 2 · +VOL VAR'}])},

  {id:'AR1', name:'Moment Stack', star:1, desc:'WORKED (green, evidence chip) · FIX (amber, evidence chip) · NEXT. Delivery note from the arbiter\'s history; structure note from SAF(e) coaching. Ships in Wave 0.', thumb:T.rows([{f:1,l:'✔ WORKED — pace held through the story · 00:34',s:'border-color:#1d5230;'},{f:1,l:'△ FIX — volume variation collapsed in CLOSE · 01:41',s:'border-color:#5a4310;'},{f:.6,l:'NEXT QUESTION →'}])},

 ]},

   ============================================================ */
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{store.set(k,v);}catch(e){}}};
const SEL = JSON.parse(store.get('ivprep3490sel')||'{}');
const DISPO = JSON.parse(store.get('ivprep3490dis')||'{}');
const NORTH = {NAV:'NAV2',HOME:'HOME1',MODE:'MODE2',BTN:'BTN1',WIZ:'WIZ2',CHK:'CHK1',PREP:'PREP2',CTRL:'CTRL1',SELF:'SELF2',
 STAGE:'STAGE2',KELLY:'KELLY2',HUD:'HUD5',COACH:'COACH1',VV:'VVLOCK',VD:'VD1',VP:'VPLOCK',VC:'VCLOCK',VR:'VRLOCK',PP:'PP1',
 GZ:'GZLOCK',GH:'GH3',GS:'GS5',FF:'FFLOCK',MC:'MC2',GE:'GELOCK',CW:'CW4',CC:'CC4',CR:'CR1',CB:'CBLOCK',WX:'WXLOCK',
 CD:'CDLOCK',CM:'CM3',CT:'CT3',NG:'NGLOCK',GO:'GO1',FILM:'FILMLOCK',TM:'TM1',NLS:'NLS1',AR:'AR1',SR:'SR2',RES:'RES1',
 PB:'PB1',BEST:'BEST2',PRG:'PRG2',MEN:'MENLOCK',ADM:'ADMLOCK',EVD:'EVD1',ERR:'ERR1',TIER:'TIER2',VLT:'VLT1',SFG:'SFG1',SET:'SET1',MOB:'MOB1'};
const BADGES={v:'<span class="badge verified">WIREABLE NOW</span>', t:'<span class="badge target">TARGET</span>',
 l72:'<span class="badge lock72">3472 LOCK</span>', '71C':'<span class="badge lock72">3471C IDs</span>', n:'<span class="badge newid">NEW IDs · 3490</span>'};
const main=document.getElementById('main'), nav=document.getElementById('nav');

function heroHTML(){
 return `

  <div style="display:flex; gap:8px; margin-bottom:10px;"><span class="badge lock72">FABLE NORTH STAR</span><span class="badge verified">RUN 1</span><span class="badge target">AWAITING FOUNDER SELECTIONS</span></div>
  <h1>IV PREP ON-CALL — <b>the complete product, visible</b></h1>
  <p>Epic-grade training engine around an Apple-grade interview moment. Everything below is selectable by ID; the gold ★ cards are Fable's recommended composite, honoring the <b>3471C signal contract</b> and the <b>3472 instrument grammar lock</b>. Global controls (top right) switch <b>DENSITY / ROLE / STATE</b> everywhere. Scenario buttons below drive live telemetry through every instrument on this page.</p>
  <div id="scen">
    <button data-scen="IDLE" class="on">FREE RUN</button>

    <button data-scen="S3">S3 · HAND LOST → COVERAGE</button>
    <button data-scen="S4">S4 · LOUD MONOTONE</button>
    <button data-scen="S5">S5 · METRONOMIC CADENCE</button>
    <button data-scen="SVV">CONTRIB → MASTER</button>
    <button data-scen="SB">B · WARM / LOW AUTH-CUE</button>
    <button data-scen="SC">C · POLISHED / COLD-CUE</button>
    <button data-scen="SD">D · NATURAL VS INTERVIEW</button>
    <button data-scen="SE">E · CONGRUENCE BEATS</button>
  </div>
  <div class="picks">${Object.entries(NORTH).map(([f,id])=>`<span class="pickchip">${f} <b>${id.replace('LOCK','★')}</b></span>`).join('')}</div>
  <div class="note blue" style="margin-top:14px;">CURRENTLY VERIFIED vs TARGET is badged per family. Runtime truth: shell WORKING · Dr Kelly PARTIAL (appeared + audible once, no natural initiation) · human QA loop NOT VERIFIED · Delivery Intelligence PARTIAL · production BLOCKED. Nothing here initiates provider sessions.</div>
 </div>
 <div class="grid2" id="maps">
  <div class="mapbox"><h3>STUDENT LOOP</h3><div class="flow">
    ${[['ARRIVE','home shows ONE next action from your weakest contributor'],
       ['MODE GATE','Quick Rep · Guided · Delivery Training · Simulation · Baseline — contracts on the door'],
       ['SETUP + CHECK','three decisions · Camera Dock + voice corridor gate (20s)'],
       ['PREP','quiet room · SAF(e) ghost · breath cadence · Dr Kelly idle'],
       ['ANSWER','Simulation: zero HUD · Training: one correction, tuner law, earned lock states'],
       ['POST-ANSWER','10s card: 1 worked · 1 fix · replay chip'],

       ['FILM ROOM','flight recorder · opportunities · fingerprint overlay · personal-best shadow'],
       ['NEXT REP','90-second micro-mission → back to ARRIVE']]
      .map((s,i)=>`<div class="fstep"><span class="n">${i+1}</span><div>${s[0]} — <small>${s[1]}</small></div></div>`).join('')}
  </div></div>
  <div class="mapbox"><h3>MENTOR / ADMIN LOOP</h3><div class="flow">
    ${[['SELECT STUDENT','roster with mastery grid + last-session deltas'],
       ['OBSERVE LIVE','private instrument rail — never mirrored to the student'],

       ['TEACH THIS MOMENT','exact frame span + all lanes + voice note → lesson chip in student prep'],
       ['ASSIGN','90-second micro-mission targeted at the limiting contributor'],
       ['INSPECT','composite arithmetic · thresholds [CALIBRATE] · confidence · coverage · evidence seeks'],
       ['VALIDATE','human-validation workbench tunes weights before any composite ships']]
      .map((s,i)=>`<div class="fstep alt"><span class="n">${i+1}</span><div>${s[0]} — <small>${s[1]}</small></div></div>`).join('')}
  </div></div>
 </div>
 <div class="mapbox" id="gap" style="margin:16px 0 40px;"><h3>CURRENT vs TARGET (honest strip)</h3>
  <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px; font-size:11px;">
   ${[['Shell / nav / modes','WORKING — wire selections now','verified'],
      ['Voice level / waveform / framing / hand presence','ACCEPTED PRIMITIVES — Wave 0','verified'],
      ['Volume variation · pace · heat/trails · Film lanes','DERIVATION — Wave 1','target'],
      ['Pitch/F0 · cadence truth · phases · composites · semantics · NL search','NEW ENGINEERING — Wave 2','target'],
      ['Dr Kelly avatar','PARTIAL — human QA loop required, Founder-initiated only','target'],
      ['SAF(e) pedagogy','EXISTING — stays qualitative, never a number','verified']]
    .map(r=>`<div style="background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:8px 10px;"><b style="font-size:11px;">${r[0]}</b><br><span class="badge ${r[2]}" style="margin-top:4px; display:inline-block;">${r[1]}</span></div>`).join('')}
  </div></div>`;
}

function render(){
 let mhtml=heroHTML();
 let nhtml=`<h4>START</h4><a href="#northstar">North Star + Scenarios</a><a href="#maps">Experience Maps</a><a href="#gap">Current vs Target</a><a href="#sheet">Selection Sheet</a>`;
 CATALOG.forEach(entry=>{
  if(entry.group){ nhtml+=`<h4>${entry.group}</h4>`; return; }
  nhtml+=`<a href="#f-${entry.fid}" data-nav="${entry.fid}">${entry.fid} · ${entry.name.replace(/^\d+[+·\d]* · /,'').slice(0,22)}<span class="pick" data-navpick="${entry.fid}"></span></a>`;
  mhtml+=`<section class="fam" id="f-${entry.fid}">
   <div class="famhead"><span class="fid">${entry.fid}</span><h2>${entry.name}</h2>${(entry.b||[]).map(b=>BADGES[b]).join(' ')}</div>
   ${entry.note?`<div class="famnote">${entry.note}</div>`:''}
   <div class="opts">
   ${entry.options.map(o=>`
    <div class="opt ${o.wide?'wide':''}" data-fam="${entry.fid}" data-oid="${o.id}">
      <div class="opthead"><span class="optid">${o.id}</span><h3>${o.name}</h3>${o.star?'<span style="color:var(--gold); font-size:15px;">★</span>':''}${o.badge==='71C'?'<span class="badge lock72" style="font-size:8px;">3471C</span>':''}</div>
      ${o.demo?`<div class="thumb ${o.th||''}" data-demo="1"></div>`: o.thumb?`<div class="thumb">${o.thumb}</div>`:''}
      <div class="optdesc">${o.desc}</div>
      <div class="optfoot">
        <button class="selbtn" data-select>SELECT ${o.id}</button>
        <select class="dispo" data-dispo>
          <option value="">— DISPOSITION —</option>
          <option>LOCK</option><option>KEEP AS BASE</option><option>REFINE</option>
          <option>REJECT</option><option>COMBINE</option><option>SHOW MORE LIKE</option>
        </select>
      </div>
    </div>`).join('')}
   </div></section>`;
 });
 mhtml+=`<section class="fam" id="sheet">
  <div class="famhead"><span class="fid">SHEET</span><h2>FOUNDER SELECTION SHEET</h2></div>
  <div class="famnote">Click SELECT on one option per family (or press <b>LOAD FABLE ★</b> in the tray to preload the North Star composite), add dispositions (3471C ledger vocabulary: LOCK · KEEP AS BASE · REFINE · REJECT · COMBINE · SHOW MORE LIKE), then COPY SELECTION SHEET and paste the result back into the ticket. For COMBINE, use: BASE &lt;ID&gt; + DONOR &lt;ID&gt; + TRANSPLANT &lt;mechanic&gt; + PRESERVE &lt;mechanic&gt;.</div>
  <div class="note">Run 2 contract: your selections + specific corrections → FINAL FROZEN DESIGN SYSTEM + FINAL PROTOTYPE + BUILD CONTRACT. No re-architecture.</div>
 </section>`;
 main.innerHTML=mhtml;
 nav.innerHTML=nhtml;

 /* mount demos */
 document.querySelectorAll('.opt').forEach(card=>{
  const fam=card.dataset.fam, oid=card.dataset.oid;
  const entry=CATALOG.find(f=>f.fid===fam), opt=entry.options.find(o=>o.id===oid);
  if(opt.demo){ mountDemo(card.querySelector('[data-demo]'), opt.demo); }
  card.querySelector('[data-select]').addEventListener('click',()=>{ pick(fam,oid); });
  const d=card.querySelector('[data-dispo]');
  d.value=DISPO[oid]||'';
  d.addEventListener('change',()=>{ DISPO[oid]=d.value; store.set('ivprep3490dis',JSON.stringify(DISPO)); refreshTray(); });
 });
 document.querySelectorAll('#scen button').forEach(b=>b.addEventListener('click',()=>setScenario(b.dataset.scen)));
 refreshTray();
}
function pick(fam,oid){
 if(SEL[fam]===oid) delete SEL[fam]; else SEL[fam]=oid;
 store.set('ivprep3490sel',JSON.stringify(SEL));
 refreshTray();
}
function refreshTray(){
 document.querySelectorAll('.opt').forEach(c=>c.classList.toggle('selected', SEL[c.dataset.fam]===c.dataset.oid));
 document.querySelectorAll('[data-navpick]').forEach(n=>{ n.textContent=SEL[n.dataset.navpick]||''; });
 const body=document.getElementById('traybody');
 const ks=Object.keys(SEL);
 document.getElementById('trayCount').textContent=ks.length+' PICKED';
 body.innerHTML= ks.length? ks.map(f=>`<div class="trow"><span>${f}</span><b>${SEL[f]}${DISPO[SEL[f]]?' · '+DISPO[SEL[f]]:''}</b></div>`).join('')
  : '<div style="color:var(--neutral); padding:6px 0;">No selections yet. SELECT options, or LOAD FABLE ★ to start from the recommended composite.</div>';
}
function loadNorthStar(){ Object.assign(SEL,NORTH); store.set('ivprep3490sel',JSON.stringify(SEL)); refreshTray(); }
function copySelections(){
 const lines=['Y1-Y2-CAM-V6-3490 — FOUNDER SELECTION SHEET','DATE: '+new Date().toISOString().slice(0,10),''];
 CATALOG.filter(f=>f.fid).forEach(f=>{
  const id=SEL[f.fid]; lines.push(`${f.fid.padEnd(6)} ${ (id||'—').padEnd(10) } ${id&&DISPO[id]?DISPO[id]:''}`.trimEnd());
 });
 const txt=lines.join('\n');
 (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(
  ()=>{ document.getElementById('trayCount').textContent='COPIED ✓'; setTimeout(refreshTray,1500); },
  ()=>{ prompt('Copy your selection sheet:',txt); });
}
let trayOpen=true;
function toggleTray(){ trayOpen=!trayOpen;
 document.getElementById('traybody').style.display=trayOpen?'block':'none';
 document.getElementById('trayfoot').style.display=trayOpen?'flex':'none';}

/* ---------- MAIN LOOP ---------- */
document.body.dataset.density='STANDARD'; document.body.dataset.role='STUDENT'; document.body.dataset.state='LIVE';
render();
let last=performance.now()/1000;
function loop(){
 const now=performance.now()/1000, dt=Math.min(.05,now-last); last=now;
 SIM.t=now;
 (SCEN[SIM.scenario]||SCEN.IDLE)(now-scenStart);
 for(const inst of MOUNTED){ try{ inst.update(now,dt); }catch(e){} }
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
