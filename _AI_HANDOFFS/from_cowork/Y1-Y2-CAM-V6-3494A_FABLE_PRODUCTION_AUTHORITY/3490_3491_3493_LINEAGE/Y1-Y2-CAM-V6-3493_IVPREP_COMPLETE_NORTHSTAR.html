function capMaster(obj,avail){
 const es=Object.entries(obj).filter(([k])=>!avail||avail[k]!==false);
 const vals=es.map(([,v])=>v); if(!vals.length)return{master:0,cov:0,tot:Object.keys(obj).length,limiting:null,raw:0,mean:0,weak:0};
 const mean=vals.reduce((a,b)=>a+b,0)/vals.length, weak=Math.min(...vals);
 const raw=Math.min(mean,weak+15), master=Math.round(raw/5)*5;
 let limiting=null; es.forEach(([k,v])=>{if(v===weak)limiting=k;});
 return{master,raw,mean,weak,limiting,cov:vals.length,tot:Object.keys(obj).length};
}

   <div class="cap" style="margin:4px 0 16px;">STORIES HYDRATE ANSWERS · ANSWERS SEND PERFORMANCE EVIDENCE BACK — TWO-WAY, ALWAYS STUDENT-CHOSEN</div>
   <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
    ${STORIES.map(s=>`<div class="card" style="padding:14px 16px;"><div class="accent"></div>
      <div class="it" style="font-size:15px;">⚡ ${s.n}</div>
      <div class="cap" style="margin-top:8px;">USED IN</div>
      <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:4px;">${s.used.map(u=>`<span class="lawchip">${u}</span>`).join('')||'<span class="cap">—</span>'}</div>

        <button class="btnB" style="font-size:9px; padding:5px 10px; margin-left:auto;" onclick="go('filmroom')"><span>EVIDENCE ▸</span></button>

      <div class="cap" style="margin-top:8px; text-transform:none; letter-spacing:.03em; color:var(--dim);">StoryForge will display this as INTERVIEW PERFORMANCE HISTORY.</div>

   </div>
   <div class="card" style="margin-top:14px; padding:14px 16px;">
     <div class="cap" style="color:var(--gold);">IN PREP — HYDRATION EXAMPLE</div>
     <div style="margin-top:6px; font-size:12.5px; color:var(--ink2); font-weight:600;">Q: "Tell me about a time you disagreed with a supervisor." → candidates: <b>ICU HANDOVER · NIGHT FLOAT CONFLICT</b> → <span class="lawchip" style="color:var(--gold);">USE THIS STORY</span> <span class="lawchip">REMIND ME</span> <span class="lawchip" style="color:var(--dim);">IGNORE</span></div>
   </div>
  </div>`;},
};

const navEl=document.getElementById('navlist');
NAVDEF.forEach(([g,items])=>{navEl.insertAdjacentHTML('beforeend',`<h5>${g}</h5>`+items.map(i=>
 `<div class="navitem" data-pg="${i[0]}"><span class="ic">${i[1]}</span>${i[2]}</div>`).join(''));});
navEl.querySelectorAll('.navitem').forEach(n=>n.addEventListener('click',()=>go(n.dataset.pg)));
document.getElementById('scendock').insertAdjacentHTML('beforeend',
 SCENL.map(([k,l])=>`<button class="scen ${k==='IDLE'?'on':''}" data-s="${k}"><span>${l}</span></button>`).join(''));
document.querySelectorAll('#scendock .scen').forEach(b=>b.addEventListener('click',()=>setScen(b.dataset.s)));
document.querySelectorAll('#roleseg button').forEach(b=>b.addEventListener('click',()=>{
 document.querySelectorAll('#roleseg button').forEach(x=>x.classList.toggle('on',x===b));
 if(b.dataset.role==='MENTOR')go('mentorreview'); if(b.dataset.role==='ADMIN')go('admin');}));
go('home');
let last=performance.now()/1000;
(function loop(){
 const now=performance.now()/1000, dt=Math.min(.05,now-last); last=now;
 SIM.t=now;
 (SCEN[SIM.scenario]||SCEN.IDLE)(now-scenStart);
 (LIVE[CUR]||[]).forEach(i=>{try{i.update(now,dt);}catch(e){}});
 requestAnimationFrame(loop);
})();
</script>
