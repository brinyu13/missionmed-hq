<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>IV PREP ON-CALL — AAA VISUAL SHOWROOM · Y1-Y2-CAM-V6-3491 · RUN 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,600;0,700;0,900;1,600;1,700;1,800;1,900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* MISSIONMED PERFORMANCE ENGINE — StoryForge DNA */
  --bg:#080C17; --bg2:#0B1020;
  --p0:#0E1425; --p1:#121A30; --p2:#16203C; --p3:#1B2748;
  --line:#242F52; --line2:#31407009; --edge:#31406F;
  --ink:#FFFFFF; --ink2:#CBD5EE; --dim:#7E8AAC;
  --org:#FF8A1E; --org2:#FF9D2E; --gold:#FFC24B; --cream:#F7EFD8;
  --ok:#2FBF63; --warn:#FFA928; --bad:#E5484D; --info:#4D7CFE; --vio:#8B7CF7;
  --grad:linear-gradient(92deg,#FF8A1E 0%,#FFC24B 100%);
  --f:'Archivo',-apple-system,'Segoe UI',sans-serif;
  --fm:'Space Grotesk',ui-monospace,monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{ background:
  radial-gradient(140% 90% at 80% -10%, #131C38 0%, transparent 55%),
  repeating-linear-gradient(115deg, transparent 0 140px, #FFFFFF04 140px 141px),
  var(--bg);
  color:var(--ink); font-family:var(--f); font-size:15px; line-height:1.45; overflow-x:hidden;}
::selection{background:#FF8A1E55;}
/* ====== TYPE ====== */
.hero-t{font-weight:900; font-style:italic; text-transform:uppercase; letter-spacing:.005em; line-height:.95;}
.kicker{font-weight:800; font-style:italic; text-transform:uppercase; letter-spacing:.22em; font-size:11px; color:var(--org2);}
.microcap{font-weight:700; text-transform:uppercase; letter-spacing:.18em; font-size:9.5px; color:var(--dim);}
.gradtxt{background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
/* ====== CHAMFER / PLATES ====== */
.cham{clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);}
.cham-s{clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);}
.idplate{
  display:inline-flex; align-items:center; justify-content:center;
  background:var(--grad); color:#131313;
  font-weight:900; font-style:italic; font-size:20px; letter-spacing:.02em;
  padding:8px 20px; transform:skewX(-10deg);
  box-shadow:0 6px 0 #00000066, 0 0 0 1px #FFB84744;
}
.idplate>span{transform:skewX(10deg); display:block;}
.tagbox{
  border:2px solid var(--gold); color:var(--gold);
  font-weight:800; font-style:italic; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  padding:7px 12px; text-align:center; line-height:1.35; background:#151004AA;
}
.slant{transform:skewX(-8deg);} .slant>*{transform:skewX(8deg); display:block;}
.btnA{
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
  background:var(--grad); color:#131313; border:0; font-family:var(--f);
  font-weight:900; font-style:italic; text-transform:uppercase; letter-spacing:.08em; font-size:13px;
  padding:12px 26px; transform:skewX(-8deg);
  box-shadow:0 5px 0 #7A4207, 0 10px 26px #FF8A1E33; transition:transform .1s, box-shadow .1s, filter .15s;
}
.btnA>span{transform:skewX(8deg); display:block;}
.btnA:hover{filter:brightness(1.08);}
.btnA:active{transform:skewX(-8deg) translateY(4px); box-shadow:0 1px 0 #7A4207;}
.btnB{
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
  background:#121A30; color:var(--ink2); border:1px solid var(--edge); font-family:var(--f);
  font-weight:800; font-style:italic; text-transform:uppercase; letter-spacing:.08em; font-size:12px;
  padding:11px 20px; transform:skewX(-8deg); transition:all .12s;
}
.btnB>span{transform:skewX(8deg); display:block;}
.btnB:hover{border-color:var(--gold); color:var(--gold);}
.btnB.on{background:var(--grad); color:#131313; border-color:transparent; box-shadow:0 4px 0 #7A4207;}
.btnB.danger:hover{border-color:var(--bad); color:var(--bad);}
/* ====== LAW STRIP ====== */
#law{position:fixed; inset:0 0 auto 0; z-index:200; display:flex; align-items:center; gap:14px;
  background:linear-gradient(180deg,#0B1122F2,#080C17E8); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line); padding:10px 20px;}
#law .logo{font-weight:900; font-style:italic; font-size:15px; letter-spacing:.02em; white-space:nowrap;}
#law .logo b{background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
#law .div{font-size:8.5px; letter-spacing:.3em; color:var(--dim); font-weight:700; margin-top:-2px;}
.lawchip{font-size:9px; letter-spacing:.14em; font-weight:800; color:var(--ink2);
  border:1px solid var(--edge); padding:4px 9px; white-space:nowrap; font-style:italic;}
.lawchip.hot{color:var(--warn); border-color:#6B4A12;}
#law .right{margin-left:auto; display:flex; gap:8px; align-items:center;}

#wrap{display:flex; padding-top:58px;}
#nav{width:264px; min-width:264px; position:sticky; top:58px; height:calc(100vh - 58px); overflow-y:auto;
  background:linear-gradient(180deg,#0C1122,#0A0E1C); border-right:1px solid var(--line); padding:18px 0 140px;}
#nav h4{font-size:9px; letter-spacing:.24em; color:var(--dim); padding:18px 20px 8px; font-weight:800; font-style:italic;}
#nav a{display:block; position:relative; color:var(--ink2); text-decoration:none;
  font-weight:700; font-style:italic; font-size:12.5px; letter-spacing:.05em; text-transform:uppercase;
  padding:9px 18px 9px 24px; margin:2px 10px 2px 0;}
#nav a:hover{color:var(--gold);}
#nav a.cur{color:#131313; background:var(--grad);
  clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%); font-weight:900;}
#nav a .st{position:absolute; right:16px; top:9px; font-size:9px; color:inherit; opacity:.75;}
#main{flex:1; padding:30px 40px 260px; max-width:1240px; margin:0 auto;}
/* ====== FAMILY SECTIONS ====== */
section.fam{margin-bottom:90px; scroll-margin-top:76px;}
.famtop{display:flex; align-items:flex-end; gap:18px; margin-bottom:6px; flex-wrap:wrap;}
.famtop .kicker{margin-bottom:6px;}
.famtop h2{font-size:44px;}
.famnote{color:var(--dim); font-size:13.5px; max-width:900px; margin:10px 0 20px; font-weight:500;}
.famnote b{color:var(--ink2);}
/* ====== ARSENAL CANDIDATE (large, one at a time) ====== */
.arsenal{position:relative;}
.cand{
  background:linear-gradient(180deg,var(--p1),var(--p0));
  border:1px solid var(--edge); position:relative;
  box-shadow:0 30px 80px #00000088, inset 0 1px 0 #FFFFFF14;
}
.cand::before{content:''; position:absolute; top:0; left:0; right:0; height:8px; background:var(--grad);
  clip-path:polygon(0 0,100% 0,calc(100% - 40px) 100%,0 100%);}
.candhead{display:flex; align-items:center; gap:18px; padding:26px 26px 14px;}
.candhead .tt{flex:1;}
.candhead .tt h3{font-weight:900; font-style:italic; text-transform:uppercase; font-size:26px; line-height:1;}
.candhead .tt .sub{font-weight:800; font-style:italic; text-transform:uppercase; letter-spacing:.1em; font-size:13px; color:var(--gold); margin-top:4px;}
.screen{
  margin:8px 24px; height:440px; position:relative; overflow:hidden;
  background:
    linear-gradient(180deg,#0A0F20,#0B1226 60%,#0A0F20),
    var(--bg2);
  border:1px solid #1D2748; box-shadow:inset 0 0 60px #00000099, inset 0 2px 0 #00000066;
}
.screen .grid{position:absolute; inset:0; background:
  linear-gradient(#FFFFFF06 1px, transparent 1px) 0 0/100% 44px,
  linear-gradient(90deg,#FFFFFF06 1px, transparent 1px) 0 0/44px 100%; pointer-events:none;}
.simtag{position:absolute; top:14px; right:16px; font-weight:800; font-style:italic; font-size:10px;
  letter-spacing:.14em; color:var(--gold); z-index:6;}
.ctxtag{position:absolute; top:14px; left:16px; z-index:6;}
.verdict{
  position:absolute; left:22px; bottom:18px; z-index:6;
  font-weight:900; font-style:italic; text-transform:uppercase; line-height:.92;
  font-size:52px; letter-spacing:.01em; color:var(--ink);
  text-shadow:5px 5px 0 #00000090; pointer-events:none; transition:color .25s;
}
.verdict.small{font-size:34px;}
.verdict.ok{color:var(--ink);} .verdict.warn{color:var(--warn);} .verdict.bad{color:#FF6B70;} .verdict.gold{color:var(--gold);}
.targetchip{position:absolute; right:18px; bottom:22px; z-index:6; background:var(--cream); color:#171310;
  font-weight:900; font-style:italic; letter-spacing:.1em; font-size:13px; padding:8px 16px;}
.canddesc{padding:16px 26px 6px; color:var(--ink2); font-size:15px; font-weight:600; max-width:900px;}
.candfoot{display:flex; align-items:center; gap:12px; padding:16px 26px 24px; flex-wrap:wrap;}
.candfoot .microcap{margin-right:auto;}
.dispsel{background:#0D1428; color:var(--ink); border:1px solid var(--edge); font-family:var(--f);
  font-weight:800; font-style:italic; font-size:13px; letter-spacing:.06em; padding:12px 16px; min-width:190px; text-transform:uppercase;}
/* carousel controls */
.carrow{display:flex; align-items:center; gap:10px; margin:14px 0 10px; flex-wrap:wrap;}
.dots{display:flex; gap:6px; margin:0 6px;}
.dots i{width:26px; height:8px; background:#222D52; transform:skewX(-18deg); cursor:pointer; transition:background .15s;}
.dots i.on{background:var(--grad);}
.compare-wrap{display:grid; grid-template-columns:1fr; gap:18px;}
.compare-wrap.two{grid-template-columns:1fr 1fr;}
.compare-wrap.two .screen{height:340px;}
.compare-wrap.two .verdict{font-size:34px;}
.compare-wrap.two .candhead .tt h3{font-size:19px;}
/* ====== HERO ====== */
.hero{position:relative; padding:56px 40px 46px; margin-bottom:42px; overflow:hidden;
  background:linear-gradient(120deg,#101830 0%,#0B101F 55%,#0B101F);
  border:1px solid var(--edge); box-shadow:0 40px 120px #000A;}
.hero::after{content:''; position:absolute; right:-80px; top:-120px; width:420px; height:520px;
  background:var(--grad); opacity:.08; transform:rotate(18deg);}
.hero h1{font-size:74px;}
.hero .lead{color:var(--ink2); font-size:16px; font-weight:600; max-width:820px; margin-top:14px;}
.hero .lead b{color:var(--gold);}
/* scenario deck */
#scenbar{position:sticky; top:58px; z-index:90; display:flex; gap:8px; flex-wrap:wrap;
  background:#0A0F1EF0; border:1px solid var(--line); padding:10px 14px; margin:0 0 34px;
  backdrop-filter:blur(8px);}
#scenbar .microcap{align-self:center; margin-right:6px;}
.scen{background:#131B32; border:1px solid var(--edge); color:var(--ink2); cursor:pointer;
  font-family:var(--f); font-weight:800; font-style:italic; font-size:11px; letter-spacing:.08em;
  text-transform:uppercase; padding:8px 13px; transform:skewX(-8deg); transition:all .12s;}
.scen>span{display:block; transform:skewX(8deg);}
.scen.on{background:var(--grad); color:#131313; border-color:transparent; box-shadow:0 3px 0 #7A4207;}
/* ====== INSTRUMENT INTERNALS ====== */
.housing{position:absolute; inset:0; padding:56px 26px 84px;}
.recess{position:relative; background:#0A0E1E; border:1px solid #202A4E;
  box-shadow:inset 0 4px 18px #000C, inset 0 0 0 1px #00000055; height:100%;}
.corr-live{
  position:absolute; left:50%; transform:translateX(-50%) skewX(-8deg); bottom:84px; z-index:8;
  background:#0B0F1DEE; border:2px solid var(--warn); padding:10px 30px;
  font-weight:900; font-style:italic; font-size:26px; letter-spacing:.05em; color:var(--warn);
  text-transform:uppercase; box-shadow:0 14px 40px #000B; transition:border-color .2s,color .2s;
}
.corr-live>span{display:block; transform:skewX(8deg);}
.corr-live.ok{border-color:var(--ok); color:var(--ok);}
.corr-live.gold{border-color:var(--gold); color:var(--gold);}
@keyframes lockSnap{0%{transform:translateX(-50%) skewX(-8deg) scale(1.25); filter:brightness(1.6);}60%{transform:translateX(-50%) skewX(-8deg) scale(.96);}100%{transform:translateX(-50%) skewX(-8deg) scale(1);}}
.corr-live.snap{animation:lockSnap .45s ease-out;}
@keyframes toastIn{0%{opacity:0; transform:translateY(14px) skewX(-8deg);}12%{opacity:1; transform:translateY(0) skewX(-8deg);}80%{opacity:1;}100%{opacity:0; transform:translateY(-8px) skewX(-8deg);}}
.toast{position:absolute; top:18px; left:50%; transform:translateX(-50%) skewX(-8deg); z-index:9;
  background:var(--grad); color:#131313; font-weight:900; font-style:italic; text-transform:uppercase;
  font-size:14px; letter-spacing:.08em; padding:9px 22px; animation:toastIn 2.6s ease forwards; box-shadow:0 10px 30px #000A;}
.toast>span{display:block; transform:skewX(8deg);}
.unavail{
  background:repeating-linear-gradient(45deg,#241C08 0 10px,#191307 10px 20px);
  border:1px solid #6B4A12; color:var(--warn); font-weight:900; font-style:italic;
  letter-spacing:.12em; font-size:14px; text-transform:uppercase; padding:12px 18px; text-align:center;}
.segline{display:flex; gap:4px;}
.seg-i{flex:1; background:#1A2342; border:1px solid #232E55; transition:background .18s, box-shadow .18s;}
/* slot plates for five-slot chassis */
.slot{position:relative; background:linear-gradient(180deg,#18213E,#121A30); border:1px solid var(--edge);
  padding:10px 12px; cursor:pointer; transition:border-color .15s, transform .15s;}
.slot:hover{border-color:var(--gold);}
.slot .nm{font-weight:800; font-style:italic; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink2);}
.slot .vl{font-family:var(--fm); font-weight:700; font-size:22px; margin-top:2px;}
.slot .lockic{position:absolute; top:8px; right:9px; font-size:10px; color:var(--dim);}
.slot.locked{cursor:default;}
.slot.limiting{border-color:var(--warn); box-shadow:0 0 0 1px var(--warn), 0 8px 26px #FFA92822;}
@keyframes slotSwap{0%{transform:rotateX(90deg); opacity:0;}100%{transform:rotateX(0); opacity:1;}}
.slot.swap{animation:slotSwap .35s ease-out;}
/* radial loadout menu */
#loadout{position:fixed; z-index:400; display:none;}
#loadout .ring{position:relative; width:320px; height:320px;}
#loadout .opt{position:absolute; width:130px; padding:8px 10px; background:#101831F2; border:1px solid var(--gold);
  color:var(--ink); font-weight:800; font-style:italic; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase;
  cursor:pointer; text-align:center; transform:translate(-50%,-50%); transition:background .12s;}
#loadout .opt:hover{background:var(--grad); color:#131313;}
#loadout .core{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center;
  font-weight:900; font-style:italic; font-size:11px; color:var(--gold); text-transform:uppercase; letter-spacing:.1em;}
/* tracks (flight recorder) */
.trk{display:flex; align-items:stretch; border-bottom:1px solid #141C36; min-height:34px;}
.trkhead{width:210px; min-width:210px; display:flex; align-items:center; gap:8px; padding:0 10px;
  background:linear-gradient(90deg,#121A30,#0F1628); border-right:1px solid var(--line);}
.trkhead .nm{font-weight:800; font-style:italic; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink2); flex:1;}
.eye,.solo{width:22px; height:18px; border:1px solid var(--edge); background:#0D1428; color:var(--dim);
  font-size:9px; font-weight:900; display:flex; align-items:center; justify-content:center; cursor:pointer;}
.eye.on{color:var(--gold); border-color:#6B4A12;}
.solo.on{background:var(--grad); color:#131313; border-color:transparent;}
.trkbody{flex:1; position:relative; overflow:hidden;}
.trk.groupline{background:#0E1526;}
.trk.groupline .trkhead{background:linear-gradient(90deg,#1A2342,#141C36);}
.trk.hidden .trkbody{opacity:.12;}
.fchip{position:absolute; top:20%; transform:translateX(-6px); background:#101831; border:1.5px solid var(--gold);
  color:var(--gold); font-weight:800; font-style:italic; font-size:8.5px; letter-spacing:.04em; padding:2px 6px;
  cursor:pointer; white-space:nowrap; font-family:var(--f); text-transform:uppercase; z-index:4;}
.fchip:hover{background:var(--grad); color:#131313;}
/* trays */
#tray{position:fixed; right:20px; bottom:20px; z-index:300; width:340px; background:#0D1327F5;
  border:1px solid var(--edge); box-shadow:0 30px 90px #000C;}
#tray header{display:flex; align-items:center; padding:12px 16px; cursor:pointer; background:linear-gradient(90deg,#141C36,#0F1628);}
#tray header b{font-weight:900; font-style:italic; letter-spacing:.1em; font-size:12px; text-transform:uppercase;}
#tray header span{margin-left:auto; font-size:10px; color:var(--gold); font-weight:800; font-style:italic;}
#traybody{max-height:280px; overflow-y:auto; padding:10px 16px; font-size:11.5px;}
#traybody .trow{display:flex; justify-content:space-between; gap:8px; padding:3px 0; color:var(--ink2); font-weight:600;}
#traybody .trow b{color:var(--gold); font-style:italic;}
#trayfoot{display:flex; gap:8px; padding:12px 14px; border-top:1px solid var(--line);}
.viewing{position:fixed; left:20px; bottom:20px; z-index:300; background:#0D1327F0; border:1px solid var(--edge); padding:10px 14px;}
.viewing .microcap{margin-bottom:4px;}
.viewing .who{font-weight:900; font-style:italic; font-size:12px; letter-spacing:.06em;}
.viewing .who b{color:var(--gold);}
canvas{display:block;}
@media(max-width:1000px){#nav{display:none;} .hero h1{font-size:44px;} .famtop h2{font-size:30px;}}
</style>
</head>

  <div>
    <div class="logo">MISSIONMED<b>//IV PREP ON-CALL</b></div>

<script>
'use strict';
/* ============================================================
   Y1-Y2-CAM-V6-3491 — MISSIONMED PERFORMANCE ENGINE SHOWROOM
   Art-direction override run. Science preserved from 3471C/3472/3490.
   ============================================================ */
const lerp=(a,b,k)=>a+(b-a)*k, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const noise=(t,s)=>Math.sin(t*1.7+s)*.5+Math.sin(t*.63+s*2.7)*.35+Math.sin(t*3.1+s*.4)*.15;
/* ---------- SIM ---------- */
const SIM={scenario:'IDLE', phase:'OPEN',
  level:.58, p10:.48, p90:.68, clip:false,
  pitchAvail:true, pitchLo:-3.2, pitchHi:3.4, pitchCur:0,
  pace:.48, paceT:[.34,.62],
  cad:'NATURAL', rHand:true,
  hands:{L:{x:-.32,y:.30},R:{x:.30,y:.27}},
  frame:{cx:0,cy:0,size:1},
  warm:72, comp:74, congrBeat:false,
  vv:{'PITCH VARIATION':96,'VOLUME VARIATION':61,'PACE VARIATION':91,'CADENCE VARIATION':89}};
let scenStart=performance.now()/1000;
const restart=()=>{scenStart=performance.now()/1000;};
const SCEN={
 IDLE(t){ SIM.phase=['OPEN','ENUMERATE','PROVE-STORY','CLOSE'][Math.floor(t/9)%4];
  SIM.level=.58+noise(t,1)*.07; SIM.p10=SIM.level-.11+noise(t,9)*.02; SIM.p90=SIM.level+.11+noise(t,4)*.02;
  SIM.clip=false; SIM.pitchAvail=true; SIM.pitchLo=-3.4+noise(t,2); SIM.pitchHi=3.5+noise(t,5); SIM.pitchCur=noise(t*1.9,3)*3.4;
  SIM.pace=.5+noise(t,7)*.09;
  SIM.paceT= SIM.phase==='PROVE-STORY'?[.20,.50]: SIM.phase==='CLOSE'?[.55,.80]:[.34,.62];
  SIM.cad='NATURAL'; SIM.rHand=true;
  SIM.hands.L={x:-.30+noise(t,11)*.16,y:.26+noise(t,13)*.13};
  SIM.hands.R={x:.30+noise(t,17)*.18,y:.24+noise(t,19)*.15};
  SIM.frame={cx:noise(t,23)*.03,cy:noise(t,29)*.02,size:1+noise(t,31)*.03};

function capMaster(obj,avail){
 const es=Object.entries(obj).filter(([k])=>!avail||avail[k]!==false);
 const vals=es.map(([,v])=>v); if(!vals.length)return{master:0,cov:0,tot:Object.keys(obj).length,limiting:null};
 const mean=vals.reduce((a,b)=>a+b,0)/vals.length, weak=Math.min(...vals);
 const raw=Math.min(mean,weak+15), master=Math.round(raw/5)*5;
 let limiting=null; es.forEach(([k,v])=>{if(v===weak)limiting=k;});
 return{master,raw,mean,weak,limiting,cov:vals.length,tot:Object.keys(obj).length};
}

function metricValue(name,now){
 const base={'VOICE VARIATION':()=> (SIM.p90-SIM.p10)>=.10? 78+noise(now,2)*6 : 40,
  'VOLUME VARIATION':()=>SIM.vv['VOLUME VARIATION'],
  'PITCH VARIATION':()=>SIM.pitchAvail? clamp((SIM.pitchHi-SIM.pitchLo)/9*88,20,96):null,
  'PACE':()=> (SIM.pace>=SIM.paceT[0]&&SIM.pace<=SIM.paceT[1])? 84+noise(now,4)*5:52,
  'GESTURE SYNCHRONY':()=>SIM.congrBeat?92:74,
  'CAMERA PRESENCE':()=> Math.hypot(SIM.frame.cx,SIM.frame.cy)<.06? 88:60,
  'GESTURE RANGE':()=> SIM.rHand? 76+noise(now,8)*6 : null,
  'HANDS VISIBLE':()=> SIM.rHand?92:66};
 const f=base[name]; const v= f? f() : 70+noise(now,name.length)*9;
 return v===null?null:clamp(v,0,100);
}

const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
const SEL=JSON.parse(store.get('ivprep3491')||'{}');
const state={idx:{}, compare:{}};
const main=document.getElementById('main'), nav=document.getElementById('nav');
const SCENBTNS=[['IDLE','FREE RUN'],['QUIET','QUIET → RECOVERY'],['MONO','LOUD MONOTONE'],['FAST','PACE TOO FAST'],['METRO','METRONOMIC'],['HANDLOST','HAND LOST'],['SUPPRESS','NATURAL VS INTERVIEW'],['WARMHI','WARM-CUE HI'],['COMPHI','COMP-CUE HI'],['CONGR','CONGRUENCE BEATS'],['VVREC','VOL-VAR RECOVERY']];
function heroHTML(){
 return `<div class="hero">
  <div class="kicker">RUN 2 · ART-DIRECTION OVERRIDE · Y1-Y2-CAM-V6-3491</div>
  <h1 class="hero-t" style="margin-top:10px;">THE MISSIONMED<br><span class="gradtxt">PERFORMANCE ENGINE.</span></h1>
  <div class="lead">Same science — <b>3471C signal contracts, 3472 grammar, cap-by-weakest, coverage honesty, claim safety</b> — rebuilt in StoryForge’s universe: near-black navy, orange→gold energy, chamfered equipment housings, big italic verdicts, mechanical locks. Founder reassignments are law here: <b>VV4 → PITCH · VV5 → PACE · VV1+VV2+EKG → VOLUME</b>. Every candidate below is large, live, and driven by the scenario deck.</div>
  <div style="display:flex; gap:12px; margin-top:22px; flex-wrap:wrap;">
    <button class="btnA" onclick="document.getElementById('f-VOL').scrollIntoView({behavior:'smooth'})"><span>ENTER THE SHOWROOM</span></button>
    <button class="btnB" onclick="document.getElementById('f-FR').scrollIntoView({behavior:'smooth'})"><span>FLIGHT RECORDER</span></button>
  </div>
 </div>
 <div id="scenbar"><span class="microcap">SCENARIO DECK</span>
  ${SCENBTNS.map(([k,l])=>`<button class="scen ${k==='IDLE'?'on':''}" data-s="${k}"><span>${l}</span></button>`).join('')}
 </div>`;
}
function candHTML(fam,v,compact){
 return `<div class="cand" data-cand="${v.v}">
  <div class="candhead">
    <div class="idplate"><span>${v.v}</span></div>
    <div class="tt"><h3>${v.name}</h3><div class="sub">${v.sub}</div></div>
    <div class="tagbox">${v.tag}</div>
  </div>
  <div class="screen" data-screen="${v.v}"></div>
  <div class="canddesc">${v.desc}</div>
  <div class="candfoot">
    <span class="microcap">FOUNDER DISPOSITION — ${fam.id}</span>
    <select class="dispsel" data-dsp="${v.v}">
      <option value="">CHOOSE…</option><option>SELECT</option><option>COMBINE</option><option>REFINE</option><option>REJECT</option><option>SHOW MORE LIKE</option>
    </select>
    <button class="btnA" data-selbtn="${v.v}" style="font-size:12px; padding:10px 20px;"><span>${SEL[fam.id]===v.v?'SELECTED ✓':'SELECT '+v.v}</span></button>
  </div>
 </div>`;
}
const LIVE={}; /* famId -> [instances] */
function mountFam(fam){
 const wrap=document.querySelector(`[data-fw="${fam.id}"]`);
 const i=state.idx[fam.id]||0, cmp=state.compare[fam.id];
 const list=[fam.vars[i]]; if(cmp!=null&&cmp!==i)list.push(fam.vars[cmp]);
 wrap.className='compare-wrap'+(list.length>1?' two':'');
 wrap.innerHTML=list.map(v=>candHTML(fam,v)).join('');
 (LIVE[fam.id]||[]).length=0; LIVE[fam.id]=[];
 list.forEach(v=>{
  const scr=wrap.querySelector(`[data-screen="${v.v}"]`);
  try{ const inst=v.build(scr); if(inst&&inst.update)LIVE[fam.id].push(inst);}catch(e){console.error(v.v,e);}
 });
 wrap.querySelectorAll('[data-selbtn]').forEach(b=>b.addEventListener('click',()=>{
  SEL[fam.id]= SEL[fam.id]===b.dataset.selbtn? undefined : b.dataset.selbtn;
  if(!SEL[fam.id])delete SEL[fam.id];
  store.set('ivprep3491',JSON.stringify(SEL)); refreshTray(); mountFam(fam);}));
 wrap.querySelectorAll('[data-dsp]').forEach(d=>{
  d.value=(JSON.parse(store.get('ivprep3491d')||'{}'))[d.dataset.dsp]||'';
  d.addEventListener('change',()=>{const o=JSON.parse(store.get('ivprep3491d')||'{}'); o[d.dataset.dsp]=d.value; store.set('ivprep3491d',JSON.stringify(o)); refreshTray();});});
 const dots=document.querySelector(`[data-dots="${fam.id}"]`);
 dots.innerHTML=fam.vars.map((_,di)=>`<i class="${di===i?'on':''}" data-d="${di}"></i>`).join('');
 dots.querySelectorAll('i').forEach(dd=>dd.addEventListener('click',()=>{state.idx[fam.id]=+dd.dataset.d; mountFam(fam);}));
 document.querySelector(`[data-cnt="${fam.id}"]`).textContent=(i+1)+' / '+fam.vars.length+(cmp!=null?' + COMPARE':'');
}
function render(){
 let nh=`<h4>PERFORMANCE ENGINE</h4><a href="#top" data-nl>OVERVIEW</a>`;
 let mh=heroHTML();
 FAMS.forEach(f=>{
  nh+=`<a href="#f-${f.id}" data-nl>${f.title}<span class="st" data-navsel="${f.id}"></span></a>`;
  mh+=`<section class="fam" id="f-${f.id}">
   <div class="famtop"><div><div class="kicker">${f.kicker}</div><h2 class="hero-t">${f.title}</h2></div></div>
   ${f.note?`<div class="famnote">${f.note}</div>`:''}
   <div class="carrow">
     <button class="btnB" data-prev="${f.id}"><span>◀ PREVIOUS</span></button>
     <div class="dots" data-dots="${f.id}"></div>
     <button class="btnB" data-next="${f.id}"><span>NEXT ▶</span></button>
     <button class="btnB" data-cmp="${f.id}"><span>COMPARE</span></button>
     <span class="microcap" data-cnt="${f.id}" style="margin-left:auto;"></span>
   </div>
   <div data-fw="${f.id}"></div>
  </section>`;
 });
 main.innerHTML=mh; nav.innerHTML=nh;
 FAMS.forEach(f=>{
  state.idx[f.id]=0; state.compare[f.id]=null;
  document.querySelector(`[data-prev="${f.id}"]`).addEventListener('click',()=>{state.idx[f.id]=(state.idx[f.id]-1+f.vars.length)%f.vars.length; state.compare[f.id]=null; mountFam(f);});
  document.querySelector(`[data-next="${f.id}"]`).addEventListener('click',()=>{state.idx[f.id]=(state.idx[f.id]+1)%f.vars.length; state.compare[f.id]=null; mountFam(f);});
  document.querySelector(`[data-cmp="${f.id}"]`).addEventListener('click',(e)=>{
   state.compare[f.id]= state.compare[f.id]==null? (state.idx[f.id]+1)%f.vars.length : null;
   e.currentTarget.classList.toggle('on',state.compare[f.id]!=null); mountFam(f);});
  mountFam(f);
 });
 document.querySelectorAll('.scen').forEach(b=>b.addEventListener('click',()=>setScen(b.dataset.s)));
 refreshTray();
}
function refreshTray(){
 const D=JSON.parse(store.get('ivprep3491d')||'{}');
 const body=document.getElementById('traybody'); const ks=Object.keys(SEL);
 document.getElementById('trayCount').textContent=ks.length+' PICKED';
 body.innerHTML= ks.length? ks.map(f=>`<div class="trow"><span>${f}</span><b>${SEL[f]}${D[SEL[f]]?' · '+D[SEL[f]]:''}</b></div>`).join('')
  :'<div style="color:var(--dim); padding:6px 0; font-weight:600;">SELECT a candidate per family — or record COMBINE/REFINE dispositions on any candidate.</div>';
 document.querySelectorAll('[data-navsel]').forEach(n=>n.textContent=SEL[n.dataset.navsel]||'');
}
function copySheet(){
 const D=JSON.parse(store.get('ivprep3491d')||'{}');
 const lines=['Y1-Y2-CAM-V6-3491 — FOUNDER VISUAL SELECTIONS','DATE: '+new Date().toISOString().slice(0,10),''];
 FAMS.forEach(f=>{ lines.push(`${f.id.padEnd(6)} ${(SEL[f.id]||'—').padEnd(8)}`);});
 lines.push('','DISPOSITIONS:');
 Object.entries(D).filter(([,v])=>v).forEach(([k,v])=>lines.push(`${k}: ${v}`));
 const txt=lines.join('\n');
 (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(
  ()=>{document.getElementById('trayCount').textContent='COPIED ✓'; setTimeout(refreshTray,1400);},
  ()=>prompt('Copy:',txt));
}
function clearSheet(){Object.keys(SEL).forEach(k=>delete SEL[k]); store.set('ivprep3491','{}'); store.set('ivprep3491d','{}'); render();}
let trayOpen=true;
function toggleTray(){trayOpen=!trayOpen;
 document.getElementById('traybody').style.display=trayOpen?'block':'none';
 document.getElementById('trayfoot').style.display=trayOpen?'flex':'none';}
document.getElementById('roleBtn').addEventListener('click',e=>{
 const b=e.currentTarget; b.dataset.r=b.dataset.r==='M'?'S':'M';
 b.innerHTML='<span>VIEWING AS: '+(b.dataset.r==='M'?'MENTOR':'STUDENT')+'</span>';});
document.head.insertAdjacentHTML('beforeend','<style>@keyframes blink{50%{opacity:.25;}}</style>');
/* ---------- LOOP ---------- */
render();
let last=performance.now()/1000;
(function loop(){
 const now=performance.now()/1000, dt=Math.min(.05,now-last); last=now;
 (SCEN[SIM.scenario]||SCEN.IDLE)(now-scenStart);
 Object.values(LIVE).forEach(arr=>arr.forEach(i=>{try{i.update(now,dt);}catch(e){}}));
 requestAnimationFrame(loop);
})();
</script>
