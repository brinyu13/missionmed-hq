name: V1 Study Schedule 8010C integration seam

on:
  pull_request:
    paths:
      - "wp-content/plugins/missionmed-hub/includes/class-mmed-v1-study-*.php"
      - "wp-content/plugins/missionmed-hub/assets/v1-study-loader.*"
      - "wp-content/plugins/missionmed-hub/assets/v1-study-release.*"
      - "wp-content/plugins/missionmed-hub/includes/class-mmed-calendar-engine.php"
      - "wp-content/plugins/missionmed-hub/includes/class-mmed-study-schedule.php"
      - "wp-content/plugins/missionmed-hub/missionmed-hub.php"
      - "tests/php/v1-study-schedule-8010c-*.php"
      - "tests/php/run-v1-study-schedule-8010c.sh"
      - "tests/js/v1-study-schedule-8010c-loader.test.js"
      - ".github/workflows/v1-study-schedule-8010c.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-contract:
    name: PHP ${{ matrix.php }} contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php:
          - "7.4-cli"
          - "8.3-cli"
    container: php:${{ matrix.php }}
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Run deterministic 8010C contract
        run: sh tests/php/run-v1-study-schedule-8010c.sh

  browser-loader:
    name: Immutable inert loader
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Run loader isolation proof
        run: |
          node --check tests/js/v1-study-schedule-8010c-loader.test.js
          node tests/js/v1-study-schedule-8010c-loader.test.js

  wordpress-integration:
    name: WordPress ${{ matrix.php }} / MariaDB integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "7.4"
            image: wordpress:6.1.1-php7.4-apache
          - php: "8.3"
            image: wordpress:6.6.2-php8.3-apache
    container:
      image: ${{ matrix.image }}
    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: wordpress
          MARIADB_ROOT_PASSWORD: v1synthetic
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install disposable WordPress 6.6.2
        run: |
          set -eu
          php -r '
            $source = "https://wordpress.org/wordpress-6.6.2.tar.gz";
            if (!copy($source, "/tmp/wordpress-6.6.2.tar.gz")) {
              fwrite(STDERR, "WordPress source download failed.\n");
              exit(1);
            }
          '
          echo "7acbf69d5fdaf804e3db322bad23b08d2e2e42ec  /tmp/wordpress-6.6.2.tar.gz" | sha1sum -c -
          tar -xzf /tmp/wordpress-6.6.2.tar.gz -C /tmp
          mv /tmp/wordpress /tmp/v1-wordpress
          cp /tmp/v1-wordpress/wp-config-sample.php /tmp/v1-wordpress/wp-config.php
          sed -i "s/database_name_here/wordpress/" /tmp/v1-wordpress/wp-config.php
          sed -i "s/username_here/root/" /tmp/v1-wordpress/wp-config.php
          sed -i "s/password_here/v1synthetic/" /tmp/v1-wordpress/wp-config.php
          sed -i "s/localhost/database/" /tmp/v1-wordpress/wp-config.php
          php -r '
            define("WP_INSTALLING", true);
            require "/tmp/v1-wordpress/wp-load.php";
            require_once ABSPATH . "wp-admin/includes/upgrade.php";
            $installed = wp_install(
              "V1 Study Schedule 8010C synthetic integration",
              "v1bootstrap",
              "v1bootstrap@example.invalid",
              false,
              "",
              "v1synthetic-bootstrap-password"
            );
            if (!is_array($installed) || empty($installed["user_id"])) {
              fwrite(STDERR, "Disposable WordPress installation failed.\n");
              exit(1);
            }
          '

      - name: Prove real WordPress default-off and enabled 8010C states
        env:
          V1_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -eu
          php -r '
            chdir("/tmp/v1-wordpress");
            require "/tmp/v1-wordpress/wp-load.php";
            require getenv("V1_REPO_ROOT") . "/tests/php/v1-study-schedule-8010c-wordpress-default-off.php";
          '
          php -r '
            chdir("/tmp/v1-wordpress");
            require "/tmp/v1-wordpress/wp-load.php";
            require getenv("V1_REPO_ROOT") . "/tests/php/v1-study-schedule-8010c-wordpress.php";
          '
