openapi: 3.1.0
info:
  title: Mission Timeline API
  version: 412.0.0-rc.0
  description: Proposed non-production API contract for D1 Timeline.
servers:
  - url: /api/timeline/v1
paths:
  /health:
    get:
      security: []
      responses:
        "200": { description: Service health }
  /session/exchange:
    post:
      description: Trusted Matrix BFF exchange. Browser body identity is not accepted as authority.
      responses:
        "200": { description: Short-lived Timeline session }
        "401": { description: Trusted Matrix context missing or invalid }
  /documents:
    get:
      responses:
        "200": { description: Student-owned documents }
    post:
      responses:
        "201": { description: Document created with server-derived owner }
        "403": { description: Program or role scope denied }
  /documents/{documentId}:
    get:
      parameters:
        - $ref: "#/components/parameters/documentId"
      responses:
        "200": { description: Authorized document }
        "403": { description: Relationship scope denied }
  /documents/{documentId}/checkpoints/{deviceId}:
    put:
      parameters:
        - $ref: "#/components/parameters/documentId"
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Recoverable checkpoint saved }
        "409": { description: Revision conflict }
  /documents/{documentId}/versions:
    post:
      parameters:
        - $ref: "#/components/parameters/documentId"
      responses:
        "201": { description: Immutable named version created }
        "409": { description: Revision conflict }
  /documents/{documentId}/intake/analyze:
    post:
      description: Owner-only, consent-bound CV intelligence over a confirmed private SOURCE object and bounded locally extracted source blocks. Provider output is schema-validated and evidence-bound before returning human-review candidates; an unavailable provider fails soft without fabricating candidates.
      parameters:
        - $ref: "#/components/parameters/documentId"
      responses:
        "200": { description: Evidence-bound analysis or explicit LOCAL_LIMITED result }
        "400": { description: Invalid source, evidence, consent, or bounded request }
        "403": { description: Document or SOURCE ownership denied }
        "409": { description: SOURCE version, integrity, or consent conflict }
        "503": { description: Configured intelligence provider unavailable }
  /documents/{documentId}/file-vault/ingestions:
    post:
      description: WordPress-gateway-only exact-version handoff. The authenticated File Vault V1 owner read is copied server-to-server into the same student's private Timeline SOURCE custody after MIME, size, and SHA256 verification. Signed File Vault URLs and object keys are never accepted from or returned to the browser.
      parameters:
        - $ref: "#/components/parameters/documentId"
      responses:
        "201": { description: Confirmed owner-bound private SOURCE and storage-opaque provenance }
        "400": { description: Invalid source provenance }
        "403": { description: Student or document ownership denied }
        "409": { description: Source integrity mismatch }
        "413": { description: Source exceeds the bounded 25 MiB limit }
        "415": { description: Source MIME is not PDF or DOCX }
  /documents/{documentId}/reviews:
    post:
      parameters:
        - $ref: "#/components/parameters/documentId"
      responses:
        "201": { description: Version-bound advisor review requested }
  /reviews/{reviewId}/comments:
    post:
      parameters:
        - $ref: "#/components/parameters/reviewId"
      responses:
        "201": { description: Scoped review comment created }
  /reviews/{reviewId}/decision:
    post:
      parameters:
        - $ref: "#/components/parameters/reviewId"
      responses:
        "200": { description: Exact-version approval or changes request }
  /exports:
    post:
      responses:
        "202": { description: Idempotent export job queued }
        "409": { description: Exact-version approval required }
  /exports/{jobId}:
    get:
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Authorized export job status }
  /objects/sign:
    post:
      responses:
        "201": { description: Short-lived private upload authorization }
  /objects/{objectId}/confirm:
    post:
      parameters:
        - name: objectId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Size, MIME, and SHA256 verified }
components:
  securitySchemes:
    timelineSession:
      type: http
      scheme: bearer
  parameters:
    documentId:
      name: documentId
      in: path
      required: true
      schema: { type: string }
    reviewId:
      name: reviewId
      in: path
      required: true
      schema: { type: string }
security:
  - timelineSession: []
