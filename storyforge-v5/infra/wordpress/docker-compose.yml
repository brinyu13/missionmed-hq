name: b1_501_storyforge_integration

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress-local-only
      MARIADB_ROOT_PASSWORD: root-local-only
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - wordpress_db:/var/lib/mysql

  wordpress:
    image: wordpress:6.8.2-php8.3-apache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${STORYFORGE_INTEGRATION_WP_PORT:-18081}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress-local-only
      WORDPRESS_DB_NAME: wordpress
      STORYFORGE_INTEGRATION_WP_URL: "${STORYFORGE_INTEGRATION_WP_URL:-http://127.0.0.1:18081}"
      STORYFORGE_INTEGRATION_APP_PORT: "${STORYFORGE_INTEGRATION_APP_PORT:-4180}"
      STORYFORGE_ROUTE_ENABLED: "${STORYFORGE_ROUTE_ENABLED:-1}"
      WORDPRESS_CONFIG_EXTRA: |
        if (!empty($$_SERVER['HTTP_X_FORWARDED_HOST'])) {
          $$_SERVER['HTTP_HOST'] = $$_SERVER['HTTP_X_FORWARDED_HOST'];
        }
        define('WP_HOME', getenv('STORYFORGE_INTEGRATION_WP_URL') ?: 'http://127.0.0.1:18081');
        define('WP_SITEURL', getenv('STORYFORGE_INTEGRATION_WP_URL') ?: 'http://127.0.0.1:18081');
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('MISSIONMED_STORYFORGE_LOCAL_FIXTURES', true);
        define('STORYFORGE_JWT_SECRET', 'b1-501-local-wordpress-signing-secret-32-bytes');
        define('MISSIONMED_STORYFORGE_GATEWAY_SHARED_SECRET', 'b1-514-local-gateway-signing-secret-32-bytes');
        define('MISSIONMED_STORYFORGE_POSTMARK_WEBHOOK_SECRET', 'b1-514-local-postmark-webhook-secret-32-bytes');
        define('MISSIONMED_STORYFORGE_ROUTE_ENABLED', getenv('STORYFORGE_ROUTE_ENABLED') !== '0');
        define('MISSIONMED_STORYFORGE_ORIGIN', 'http://host.docker.internal:' . (getenv('STORYFORGE_INTEGRATION_APP_PORT') ?: '4180'));
    volumes:
      - wordpress_files:/var/www/html
      - ../../../wp-content/plugins/missionmed-storyforge-sso:/var/www/html/wp-content/plugins/missionmed-storyforge-sso:ro
      - ./missionmed-storyforge-route.php:/var/www/html/wp-content/mu-plugins/missionmed-storyforge-route.php:ro
      - "${STORYFORGE_INTEGRATION_RUNTIME_DIR:-./missionmed-storyforge-runtime}:/var/www/html/wp-content/mu-plugins/missionmed-storyforge-runtime:ro"
      - ./.htaccess:/var/www/html/.htaccess:ro

  wpcli:
    image: wordpress:cli-php8.3
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress-local-only
      WORDPRESS_DB_NAME: wordpress
      STORYFORGE_INTEGRATION_WP_URL: "${STORYFORGE_INTEGRATION_WP_URL:-http://127.0.0.1:18081}"
      STORYFORGE_INTEGRATION_APP_PORT: "${STORYFORGE_INTEGRATION_APP_PORT:-4180}"
      STORYFORGE_ROUTE_ENABLED: "${STORYFORGE_ROUTE_ENABLED:-1}"
      WORDPRESS_CONFIG_EXTRA: |
        if (!empty($$_SERVER['HTTP_X_FORWARDED_HOST'])) {
          $$_SERVER['HTTP_HOST'] = $$_SERVER['HTTP_X_FORWARDED_HOST'];
        }
        define('WP_HOME', getenv('STORYFORGE_INTEGRATION_WP_URL') ?: 'http://127.0.0.1:18081');
        define('WP_SITEURL', getenv('STORYFORGE_INTEGRATION_WP_URL') ?: 'http://127.0.0.1:18081');
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('MISSIONMED_STORYFORGE_LOCAL_FIXTURES', true);
        define('STORYFORGE_JWT_SECRET', 'b1-501-local-wordpress-signing-secret-32-bytes');
        define('MISSIONMED_STORYFORGE_GATEWAY_SHARED_SECRET', 'b1-514-local-gateway-signing-secret-32-bytes');
        define('MISSIONMED_STORYFORGE_POSTMARK_WEBHOOK_SECRET', 'b1-514-local-postmark-webhook-secret-32-bytes');
        define('MISSIONMED_STORYFORGE_ROUTE_ENABLED', getenv('STORYFORGE_ROUTE_ENABLED') !== '0');
        define('MISSIONMED_STORYFORGE_ORIGIN', 'http://host.docker.internal:' . (getenv('STORYFORGE_INTEGRATION_APP_PORT') ?: '4180'));
    volumes:
      - wordpress_files:/var/www/html
      - ../../../wp-content/plugins/missionmed-storyforge-sso:/var/www/html/wp-content/plugins/missionmed-storyforge-sso:ro
      - ./missionmed-storyforge-route.php:/var/www/html/wp-content/mu-plugins/missionmed-storyforge-route.php:ro
      - "${STORYFORGE_INTEGRATION_RUNTIME_DIR:-./missionmed-storyforge-runtime}:/var/www/html/wp-content/mu-plugins/missionmed-storyforge-runtime:ro"

volumes:
  wordpress_db:
  wordpress_files:
