name = "missionmed-storyforge-v5"
main = "worker.mjs"
compatibility_date = "2026-07-26"
workers_dev = false
preview_urls = false

[vars]
STORYFORGE_BASE_PATH = "/storyforge/"
# Set STORYFORGE_ORIGIN in the protected environment store for B1-502.

[assets]
directory = "../../dist"
binding = "ASSETS"
not_found_handling = "none"

[[routes]]
pattern = "missionmedinstitute.com/storyforge/*"
zone_name = "missionmedinstitute.com"
