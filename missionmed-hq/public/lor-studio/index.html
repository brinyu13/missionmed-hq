  if(step===4){
    return `<div class="facPanel"><div class="pBody" style="padding:20px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><div class="h2" style="color:#eafff4">Your private <em style="color:var(--fac)">assessment</em></div><span class="privTag">🔒 Never shown to the student or mentor</span></div>
      <div class="rowS" style="color:#9fb8aa;margin:10px 0 16px">Comparison and endorsement are yours alone. The system never proposes them, and honesty here is what keeps your signature worth something.</div>

        <select id="facTier" style="background:rgba(7,16,11,.8);border-color:#1d3327"><option value="">— choose honestly, or leave blank —</option>${CMP_TIERS.map(x=>`<option ${fc.comparison&&fc.comparison.tier===x?'selected':''}>${x}</option>`).join('')}</select></div>

      <div class="rowS" style="color:#9fb8aa;margin:8px 0 14px">Every paragraph is traceable to material you confirmed. Click any paragraph to edit it directly; phrasing alternatives never change facts, comparison, or endorsement. Excluded cues are simply absent.</div>
      ${fc.pars.map((p,i)=>`<div class="parBlock">
        <div class="parTxt" contenteditable="true" data-par="${i}" spellcheck="false">${esc(p.txt)}</div>
        <div class="parProv"><span style="font-family:var(--num);font-size:9px;letter-spacing:.14em;color:#6f8a7a;text-transform:uppercase">Provenance</span>${p.prov.map(k=>provChip(k)).join('')}${p.spoken?'<span class="chip gn" style="font-size:8px">From your dictation</span>':''}</div>
        ${p.alt?`<div class="altRow"><span style="font-family:var(--num);font-size:9px;letter-spacing:.14em;color:#6f8a7a;text-transform:uppercase;align-self:center">Same facts, different phrasing:</span>

      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px">

      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button class="facBtn" id="facChecksOk">Checks reviewed — continue ▸</button><button class="facAlt" data-fgoto="5">Back to draft</button></div>
    </div></div>`;
  }
  /* step 7 export */
  return `<div class="facPanel"><div class="pBody" style="padding:20px">
    <div class="h2" style="color:#eafff4">Export & <em style="color:var(--fac)">official upload</em></div>
    <div class="rowS" style="color:#9fb8aa;margin:8px 0 14px">LOR Studio has <b>no connection to ERAS, the AAMC Letter Writer Portal, or ResidencyCAS</b>. It prepares your letter and hands you to the official system — it never claims to submit.</div>

function runFacChecks(c){
  const fc=c.fac,S=D.student,w=wOf(c.writerId),r=rOf(w.rotationId);
  const text=(fc.pars||[]).map(p=>p.txt).join(' ');
  const rejected=Object.values(fc.cues).filter(d=>d.decision==='reject').length;
  const ctx=Object.values(fc.cues).filter(d=>d.decision==='context').length;
  const checks=[];
  checks.push({ok:true,t:'Every paragraph is provenance-bound',d:(fc.pars||[]).length+' paragraphs, each traceable to your confirmed relationship, cues, dictated observations, or chosen closing. '+(rejected?rejected+' excluded cue(s) are fully absent from the draft.':'No cues were excluded.')});
  checks.push({ok:ctx===0||/shared with me|has told me|reports that/i.test(text),t:'Student-supplied context is attributed, not absorbed',d:ctx?ctx+' item(s) you marked “true but not seen” appear only with explicit attribution to '+S.first+'.':'No student-attributed context items were used.'});
  const priv=/\b\d{1,3}-year-old\b|firefighter|maple street/i.test(text);
  checks.push({ok:!priv,t:'Patient privacy scan',d:priv?'Possible identifying patient details detected (age/occupation/place). Edit the paragraph before export.':'No patient names, ages, occupations, or locations detected in the draft.'});
  const cmpPar=(fc.pars||[]).some(p=>p.id==='p_cmp');
  checks.push({ok:!cmpPar||(fc.comparison&&fc.comparison.cohort&&fc.comparison.tier),t:'Comparison has a defined basis',d:cmpPar?'Your comparative sentence names its cohort ('+esc(fc.comparison.cohort)+') — “top 10%” language without a cohort is what makes letters generic.':'No comparative claims are made — also perfectly credible.'});
  checks.push({ok:new RegExp(S.first,'i').test(text)&&!/\b(he|him)\b/i.test(text.replace(/the team|the family/gi,'')),t:'Name & pronoun consistency',d:'Draft uses “'+S.name+'” / “she”. One wrong pronoun signals a recycled letter — re-read once before signing.'});
  checks.push({ok:!r||text.includes(fmtD(r.start).split(',')[1].trim())||text.includes(fmtD(r.start)),t:'Dates match the rotation record',d:r?'Letter dates align with '+r.name+' ('+fmtD(r.start)+(r.end?' – '+fmtD(r.end):'')+').':'No rotation dates to check.'});
  checks.push({ok:!!fc.endorsement,t:'Endorsement chosen by you',d:'The closing reflects your explicit choice — the system never selected praise on your behalf.'});
  return checks;
}

  const S=D.student;
  $$('#facBody [data-fgoto]').forEach(b=>b.onclick=()=>{fc.step=+b.dataset.fgoto;persist();renderFac()});
  if(step===0){
    $('#facIdOk').onclick=()=>{fc.identityOk=true;fc.step=1;persist();renderFac()};
    $('#facDecline').onclick=()=>{
      modal(`<div class="h2">An honest <em>no</em> helps ${esc(S.first)}</div>
        <p class="sub" style="margin-top:10px">Declining now — while there’s time to ask someone else — is a genuine kindness. ${esc(S.first)} will see “Declined” with no further detail.</p>

      $('#decGo').onclick=()=>{setStage(c,'declined');closeModal();closeFaculty();toast('Request declined. '+S.first+' sees the status only — the backup plan is ready in their request tab.')}};
  }
  if(step===1){$('#facRelOk').onclick=()=>{fc.relTxt=$('#facRel').value.trim();fc.relConfirmed=true;fc.step=2;fc.pars=null;persist();renderFac()}}
  if(step===2){
    $$('#facBody [data-cue]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.cue,dec=b.dataset.dec;
      if(dec==='corrected'){
        const q=facCueList(c).find(x=>x.id===id);
        modal(`<div class="h2">Correct this <em>cue</em></div>
          <div class="fld" style="margin-top:12px"><label for="corTxt">Your accurate version (used as “corrected by you”)</label>
          <textarea id="corTxt">${esc((fc.cues[id]&&fc.cues[id].correction)||q.txt)}</textarea></div>

        $('#corGo').onclick=()=>{fc.cues[id]={decision:'corrected',correction:$('#corTxt').value.trim()};fc.pars=null;persist();closeModal();renderFac()};
        return;
      }

    const ok=$('#facCuesOk');if(ok)ok.onclick=()=>{if(!ok.disabled){fc.step=3;persist();renderFac()}};
  }
  if(step===3){
    const ta=$('#facObsTxt');
    wireMic($('#facMic'),$('#facMicNote'),fin=>{ta.value=(ta.value?ta.value.trim()+' ':'')+fin;ta.dataset.voiced='1'},inter=>{$('#facInterim').textContent=inter?'“'+inter+'…”':''});
    $('#facObsAdd').onclick=()=>{const t=ta.value.trim();if(!t){toast('Type or dictate an observation first.');return}
      fc.obs.push({txt:t,via:ta.dataset.voiced?'voice':'text'});ta.value='';delete ta.dataset.voiced;fc.pars=null;persist();renderFac()};
    $$('#facBody [data-delobs]').forEach(x=>x.onclick=()=>{fc.obs.splice(+x.dataset.delobs,1);fc.pars=null;persist();renderFac()});
    const ok=$('#facObsOk');if(ok)ok.onclick=()=>{if(!ok.disabled){fc.step=4;persist();renderFac()}};
  }
  if(step===4){
    $('#facCmp').onchange=e=>{fc.comparison={cohort:e.target.value,tier:(fc.comparison||{}).tier||''};fc.pars=null;persist();
      $('#facTierWrap').style.display=e.target.value===CMP_COHORTS[2]?'none':'';};
    const ft=$('#facTier');if(ft)ft.onchange=e=>{fc.comparison={cohort:$('#facCmp').value,tier:e.target.value};fc.pars=null;persist()};
    $$('#facBody [data-endorse]').forEach(b=>b.onclick=()=>{fc.endorsement=b.dataset.endorse;
      if(!fc.comparison)fc.comparison={cohort:$('#facCmp').value,tier:($('#facTier')&&$('#facTier').value)||''};
      fc.pars=null;persist();renderFac()});
    const ok=$('#facAsmOk');if(ok)ok.onclick=()=>{if(!ok.disabled){if(!fc.comparison)fc.comparison={cohort:$('#facCmp').value,tier:($('#facTier')&&$('#facTier').value)||''};fc.step=5;persist();renderFac()}};
  }
  if(step===5){
    $$('#facBody [data-par]').forEach(el=>el.oninput=()=>{fc.pars[+el.dataset.par].txt=el.textContent;fc.edits++;persist()});
    $$('#facBody [data-alt]').forEach(b=>b.onclick=()=>{const p=fc.pars[+b.dataset.alt];if(p.alt&&p.alt[b.dataset.kind]){p.txt=p.alt[b.dataset.kind];persist();renderFac();toast('Phrasing swapped — facts unchanged, still yours to edit.')}});

  }
  if(step===6){$('#facChecksOk').onclick=()=>{fc.checked=true;fc.step=7;persist();renderFac()}}
  if(step===7){
    $('#facDl').onclick=()=>{
      const txt=(fc.pars||[]).map(p=>p.txt).join('\n\n')+'\n\n'+w.name+', '+w.cred+'\n'+w.title+'\n'+w.inst.split('(')[0].trim();

      toast('Downloaded. Letterhead, signature, and PDF conversion happen in your own tools — then upload via the official portal.')};
    const fd=$('#facDone');if(fd&&!fc.done)fd.onclick=()=>{
      fc.done=true;setStage(c,'uploadPending');persist();
      modal(`<div class="boundary" style="border:0;padding:6px"><div class="bIco">🔏</div>

        <button class="btn pri" style="margin-top:16px" id="sealGo">Return to LOR Studio</button></div>`);
      $('#sealGo').onclick=()=>{closeModal();closeFaculty()};};
  }
}

/* conversational step */
function wizQuestions(c,b,w){
  const last=w.name.split(' ').slice(-1)[0];
  const qs=[
    {id:'know',title:`How does Dr. ${last} know you?`,type:'chips+',opts:['Daily inpatient rounds','Direct one-on-one precepting','Weekly clinic sessions','Research meetings','Occasional teaching rounds'],hint:'Pick what fits and add detail — this anchors the letter\'s credibility.'},
    {id:'moments',title:`What moments might Dr. ${last} actually remember?`,type:'voice',ph:'e.g., The evening a family was confused about the discharge plan and I went back after rounds…',hint:'Speak it like you\'d tell a friend. Only moments the writer could credibly know will survive the evidence check.'},
    {id:'qualities',title:'Which qualities do you hope this letter can address?',type:'multi',opts:Object.values(COMPS).map(x=>x.toLowerCase()),hint:'Choose 2–4. More than that dilutes every letter.'},
    {id:'accomplish',title:'Any accomplishments the writer could mention — with honest attribution?',type:'multi',opts:D.student.profile.map(p=>p.title).concat(['Presented 12 admissions','QI poster on discharge communication']),hint:'These appear as attributed facts (“Amara shared with me…”), never as invented observations.'},
    {id:'distinctive',title:'What made this rotation or relationship distinctive?',type:'voice',ph:'e.g., She let me run the family meetings by week three…',hint:''},
    {id:'prefs',title:'How should the letter read?',type:'prefs',hint:b.tplPrefs?'Prefilled from your chosen template — adjust freely.':'These steer tone and length across all four options.'},
    {id:'logistics',title:'Last details — names, dates, logistics.',type:'logistics',hint:'One wrong pronoun sinks a letter. Confirm everything here once.'},
    {id:'wants',title:`What did Dr. ${last} ask for?`,type:'chips',opts:['A complete draft','A supporting packet only','Both — draft plus packet'],hint:''}
  ];
  const out=[];
  qs.forEach(q=>{
    out.push(q);
    if(q.id==='moments'&&b.answers.moments&&b.answers.moments.text){
      const t=b.answers.moments.text;
      if(/famil|anxious|upset|scared|worried|crying|confus/i.test(t))out.push({id:'fu_scene',title:'Follow-up: you mentioned a worried family — what did you actually say or do, and what changed afterward?',type:'voice',ph:'I sat down, re-drew the med schedule in plain words…',hint:'The consequence is what makes a moment letter-worthy.',followup:true});
      if(/procedur|suture|line|intubat|deliver|code|resus|scrub/i.test(t))out.push({id:'fu_role',title:'Follow-up: what was your exact role in that — performed, assisted, or observed?',type:'chips+',opts:['I performed it under supervision','I assisted','I observed and discussed'],hint:'The letter must claim your role honestly — this is what keeps the writer credible.',followup:true});
    }
  });
  return out;
}
function wizConvoHTML(c,b,w){

  let body='';

    <div class="micNote" id="qMicNote">${speechSupported()?'Real browser speech-to-text.':''}</div>`;
  }else if(q.type==='prefs'){
    const p=b.prefs;
    body=`<div class="eyebrow" style="margin-bottom:6px">Formality</div><div class="chipPick" style="margin-top:4px">${['warm','balanced','formal'].map(o=>`<button data-pref="formality:${o}" class="${p.formality===o?'sel':''}">${o}</button>`).join('')}</div>
    <div class="eyebrow" style="margin:14px 0 6px">Length & detail</div><div class="chipPick" style="margin-top:4px">${['concise','standard','detailed'].map(o=>`<button data-pref="length:${o}" class="${p.length===o?'sel':''}">${o}</button>`).join('')}</div>`;
  }else if(q.type==='logistics'){

      ${!q.followup&&q.type!=='logistics'?'<button class="btn ghost" id="qSkip">Skip</button>':''}

function finalLetterText(c,b){

function simulateFacultyActivity(c){
  const w=wOf(c.writerId);const last=w.name.split(' ').slice(-1)[0];
  const seq=[
    ['Possible email open signal','weak','Pixel-style signal — may be automated prefetch or privacy-protected. Never treated as proof a human read it.'],
    ['Secure link accessed — visitor not yet verified','weak','Someone (or a security scanner) followed the Depot link.'],
    ['Faculty identity verified','strong','Dr. '+last+' completed the simulated identity check inside the Depot.'],
    ['Thank-you video played','strong','Intentional in-page play — recorded only because it required a click after verification.'],
    ['Letter viewed in secure workspace','strong',''],
    ['Downloaded as PDF','strong',''],
    ['Faculty started review','strong',''],
    ['Faculty requested changes','strong','“Could you correct the dates on the cardiology week? Everything else reads right.”'],
    ['Faculty approved/sealed','strong','Workspace sealed — content now confidential.']
  ];
  const nextEv=seq.find(([l])=>!c.events.some(e=>e.label===l));
  if(!nextEv){toast('The full simulated sequence has played out for this letter.');return}
  if(!c.depot.video.approved&&nextEv[0]==='Thank-you video played'){c.events.push({t:todayISO,label:'(video skipped — none added)',conf:'self',d:'No thank-you video on this Depot; the workflow completes without one.'});persist();render();return}
  c.events.push({t:todayISO,label:nextEv[0],conf:nextEv[1],d:nextEv[2]});
  if(nextEv[0]==='Faculty requested changes')c.collab.push({t:todayISO,txt:'Could you correct the dates on the cardiology week? Everything else reads right.'});
  if(nextEv[0]==='Faculty identity verified')c.depot.link.verified=true;
  if(nextEv[0]==='Faculty approved/sealed'){c.fac.done=true;if(stageIndex(c.stage)<stageIndex('uploadPending'))setStage(c,'uploadPending')}
  persist();render();
  toast('Simulated: '+nextEv[0]);
}

/* ================= EXAMPLES & TEMPLATES LIBRARY ================= */
function libFilterSamples(){
  const L=D.library;const q=(L.q||'').toLowerCase();
  let list=SAMPLES.filter(s=>{
    if(L.fSpec&&s.spec!==L.fSpec)return false;
    if(L.fUsce&&s.usce!==L.fUsce)return false;
    if(L.fRole&&s.role!==L.fRole)return false;
    if(L.fTone&&s.tone!==L.fTone)return false;
    if(L.fLen&&s.len!==L.fLen)return false;
    if(L.fStruct&&s.struct!==L.fStruct)return false;
    if(L.fStr&&!s.strengths.includes(L.fStr))return false;
    if(L.fDur&&s.dur!==L.fDur)return false;
    if(q&&!(s.title+' '+s.sub+' '+s.text+' '+(L.tags[s.id]||[]).join(' ')).toLowerCase().includes(q))return false;
    return true});
  if(L.sort==='fav')list=list.slice().sort((a,b2)=>(L.favs.includes(b2.id)?1:0)-(L.favs.includes(a.id)?1:0));
  else if(L.sort==='recent')list=list.slice().sort((a,b2)=>L.recent.indexOf(a.id)===-1?1:L.recent.indexOf(b2.id)===-1?-1:L.recent.indexOf(a.id)-L.recent.indexOf(b2.id));
  else if(D.specialty)list=list.slice().sort((a,b2)=>((b2.spec===D.specialty?1:0)-(a.spec===D.specialty?1:0)));
  return list;
}

      const stopRec=()=>{try{mr.stop()}catch(e){}};
      recState={stop:stopRec};
      mr.start();
      setTimeout(()=>{const sb=$('#vidStop');if(sb)sb.onclick=stopRec},50);
    }catch(err){dep.video.state='denied';persist();render();}
  };
  const vs2=$('#vidStop');if(vs2&&recState)vs2.onclick=recState.stop;
  const vu=$('#vidUpl');if(vu)vu.onclick=()=>$('#vidFile').click();
  const vf=$('#vidFile');if(vf)vf.onchange=e=>{const f=e.target.files[0];if(!f)return;

    toast('Uploaded — preview it, then approve before it appears in the Depot.')};
  const va=$('#vidApprove');if(va)va.onclick=()=>{dep.video.approved=true;dep.video.state='saved';
    if(!dep.video.transcript)dep.video.transcript='Dear Dr. '+w.name.split(' ').slice(-1)[0]+', thank you for making time for this letter — and for what our rotation taught me. (Edit this transcript to match your video.)';
    persist();render();toast('Video approved. It will appear in the Depot with a play button — never autoplay.')};
  const vt=$('#vidRetake');if(vt)vt.onclick=()=>{dep.video.approved=false;dep.video.state='none';delete VIDEO_BLOBS[c.id];persist();render()};
  const vm=$('#vidRemove');if(vm)vm.onclick=()=>{dep.video.approved=false;dep.video.state='none';dep.video.transcript='';delete VIDEO_BLOBS[c.id];persist();render();toast('Video removed. The Depot is complete without one.')};
}

    <p class="sub" style="margin-top:10px;max-width:700px">Built from student-selected evidence tags and faculty-confirmed coverage — never from letter content. A portfolio should read like complementary witnesses, not one witness echoed four times.</p>
    <div class="panel" style="margin-top:20px"><div class="pBody" style="overflow-x:auto">
      <table class="covTable" aria-label="Competency coverage by planned letter">
        <thead><tr><th>Competency</th>${cases.map(c=>`<th>${esc(wOf(c.writerId).name.replace('Dr. ',''))}</th>`).join('')}<th>Coverage</th></tr></thead>
        <tbody>${Object.keys(COMPS).map(k=>`<tr>
          <td style="font-weight:700">${COMPS[k]}</td>
          ${cases.map(c=>`<td><span class="covDot ${caseComps(c).has(k)?'y':'n'}">${caseComps(c).has(k)?'✓':'·'}</span></td>`).join('')}
          <td>${cov[k].length===0?'<span class="chip rd" style="font-size:8.5px">Gap</span>':cov[k].length>=3?'<span class="chip em" style="font-size:8.5px">Redundant ×'+cov[k].length+'</span>':'<span class="chip gn" style="font-size:8.5px">Covered</span>'}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div></div>
    ${redundant.length?`<div class="warnBox" style="margin-top:16px"><b>Redundancy:</b> ${redundant.map(k=>COMPS[k]).join(', ')} appear${redundant.length===1?'s':''} in three or more planned letters. Program readers will notice the echo. Differentiate: point one writer at a different strength their rotation actually showed.</div>`:''}
    ${gaps.length?`<div class="warnBox" style="margin-top:12px"><b>Gaps:</b> no planned letter currently evidences ${gaps.map(k=>COMPS[k]).join(', ')}. ${gaps.includes('clinicalReasoning')||gaps.includes('workEthic')?'“Night of Three Admissions” (still private in StoryForge) would cover this — suggest Amara permission it for the Okafor case.':'Check whether an existing writer actually observed these, or whether a different writer is needed.'}</div>`:''}
    <div class="noteBox" style="margin-top:12px">Suggested rebalance: keep Okafor on communication + the discharge story; move the teaching thread to Raman (she saw it directly); ask Whitfield’s coverage tags to carry acute care; give Marchetti the longitudinal scholarship angle no clinical writer can offer.</div>
  </section>`;
}

function renderMDeadlines(){
  const rows=plannedCases().map(c=>({c,w:wOf(c.writerId),dl:c.request.deadline,left:daysUntil(c.request.deadline)}));
  return `<section data-view="mdeadlines" class="live">
    <div class="eyebrow">Mentor · deadlines & exceptions</div>
    <div class="h1" style="margin-top:8px">What breaks first, <em>and the backup</em>.</div>
    <div class="panel" style="margin-top:20px"><div class="pBody">
      ${rows.sort((a,b)=>a.left-b.left).map(({c,w,dl,left})=>{
        const stalled=c.stage==='asked'&&c.request.sent&&Math.round((new Date(todayISO)-new Date(c.request.sent))/86400000)>=14;
        return `<div class="row">
          <div class="caseAv">${initials(w.name)}</div>
          <div class="rowMain"><div class="rowT" style="font-size:13.5px">${esc(w.name)}</div>
            <div class="rowS">Needed by ${fmtD(dl)} · ${left} days · ${STAGE_META[c.stage].label}${c.request.followups.length?' · '+c.request.followups.length+' follow-up(s)':''}</div></div>
          ${stalled?'<span class="stage bad">Stalled — no reply 21d</span>':left<45&&!['uploaded','assigned','thanked'].includes(c.stage)?'<span class="stage warn">Watch</span>':'<span class="stage good">On track</span>'}
        </div>`}).join('')}
    </div></div>
    <div class="panel" style="margin-top:16px"><div class="pHead"><div class="h2">Exceptions & <em>backup plan</em></div></div><div class="pBody">
      <div class="row"><div class="rowMain"><div class="rowT" style="font-size:13px">Dr. Marchetti — asked Jul 12, no response in 3 weeks</div>
        <div class="rowS">St. Aurelius closes Sep 15 (${daysUntil('2026-09-15')}d). Recommendation: one gentle follow-up this week; in parallel, Amara should warm up <b>Dr. Naomi Hale</b> (co-attended the IM service, ~8 directly-precepted presentations) as a backup. Your note with the one-click add is already on Amara’s home screen.</div></div>
        <span class="stage bad">Action needed</span></div>
      <div class="row"><div class="rowMain"><div class="rowT" style="font-size:13px">St. Aurelius chair-letter requirement</div>
        <div class="rowS">Requirement verified Jul 20 from the program website. Only chair option is Dr. Blackwood (readiness: limited observation). Honest play: narrow-claim chair letter for the requirement + strong clinical letters to carry evidence.</div></div>
        <span class="stage warn">Coach it</span></div>
      <div class="row"><div class="rowMain"><div class="rowT" style="font-size:13px">Dr. Whitfield — uploaded (self-reported), waived</div>
        <div class="rowS">Status came from Amara’s own confirmation, not an ERAS integration. The letter itself is confidential to everyone here.</div></div>
        <span class="stage good">Done</span></div>
    </div></div>
  </section>`;
}

/* ================= RENDER DISPATCH ================= */
const VIEWS={
  build:[renderBuild,wireBuild],library:[renderLibrary,wireLibrary],depot:[renderDepot,wireDepot],
  letters:[renderHome,wireHome],intel:[renderIntel,wireIntel],
  rotations:[renderRotations,wireRotations],writers:[renderWriters,wireWriters],
  programs:[renderPrograms,wirePrograms],settings:[renderSettings,wireSettings],
  mhome:[renderMHome,wireMHome],mcoverage:[renderMCoverage,()=>{$$('[data-why]').forEach(b=>b.onclick=()=>openReadinessModal(b.dataset.why))}],
  mdeadlines:[renderMDeadlines,()=>{}]
};
function render(){
  const studentViews=['build','library','depot','letters','intel','home','rotations','writers','programs'];
  const mentorViews=['mhome','mcoverage','mdeadlines'];
  if(D.view==='home')D.view='letters';
  if(D.role==='mentor'&&studentViews.includes(D.view))D.view='mhome';
  if(D.role==='student'&&mentorViews.includes(D.view))D.view='build';
  document.body.dataset.role=D.role;
  renderNav();
  const [rf,wf]=VIEWS[D.view]||VIEWS.build;
  $('#main').innerHTML=rf();
  wf();
  $$('#main [data-nav]').forEach(b=>{if(!b._navWired){b._navWired=true;b.addEventListener('click',()=>go(b.dataset.nav))}});
}

/* ================= INIT + RECOVERY ================= */
(function init(){
  document.body.dataset.role=D.role;
  $$('#rolePill .pp').forEach(p=>{const on=p.dataset.r===D.role;p.classList.toggle('on',on);p.setAttribute('aria-pressed',on)});
  render();
  /* interruption recovery: reopen where the user was */
  if(D.ui.facCaseId&&cOf(D.ui.facCaseId)){renderFac();$('#facWrap').classList.add('open')}
  else if(D.ui.caseId&&cOf(D.ui.caseId)){renderSheet();$('#sheet').classList.add('open')}
})();
</script>

<script src="/lor-studio/production-adapter.js?v=5"></script>
