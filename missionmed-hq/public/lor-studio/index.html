<!DOCTYPE html>
<html lang="en" data-lor-runtime="gated">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOR Studio · MissionMed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;0,800;0,900;1,700;1,800;1,900&family=Rajdhani:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
/* ============ LOR STUDIO · MISSIONMED MATRIX TOKENS ============ */
:root{
  --bg:#0a0d14; --bg2:#0f1522; --card:#121927; --card2:#161f31; --edge:#243046; --edge2:#31405c;
  --tx:#e9eefb; --dim:#8593ae; --mid:#aab8d1;
  --em:#ffb340; --em2:#ff7a3d; --cy:#39d6ff; --vi:#8a7dff; --gd:#ffd76a; --gn:#4ade9d; --rd:#ff5470; --tl:#5eead4;
  --disp:'Archivo',system-ui,sans-serif; --num:'Rajdhani',sans-serif; --voice:'Lora',Georgia,serif;
  --accent:var(--em); --accent2:var(--em2); --accentGlow:255,179,64;
  --hdr:60px;
}
body[data-role="mentor"]{--accent:#39d6ff;--accent2:#5a8dff;--accentGlow:57,214,255}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--disp);overflow:hidden}
button{cursor:pointer;font-family:inherit;border:0;background:none;color:inherit}
button:disabled{cursor:not-allowed;opacity:.45}
::selection{background:var(--em);color:#000}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--edge);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px;border-radius:6px}
input,select,textarea{font-family:var(--disp);color:var(--tx)}

/* ambient */
.aur{position:fixed;z-index:0;pointer-events:none;filter:blur(90px);opacity:.45;border-radius:50%;will-change:transform}
.aur.a{width:54vw;height:54vw;left:-16vw;top:-22vw;background:radial-gradient(circle,rgba(255,122,61,.14),rgba(255,122,61,0) 65%);animation:drift1 48s ease-in-out infinite alternate}
.aur.b{width:62vw;height:62vw;right:-22vw;bottom:-30vw;background:radial-gradient(circle,rgba(90,77,208,.18),rgba(90,77,208,0) 65%);animation:drift2 58s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(9vw,7vw) scale(1.1)}}
@keyframes drift2{to{transform:translate(-8vw,-9vw) scale(1.07)}}
.vg{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 38%,transparent 46%,rgba(3,5,9,.72))}
@media (prefers-reduced-motion:reduce){
  .aur{animation:none!important}
  *,*:before,*:after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
}

/* ============ SHELL ============ */
header{position:fixed;top:0;left:0;right:0;height:var(--hdr);z-index:70;display:flex;align-items:center;gap:14px;padding:0 18px;
  background:linear-gradient(180deg,rgba(10,13,20,.94),rgba(10,13,20,.66));border-bottom:1px solid var(--edge);backdrop-filter:blur(10px)}
.matrixBtn{display:flex;align-items:center;gap:7px;font-family:var(--num);font-weight:700;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);padding:7px 12px;border:1px solid var(--edge);border-radius:9px;transition:.15s;white-space:nowrap}
.matrixBtn:hover{color:#fff;border-color:var(--edge2)}
.logo{font-weight:900;font-style:italic;font-size:20px;transform:skewX(-4deg);white-space:nowrap;letter-spacing:-.01em;cursor:pointer;user-select:none}
.logo b{color:var(--accent);font-style:italic;transition:color .3s}
.logoSub{font-family:var(--num);font-size:8.5px;font-weight:700;letter-spacing:.24em;color:var(--dim);margin-top:-3px;transform:skewX(-4deg);text-transform:uppercase}
nav.top{display:flex;gap:2px;margin-left:4px;overflow-x:auto;scrollbar-width:none}
nav.top::-webkit-scrollbar{display:none}
.ntab{font-family:var(--num);font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);padding:8px 13px;border-radius:8px;transition:.18s;position:relative;white-space:nowrap}
.ntab:hover{color:#fff;background:rgba(36,48,70,.55)}
.ntab.on{color:var(--accent)}
.ntab.on:after{content:"";position:absolute;left:13px;right:13px;bottom:2px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.hRight{margin-left:auto;display:flex;align-items:center;gap:10px}
.demoChip{font-family:var(--num);font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gd);border:1px dashed rgba(255,215,106,.5);border-radius:6px;padding:4px 9px;cursor:pointer;transition:.15s;white-space:nowrap}
.demoChip:hover{background:rgba(255,215,106,.08)}
.rolePill{display:flex;align-items:center;border:1px solid var(--edge);background:rgba(15,21,34,.85);border-radius:999px;padding:3px;cursor:pointer}
.rolePill .pp{display:flex;align-items:center;gap:6px;padding:4px 11px 4px 5px;border-radius:999px;font-family:var(--num);font-weight:700;font-size:11px;letter-spacing:.06em;color:var(--dim);transition:.18s}
.rolePill .pp.on{background:linear-gradient(90deg,rgba(var(--accentGlow),.22),rgba(var(--accentGlow),.08));color:var(--tx)}
.avc{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:10.5px;flex:none}
.avc.stu{background:linear-gradient(150deg,#ffb340,#ff7a3d);color:#161005}
.avc.men{background:linear-gradient(150deg,#39d6ff,#5a8dff);color:#04121c}

#mentorBanner{position:fixed;top:var(--hdr);left:0;right:0;z-index:60;display:none;align-items:center;gap:12px;padding:6px 22px;
  background:linear-gradient(90deg,rgba(57,214,255,.13),rgba(90,141,255,.07));border-bottom:1px solid rgba(57,214,255,.25);backdrop-filter:blur(8px);
  font-family:var(--num);font-size:11.5px;font-weight:600;letter-spacing:.05em;color:#bfe9ff}
body[data-role="mentor"] #mentorBanner{display:flex}
#mentorBanner b{color:var(--cy)}

main{position:fixed;inset:var(--hdr) 0 0 0;overflow-y:auto;overflow-x:hidden;z-index:10}
body[data-role="mentor"] main{top:calc(var(--hdr) + 30px)}
section[data-view]{display:none;min-height:100%;padding:30px clamp(16px,4.5vw,64px) 90px;max-width:1360px;margin:0 auto;animation:vin .35s cubic-bezier(.2,.9,.3,1.1)}
section.live{display:block}
@keyframes vin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* type */
.eyebrow{font-family:var(--num);font-size:11px;font-weight:700;letter-spacing:.32em;color:var(--dim);text-transform:uppercase}
.h1{font-size:clamp(24px,3.2vw,38px);font-weight:900;font-style:italic;transform:skewX(-3deg);letter-spacing:-.02em;line-height:1.08}
.h1 em,.h2 em{color:var(--accent);font-style:italic}
.h2{font-size:18px;font-weight:900;font-style:italic;transform:skewX(-3deg);letter-spacing:-.01em}
.sub{font-size:13.5px;color:var(--mid);line-height:1.6}
.voiceTxt{font-family:var(--voice);font-style:italic;color:var(--mid)}

/* panels & buttons */
.panel{background:linear-gradient(165deg,rgba(19,25,39,.9),rgba(15,20,33,.86));border:1px solid var(--edge);border-radius:16px;position:relative;overflow:hidden;backdrop-filter:blur(4px)}
.panel:before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--accentGlow),.4),transparent)}
.pHead{display:flex;align-items:center;gap:12px;padding:16px 20px 0;flex-wrap:wrap}
.pBody{padding:14px 20px 20px}
.pMore{margin-left:auto;font-family:var(--num);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);transition:.15s}
.pMore:hover{color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase;border-radius:10px;transition:.18s;white-space:nowrap}
.btn.pri{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#140b00;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);border-radius:0}
.btn.pri:hover:not(:disabled){transform:scale(1.04);filter:brightness(1.1);box-shadow:0 8px 30px rgba(var(--accentGlow),.35)}
body[data-role="mentor"] .btn.pri{color:#04121c}
.btn.alt{border:1px solid var(--edge2);color:var(--mid);background:rgba(15,21,34,.7)}
.btn.alt:hover:not(:disabled){color:#fff;border-color:var(--mid)}
.btn.ghost{color:var(--dim);font-size:11px;padding:8px 12px}
.btn.ghost:hover{color:#fff}
.btn.sm{padding:7px 14px;font-size:10.5px}
.btn.danger{border:1px solid rgba(255,84,112,.5);color:var(--rd)}
.btn.danger:hover{background:rgba(255,84,112,.1)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--num);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:5px;border:1px solid var(--edge2);color:var(--mid)}
.chip.em{color:var(--em);border-color:rgba(255,179,64,.45)}
.chip.cy{color:var(--cy);border-color:rgba(57,214,255,.4)}
.chip.gn{color:var(--gn);border-color:rgba(74,222,157,.45)}
.chip.rd{color:var(--rd);border-color:rgba(255,84,112,.45)}
.chip.vi{color:var(--vi);border-color:rgba(138,125,255,.45)}
.chip.gd{color:var(--gd);border-color:rgba(255,215,106,.45)}
.chip.dashed{border-style:dashed}
/* provenance chips */
.prov{display:inline-flex;align-items:center;gap:5px;font-family:var(--num);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid}
.prov i{width:6px;height:6px;border-radius:50%;background:currentColor}
.prov.stu{color:#b9aefc;border-color:rgba(138,125,255,.5)}
.prov.sf{color:var(--em);border-color:rgba(255,179,64,.5)}
.prov.doc{color:var(--cy);border-color:rgba(57,214,255,.5)}
.prov.obs{color:var(--gn);border-color:rgba(74,222,157,.55)}
.prov.ctx{color:var(--tl);border-color:rgba(94,234,212,.5)}
.prov.men{color:#7cb8ff;border-color:rgba(124,184,255,.5)}
.prov.ai{color:#ff8fa8;border-color:rgba(255,143,168,.5)}
.prov.app{color:var(--gd);border-color:rgba(255,215,106,.55)}

/* stage chips */
.stage{font-family:var(--num);font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:3px 9px;border-radius:4px;border:1px solid var(--edge2);color:var(--mid);white-space:nowrap}
.stage.warn{color:var(--em);border-color:rgba(255,179,64,.5)}
.stage.good{color:var(--gn);border-color:rgba(74,222,157,.5)}
.stage.bad{color:var(--rd);border-color:rgba(255,84,112,.5)}
.stage.info{color:var(--cy);border-color:rgba(57,214,255,.45)}

/* forms */
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-family:var(--num);font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.fld input,.fld select,.fld textarea{background:rgba(10,14,22,.85);border:1px solid var(--edge);border-radius:10px;padding:10px 13px;font-size:14px;outline:none;transition:.15s;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--cy);box-shadow:0 0 0 1px rgba(57,214,255,.3)}
.fld textarea{min-height:90px;resize:vertical;line-height:1.55}
.fld .hint{font-size:11.5px;color:var(--dim);line-height:1.5}
.fRow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.fRow{grid-template-columns:1fr}}

/* rows */
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid rgba(36,48,70,.6)}
.row:last-child{border-bottom:0}
.rowMain{flex:1;min-width:0}
.rowT{font-weight:800;font-size:14.5px;letter-spacing:-.01em}
.rowS{font-size:12px;color:var(--dim);margin-top:2px;line-height:1.5}
.rowBtn{font-family:var(--num);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);border:1px solid var(--edge2);border-radius:8px;padding:7px 13px;transition:.15s;white-space:nowrap}
.rowBtn:hover:not(:disabled){color:#fff;border-color:var(--mid)}
.rowBtn.pri{color:var(--accent);border-color:rgba(var(--accentGlow),.5)}
.rowBtn.pri:hover:not(:disabled){background:rgba(var(--accentGlow),.1)}

/* home */
.homeHero{padding:4vh 0 26px;text-align:center;max-width:860px;margin:0 auto}
.greet{font-size:clamp(26px,3.8vw,44px);font-weight:900;font-style:italic;transform:skewX(-3deg);letter-spacing:-.02em;line-height:1.06;animation:rise .5s .05s both}
.greet em{color:var(--em);font-style:italic}
.greetSub{margin-top:12px;font-family:var(--voice);font-style:italic;font-size:16px;color:var(--mid);animation:rise .5s .13s both;line-height:1.6}
.nextAction{margin:26px auto 0;max-width:640px;display:flex;align-items:center;gap:16px;text-align:left;background:linear-gradient(160deg,rgba(19,25,39,.94),rgba(15,21,34,.88));
  border:1px solid rgba(255,179,64,.4);border-radius:16px;padding:18px 20px;animation:rise .5s .2s both;transition:.2s;cursor:pointer}
.nextAction:hover{border-color:rgba(255,179,64,.7);box-shadow:0 0 44px rgba(255,150,60,.18)}
.nextAction .nIco{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(150deg,var(--em),var(--em2));color:#140b00;font-size:19px}
.nextAction .nLbl{font-family:var(--num);font-size:10px;font-weight:700;letter-spacing:.26em;color:var(--em);text-transform:uppercase}
.nextAction .nTxt{font-weight:800;font-size:16px;margin-top:2px;line-height:1.35}
.nextAction .nGo{margin-left:auto;flex:none;font-family:var(--num);font-weight:700;font-size:12px;letter-spacing:.2em;color:var(--em);text-transform:uppercase}
.svcNotice{margin:18px auto 0;max-width:640px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;animation:rise .5s .26s both}
.homeGrid{display:grid;grid-template-columns:1.55fr 1fr;gap:20px;margin-top:24px}
@media(max-width:980px){.homeGrid{grid-template-columns:1fr}}

/* case cards */
.caseCard{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--edge);border-radius:14px;background:linear-gradient(168deg,var(--card),#101624);
  cursor:pointer;transition:transform .2s cubic-bezier(.2,.9,.3,1.2),border-color .2s,box-shadow .2s;margin-bottom:10px;position:relative;overflow:hidden}
.caseCard:before{content:"";position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--hue,var(--em))}
.caseCard:hover{transform:translateY(-3px);border-color:var(--edge2);box-shadow:0 12px 34px rgba(3,5,9,.55)}
.caseAv{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:14px;background:linear-gradient(150deg,#2a344b,#1a2233);color:var(--mid);border:1px solid var(--edge2)}
.pipe{display:flex;gap:3px;margin-top:7px}
.pipe i{width:22px;height:5px;border-radius:3px;background:var(--edge)}
.pipe i.on{background:linear-gradient(90deg,var(--em),var(--em2))}
.pipe i.done{background:rgba(74,222,157,.7)}

/* readiness */
.factor{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(36,48,70,.5)}
.factor:last-child{border-bottom:0}
.factor .fL{flex:1;min-width:0}
.factor .fN{font-weight:700;font-size:13px}
.factor .fD{font-size:11.5px;color:var(--dim);margin-top:1px;line-height:1.45}
.lvl{display:flex;gap:4px;flex:none}
.lvl i{width:16px;height:7px;border-radius:3px;background:var(--edge)}
.lvl.strong i{background:var(--gn)}
.lvl.moderate i:nth-child(-n+2){background:var(--em)}
.lvl.limited i:first-child{background:var(--rd)}
.verdict{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:12px;margin-top:12px;border:1px solid}
.verdict.good{border-color:rgba(74,222,157,.45);background:rgba(74,222,157,.06)}
.verdict.warn{border-color:rgba(255,179,64,.45);background:rgba(255,179,64,.06)}
.verdict.bad{border-color:rgba(255,84,112,.4);background:rgba(255,84,112,.05)}
.verdict b{font-size:14px}
.verdict .vSub{font-size:12px;color:var(--mid);margin-top:2px;line-height:1.5}

/* reorder */
.ordBtns{display:flex;flex-direction:column;gap:3px;flex:none}
.ordBtns button{width:26px;height:22px;border:1px solid var(--edge2);border-radius:6px;color:var(--mid);display:grid;place-items:center;font-size:11px;transition:.13s}
.ordBtns button:hover:not(:disabled){color:#fff;border-color:var(--mid)}
.prefBadge{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:14px;background:rgba(var(--accentGlow),.12);color:var(--accent);border:1px solid rgba(var(--accentGlow),.35)}

/* case sheet */
#sheet{position:fixed;inset:0;z-index:80;display:none;overflow-y:auto;background:rgba(6,8,13,.62);backdrop-filter:blur(3px)}
#sheet.open{display:block}
.sheetIn{min-height:100%;max-width:1150px;margin:0 auto;background:linear-gradient(175deg,#0e1420,#0a0d14 40%);border-left:1px solid var(--edge);border-right:1px solid var(--edge);
  padding:24px clamp(16px,4vw,50px) 80px;animation:sheetUp .35s cubic-bezier(.2,.9,.3,1.05)}
@keyframes sheetUp{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
.backBtn{display:inline-flex;align-items:center;gap:8px;font-family:var(--num);font-weight:700;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);padding:8px 14px;border:1px solid var(--edge);border-radius:9px;transition:.15s}
.backBtn:hover{color:#fff;border-color:var(--edge2)}
.stepRail{display:flex;gap:4px;margin:20px 0 22px;flex-wrap:wrap}
.stepRail button{font-family:var(--num);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:8px 14px;border-radius:8px;border:1px solid transparent;transition:.15s;display:flex;align-items:center;gap:7px}
.stepRail button:hover:not(:disabled){color:#fff;background:rgba(36,48,70,.5)}
.stepRail button.on{color:var(--accent);border-color:rgba(var(--accentGlow),.4);background:rgba(var(--accentGlow),.07)}
.stepRail button .dot{width:7px;height:7px;border-radius:50%;background:var(--edge2)}
.stepRail button.done .dot{background:var(--gn)}
.stepRail button.on .dot{background:var(--accent)}

/* evidence */
.evCard{border:1px solid var(--edge);border-radius:13px;padding:13px 15px;margin-bottom:10px;background:linear-gradient(168deg,var(--card),#101624);transition:.15s;position:relative}
.evCard.sel{border-color:rgba(var(--accentGlow),.55);box-shadow:0 0 20px rgba(var(--accentGlow),.1)}
.evCard .evT{font-weight:800;font-size:14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.evCard .evX{font-family:var(--voice);font-style:italic;font-size:12.5px;color:var(--mid);margin-top:6px;line-height:1.55}
.evCard .evF{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.evTick{flex:none;width:22px;height:22px;border:2px solid var(--edge2);border-radius:7px;display:grid;place-items:center;color:transparent;transition:.15s;font-size:13px}
.evCard.sel .evTick{background:var(--accent);border-color:var(--accent);color:#140b00}
.lockNote{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border:1px dashed rgba(255,84,112,.4);border-radius:11px;background:rgba(255,84,112,.04);font-size:12px;color:var(--mid);line-height:1.55}

/* drafts */
.draftGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:1020px){.draftGrid{grid-template-columns:1fr}}
.draftCard{border:1px solid var(--edge);border-radius:14px;background:linear-gradient(170deg,var(--card),#0f1522);display:flex;flex-direction:column;overflow:hidden;transition:.18s}
.draftCard.sel{border-color:rgba(74,222,157,.6);box-shadow:0 0 26px rgba(74,222,157,.12)}
.draftCard .dHead{padding:13px 15px 10px;border-bottom:1px solid var(--edge)}
.draftCard .dBody{padding:13px 15px;font-family:var(--voice);font-size:12.5px;line-height:1.7;color:#cfd8ea;max-height:340px;overflow-y:auto;white-space:pre-wrap}

.facBtn{display:inline-flex;align-items:center;gap:8px;padding:11px 24px;font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase;border-radius:0;transition:.18s;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);background:linear-gradient(90deg,var(--fac),var(--fac2));color:#04120b}

.privTag{display:inline-flex;align-items:center;gap:6px;font-family:var(--num);font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--fac);border:1px solid rgba(74,222,157,.4);border-radius:999px;padding:3px 10px}

.altRow{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}

/* mic */
.micBtn{display:inline-flex;align-items:center;gap:8px;padding:8px 15px;border-radius:999px;border:1px solid var(--edge2);color:var(--mid);font-family:var(--num);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;transition:.18s;background:rgba(10,13,20,.8)}

.micBtn .rdot{width:8px;height:8px;border-radius:50%;background:var(--rd)}

/* coverage matrix */
.covTable{width:100%;border-collapse:collapse;font-size:12px}

.reqChip.unmet{color:var(--em);border-color:rgba(255,179,64,.5)}

/* modal */
#modal{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;background:rgba(5,7,11,.7);backdrop-filter:blur(4px);padding:18px}

/* toast */
#toast{position:fixed;bottom:30px;left:50%;transform:translate(-50%,20px);z-index:150;background:var(--card2);border:1px solid var(--edge2);border-radius:11px;color:var(--tx);padding:13px 22px;font-weight:600;font-size:13px;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 14px 40px rgba(0,0,0,.6);max-width:min(560px,92vw);text-align:center;line-height:1.5}
#toast.show{opacity:1;transform:translate(-50%,0)}

.glance .g small{display:block;font-family:var(--num);font-size:9px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin-bottom:4px}
.glance .g b{font-size:13px}
.vidBox{border:1px solid var(--edge);border-radius:14px;overflow:hidden;background:#0a0e15;position:relative}
.vidBox video{width:100%;display:block;max-height:320px;background:#000}
.vidPoster{aspect-ratio:16/7;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#1a2438,#0d1220);cursor:pointer}
.vidPoster .playBtn{width:62px;height:62px;border-radius:50%;background:linear-gradient(150deg,var(--em),var(--em2));display:grid;place-items:center;font-size:22px;color:#140b00;box-shadow:0 8px 30px rgba(255,150,60,.4)}
.recDot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--rd);animation:blink 1s infinite}
/* timeline / statuses */
.evLine{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid rgba(36,48,70,.5);align-items:flex-start}
.evLine:last-child{border:0}
.evDot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:4px;background:var(--edge2)}
.evLine.strong .evDot{background:var(--gn);box-shadow:0 0 8px rgba(74,222,157,.5)}
.evLine.weak .evDot{background:var(--em)}
.evLine.self .evDot{background:var(--cy)}
.evLine .evT{font-size:12.5px;font-weight:600}
.evLine .evS{font-size:11px;color:var(--dim);margin-top:1px;line-height:1.45}
.confTag{font-family:var(--num);font-size:8.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px dashed;margin-left:6px}
.confTag.weak{color:var(--em);border-color:rgba(255,179,64,.5)}
.confTag.strong{color:var(--gn);border-color:rgba(74,222,157,.5)}
.confTag.self{color:var(--cy);border-color:rgba(57,214,255,.5)}
/* gmail */
.gAcct{display:flex;align-items:center;gap:12px;border:1px solid var(--edge2);border-radius:12px;padding:12px 14px;background:#0e1420;cursor:pointer;transition:.15s;margin-bottom:8px}
.gAcct:hover{border-color:var(--cy)}
.gAv{width:36px;height:36px;border-radius:50%;background:linear-gradient(150deg,#5a8dff,#39d6ff);display:grid;place-items:center;font-weight:800;color:#04121c;flex:none}
.scopeRow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid rgba(36,48,70,.5);font-size:12.5px;color:var(--mid)}
/* intel hub */
.hubGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:20px}
/* print */
#printArea{display:none}
@media print{
  body>*{display:none!important}
  #printArea{display:block!important;color:#000;background:#fff;font:12pt/1.6 Georgia,serif;padding:0}
  #printArea .pHdr{font:9pt/1.4 Arial,sans-serif;color:#555;border-bottom:1px solid #999;padding-bottom:6pt;margin-bottom:14pt}
}
@media(max-width:560px){
  .libToolbar select{max-width:none;flex:1}
  .letterCard .dBody{max-height:300px}
}

/* ---------- speech-to-text (real Web Speech API) ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
let activeRec=null;
function speechSupported(){return !!SR}
/* attach(btn, noteEl, onFinal, onInterim) — real transcription; truthful states */
function wireMic(btn,note,onFinal,onInterim){
  if(!btn)return;
  if(!SR){
    btn.disabled=true;btn.title='Speech recognition is not supported in this browser';
    if(note)note.innerHTML='🎙 Voice input isn’t supported in this browser — typing works everywhere. (Chrome and Edge support the Web Speech API.)';
    return;
  }
  let rec=null,listening=false;
  const stop=()=>{if(rec){try{rec.stop()}catch(e){}}};
  btn.onclick=()=>{
    if(listening){stop();return}
    if(activeRec)try{activeRec.stop()}catch(e){}
    rec=new SR();activeRec=rec;rec.continuous=true;rec.interimResults=true;rec.lang='en-US';
    rec.onstart=()=>{listening=true;btn.classList.add('rec');btn.querySelector('.mlbl').textContent='Listening… tap to stop';
      if(note)note.innerHTML='Live transcription is on — words appear as you speak. Nothing is uploaded; recognition runs through your browser.'};
    rec.onresult=e=>{let fin='',inter='';
      for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript;else inter+=r[0].transcript}
      if(fin)onFinal(fin.trim());
      if(onInterim)onInterim(inter.trim());};
    rec.onerror=e=>{listening=false;btn.classList.remove('rec');btn.querySelector('.mlbl').textContent='Speak instead of typing';
      if(note){note.classList.add('err');
        note.innerHTML=e.error==='not-allowed'||e.error==='service-not-allowed'
          ?'Microphone permission was denied. Enable it in your browser settings, or keep typing — nothing is lost.'
          :e.error==='no-speech'?'No speech detected — tap the mic to try again, or keep typing.'
          :'Speech recognition stopped ('+esc(e.error)+'). You can keep typing.'}};
    rec.onend=()=>{listening=false;activeRec=null;btn.classList.remove('rec');btn.querySelector('.mlbl').textContent='Speak instead of typing';
      if(onInterim)onInterim('');
      if(note&&!note.classList.contains('err'))note.innerHTML='Stopped. Tap the mic to continue dictating, or edit the text directly.'};
    try{rec.start()}catch(e){}
  };
}

/* ---------- writer readiness (explainable, never a score) ---------- */
function readiness(w){
  const f=[];
  const lvl=(v,hi,mid)=>v>=hi?'strong':v>=mid?'moderate':'limited';
  const obsL=lvl(w.obsDays,12,6);
  f.push({k:'Observation depth',lvl:obsL,d:w.obsDays+' days of direct observation — '+(obsL==='strong'?'enough to describe specific behavior credibly.':obsL==='moderate'?'workable, but the letter will lean on fewer scenes.':'a reader may ask how well this writer actually knows you.')});
  const m=monthsSince(w.lastDirect);const recL=m<=4?'strong':m<=9?'moderate':'limited';
  f.push({k:'Recency',lvl:recL,d:'Last direct contact '+m+' month'+(m===1?'':'s')+' ago — '+(recL==='strong'?'memory of specifics is fresh.':recL==='moderate'?'send memory cues with your packet.':'recall will be thin without strong memory cues.')});
  const durL=lvl(w.weeks,4,2);
  f.push({k:'Duration & frequency',lvl:durL,d:w.weeks+' week'+(w.weeks===1?'':'s')+' together — '+(durL==='strong'?'a sustained working relationship.':durL==='moderate'?'moderate exposure.':'brief exposure; observations may be limited to a few encounters.')});
  const sp=spec();const rel=w.specialty===D.specialty?'strong':(w.specialty==='research'||w.specialty==='fm'||w.specialty==='em'||w.specialty==='cards')?'moderate':'limited';
  f.push({k:'Specialty relevance',lvl:rel,d:rel==='strong'?'Writes from inside '+sp.name+' — the strongest signal for program readers.':'Adjacent to '+sp.name+' — valuable for breadth; pair with an in-specialty letter.'});
  const kw=(w.relationship||'').toLowerCase();
  const negated=/\bno direct\b|\bnot direct|\bwithout direct|\bno 1:1|\bno one-on-one/.test(kw);
  const ctxL=negated?'limited':/direct|one-on-one|1:1|daily|supervis/.test(kw)?'strong':/rounds|weekly|remote/.test(kw)?'moderate':'limited';
  f.push({k:'Relationship context',lvl:ctxL,d:w.relationship});
  const evCount=D.evidence.filter(e=>e.perm==='granted'&&(e.rotationId===w.rotationId||!e.rotationId)).length;
  const evL=lvl(evCount,3,1);
  f.push({k:'Available evidence',lvl:evL,d:evCount+' permissioned evidence item'+(evCount===1?'':'s')+' map to this relationship — '+(evL==='strong'?'a solid memory-cue packet is possible.':evL==='moderate'?'usable; more StoryForge evidence would strengthen the packet.':'build or permission more evidence before asking.')});
  const limited=f.filter(x=>x.lvl==='limited').length,strong=f.filter(x=>x.lvl==='strong').length;
  let verdict,vCls,vSub;
  if(limited>=2){verdict='Consider another writer — or change the plan';vCls='bad';
    vSub='Multiple factors are weak. Honest options: build more observed time, narrow what this letter claims, or ask someone who saw more. Prestige does not substitute for observation.'}
  else if(limited===1||strong<3){verdict='Needs more evidence before asking';vCls='warn';
    vSub='The relationship is real but the evidence base is thin. Strengthen the flagged factor before the request goes out.'}
  else{verdict='Strong candidate';vCls='good';vSub='Deep direct observation with usable evidence. Ask with the strong-letter question and a focused packet.'}
  return {factors:f,verdict,vCls,vSub};
}

/* ---------- pipeline helpers ---------- */
function stageIndex(st){return STAGES.indexOf(st)}
function setStage(c,st){c.stage=st;c.history.push([todayISO,st]);persist()}
function nextActionFor(c){
  const w=wOf(c.writerId);
  switch(c.stage){
    case 'considering':return{t:'Run the readiness check for '+w.name,go:()=>openCase(c.id,'overview')};
    case 'evidence':return{t:'Strengthen evidence for '+w.name,go:()=>openCase(c.id,'evidence')};
    case 'ready':return{t:'Draft the request email to '+w.name,go:()=>openCase(c.id,'request')};
    case 'asked':{const days=Math.round((new Date(todayISO)-new Date(c.request.sent))/(86400000));
      return days>=14?{t:'No reply from '+w.name+' in '+days+' days — send a follow-up or line up a backup',go:()=>openCase(c.id,'request')}
                    :{t:'Waiting on '+w.name+' — follow up after ~2 weeks',go:()=>openCase(c.id,'request')}}
    case 'agreed':return{t:'Build and send the supporting packet to '+w.name,go:()=>openCase(c.id,'packet')};
    case 'packetSent':return{t:'Hand off to '+w.name+'’s secure faculty workspace',go:()=>openCase(c.id,'status')};
    case 'drafts':{const b=D.builds[c.id];
      return{t:b&&b.chosenId?'Finish the writer package for '+w.name+' in LOR Builder':'Build the letter '+w.name+' asked for — open LOR Builder',go:()=>openBuilder(c.id,b&&b.chosenId?7:undefined)}};
    case 'facultyWorking':return{t:w.name+' is working — nothing needed from you right now',go:()=>openCase(c.id,'status')};
    case 'uploadPending':return{t:'Confirm the official upload for '+w.name+'’s letter',go:()=>openCase(c.id,'status')};
    case 'uploaded':return{t:'Assign '+w.name+'’s letter to programs',go:()=>go('programs')};
    case 'assigned':return{t:'Send a thank-you to '+w.name,go:()=>openCase(c.id,'status')};
    default:return{t:'Review '+w.name+'’s case',go:()=>openCase(c.id,'overview')};
  }
}
function topNextAction(){
  const order=['drafts','ready','agreed','asked','packetSent','uploadPending','uploaded','considering','evidence','assigned','facultyWorking','thanked'];
  const active=[...D.cases].sort((a,b)=>order.indexOf(a.stage)-order.indexOf(b.stage));
  // surface the Marchetti stall first if overdue
  const stalled=D.cases.find(c=>c.stage==='asked'&&Math.round((new Date(todayISO)-new Date(c.request.sent))/86400000)>=14);
  const c=stalled||active[0];
  return c?{...nextActionFor(c),caseId:c.id}:null;
}
/* ---------- deterministic demo drafting (labeled — no live AI) ---------- */
const CONFIRM='<span class="confirmTag">[Faculty to confirm]</span>';
function grantedEvidence(c){return c.selectedEvidence.map(evOf).filter(e=>e&&e.perm==='granted')}
function evSentence(e,studentFirst){
  const base=studentFirst+' '+e.fact+'.';
  return e.prov==='sf'||e.prov==='stu'?esc(base)+' '+CONFIRM:esc(base);
}
function draftDirections(c){
  const w=wOf(c.writerId),r=rOf(w.rotationId),sp=spec(),S=D.student;
  const evs=grantedEvidence(c);
  const rel=`${S.first} worked with me as a ${r?r.role.toLowerCase():'clinical extern'} ${r?'on '+r.name.toLowerCase():''} at ${w.inst.split('(')[0].trim()}${r&&r.start?', from '+fmtD(r.start)+(r.end?' to '+fmtD(r.end):' to the present'):''}.`;
  const head=`To the ${sp.name} Residency Selection Committee:`;
  const endorse=`<span class="confirmTag">[Endorsement strength — reserved for ${esc(w.name)}. Applicant-prepared drafts never propose how strongly a writer recommends.]</span>`;
  const cvE=evs.filter(e=>e.prov==='doc');
  const storyE=evs.filter(e=>e.prov==='sf');
  const statedE=evs.filter(e=>e.prov==='stu');
  const narr=c.narrative?`<i>${esc('Context from '+S.first+': '+c.narrative)}</i> ${CONFIRM}`:'';
  const s=S.first;
  const dirs=[];
  dirs.push({id:'A',title:'Structured & focused',warmth:'Cooler · evaluative',len:'Shortest',
    desc:'Competency-led paragraphs. Reads like an evaluation: relationship, evidence, growth.',
    html:[
      esc(head),
      esc(rel)+' '+CONFIRM,
      (cvE.length?cvE.map(e=>evSentence(e,s)).join(' '):'')||esc(s+' maintained a consistent record across the rotation.')+' '+CONFIRM,
      storyE.length?('Two behaviors stood out. '+storyE.map(e=>evSentence(e,s)).join(' ')):'',
      statedE.length?statedE.map(e=>evSentence(e,s)).join(' '):'',
      narr,endorse
    ].filter(Boolean).join('\n\n')});
  dirs.push({id:'B',title:'Narrative & warm',warmth:'Warmest · story-first',len:'Longest',
    desc:'Opens inside a specific scene, then widens to the relationship and record.',
    html:[
      esc(head),
      storyE.length?('There is a moment I would want a selection committee to see. '+evSentence(storyE[0],s)+' It is representative of how '+s+' works.'):esc('I want to begin with how '+s+' works day to day.')+' '+CONFIRM,
      esc(rel)+' '+CONFIRM,
      storyE.slice(1).map(e=>evSentence(e,s)).join(' '),
      (cvE.length?cvE.map(e=>evSentence(e,s)).join(' '):''),
      statedE.length?statedE.map(e=>evSentence(e,s)).join(' '):'',
      narr,endorse
    ].filter(Boolean).join('\n\n')});
  dirs.push({id:'C',title:'Chronological & balanced',warmth:'Even · relationship-first',len:'Medium',
    desc:'Follows the rotation in order: how the relationship formed, what happened, what changed.',
    html:[
      esc(head),
      esc(rel)+' '+CONFIRM,
      esc('Early in the rotation, '+s+' established a baseline of preparation and reliability.')+' '+CONFIRM,
      storyE.length?('As the weeks progressed: '+storyE.map(e=>evSentence(e,s)).join(' ')):'',
      (cvE.length?('By the end of our time together, '+cvE.map(e=>evSentence(e,s)).join(' ')):''),
      statedE.length?statedE.map(e=>evSentence(e,s)).join(' '):'',
      narr,endorse
    ].filter(Boolean).join('\n\n')});
  return dirs;
}

/* ---------- faculty draft (evidence-bound, one draft) ---------- */
const CMP_COHORTS=[
  'Students I have directly supervised on this service over the past five years (roughly 40)',
  'Clinical externs at this site over the past three years (about 15)',
  'I prefer not to make a comparison'
];
const CMP_TIERS=['among the strongest','well above the typical student','comparable to my strong students'];
const ENDORSE_OPTS=[
  {id:'own',label:'I will write my own closing',txt:null},
  {id:'enthusiastic',label:'Recommend without reservation',txt:'I recommend {S} without reservation for residency training in {SP}.'},
  {id:'strong',label:'Strongly recommend',txt:'I strongly recommend {S} for residency training in {SP}.'},
  {id:'positive',label:'Recommend',txt:'I am glad to recommend {S} for residency training in {SP}.'},
  {id:'reserved',label:'Recommend with context',txt:'I recommend {S} for residency training in {SP}, in the context described above.'}
];
function buildFacultyDraft(c){
  const w=wOf(c.writerId),r=rOf(w.rotationId),sp=spec(),S=D.student,fc=c.fac;
  const P=[];const s=S.first;const pron=w.pron==='she'?'she':'he';
  P.push({id:'p_intro',prov:['obs'],
    txt:`I am writing to evaluate ${S.name}, who worked with me as a ${r?r.role.toLowerCase():'clinical extern'}${r?' on '+r.name.toLowerCase():''} at ${w.inst.split('(')[0].trim()}${r&&r.start?' from '+fmtD(r.start)+(r.end?' to '+fmtD(r.end):' to the present'):''}. ${fc.relTxt||w.relationship}. This letter is based on that direct experience.`,
    alt:{concise:`${S.name} worked with me as a ${r?r.role.toLowerCase():'clinical extern'} at ${w.inst.split('(')[0].trim()}. ${fc.relTxt||w.relationship}.`,
         fuller:`I am pleased to write on behalf of ${S.name}. ${s} joined me as a ${r?r.role.toLowerCase():'clinical extern'}${r?' on '+r.name.toLowerCase():''} at ${w.inst.split('(')[0].trim()}${r&&r.start?' from '+fmtD(r.start)+(r.end?' to '+fmtD(r.end):' to the present'):''}, and ${fc.relTxt?fc.relTxt.toLowerCase():w.relationship.toLowerCase()}. Everything that follows reflects what I personally saw during that time.`}});
  const cueIds=Object.keys(fc.cues);
  cueIds.forEach(id=>{
    const dec=fc.cues[id];const e=evOf(id);if(!e)return;
    if(dec.decision==='observed'){
      P.push({id:'p_'+id,prov:['obs'],txt:`I directly observed the following: ${s} ${dec.correction||e.fact}. This is the kind of behavior I weight most heavily in a future resident.`,
        alt:{concise:`I directly observed that ${s} ${dec.correction||e.fact}.`,
             fuller:`One episode I witnessed firsthand: ${s} ${dec.correction||e.fact}. Moments like this are, in my experience, better predictors of residency performance than any single evaluation score.`}});
    }else if(dec.decision==='context'){
      P.push({id:'p_'+id,prov:['ctx'],txt:`${s} has shared with me that ${pron} ${dec.correction||e.fact}. While I did not observe this directly, it is consistent with the ${s} I supervised.`,
        alt:{concise:`${s} reports that ${pron} ${dec.correction||e.fact} — consistent with what I saw.`,
             fuller:`${s} has told me that ${pron} ${dec.correction||e.fact}. I did not witness the episode myself, but it aligns closely with the pattern of behavior I observed directly.`}});
    }
  });
  fc.obs.forEach((o,i)=>{
    P.push({id:'p_obs'+i,prov:['obs',o.via==='voice'?'app':'app'].slice(0,1).concat(['app']),
      txt:o.txt, alt:null, spoken:o.via==='voice'});
  });
  if(fc.comparison&&fc.comparison.cohort&&fc.comparison.cohort!==CMP_COHORTS[2]&&fc.comparison.tier){
    P.push({id:'p_cmp',prov:['obs'],txt:`For context: compared with ${fc.comparison.cohort.charAt(0).toLowerCase()+fc.comparison.cohort.slice(1)}, ${s} is ${fc.comparison.tier}.`,alt:null});
  }
  const eo=ENDORSE_OPTS.find(x=>x.id===fc.endorsement);
  if(eo&&eo.txt){P.push({id:'p_end',prov:['app'],txt:eo.txt.replace('{S}',S.name).replace('{SP}',sp.name),alt:null})}
  else if(eo){P.push({id:'p_end',prov:['app'],txt:'[Write your closing endorsement in your own words — this line is yours alone.]',alt:null})}
  return P;
}

  const conf=L.pars.filter(p=>p.needsConfirm).length;
  issues.push({t:conf+' claims marked for writer confirmation',d:'Observation and evaluation claims stay flagged until '+wOf(c.writerId).name+' confirms them.',ok:true});
  issues.push({t:'No invented comparison or ranking',d:'The draft contains no cohort ranking — comparison, if any, is added privately by the writer.',ok:true});
  issues.push({t:'Suggested closing is labeled',d:'The conservative closing is explicitly marked as the writer’s to keep, rewrite, or replace.',ok:true});
  return issues;
}

function openImportReview(rows,source,srcLabel){
  const items=rows.map(r=>({row:r,dup:dupOf(r),decision:dupOf(r)?'skip':'accept'}));
  const paint=()=>{
    $('#modalIn').innerHTML=`<div class="h2">Review detected <em>rotations</em></div>
      <p class="sub" style="margin-top:8px">Source: ${esc(srcLabel)}. Nothing is added until you approve it. Duplicates are matched against what you already have.</p>

        <div class="evCard ${it.decision==='accept'||it.decision==='merge'?'sel':''}">
          <div class="evT">${esc(it.row.name)} ${it.dup?`<span class="chip gd" title="Matches “${esc(it.dup.name)}” already in your plan">Possible duplicate</span>`:''}</div>
          <div class="rowS">${esc(it.row.site)} · ${esc(it.row.role)} · ${fmtD(it.row.start)} – ${it.row.end?fmtD(it.row.end):'present'} (${it.row.weeks} wk)</div>
          <div class="evF">
            <button class="rowBtn ${it.decision==='accept'?'pri':''}" data-dec="accept" data-i="${i}" ${it.dup?'disabled title="Already in your plan — merge or skip instead"':''}>Accept</button>
            ${it.dup?`<button class="rowBtn ${it.decision==='merge'?'pri':''}" data-dec="merge" data-i="${i}" title="Update the existing rotation’s dates and site from this import">Merge into existing</button>`:''}
            <button class="rowBtn ${it.decision==='edit'?'pri':''}" data-dec="edit" data-i="${i}">Edit then add</button>
            <button class="rowBtn ${it.decision==='skip'?'pri':''}" data-dec="skip" data-i="${i}">Skip</button>
          </div>
        </div>`).join('')}</div>
      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button class="btn pri" id="impGo">Approve import</button><button class="btn alt" onclick="closeModal()">Cancel</button></div>`;
    $$('#modalIn [data-dec]').forEach(b=>b.onclick=()=>{items[+b.dataset.i].decision=b.dataset.dec;paint()});
    $('#impGo').onclick=()=>{
      let added=0,merged=0,skipped=0;
      items.forEach(it=>{
        if(it.decision==='accept'){D.rotations.push({id:uid(),...it.row,source,writerIds:[]});added++}
        else if(it.decision==='merge'&&it.dup){Object.assign(it.dup,{site:it.row.site,start:it.row.start,end:it.row.end,weeks:it.row.weeks,source});merged++}
        else if(it.decision==='edit'){D.rotations.push({id:uid(),...it.row,source,writerIds:[],_needsEdit:true});added++}

      toast(`Import approved — ${added} added, ${merged} merged, ${skipped} skipped. Timeline Builder remains the source of truth.`);
      if(pend){delete pend._needsEdit;persist();openRotModal(pend.id)}
    };
  };
  modal('',true);paint();
}

function reqMet(p,req){
  const cases=p.assigned.map(cOf).filter(Boolean);const ws=cases.map(c=>wOf(c.writerId));
  switch(req.type){
    case 'chair':return ws.some(w=>/chair/i.test(w.title));
    case 'im':return ws.some(w=>w.specialty==='im');
    case 'im2':return ws.filter(w=>w.specialty==='im').length>=2;
    case 'recent':return ws.length>0&&ws.every(w=>monthsSince(w.lastDirect)<=12);
    default:return false;
  }
}

              <div class="row"><div class="rowMain"><div class="rowT" style="font-size:13px">3 · Draft the request</div></div><button class="rowBtn" data-goto="request">Go</button></div>`
            :`<div class="rowS" style="margin-bottom:8px">Weak evidence is handled honestly — pick a real path, not louder prose:</div>
              <div class="row"><div class="rowMain"><div class="rowT" style="font-size:13px">Strengthen the evidence</div><div class="rowS">More observed time, or permission more StoryForge items tied to this rotation.</div></div><button class="rowBtn" data-goto="evidence">Evidence</button></div>
              <div class="row"><div class="rowMain"><div class="rowT" style="font-size:13px">Narrow the claim</div><div class="rowS">A short, specific letter about what ${esc(w.name.split(' ').slice(-1)[0])} truly saw can still serve — e.g., paired with a required chair letter.</div></div></div>
              <div class="row"><div class="rowMain"><div class="rowT" style="font-size:13px">Delay the request</div><div class="rowS">Ask after more contact, if the calendar allows.</div></div></div>
              <div class="row"><div class="rowMain"><div class="rowT" style="font-size:13px">Consider another writer</div><div class="rowS">Your writer list shows who has deeper direct observation.</div></div><button class="rowBtn" data-closegoto="writers">Writers</button></div>`}
        </div></div>
        <div class="panel"><div class="pHead"><div class="h2">Case <em>history</em></div></div><div class="pBody">
          ${c.history.map(([d,s])=>`<div class="row" style="padding:8px 0"><div class="rowMain"><div class="rowS">${fmtD(d)} — <b style="color:var(--tx)">${STAGE_META[s].label}</b></div></div></div>`).join('')}
        </div></div>
      </div>
    </div>`;
  }
  if(step==='evidence'){
    return `<div class="noteBox" style="margin-bottom:16px"><b>Evidence before prose.</b> Everything you select keeps a visible provenance label, and nothing you supply can silently become a faculty observation — the writer confirms or rejects each item later, in private.</div>
    <div class="grid2">
      <div>
        <div class="panel"><div class="pHead"><div class="h2">StoryForge & <em>evidence</em></div><span class="chip em" style="font-size:8.5px" title="StoryForge remains the canonical home of your stories — LOR Studio only references them by permission">Referenced, not copied</span></div>
        <div class="pBody">
          ${D.evidence.map(e=>{
            const sel=c.selectedEvidence.includes(e.id);
            const relevant=!e.rotationId||e.rotationId===w.rotationId;
            if(e.perm==='private')return `<div class="evCard" style="opacity:.85"><div class="evT">🔒 ${esc(e.title)} ${provChip(e.prov)}</div>
              <div class="lockNote" style="margin-top:8px"><span>🔐</span><span><b>Private in StoryForge.</b> This story hasn’t been permissioned for letter use. LOR Studio never reads private stories.</span></div>
              <div class="evF"><button class="rowBtn pri" data-grant="${e.id}">Grant permission for this case…</button></div></div>`;
            if(e.perm==='flagged')return `<div class="evCard"><div class="evT">⚠️ ${esc(e.title)} ${provChip(e.prov)}</div>
              <div class="evX">“${esc(e.excerpt)}”</div>
              <div class="lockNote" style="margin-top:8px;border-color:rgba(255,179,64,.5)"><span>🛡</span><span><b>Patient-privacy check:</b> ${esc(e.deidWarn)}</span></div>
              <div class="evF"><button class="rowBtn pri" data-deid="${e.id}">Review de-identified version…</button></div></div>`;
            return `<div class="evCard ${sel?'sel':''}">
              <div class="evT"><button class="evTick" data-ev="${e.id}" aria-pressed="${sel}" aria-label="${sel?'Remove':'Include'} ${esc(e.title)}">✓</button>${esc(e.title)} ${provChip(e.prov)} ${e.mentorReviewed?'<span class="chip cy" style="font-size:8px">Mentor-reviewed</span>':''}${e.deid?'<span class="chip gn" style="font-size:8px">De-identified</span>':''}</div>
              <div class="evX">“${esc(e.excerpt)}”</div>
              <div class="evF">${e.tags.map(t=>`<span class="chip" style="font-size:8.5px">${COMPS[t]}</span>`).join('')}${!relevant?'<span class="chip" style="font-size:8.5px" title="From a different rotation — still usable as background">Other rotation</span>':''}</div>
            </div>`}).join('')}
          <div class="rowS" style="margin-top:6px">Develop or edit stories in <b>StoryForge</b> — LOR Studio references them here by permission only.</div>
        </div></div>
      </div>
      <div>
        <div class="panel"><div class="pHead"><div class="h2">Your <em>context</em> for this writer</div></div><div class="pBody">
          <div class="fld"><label for="caseNarr">What should this letter carry? (speak or type)</label>
            <textarea id="caseNarr" placeholder="e.g., I want this letter to carry the inpatient story — what she saw me do with families…">${esc(c.narrative)}</textarea>
            <div class="hint">Labeled <b>student-stated</b> wherever it appears. It guides emphasis — it never becomes the writer’s observation.</div></div>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <button class="micBtn" id="caseMic"><span class="rdot"></span><span class="mlbl">Speak instead of typing</span></button>
            <span id="caseInterim" class="interim" aria-live="polite"></span>
          </div>
          <div class="micNote" id="caseMicNote">${speechSupported()?'Real browser speech-to-text (Web Speech API). Words land in the box as you speak.':''}</div>
          <div class="divider"></div>
          <div class="rowS"><b style="color:var(--tx)">${c.selectedEvidence.length}</b> evidence item(s) selected for this case — they feed the packet${c.draftRequested?' and your working drafts':''}.</div>
          <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><button class="btn pri" data-goto="packet">Preview supporting packet ▸</button></div>
        </div></div>
      </div>
    </div>`;
  }
  if(step==='packet'){
    const evs=grantedEvidence(c);
    return `<div class="noteBox" style="margin-bottom:16px">This is exactly what ${esc(w.name)} will receive with your request — a memory-provoking packet, not homework. The official MyERAS request delivers only metadata; this packet is the missing layer.</div>
    <div class="panel"><div class="pHead"><div class="h2">Supporting packet <em>preview</em></div><span class="chip cy" style="font-size:8.5px">As the writer will see it</span></div>
      <div class="pBody">
        <div class="eyebrow" style="margin-bottom:8px">Request summary</div>
        <div class="rowS" style="margin-bottom:14px">${esc(D.student.name)}, ${esc(D.student.degree)} — applying in <b>${esc(spec().name)}</b>, 2027 season · letter needed by <b>${fmtD(c.request.deadline)}</b> · official upload via ${esc(spec().service)} · narrative letters: PDF, max 1&nbsp;MB, letterhead + signature recommended.</div>
        <div class="eyebrow" style="margin-bottom:8px">Your relationship (from ${esc(D.student.first)})</div>
        <div class="rowS" style="margin-bottom:14px">${r?esc(r.name)+' · '+fmtD(r.start)+(r.end?' – '+fmtD(r.end):' – present')+' · ':''}${esc(w.relationship)} <span class="prov stu"><i></i>Student-stated</span></div>
        <div class="eyebrow" style="margin-bottom:8px">Memory cues — each labeled by who reported it</div>
        ${evs.length?evs.map(e=>`<div class="evCard"><div class="evT" style="font-size:13px">${esc(e.title)} ${provChip(e.prov)}</div><div class="evX">“${esc(e.deid?e.deidExcerpt:e.excerpt)}”</div></div>`).join(''):'<div class="warnBox">No evidence selected yet — the packet would arrive empty. Go back one step and select the moments this writer saw.</div>'}
        ${c.narrative?`<div class="eyebrow" style="margin:14px 0 8px">Emphasis requested by ${esc(D.student.first)}</div><div class="rowS voiceTxt">“${esc(c.narrative)}” <span class="prov stu"><i></i>Student-stated</span></div>`:''}
        <div class="eyebrow" style="margin:14px 0 8px">Attached documents</div>
        <div class="rowS">CV · Personal statement · Official letter request form <span class="chip dashed" style="font-size:8.5px">Simulated attachments — File Vault integration planned</span></div>
      </div></div>
    <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
      ${c.stage==='agreed'||c.stage==='drafts'?`<button class="btn pri" id="pktSend">Mark packet as sent to ${esc(w.name.split(' ').slice(-1)[0])}</button>`:
        stageIndex(c.stage)>=stageIndex('packetSent')?'<span class="chip gn">Packet sent '+(c.request.sent?'· '+fmtD(c.request.sent):'')+'</span>':
        `<button class="btn pri" disabled title="Send the request first — the packet goes out after the writer agrees">Mark packet as sent</button><span class="rowS" style="align-self:center">The packet goes out after the writer agrees — draft the request first.</span>`}
      <button class="btn alt" data-goto="request">Request & follow-up ▸</button>
    </div>`;
  }
  if(step==='request'){
    const T=emailTemplates(c);
    const days=c.request.sent?Math.round((new Date(todayISO)-new Date(c.request.sent))/86400000):null;
    return `<div class="grid2">
      <div>
        <div class="panel"><div class="pHead"><div class="h2">The <em>ask</em></div></div><div class="pBody">
          <div class="rowS" style="margin-bottom:10px">The question that permits an honest no: <i>“Would you feel comfortable writing me a <b>strong</b> letter…?”</i> Allow ~6 weeks when possible.</div>
          <div class="fld"><label for="reqTxt">Request email — edit freely</label><textarea id="reqTxt" style="min-height:220px;font-size:13px">${esc(T.request)}</textarea></div>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button class="btn alt sm" data-copy="reqTxt">Copy to clipboard</button>
            ${!c.request.sent?`<button class="btn pri" id="markAsked">I sent it — mark as Asked</button>`:`<span class="chip gn">Asked ${fmtD(c.request.sent)}</span>`}
          </div>
          <div class="micNote">LOR Studio never sends email for you — you stay the sender, we keep the record.</div>
        </div></div>
      </div>
      <div>
        ${c.request.sent&&!['agreed','declined'].some(s=>c.history.some(h=>h[1]===s))?`
        <div class="panel" style="margin-bottom:16px"><div class="pHead"><div class="h2">Their <em>answer</em></div></div><div class="pBody">
          <div class="rowS" style="margin-bottom:10px">${days>=14?`<b style="color:var(--em)">No reply in ${days} days.</b> A gentle follow-up is fair — and it’s time to warm up a backup.`:`Asked ${days} day(s) ago. Give it ~2 weeks before following up.`}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="rowBtn pri" id="ansYes">They agreed</button>
            <button class="rowBtn" id="ansDraft">They said “send me a draft”</button>
            <button class="rowBtn" id="ansNo">They declined</button>
          </div>
        </div></div>`:''}
        <div class="panel" style="margin-bottom:16px"><div class="pHead"><div class="h2">Follow-up & <em>thanks</em></div></div><div class="pBody">
          <div class="fld"><label for="fuTxt">Polite follow-up (${c.request.followups.length} logged)</label><textarea id="fuTxt" style="min-height:120px;font-size:12.5px">${esc(T.followup)}</textarea></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px"><button class="btn alt sm" data-copy="fuTxt">Copy</button>
            <button class="rowBtn" id="logFu" ${!c.request.sent?'disabled title="Send the request first"':''}>Log a follow-up</button></div>
          <div class="fld"><label for="tyTxt">Thank-you note</label><textarea id="tyTxt" style="min-height:100px;font-size:12.5px">${esc(T.thankyou)}</textarea></div>
          <button class="btn alt sm" data-copy="tyTxt">Copy</button>
        </div></div>
        <div class="panel"><div class="pHead"><div class="h2">Backup <em>plan</em></div></div><div class="pBody">
          <div class="rowS" style="margin-bottom:8px">Every deadline deserves a plan B. Draft the backup ask now; send it only if you need it.</div>
          <div class="fld"><textarea id="bkTxt" style="min-height:120px;font-size:12.5px" aria-label="Backup writer email">${esc(T.backup)}</textarea></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn alt sm" data-copy="bkTxt">Copy</button><button class="rowBtn" id="bkAdd">Add Dr. Hale as a writer</button></div>
        </div></div>
      </div>
    </div>`;
  }
  if(step==='drafts'){
    const b=D.builds[c.id];
    return `<div class="noteBox" style="margin-bottom:16px"><b>${esc(w.name)} asked you to send a draft.</b> Letter drafting now lives in <b>LOR Builder</b> — the guided flow that turns your rotations, StoryForge stories, and verified facts into complete, comparable applicant-prepared letters.</div>
    <div class="panel"><div class="pBody" style="padding-top:16px">
      ${b&&b.letters?`<div class="rowS" style="margin-bottom:10px">Builder progress: step ${b.step} of 8 · ${b.letters.length} complete letter options generated${b.chosenId?' · option '+b.chosenId+' selected':''}.</div>`:'<div class="rowS" style="margin-bottom:10px">No Builder session for this letter yet.</div>'}
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn pri" id="openBuilder">✦ ${b?'Continue in LOR Builder':'Open LOR Builder'} ▸</button>
        ${b&&b.chosenId?`<button class="btn alt" id="caseViewLetter">View selected letter</button>`:''}
      </div>
    </div></div>`;
  }
  /* status */
  const canFac=stageIndex(c.stage)>=stageIndex('packetSent')&&!c.fac.done&&c.stage!=='drafts';
  const allowed=STAGES.slice(Math.max(stageIndex(c.stage),0)).filter(s=>!['drafts','evidence'].includes(s));
  return `<div class="grid2">
    <div>
      <div class="panel" style="margin-bottom:16px"><div class="pHead"><div class="h2">Letter <em>status</em></div><span class="chip dashed" style="font-size:8.5px" title="LOR Studio never monitors ERAS — you record what you know">Self-reported</span></div>
        <div class="pBody">
          <div class="fld"><label for="stSel">Update status</label>
            <select id="stSel">${allowed.map(s=>`<option value="${s}" ${s===c.stage?'selected':''}>${STAGE_META[s].label}</option>`).join('')}</select>
            <div class="hint">${esc(STAGE_META[c.stage].hint)} “Uploaded” means <i>you</i> confirmed it with the writer or the official system — LOR Studio has no ERAS connection.</div></div>
          <div class="eyebrow" style="margin:14px 0 6px">History</div>
          ${c.history.slice().reverse().map(([d,s])=>`<div class="row" style="padding:7px 0"><div class="rowS">${fmtD(d)} — <b style="color:var(--tx)">${STAGE_META[s].label}</b></div></div>`).join('')}
        </div></div>
      <div class="panel" style="margin-bottom:16px"><div class="pHead"><div class="h2">Tracking <em>timeline</em></div><span class="chip dashed" style="font-size:8.5px">Confidence-aware</span></div><div class="pBody">
        ${c.events.length?c.events.map(e=>`<div class="evLine ${CONF_META[e.conf].cls}"><span class="evDot"></span><div><div class="evT">${esc(e.label)}<span class="confTag ${CONF_META[e.conf].cls}">${CONF_META[e.conf].label}</span></div><div class="evS">${fmtD(e.t)}${e.d?' — '+esc(e.d):''}</div></div></div>`).join(''):'<div class="rowS">No delivery activity yet — events appear here once you send from the Builder or the Writer Depot.</div>'}
        ${c.collab.length?`<div class="eyebrow" style="margin:12px 0 6px">Change requests from the writer</div>${c.collab.map(m=>`<div class="warnBox" style="margin-bottom:8px">“${esc(m.txt)}” <span class="chip" style="font-size:8px;margin-left:6px">${fmtD(m.t)}</span></div>`).join('')}`:''}
      </div></div>
      <div class="panel"><div class="pHead"><div class="h2">Program <em>assignment</em></div></div><div class="pBody">
        <div class="rowS">${D.programs.filter(p=>p.assigned.includes(c.id)).map(p=>esc(p.name.split('—')[0].trim())).join(' · ')||'Not planned into any program yet.'}</div>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn alt sm" id="stProg">Open program plan ▸</button><button class="btn alt sm" id="stDepot">Open Writer Depot ▸</button></div>
      </div></div>
    </div>
    <div>
      <div class="boundary" style="margin-bottom:16px">
        <div class="bIco">🔐</div>
        <div class="h2" style="transform:none">The faculty-private <em>boundary</em></div>
        <p class="sub" style="margin-top:8px;max-width:460px;margin-inline:auto">Everything past this point belongs to ${esc(w.name)}: their intake answers, comparison basis, endorsement strength, edits${c.waived?', and — because you waived access — the final letter itself':''}. You’ll see status, never content.</p>
        ${c.fac.done
          ?`<button class="btn alt" style="margin-top:14px" disabled title="${esc(w.name)} completed this letter. The workspace and the ${c.waived?'waived final letter':'letter content'} remain confidential — there is nothing for a student to open.">Faculty workspace — closed & confidential</button>`
          :canFac
            ?`<button class="btn pri" style="margin-top:14px" id="openFac">Open the secure faculty link · prototype simulation</button>
               <div class="micNote" style="max-width:420px;margin:8px auto 0">In production this link goes only to ${esc(w.name)}’s email. Opening it here is a labeled role simulation so you can experience the writer’s side.</div>`
            :`<button class="btn alt" style="margin-top:14px" disabled title="${c.stage==='drafts'?'Choose a working draft and send the handoff first.':'Send the packet first — the faculty workspace opens with the handoff.'}">Faculty link not yet active</button>
               <div class="micNote" style="max-width:420px;margin:8px auto 0">${c.stage==='drafts'?'Finish the working-drafts step — the faculty link activates at handoff.':'The secure link activates once your packet is sent.'}</div>`}
      </div>
      ${c.waived?`<div class="warnBox"><b>Waived letter.</b> You chose to waive your right of access under FERPA when creating the official request. That choice is what makes the letter credible to programs — and it means the submitted letter is never visible in LOR Studio, to you or your mentor.</div>`:''}
    </div>
  </div>`;
}

function renderDraftsStep(c,w){
  const evs=grantedEvidence(c);
  const built=c.drafts&&c.drafts.builtWith;
  const dirty=built&&(built.ev.join(',')!==c.selectedEvidence.join(',')||built.narr!==c.narrative);
  return `
    <div class="noteBox" style="margin-bottom:14px"><b>${esc(w.name)} asked you to send a draft.</b> That’s common — and it has an ethical shape. You may prepare evidence and a disclosed working draft; the assessment, endorsement, and final letter must become ${esc(w.name.split(' ').slice(-1)[0])}’s own. Every version below is labeled, contains no endorsement language, and marks each observation <b>[Faculty to confirm]</b>.</div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px">
      <span class="chip gd dashed">Prototype generation using demo logic — no live AI call</span>
      <span class="chip">${evs.length} evidence items + your context feed these drafts</span>
      <button class="btn ${c.drafts&&c.drafts.dirs?(dirty?'pri':'alt'):'pri'} sm" id="genDrafts" ${evs.length===0&&!c.narrative?'disabled title="Select at least one evidence item or add your context first — drafts are built from ingredients, not thin air"':''}>${c.drafts&&c.drafts.dirs?(dirty?'Ingredients changed — rebuild drafts':'Rebuild from current ingredients'):'Generate 3 working directions'}</button>
      ${evs.length===0&&!c.narrative?'<span class="rowS">Select evidence first — drafts are built from ingredients, not thin air.</span>':''}
      ${dirty?'<span class="chip em" style="font-size:8.5px">Drafts below were built from older ingredients</span>':''}
    </div>
    ${c.drafts&&c.drafts.dirs?`
    <div class="draftGrid">
      ${c.drafts.dirs.map(d=>`<div class="draftCard ${c.drafts.chosen===d.id?'sel':''}">
        <div class="dHead">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b style="font-size:14px">Direction ${d.id} — ${d.title}</b>${c.drafts.chosen===d.id?'<span class="chip gn" style="font-size:8.5px">Chosen</span>':''}</div>
          <div class="rowS" style="margin-top:4px">${d.desc}</div>
          <div style="display:flex;gap:6px;margin-top:7px;flex-wrap:wrap"><span class="chip" style="font-size:8.5px">${d.warmth}</span><span class="chip" style="font-size:8.5px">${d.len}</span></div>
        </div>
        <div class="dBody">${d.html}</div>
        <div class="dFoot">
          <span class="wmark">Applicant-prepared working draft — faculty confirmation required</span>
          <button class="rowBtn ${c.drafts.chosen===d.id?'':'pri'}" data-pick="${d.id}">${c.drafts.chosen===d.id?'Chosen ✓':'Choose this direction'}</button>
        </div>
      </div>`).join('')}
    </div>
    <div style="display:flex;gap:12px;margin-top:18px;align-items:center;flex-wrap:wrap">
      <button class="btn pri" id="sendFac" ${!c.drafts.chosen?'disabled title="Choose one direction first — the writer receives one working draft plus your full packet"':''}>Send chosen draft + packet to ${esc(w.name.split(' ').slice(-1)[0])} ▸</button>
      <span class="rowS" style="max-width:420px">Same facts, different shapes. The versions may differ in structure, warmth, and concision — never in facts, comparison, or endorsement.</span>
    </div>`:''}`;
}

function wireCaseStep(c,w,r,step){
  $$('#stepBody [data-goto]').forEach(b=>b.onclick=()=>{D.ui.caseStep=b.dataset.goto;persist();renderSheet()});
  $$('#stepBody [data-closegoto]').forEach(b=>b.onclick=()=>{closeCase();go(b.dataset.closegoto)});
  $$('#stepBody [data-copy]').forEach(b=>b.onclick=()=>{
    const el=document.getElementById(b.dataset.copy);
    const done=()=>toast('Copied — paste it into your own email client. LOR Studio never sends mail for you.');
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(el.value).then(done,()=>{el.select();document.execCommand('copy');done()});
    else{el.select();document.execCommand('copy');done()}});
  if(step==='evidence'){
    $$('#stepBody [data-ev]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.ev;const i=c.selectedEvidence.indexOf(id);
      if(i>=0)c.selectedEvidence.splice(i,1);else c.selectedEvidence.push(id);
      persist();renderSheet()});
    $$('#stepBody [data-grant]').forEach(b=>b.onclick=()=>{
      const e=evOf(b.dataset.grant);
      modal(`<div class="h2">Permission <em>StoryForge story</em></div>
        <p class="sub" style="margin-top:10px">“${esc(e.title)}” is private in StoryForge. Granting permission makes it referenceable in this recommendation case only — it stays student-authored, and the writer will see exactly that label. <span class="chip dashed" style="font-size:8.5px">Simulated — production permission lives in StoryForge</span></p>
        <div style="display:flex;gap:10px;margin-top:16px"><button class="btn pri" id="grGo">Grant for this case</button><button class="btn alt" onclick="closeModal()">Keep private</button></div>`);
      $('#grGo').onclick=()=>{e.perm='granted';c.selectedEvidence.push(e.id);persist();closeModal();renderSheet();toast('Permission granted. “'+e.title+'” is now referenceable, provenance intact.')}});
    $$('#stepBody [data-deid]').forEach(b=>b.onclick=()=>{
      const e=evOf(b.dataset.deid);
      modal(`<div class="h2">Protect the <em>patient</em></div>
        <p class="sub" style="margin-top:10px">${esc(e.deidWarn)}</p>
        <div class="evCard" style="margin-top:12px"><div class="evT" style="font-size:12.5px">Original (kept in StoryForge)</div><div class="evX">“${esc(e.excerpt)}”</div></div>
        <div class="evCard sel"><div class="evT" style="font-size:12.5px">De-identified for letter use</div><div class="evX">“${esc(e.deidExcerpt)}”</div></div>
        <div style="display:flex;gap:10px;margin-top:14px"><button class="btn pri" id="deidGo">Use the de-identified version</button><button class="btn alt" onclick="closeModal()">Not now</button></div>`,true);
      $('#deidGo').onclick=()=>{e.perm='granted';e.deid=true;c.selectedEvidence.push(e.id);persist();closeModal();renderSheet();toast('De-identified version approved for letter use. The original stays untouched in StoryForge.')}});
    const ta=$('#caseNarr');ta.oninput=()=>{c.narrative=ta.value;persist()};
    wireMic($('#caseMic'),$('#caseMicNote'),fin=>{ta.value=(ta.value?ta.value.trim()+' ':'')+fin;c.narrative=ta.value;persist()},inter=>{$('#caseInterim').textContent=inter?'“'+inter+'…”':''});
  }
  if(step==='packet'){
    const ps=$('#pktSend');if(ps)ps.onclick=()=>{setStage(c,'packetSent');toast('Packet marked as sent. The secure faculty link is now active in Status & handoff.');renderSheet()};
  }
  if(step==='request'){
    const ma=$('#markAsked');if(ma)ma.onclick=()=>{c.request.sent=todayISO;setStage(c,'asked');toast('Marked as Asked — follow up in about two weeks if you haven’t heard back.');renderSheet()};
    const y=$('#ansYes');if(y)y.onclick=()=>{setStage(c,'agreed');toast(w.name+' agreed 🎉 Next: send the supporting packet.');renderSheet()};
    const nd=$('#ansDraft');if(nd)nd.onclick=()=>{c.draftRequested=true;if(!c.drafts)c.drafts={chosen:null,dirs:null,builtWith:null};setStage(c,'drafts');
      toast('“Send me a draft” recorded. A safeguarded working-drafts step is now part of this case.');D.ui.caseStep='drafts';renderSheet()};
    const n=$('#ansNo');if(n)n.onclick=()=>{setStage(c,'declined');toast('Recorded. A decline is honest data — your backup plan is one tab away.');renderSheet()};
    const lf=$('#logFu');if(lf)lf.onclick=()=>{c.request.followups.push(todayISO);persist();toast('Follow-up logged ('+c.request.followups.length+' total). Keep it to one gentle reminder per ~2 weeks.');renderSheet()};
    const bk=$('#bkAdd');if(bk)bk.onclick=()=>openWriterModal(null,{name:'Dr. Naomi Hale',cred:'MD',title:'Attending Physician, Internal Medicine',inst:'Mercy General Hospital',email:'n.hale@mercygeneral.example',rotationId:'r1',relationship:'Co-attended on the IM service; directly precepted ~8 of Amara’s patient presentations',obsDays:8,weeks:3,lastDirect:'2026-02-13',prestige:'moderate',specialty:'im',pron:'she'});
  }
  if(step==='drafts'){
    $('#openBuilder').onclick=()=>{closeCase();openBuilder(c.id)};
    const cv=$('#caseViewLetter');if(cv)cv.onclick=()=>{closeCase();openBuilder(c.id,6)};
    return;
  }
  if(step==='__legacy_drafts'){
    const g=$('#genDrafts');if(g)g.onclick=()=>{
      if(!c.drafts)c.drafts={chosen:null,dirs:null,builtWith:null};
      c.drafts.dirs=draftDirections(c);c.drafts.builtWith={ev:[...c.selectedEvidence],narr:c.narrative};
      if(c.drafts.chosen&&!c.drafts.dirs.find(d=>d.id===c.drafts.chosen))c.drafts.chosen=null;
      persist();renderSheet();
      toast('Three directions built from your current ingredients — demo logic, no live AI. Change the evidence and rebuild to see the drafts change.')};
    $$('#stepBody [data-pick]').forEach(b=>b.onclick=()=>{c.drafts.chosen=b.dataset.pick;persist();renderSheet();
      toast('Direction '+b.dataset.pick+' chosen as your working start. The writer still owns everything from here.')});
    const sf=$('#sendFac');if(sf)sf.onclick=()=>{
      modal(`<div class="boundary" style="border:0;padding:6px">
        <div class="bIco">🔏</div>
        <div class="h2" style="transform:none">You’re crossing the <em>authorship boundary</em></div>
        <p class="sub" style="margin-top:10px;text-align:left">Your working draft and packet go to ${esc(w.name)}’s <b>private</b> workspace. From this moment:</p>
        <ul class="sub" style="text-align:left;margin:10px 0 0 18px;line-height:1.8">
          <li>${esc(w.name.split(' ').slice(-1)[0])} confirms, corrects, or rejects every cue — including yours.</li>
          <li>Comparison and endorsement are chosen privately by the writer. You will never see them.</li>
          <li>${c.waived?'You waived access: the final letter will not be visible to you, ever.':'The writer controls what, if anything, you see of the final letter.'}</li>
        </ul>
        <div style="display:flex;gap:10px;margin-top:18px;justify-content:center;flex-wrap:wrap">
          <button class="btn pri" id="crossGo">I understand — send it</button>
          <button class="btn alt" onclick="closeModal()">Wait</button></div></div>`);
      $('#crossGo').onclick=()=>{setStage(c,'facultyWorking');closeModal();D.ui.caseStep='status';renderSheet();
        toast('Sent. '+w.name+' now owns this letter — you’ll see status changes, never private content.')}};
  }
  if(step==='status'){
    const sel=$('#stSel');if(sel)sel.onchange=()=>{setStage(c,sel.value);renderSheet();toast('Status updated — self-reported, stored locally.');};
    const sp2=$('#stProg');if(sp2)sp2.onclick=()=>{closeCase();go('programs')};
    const sd2=$('#stDepot');if(sd2)sd2.onclick=()=>{closeCase();D.ui.depotCase=c.id;go('depot')};
    const of=$('#openFac');if(of)of.onclick=()=>{
      modal(`<div class="boundary" style="border:0;padding:6px">
        <div class="bIco">🎭</div>
        <div class="h2" style="transform:none">Prototype role <em>simulation</em></div>
        <p class="sub" style="margin-top:10px">In production, this secure link is emailed only to ${esc(w.name)} and never appears in a student’s interface. You’re about to preview the <b>writer’s private workspace</b> so you can evaluate the product. Simulated identity verification; no real security is claimed.</p>
        <div style="display:flex;gap:10px;margin-top:16px;justify-content:center"><button class="btn pri" id="facGo">Continue as ${esc(w.name)}</button><button class="btn alt" onclick="closeModal()">Back</button></div></div>`);
      $('#facGo').onclick=()=>{closeModal();openFaculty(c.id)};
    };
  }
}
/* ================= FACULTY SECURE WORKSPACE (simulation) ================= */
const FAC_STEPS=['Request','Relationship','Memory cues','Your observations','Private assessment','Draft','Final checks','Export'];
function openFaculty(caseId){D.ui.facCaseId=caseId;persist();renderFac();$('#facWrap').classList.add('open');$('#facWrap').scrollTop=0}
function closeFaculty(){$('#facWrap').classList.remove('open');D.ui.facCaseId=null;persist();renderSheet();render()}

function facCueList(c){
  const cues=grantedEvidence(c).map(e=>({id:e.id,txt:(e.deid?e.deidExcerpt:e.excerpt),title:e.title,prov:e.prov}));
  if(c.narrative)cues.push({id:'narr',txt:c.narrative,title:'Emphasis requested by the applicant',prov:'stu'});
  return cues;
}
function renderFac(){
  const c=cOf(D.ui.facCaseId);if(!c)return;
  const w=wOf(c.writerId),r=rOf(w.rotationId),fc=c.fac,sp=spec(),S=D.student;
  const step=fc.step||0;
  const stepDone=i=>{
    switch(i){case 0:return fc.identityOk;case 1:return fc.relConfirmed;case 2:return facCueList(c).every(q=>fc.cues[q.id]);
      case 3:return fc.obs.length>0;case 4:return !!fc.endorsement&&!!fc.comparison;case 5:return !!fc.pars;case 6:return fc.checked;case 7:return fc.done}return false};
  $('#facWrap').innerHTML=`
    <div class="facTop">
      <div class="facBadge">🔒 Secure faculty workspace · private to ${esc(w.name)}</div>
      <span class="chip gd dashed" style="font-size:8.5px">Prototype — simulated secure link & identity</span>
      <button class="facAlt" style="margin-left:auto" id="facExit">Exit simulation</button>
    </div>
    <div class="facIn">
      <div class="eyebrow" style="color:#6f8a7a">Letter request · ${esc(sp.name)} · needed by ${fmtD(c.request.deadline)}</div>
      <div class="h1" style="margin-top:6px;color:#eafff4">Recommendation for <em style="color:var(--fac)">${esc(S.name)}</em></div>
      <p class="sub" style="margin-top:8px;color:#9fb8aa;max-width:640px">Nothing in this workspace is visible to ${esc(S.first)} or any mentor. You confirm what you saw, reject what you didn’t, and own every word of the final letter.</p>
      <div class="facSteps" role="tablist" aria-label="Faculty steps">
        ${FAC_STEPS.map((l,i)=>`<button role="tab" aria-selected="${step===i}" class="${step===i?'on':''} ${stepDone(i)?'done':''}" data-fstep="${i}">${stepDone(i)?'✓ ':''}${i+1} · ${l}</button>`).join('')}
      </div>
      <div id="facBody">${facStepHTML(c,w,r,fc,step)}</div>
    </div>`;
  $('#facExit').onclick=()=>{toast('Left the faculty simulation. Your progress there is saved.');closeFaculty()};
  $$('#facWrap [data-fstep]').forEach(b=>b.onclick=()=>{fc.step=+b.dataset.fstep;persist();renderFac()});
  wireFacStep(c,w,r,fc,step);
}

    return `<div class="facPanel"><div class="pBody" style="padding:20px">

        <b style="color:#d7f5e6">${esc(S.name)}, ${esc(S.degree)}</b> — international medical graduate applying in <b style="color:#d7f5e6">${esc(sp.name)}</b>, 2027 season.<br>
        You supervised ${esc(S.first)}: ${r?esc(r.name)+', '+fmtD(r.start)+(r.end?' – '+fmtD(r.end):' – present'):'—'}.<br>

      ${c.draftRequested&&c.drafts&&c.drafts.chosen?`<div class="cueCard" style="border-color:rgba(255,215,106,.4)"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px"><b style="font-size:12.5px;color:#ffe9a8">Working draft you asked ${esc(S.first)} to prepare</b><span class="wmark">Applicant-prepared working draft — your confirmation required</span></div>
        <div class="cueTxt" style="max-height:180px;overflow-y:auto;white-space:pre-wrap">${c.drafts.dirs.find(d=>d.id===c.drafts.chosen).html}</div>
        <div class="rowS" style="color:#9fb8aa;margin-top:8px">Use it as a memory aid if helpful. Your draft in step 6 is built only from what <i>you</i> confirm — never directly from this text.</div></div>`:''}
      <div class="divider" style="background:#1d3327"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <button class="facBtn" id="facIdOk">I am ${esc(w.name)} — begin ▸</button>
        <button class="facAlt" id="facDecline">I can’t write a strong letter</button>

      <div class="h2" style="color:#eafff4">How do you know <em style="color:var(--fac)">${esc(S.first)}</em>?</div>
      <div class="rowS" style="color:#9fb8aa;margin:8px 0 14px">${esc(S.first)} described the relationship below. Confirm it, or correct it — this sentence anchors your letter’s credibility (dates, duration, setting, supervision).</div>
      <div class="cueCard"><div style="display:flex;gap:8px;margin-bottom:6px">${provChip('stu')}</div><div class="cueTxt">“${esc(w.relationship)}${r?' — '+esc(r.name)+', '+fmtD(r.start)+(r.end?' – '+fmtD(r.end):' – present'):''}”</div></div>
      <div class="fld"><label for="facRel" style="color:#6f8a7a">Your version (edit freely — this becomes <b>faculty directly observed</b>)</label>
        <textarea id="facRel" style="background:rgba(7,16,11,.8);border-color:#1d3327">${esc(fc.relTxt||('I directly supervised '+S.first+' during '+(r?r.name.toLowerCase():'the rotation')+', including '+w.obsDays+' days of direct observation'))}</textarea></div>

    </div></div>`;

  if(step===2){

      <div class="rowS" style="color:#9fb8aa;margin:8px 0 14px">These came from ${esc(S.first)}’s packet. Nothing enters your letter as an observation unless <b>you</b> say you saw it. “True, but I didn’t see it” keeps a fact honest by attributing it to ${esc(S.first)}.</div>
      ${cues.map(q=>{const d=fc.cues[q.id];return `<div class="cueCard">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px"><b style="font-size:12.5px;color:#d7f5e6">${esc(q.title)}</b>${provChip(q.prov)}${d?`<span class="chip ${d.decision==='observed'?'gn':d.decision==='context'?'cy':d.decision==='corrected'?'em':'rd'}" style="font-size:8px">${d.decision==='observed'?'You observed this':d.decision==='context'?'Context · attributed to student':d.decision==='corrected'?'Corrected by you':'Excluded'}</span>`:''}</div>

      <div style="display:flex;gap:10px;margin-top:6px"><button class="facBtn" id="facCuesOk" ${cues.every(q=>fc.cues[q.id])?'':'disabled title="Decide on every cue first — each one needs your explicit call"'}>All decided — continue ▸</button></div>
