      <button type="button" class="panel cyc future" data-go="#/cycle/current"><div class="nm">Current Cycle</div><div class="rg">September · dates to be set</div><div class="facts"><div class="f"><span class="n">—</span><span class="l">people</span></div><div class="f"><span class="n">—</span><span class="l">classes</span></div></div><div class="d muted" style="font-size:14px">${missionAccountsCapability('zoom_sync')?'Attendance updates automatically after the daily Zoom sync runs.':'Attendance will arrive from the daily Zoom sync once it is connected.'}</div></button>
    </div>
  </section>`; }

/* ---------------- CYCLE ---------------- */
function ruleSentence(){ const d=WS.ruleDecision; if(WS.rule==='event') return 'Comparison view — the original $25-per-class rule.'; if(d) return d.mode==='retroactive'? 'Estimated with the corrected rule (one $25 charge per class day) — the Founder decided it applies to past cycles too.' : 'Estimated with the corrected rule (one $25 charge per class day) — the Founder decided it applies from the Current Cycle onward; earlier cycles are shown for comparison.'; return 'Estimated with the corrected rule (one $25 charge per class day). The Founder is still deciding whether it also applies to past cycles.'; }
function ruleNoteHTML(s){ return `<span class="ruleNote"><span class="chip ${WS.rule==='day'?'approved':'review'}">${WS.rule==='day'?'Corrected rule · one charge per day':'Original rule · per class'}</span><span class="muted">${esc(ruleSentence())} <a class="linkish" href="#/billing?cycle=all#rule">Details</a></span></span>`; }
function rowHTML(item, k, opts={}){ const {e,st,att}=item; const cc=e.c[k]; const sug=suggestionFor(e,k); const pct=Math.round(100*att/cyc(k).sessions); const email=contactOf(e.i).email;
  const dec=decisionFor(e.i,k);
  const amtHTML = st.state==='stale' ? `<span class="m est money">${money(sug.amount)}</span><span class="chip review">was approved ${money(st.amount)} · basis changed</span>`
    : st.state==='clean'||st.state==='question'||st.state==='device' ? `<span class="m est money">${money(sug.amount)}</span><span class="chip est">${esc(sug.label)}</span>`
    : (st.state==='nocharge'||st.state==='handled') ? `<span class="m money" style="color:var(--mute)">$0</span><span class="chip ${st.chip}">${esc(st.label)}</span>`
    : `<span class="m ok money">${money(st.amount)}</span><span class="chip ${st.chip}">${esc(st.label)}</span>`;
  const acts = st.state==='stale' ? `<button type="button" class="btn confirm sm" data-decide="${e.i}|${k}|confirm">Re-approve ${money(sug.amount)}</button><button type="button" class="btn soft sm" data-go="#/student/${e.i}?cycle=${k}">Open</button>`
    : st.state==='clean' ? `<button type="button" class="btn confirm sm" data-decide="${e.i}|${k}|confirm">Confirm ${money(sug.amount)}</button><button type="button" class="btn soft sm" data-go="#/student/${e.i}?cycle=${k}">Open</button>`
    : st.state==='approvedNoEmail' ? `<button type="button" class="btn soft sm" data-go="#/student/${e.i}?cycle=${k}#contact">Add email</button>`
    : st.state==='approved' ? `<button type="button" class="btn soft sm" data-go="#/invoice/${e.i}/${k}">Preview invoice</button>`
    : st.state==='ready' ? `<button type="button" class="btn soft sm" data-go="#/invoice/${e.i}/${k}">Invoice</button>`
    : `<button type="button" class="btn soft sm" data-go="#/student/${e.i}?cycle=${k}">Open</button>`;
  return `<div class="row"><div class="ring ${st.state==='approved'||st.state==='ready'?'ok':''}" style="--p:${pct}"><span>${att}</span></div>
    <div class="who"><div class="nm"><a href="#/student/${e.i}?cycle=${k}">${esc(e.n)}</a></div><div class="meta"><span>${att} of ${cyc(k).sessions} classes</span><span class="chip s1">Step 1 · ${e.c[k].s1}</span><span class="chip s23">Step 2/3 · ${e.c[k].s23}</span>${WS.rule==='day'?`<span class="chip bday" title="One $25 charge per calendar day — attending Step 1 and Step 2/3 on the same day counts once">${cc.billable} billable ${cc.billable===1?'day':'days'}${cc.comped?` · ${cc.comped} comped`:''}${cc.grace?` · ${cc.grace} exam grace`:''}</span>`:''}${email?'':'<span class="muted">· no email yet</span>'}${dec&&dec.note?`<span class="muted">· ${esc(dec.note)}</span>`:''}</div></div>
    <div class="amt">${amtHTML}</div><div class="act">${acts}</div></div>`; }

function clusterCard(cl, opts={}){ const m=model(); const d=WS.ident[cl.id]; const prev=mergePreview(cl); const total=prev.reduce((a,x)=>a+x.delta,0);
  const primary=cl.members[0];
  const names = cl.members.map(mm=>{ const e=m.eff[m.canonOf(mm.si)]; const cyclesTxt=CYK.filter(kk=>mm.cycles.includes(kk)).map(kk=>cyc(kk).label.replace(' Cycle','')).join(', ');
    return `<div class="nameBox"><span class="n ${mm.device?'mono':''}">${esc(mm.alias)}</span><span class="d">${mm.att} ${mm.att===1?'class':'classes'} · ${esc(cyclesTxt)}</span>${(()=>{ const r=(mm.raw||[]).filter(x=>x.toLowerCase()!==mm.alias.toLowerCase()); return r.length?`<span class="d">Zoom name: <b>${esc(r.join(' / '))}</b></span>`:''; })()}</div>`; }).join('');
  const impact = prev.length? `<div class="impact">If they are the same person: ${prev.map(p=>`<span style="${opts.cycle===p.k?'background:var(--amberSoft);padding:2px 6px;border-radius:6px':''}">${esc(p.label.replace(' Cycle',''))} ${p.att} classes → <b>${money(p.after)}</b> <span class="muted">(was ${money(p.before)})${(p.att>=13&&p.att<=15&&!WS.policy[p.k])?' · pricing question pending':''}</span></span>`).join(' · ')} ${total!==0?`<b>${money(Math.abs(total))} ${total<0?'less':'more'} than billing them separately</b>`:'<b>no change to the total</b>'}</div>`:'';
  const why = `<details class="why"><summary>Why do we think this?</summary><div class="evid">
      <div><span class="k">What matches</span><br>${esc(cl.supporting)}</div>
      <div><span class="k">Timing</span><br>${esc(cl.temporal)}</div>
      <div><span class="k">What argues against</span><br>${esc(cl.against)}${cl.cooccur?` · seen in the same class at the same time ${cl.cooccur}×`:''}</div>
      <div><span class="k">Confidence</span><br>${cl.tier==='probable'?'Likely the same person — please confirm.':'Possibly the same person — we are not sure.'}</div></div></details>`;
  const decided = d ? `<div class="decided"><span class="chip ${d.d==='same'?'approved':d.d==='different'?'none':'review'}">${d.d==='same'?'✓ Same student':d.d==='different'?'Different people':'Not sure — kept open'}</span><span class="muted" style="font-size:13px">${esc(fmtStamp(d.at))}</span><button type="button" class="btn xs soft" data-ident-undo="${esc(cl.id)}">Undo</button></div>`
    : `<div class="acts"><button type="button" class="btn confirm" data-ident="${esc(cl.id)}|same">Yes, same student</button><button type="button" class="btn ghost" data-ident="${esc(cl.id)}|different">No, different people</button><button type="button" class="btn soft" data-ident="${esc(cl.id)}|unsure">I'm not sure</button></div>`;
  return `<div class="qcard ${d?'done':''}" id="q-${esc(cl.id)}"><div><div class="q">${d&&d.d==='same'?`Merged as <em>${esc(m.eff[m.canonOf(primary.si)].n)}</em>`:'We think these may be the same person'}</div><div class="names">${names}</div>${impact}${why}</div>${decided}</div>`; }

function deviceCard(dv){ const m=model(); const d=WS.dev[dv.key]; const e=m.eff[dv.si]; const cyclesTxt=dv.cycles.map(kk=>cyc(kk).label.replace(' Cycle','')).join(', ');
  const sessions = e.absorbed? [] : CYK.flatMap(kk=> (D.students[dv.si].c[kk]?D.students[dv.si].c[kk].sess:[]) ).map(ss=>D.sessions[ss]);
  const when = sessions.slice(0,4).map(s=>`${fmtDate(s.d,{short:true})} ${fmtTime(s.t)} (${stepLabel(s.st)})`).join(' · ') + (sessions.length>4?` · +${sessions.length-4} more`:'');
  const decided = d && d.d!=='leave' ? `<div class="decided"><span class="chip ${d.d==='match'?'approved':'none'}">${d.d==='match'?'✓ Matched to '+esc(D.students[d.si].n):'Not a student'}</span><span class="muted" style="font-size:13px">${esc(fmtStamp(d.at))}</span><button type="button" class="btn xs soft" data-dev-undo="${esc(dv.key)}">Undo</button></div>`
    : `<div class="acts"><button type="button" class="btn confirm" data-dev="${esc(dv.key)}|match">Match to a student</button><button type="button" class="btn ghost" data-dev="${esc(dv.key)}|not">Not a student</button><button type="button" class="btn soft" data-dev="${esc(dv.key)}|leave">Decide later</button></div>`;
  return `<div class="qcard dev ${d&&d.d!=='leave'?'done':''}" id="d-${esc(dv.key)}"><div><div class="q">We need your help identifying this attendee</div>
    <div class="names"><div class="nameBox"><span class="d">Recorded Zoom name</span><span class="n mono">${esc(dv.name)}</span></div><div class="nameBox"><span class="d">Attendance</span><span class="n">${dv.att} ${dv.att===1?'class':'classes'} · ${esc(dv.cycles.map(kk=>cyc(kk).label).join(', '))}</span><span class="d">${esc(when)}</span></div></div>
    <div class="impact">Carried in the starting estimate at <b>${money(CYK.reduce((a,kk)=>a+(e.c[kk]?suggestionFor(e,kk).amount:0),0))}</b> (${WS.rule==='day'?'$25 per billable day':'$25 per class'}). It stays flagged — not shown as a student — until you match it to someone, mark it not a student, or decide later.</div></div>${decided}</div>`; }

function viewCycle(k){ if(k==='current') return viewCurrent(); const s=cycleStats(k); if(!s) return viewHome(); const c=s.c; const m=model();
  const clusters = m.openClusters.filter(cl=>cl.members.some(mm=>mm.cycles.includes(k)));
  const decidedClusters = D.clusters.filter(cl=>WS.ident[cl.id] && WS.ident[cl.id].d!=='unsure' && cl.members.some(mm=>mm.cycles.includes(k)));
  const devices = D.devices.filter(dv=>dv.cycles.includes(k) && !(WS.dev[dv.key] && WS.dev[dv.key].d!=='leave'));
  const devicesDone = D.devices.filter(dv=>dv.cycles.includes(k) && WS.dev[dv.key] && WS.dev[dv.key].d!=='leave');
  const capOpen = !WS.policy[k] && s.capCount>0;
  const attentionN = clusters.length + devices.length + (capOpen?1:0);
  const g=s.groups; const cleanFull=g.clean.filter(x=>x.u>=16), cleanPer=g.clean.filter(x=>x.u<16);
  const allDone = attentionN===0 && g.clean.length===0;
  const dominant = attentionN>0? `<a class="btn primary lg" href="#/cycle/${k}#attention">Answer the ${attentionN} question${attentionN===1?'':'s'} →</a>` : g.clean.length? `<button type="button" class="btn primary lg" data-confirm-all="${k}">Confirm ${g.clean.length} clean record${g.clean.length===1?'':'s'} · ${money(g.clean.reduce((a,x)=>a+suggestionFor(x.e,k).amount,0))}</button>` : `<span class="chip approved" style="font-size:16px;padding:10px 16px">✓ ${esc(c.label)} fully confirmed</span>`;
  const list = (items, limit, id) => { const shown=items.slice(0,limit); return `<div class="stack" id="${id}">${shown.map(it=>rowHTML(it,k)).join('')}</div>${items.length>limit?`<div class="moreRow"><button type="button" class="btn ghost sm" data-expand="${id}">Show all ${items.length}</button></div>`:''}`; };
  const noChargeAll=[...g.nocharge,...g.handled];
  window.__lists = window.__lists||{}; window.__lists[k]={cleanFull,cleanPer,approved:[...g.approved,...g.approvedNoEmail],ready:g.ready,nocharge:noChargeAll};
  return `<section class="view">
    <a class="back" href="#/home">← Home</a>
    <div class="cycBar">${cycleSelector(k, kk=>'#/cycle/'+kk)}<span class="eyebrow em">${esc(c.label)} · ${fmtRange(c)}</span></div>
    <h1 class="h1" style="margin-top:8px">${allDone?`${esc(c.label.replace(' Cycle',''))} is done.`:`Let's finish ${esc(c.label.replace(' Cycle',''))}.`}</h1>
    ${WS.rule==='event'?`<div class="compareBanner"><span class="chip review">Comparison view</span> You are looking at the <b>original per-class rule</b>. Approvals are paused in this view — <a class="linkish" href="#/billing?cycle=all#rule">switch back to the corrected rule</a> to approve amounts.</div>`:''}
    <p class="lead" style="margin-top:10px">${c.sessions} Live Drills classes · ${s.people.length} people attended · ${s.events.toLocaleString()} attendances recorded from Zoom.</p>
    <div class="panel band">
      <div class="cell"><span class="l">Classes</span><span class="n">${c.sessions}</span><span class="s">${c.s1_sessions} Step 1 · ${c.s23_sessions} Step 2/3 · ${c.days} class days</span></div>
      <div class="cell"><span class="l">People</span><span class="n">${s.people.length}</span><span class="s">${s.full} at 16+ classes · ${s.per} at 1–15${s.groups.device.length?` · incl. ${s.groups.device.length} unidentified`:''}</span></div>
      <div class="cell"><span class="l">Attendance events</span><span class="n">${s.events.toLocaleString()}</span><span class="s">${s.s1.toLocaleString()} Step 1 · ${s.s23.toLocaleString()} Step 2/3 — every event is kept</span></div>
      <div class="cell"><span class="l">Billable days</span><span class="n">${s.billDays.toLocaleString()}</span><span class="s">one $25 charge per calendar day · ${s.dupDays.toLocaleString()} days had both Steps${s.compDays?` · ${s.compDays} comped`:''}${s.graceDays?` · ${s.graceDays} exam grace`:''}</span></div>
      <div class="cell"><span class="l">Dr J approved</span><span class="n ok money">${money(s.approved)}</span><span class="s">${s.decided} of ${s.people.length} confirmed${s.ncNo?` · ${s.ncNo} no charge`:''}</span></div>
      <div class="cell"><span class="l">Our estimate · not approved</span><span class="n est money">${money(s.est)}</span><span class="s">from attendance, before your decisions</span></div>
      <div class="cell"><span class="l">Ready to invoice</span><span class="n blue money">${money(s.ready)}</span><span class="s">${g.ready.length} approved with an email on file</span></div>
      <div class="cell"><span class="l">Paid</span><span class="n faint">—</span><span class="s">Appears once invoices go out</span></div>
    </div>
    <div class="legend" style="margin-top:10px"><span><i class="estL"></i>dashed = our estimate</span><span><i class="okL"></i>green = approved by you</span>${ruleNoteHTML(s)}</div>
    <div style="margin-top:22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">${dominant}<span class="muted">Then confirm the clean records, preview invoices, and mark them ready.</span></div>

    <div class="chapter" id="attention"><div class="chHead"><span class="t">Needs your attention</span><span class="c">${attentionN} question${attentionN===1?'':'s'} in ${esc(c.label.replace(' Cycle',''))}</span><span class="why">Only the questions that change who is billed or how much. Everything else is already organized below.${totalQuestions()>attentionN?` (${totalQuestions()} questions across all cycles.)`:''}</span></div>
      <div class="stack">
        ${capOpen? `<div class="qcard pol"><div><div class="q">${s.capCount} ${s.capCount===1?'person':'people'} ${WS.rule==='day'?'have 13–15 billable days':'attended 13–15 classes'}. At $25 ${WS.rule==='day'?'a day':'a class'} that is $325–$375 — more than the $300 full cycle.</div><div class="impact">By the written rule they would pay more than students who came to every class. Charge the flat $300 full-cycle price, or ${WS.rule==='day'?'$25 a day':'$25 a class'}? You can still change any one of them individually.</div><details class="why"><summary>Who this affects</summary><div class="evid">${s.people.filter(e=>{ const u=unitsOf(e.c[k]); return u>=13&&u<=15; }).map(e=>`<div>${esc(e.n)} — ${unitsOf(e.c[k])} ${unitWord(unitsOf(e.c[k]))} · ${money(unitsOf(e.c[k])*25)} at $25</div>`).join('')}</div></details></div><div class="acts"><button type="button" class="btn confirm" data-policy="${k}|cap">Cap at $300 full-cycle</button><button type="button" class="btn ghost" data-policy="${k}|per">Charge ${WS.rule==='day'?'$25 per day':'$25 per class'}</button></div></div>`
        : (WS.policy[k]? `<div class="qcard pol done"><div><div class="q">13–15 ${WS.rule==='day'?'billable days':'classes'}: ${WS.policy[k]==='cap'?'capped at the $300 full-cycle price':'kept at $25 each'}</div><div class="impact">${s.capCount} ${s.capCount===1?'person':'people'} in ${esc(c.label)}. Change this any time.</div></div><div class="decided"><button type="button" class="btn xs soft" data-policy="${k}|">Undo</button></div></div>`:'')}
        ${clusters.slice(0,5).map(cl=>clusterCard(cl,{cycle:k})).join('')}
        ${clusters.length>5? `<div id="moreQ-${k}" hidden>${clusters.slice(5).map(cl=>clusterCard(cl,{cycle:k})).join('')}</div><div class="moreRow"><button type="button" class="btn ghost" data-reveal="moreQ-${k}">Show the other ${clusters.length-5} name questions</button></div>`:''}
        ${devices.map(dv=>deviceCard(dv)).join('')}
        ${attentionN===0? `<div class="panel empty"><div class="ill">✓</div><div class="t">No open questions for ${esc(c.label.replace(' Cycle',''))}</div><div class="d">Every name is resolved and every unidentified attendee has been handled.</div></div>`:''}
        ${decidedClusters.length||devicesDone.length? `<details class="why"><summary>${decidedClusters.length+devicesDone.length} answered question${decidedClusters.length+devicesDone.length===1?'':'s'}</summary><div class="stack" style="margin-top:10px">${decidedClusters.map(cl=>clusterCard(cl)).join('')}${devicesDone.map(dv=>deviceCard(dv)).join('')}</div></details>`:''}
      </div>
    </div>

    ${g.stale.length? `<div class="chapter" id="stale"><div class="chHead"><span class="t">Attendance changed after you approved</span><span class="c">${g.stale.length}</span><span class="why">The billable-day count moved (a correction, a comp-day change or an exam approval). The approved amount is kept until you re-approve.</span></div>${list(g.stale,6,'ls-'+k)}</div>`:''}
    <div class="chapter" id="clean"><div class="chHead"><span class="t">Attendance looks clean</span><span class="c">${g.clean.length} ${g.clean.length===1?'record':'records'}</span><span class="why">One clear name, no open questions. The starting estimate follows the written rule; confirm each one, or confirm them together.</span></div>
      ${cleanFull.length? `<div class="groupHead"><span class="t">Attendance suggests full-cycle</span><span class="d">${cleanFull.length} people at 16+ ${unitWord(16)} · $300 each${s.full>cleanFull.length?` · ${s.full-cleanFull.length} more waiting on a name question`:''}</span><div class="right"><button type="button" class="btn green sm" data-confirm-group="${k}|cleanFull">Confirm all ${cleanFull.length} · ${money(cleanFull.reduce((a,x)=>a+suggestionFor(x.e,k).amount,0))}</button></div></div>${list(cleanFull,6,'lf-'+k)}`:''}
      ${cleanPer.length? `<div class="groupHead"><span class="t">Attendance suggests ${WS.rule==='day'?'per day':'per-session'}</span><span class="d">${cleanPer.length} people at 1–${WS.policy[k]?'15':'12'} ${unitWord(2)} · $25 ${WS.rule==='day'?'per billable day':'per class'}</span><div class="right"><button type="button" class="btn green sm" data-confirm-group="${k}|cleanPer">Confirm all ${cleanPer.length} · ${money(cleanPer.reduce((a,x)=>a+suggestionFor(x.e,k).amount,0))}</button></div></div>${list(cleanPer,6,'lp-'+k)}`:''}
      ${g.held.length? `<div class="groupHead"><span class="t">Waiting on your pricing answer</span><span class="d">${g.held.length} people at 13–15 ${unitWord(14)}${s.capCount>g.held.length?` · ${s.capCount-g.held.length} more are in name questions above`:''}</span><div class="right"><a class="btn soft sm" href="#/cycle/${k}#attention">Answer the question</a></div></div><div class="panel" style="padding:16px 18px"><div class="lead" style="font-size:16px">${g.held.map(x=>esc(x.e.n)).slice(0,8).join(', ')}${g.held.length>8?` and ${g.held.length-8} more`:''} are held here until you decide whether 13–15 ${unitWord(14)} is capped at $300. They are not in the totals above as confirmed.</div></div>`:''}
      ${g.clean.length===0&&!g.held.length? `<div class="panel empty"><div class="ill">✓</div><div class="t">Every clean record is confirmed</div><div class="d">Approved amounts are listed below.</div></div>`:''}
    </div>

    <div class="chapter" id="ready"><div class="chHead"><span class="t">Ready to invoice</span><span class="c">${g.ready.length} ready · ${g.approved.length+g.approvedNoEmail.length} approved</span><span class="why">Confirmed amounts become invoices once the student has an email on file. <span class="chip future">Server-authoritative state</span></span></div>
      ${g.ready.length? `<div class="groupHead"><span class="t">Ready to send</span><span class="d">${g.ready.length} · ${money(s.ready)}</span></div>${list(g.ready,8,'lr-'+k)}`:''}
      ${g.approved.length? `<div class="groupHead"><span class="t">Approved — preview and mark ready</span><span class="d">${g.approved.length}</span></div>${list(g.approved,8,'la-'+k)}`:''}
      ${g.approvedNoEmail.length? `<div class="groupHead"><span class="t">Approved — email needed before invoicing</span><span class="d">${g.approvedNoEmail.length}</span></div>${list(g.approvedNoEmail,6,'ln-'+k)}`:''}
      ${g.ready.length+g.approved.length+g.approvedNoEmail.length===0? `<div class="panel empty"><div class="ill">→</div><div class="t">Nothing approved yet</div><div class="d">Confirm a clean record above and it moves here.</div></div>`:''}
    </div>

    <div class="chapter" id="nocharge"><div class="chHead"><span class="t">No charge · UCC · MUL · handled elsewhere</span><span class="c">${noChargeAll.length}</span><span class="why">Attendance stays on record; nothing is invoiced from here (UCC, MUL, waived, prepaid, already paid or invoiced elsewhere).</span></div>
      ${noChargeAll.length? list(noChargeAll,6,'lnc-'+k) : `<div class="panel empty" style="padding:22px"><div class="d">No one in ${esc(c.label.replace(' Cycle',''))} is marked UCC, MUL, waived, prepaid or already handled yet.</div></div>`}
    </div>

    <div class="chapter"><div class="chHead"><span class="t">Invoiced</span><span class="c">0</span></div><div class="panel empty" style="padding:22px"><div class="d">No invoices have been sent through this system yet. Sent and Paid fill in once online invoicing is switched on.</div></div></div>
    <div class="chapter"><div class="chHead"><span class="t">Paid</span><span class="c">0</span></div><div class="panel empty" style="padding:22px"><div class="d">Payments will appear here after invoices are sent.</div></div></div>
    <p class="muted" style="margin-top:28px">Need every record at once? <a class="linkish" href="#/advanced/records?cycle=${k}">Open all ${s.people.length} ${esc(c.label)} records in Advanced</a>.</p>
  </section>`; }

/* ---------------- STUDENTS ---------------- */
function viewStudents(q, missing, setup){ return `<section class="view"><div class="eyebrow em">Students</div><h1 class="h1" style="margin-top:8px">Find a student.</h1>
  <div class="dirHead"><label class="bigSearch"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="dirSearch" placeholder="Type a name — first, last, or how it appeared in Zoom" value="${esc(q||'')}" autocomplete="off"></label>
  <label class="toggle"><input type="checkbox" id="missingOnly" ${missing?'checked':''}> Only people without an email</label><label class="toggle"><input type="checkbox" id="needOnly"> Only people who still need a decision</label><label class="toggle"><input type="checkbox" id="setupOnly" ${setup?'checked':''}> Only people missing payment setup</label></div>
  <div id="dirList"></div></section>`; }
function pendingCycles(e){ return CYK.filter(k=>e.c[k] && ['clean','question','device'].includes(accountState(e,k).state)); }
function renderStudents(q, partial){ const m=model(); const list=$('#dirList'); if(!list) return; const missing=$('#missingOnly')&&$('#missingOnly').checked; const needOnly=$('#needOnly')&&$('#needOnly').checked; const setupOnly=$('#setupOnly')&&$('#setupOnly').checked; const needle=(q||'').trim().toLowerCase();
  const people=m.eff.filter(e=>!e.absorbed && !e.notStudent && e.k!=='device' && (!missing || !contactOf(e.i).email) && (!needOnly || pendingCycles(e).length) && (!setupOnly || needsSetup(e)) && (!needle || e.n.toLowerCase().includes(needle) || e.a.some(a=>a.toLowerCase().includes(needle))));
  const devices=m.eff.filter(e=>!e.absorbed && !e.notStudent && e.k==='device' && (!needle || e.n.toLowerCase().includes(needle)));
  const total = e => CYK.reduce((a,k)=>a+(e.c[k]?e.c[k].att:0),0);
  let html=`<p class="muted" style="margin-top:14px;display:flex;gap:14px;flex-wrap:wrap;align-items:center"><span>${people.length} ${people.length===1?'person':'people'}${needle?` matching “${esc(needle)}”`:''}${missing?' without an email':''}${setupOnly?' missing payment setup':''}.</span><span class="cyc3" style="display:inline-flex;gap:6px;align-items:center;font-size:13px"><i class="on" style="width:26px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--em),var(--em2));display:inline-block"></i> bars = June · July · August attended</span></p>`;
  let last=''; people.forEach(e=>{ const L=e.n[0].toUpperCase(); if(L!==last && !needle){ html+=`<div class="letter">${esc(L)}</div>`; last=L; }
    const alias = e.a.filter(a=>a!==e.n); html+=`<a class="srow" href="#/student/${e.i}"><div><div class="nm">${esc(e.n)}</div><div class="al">${alias.length?'Also seen as '+esc(alias.slice(0,3).join(', '))+(alias.length>3?'…':''):''}${contactOf(e.i).email?(alias.length?' · ':'')+esc(contactOf(e.i).email):(alias.length?' · ':'')+'no email yet'}</div></div><div class="cyc3" title="June · July · August">${CYK.map(k=>`<i class="${e.c[k]?'on':''}"></i>`).join('')}</div><div class="tot">${total(e)}<small>classes</small></div><div class="need">${(()=>{ const p=pendingCycles(e); const cy=CYK.filter(k=>e.c[k]); const approved=cy.reduce((a,k)=>{ const st=accountState(e,k); return a+((st.state==='approved'||st.state==='ready'||st.state==='approvedNoEmail')?st.amount:0); },0); const ev=examView(e.i); return (p.length? `<span class="chip review">${p.length} of ${cy.length} to decide</span>` : `<span class="chip approved">✓ decided · ${money(approved)}</span>`) + (ev.state!=='none'?` <span class="chip ${ev.state==='pending'?'review':ev.state==='passed'?'approved':'s23'}" title="Exam plan">${esc(stepShort(ev.ex.step))} · ${esc(fmtDate(ev.ex.date,{short:true}))}</span>`:'') + (setupOnly?' <span class="chip none">setup missing</span>':''); })()}</div></a>`; });
  if(devices.length && !missing){ html+=`<div class="letter" style="margin-top:28px">Unidentified attendees</div><p class="muted" style="margin:-2px 0 10px 4px;font-size:14.5px">Zoom names that are not a person yet. They are listed here so nothing is lost — resolve them from <a class="linkish" href="#/review">Similar names</a>.</p>`;
    devices.forEach(e=>{ html+=`<a class="srow" href="#/review"><div><div class="nm"><span class="chip device">${esc(e.n)}</span></div><div class="al">Recorded Zoom name · not counted as a student</div></div><div class="cyc3">${CYK.map(k=>`<i class="${e.c[k]?'on':''}"></i>`).join('')}</div><div class="tot">${total(e)}<small>classes</small></div><div class="need"><span class="chip device">unidentified</span></div></a>`; }); }
  if(!people.length && !devices.length) html+=`<div class="panel empty"><div class="ill">?</div><div class="t">No one matches “${esc(needle)}”</div><div class="d">Try a first name only, or the name as it appeared in Zoom.</div></div>`;
  list.innerHTML=html; }

/* ---------------- STUDENT PROFILE ---------------- */
function calendarHTML(e, k, opts={}){ const c=cyc(k); const sessions=D.sessions.filter(s=>s.c===k); const mine=new Set(e.c[k]?e.c[k].sess:[]);
  const stepOf = s => e.stepOv[s.i]||s.st;
  const byDate={}; sessions.forEach(s=>{ (byDate[s.d]=byDate[s.d]||{}); byDate[s.d][s.st]=s; });
  // weeks Monday..Friday between cycle start and end
  const start=new Date(c.start+'T12:00:00'); const end=new Date(c.end+'T12:00:00'); const d0=new Date(start); d0.setDate(d0.getDate()-((d0.getDay()+6)%7));
  let html=`<div class="cal"><div class="dh">Mon</div><div class="dh">Tue</div><div class="dh">Wed</div><div class="dh">Thu</div><div class="dh">Fri</div>`;
  for(let w=new Date(d0); w<=end; w.setDate(w.getDate()+7)){
    for(let i=0;i<5;i++){ const day=new Date(w); day.setDate(day.getDate()+i); const iso=localISO(day); const inRange=day>=start && day<=end; const sess=byDate[iso];
      if(!inRange){ html+=`<div class="day blank" aria-hidden="true"></div>`; continue; }
      if(!sess){ html+=`<div class="day blank"><div class="dn"><span>${day.getDate()}</span><small>${MONTH[day.getMonth()].toUpperCase()}</small></div><span class="nc">No class</span></div>`; continue; }
      const lane = st => { const s=sess[st]; if(!s) return `<div class="lane nos"></div>`; const att=mine.has(s.i); const shown=stepOf(s); const add=e.added.has(s.i), rem=e.removed.has(s.i); return `<div class="lane ${att?'att '+shown:'miss'} ${add?'added':''} ${rem?'removed':''}" title="${stepLong(shown)} · ${fmtTime(s.t)} · ${att?'attended':'not attended'}${add?' · added by Dr J':''}${rem?' · removed by Dr J':''}">${att?'✓ ':''}<span class="full">${stepLabel(shown)}${add?' +':''}</span><span class="short">${shown==='s1'?'S1':'S2/3'}</span></div>`; };
      const stu=WS.lens==='student'; const dayInfo = (e.c[k]&&e.c[k].days||[]).find(x=>x.d===iso); const dayTag = !dayInfo? '' : dayInfo.kind==='comped'? `<span class="dayTag comp" title="Comped — Day ${dayInfo.compN} of ${e.compAllow}">${stu?`Free day ${dayInfo.compN} of ${e.compAllow}`:`Comped ${dayInfo.compN}/${e.compAllow}`}</span>` : dayInfo.kind==='grace'? `<span class="dayTag grace" title="Exam-result grace — recorded, not billed">${stu?'Free · waiting for result':'Exam grace'}</span>` : dayInfo.dup? `<span class="dayTag one" title="Step 1 and Step 2/3 on the same day — one $25 charge">${stu?'Both Steps · one $25 day':'1 billable day'}</span>` : `<span class="dayTag bill" title="Billable day">$25 day</span>`;
      const exDate = examApprovedDate(examOf(e.i)); const isExam = exDate===iso;
      html+=`<div class="day ${dayInfo?dayInfo.kind:''} ${isExam?'examDay':''}"><div class="dn"><span>${day.getDate()}</span><small>${MONTH[day.getMonth()].toUpperCase()}</small>${isExam?'<b class="exMark" title="Approved exam date">EXAM</b>':''}</div>${lane('s1')}${lane('s23')}${WS.rule==='day'?dayTag:''}</div>`; }
  }
  html+=`</div>`; return html; }
function ledgerHTML(e, k, showMissed, admin){ const sessions=D.sessions.filter(s=>s.c===k); const mine=new Map(); D.events.forEach(([si,ss,mins,ai,rows])=>{ const m=model(); if(m.canonOf(si)===e.i && D.sessions[ss].c===k) mine.set(ss,{mins,alias:D.students[si].a[ai],rows}); });
  const attended=new Set(e.c[k]?e.c[k].sess:[]);
  const rows=sessions.filter(s=>showMissed||attended.has(s.i)||e.removed.has(s.i)).map(s=>{ const ev=mine.get(s.i); const shown=e.stepOv[s.i]||s.st; const isAtt=attended.has(s.i);
    if(!isAtt){ const rem=e.removed.has(s.i); return `<div class="led miss"><span class="dt">${esc(fmtDate(s.d))}</span><span class="tm">${fmtTime(s.t)}</span><span class="as">${stepLong(shown)} · ${rem?`Zoom shows attended · <b>removed by Dr J</b>`:'class held'}</span><span class="st"><span class="chip ${rem?'review':'none'}">${rem?'Removed by Dr J':'Not attended'}</span></span></div>`; }
    if(!ev){ return `<div class="led"><span class="dt">${esc(fmtDate(s.d))}</span><span class="tm">${fmtTime(s.t)}</span><span class="as"><span class="chip ${shown}">${stepLabel(shown)}</span> ${admin?'No Zoom record · <b>added by Dr J</b>':'Confirmed by Dr J'}</span><span class="st"><span class="chip approved">✓ Attended · added</span>${(()=>{ const di=(e.c[k]&&e.c[k].kindOf)?e.c[k].kindOf[s.i]:null; return !di||WS.rule!=='day'?'': di.kind==='comped'?`<span class="chip comp">Comped · Day ${di.compN} of ${e.compAllow}</span>`: di.kind==='grace'?`<span class="chip grace">Exam-result grace · not billable</span>`: (di.dup&&di.sess[0]!==s.i)?`<span class="chip bday">Same day · counted once</span>`:`<span class="chip bday">Billable day · $25</span>`; })()}</span></div>`; }
    const di=(e.c[k]&&e.c[k].kindOf)?e.c[k].kindOf[s.i]:null; const billChip = !di||WS.rule!=='day' ? '' : di.kind==='comped'? `<span class="chip comp">${admin?`Comped · Day ${di.compN} of ${e.compAllow}`:`Free day ${di.compN} of ${e.compAllow}`}</span>` : di.kind==='grace'? `<span class="chip grace">${admin?'Exam-result grace · not billable':'Free · waiting for your result'}</span>` : (di.dup && di.sess[0]!==s.i)? `<span class="chip bday">Same day · counted once</span>` : `<span class="chip bday">Billable day · $25</span>`;
    return `<div class="led"><span class="dt">${esc(fmtDate(s.d))}</span><span class="tm">${fmtTime(s.t)}</span><span class="as"><span class="chip ${shown}">${stepLabel(shown)}${e.stepOv[s.i]?' · corrected':''}</span> ${admin?`Joined as <b>${esc(ev.alias)}</b> · ${ev.mins} min connected`:`${ev.mins} min in class`}</span><span class="st"><span class="chip approved">✓ Attended</span>${billChip}${admin?`<details><summary>Source</summary><div class="src">Zoom meeting ${esc(s.m)} · started ${esc(s.t.replace('T',' '))} · ${ev.rows} participant row${ev.rows===1?'':'s'} consolidated · ${s.n} participants in class${e.stepOv[s.i]?` · source Step: ${stepLabel(s.st)}`:''}</div></details>`:''}</span></div>`; }).join('');
  return `<div class="ledger">${rows||'<div class="led"><span class="as">No classes attended in this cycle.</span></div>'}</div>`; }

function recordLayersHTML(e,k){ const src=e.src[k]||{att:0,s1:0,s23:0,days:0}; const cur=e.c[k]||{att:0,s1:0,s23:0,billable:0,comped:0,grace:0,dayCount:0}; const sugSrc=suggestionN(WS.rule==='event'?src.att:src.days,k); const sugCur=suggestionFor(e,k); const st=accountState(e,k); const dec=decisionFor(e.i,k); const ct=contactOf(e.i); const corrs=corrsFor(e.i).filter(c=>c.type==='name'||(c.sess!=null && D.sessions[c.sess].c===k));
  const changed = src.att!==cur.att || src.s1!==cur.s1 || e.n!==e.srcName;
  return `<div class="layers panel"><div class="lay"><span class="k">Source record</span><span class="s">what Zoom and the reconciliation say</span><div class="v">${src.att} ${src.att===1?'class':'classes'}<small>Step 1: ${src.s1} · Step 2/3: ${src.s23}</small></div><div class="v2">${esc(e.srcName)}</div></div>
    <div class="lay"><span class="k">System interpretation</span><span class="s">what the attendance rules calculate</span><div class="v">${cur.att} ${cur.att===1?'class':'classes'}${changed?' <span class="chip review">corrected</span>':''}<small>${WS.rule==='day'?`${cur.billable} billable ${cur.billable===1?'day':'days'}${cur.comped?` · ${cur.comped} comped`:''}${cur.grace?` · ${cur.grace} exam grace`:''} · `:''}${esc(sugCur.label)} · <span class="money est">${money(sugCur.amount)}</span> estimate</small></div><div class="v2">${changed&&src.att!==cur.att?`was ${src.att} · ${money(sugSrc.amount)}`:'no corrections'}</div></div>
    <div class="lay"><span class="k">Dr J approved record</span><span class="s">the operational truth after your decision</span><div class="v ${dec?'ok':''}">${dec? (st.amount||st.state==='nocharge'||st.state==='handled'? money(st.amount) : money(st.amount)) : '—'}<small>${dec? esc(st.label) : 'not yet approved'}</small></div><div class="v2">${e.n!==e.srcName?`shown as <b>${esc(e.n)}</b>`:''}${ct.email?` · ${esc(ct.email)}`:''}</div></div></div>`; }
function examPlanChapterHTML(e){ const ev=examView(e.i); const ex=ev.ex; const chipCls = {none:'none',pending:'review',approved:'approved',speak:'s23',denied:'none',completed:'s1',passed:'approved',followup:'review'}[ev.state];
  const body = !ex ? `<div class="exRow"><div><div class="t">No exam date yet</div><div class="d">The student can submit a Step / Level and an intended date from their MissionAccounts home. Dr J can also enter one here.</div></div><button type="button" class="btn soft sm" data-exam-set="${e.i}">Enter exam plan</button></div>`
    : `<div class="exRow"><div><div class="t">${esc(STEP_NAMES[ex.step])} · ${esc(fmtDate(ex.date))}, ${ex.date.slice(0,4)} <span class="chip ${chipCls}">${esc(ev.label)}</span></div><div class="d">${ev.state==='pending'?`Submitted ${esc(fmtStamp(ex.submittedAt))} · waiting for your decision.`:ev.state==='approved'?`Approved ${esc(fmtStamp(ex.decidedAt))}. Attendance after ${esc(fmtDate(ex.date,{short:true}))} is recorded but <b>not billed</b> while the result is pending.${ev.reminder?' '+esc(ev.reminder.text)+'.':''}`:ev.state==='completed'?`Exam date has passed · awaiting result. ${ev.reminder?esc(ev.reminder.text)+'.':''} Attendance since ${esc(fmtDate(ex.date,{short:true}))} is in exam-result grace.`:ev.state==='passed'?`Passed · recorded ${esc(fmtDate(passedDate(ex)||TODAY_ISO))}. Classes from ${esc(fmtDate(ex.date,{short:true}))} to ${esc(fmtDate(passedDate(ex)||TODAY_ISO,{short:true}))} stay free; billing resumes from the next class. ${ev.reminder?esc(ev.reminder.text)+'.':''}`:ev.state==='speak'?`You asked to speak with the student before deciding.${ex.note?' “'+esc(ex.note)+'”':''}`:ev.state==='denied'?`Not approved — the student was asked to choose another date${ex.suggested?` (you suggested ${esc(fmtDate(ex.suggested,{short:true}))})`:''}.${ex.note?' “'+esc(ex.note)+'”':''}`:`Needs follow-up.${ex.note?' “'+esc(ex.note)+'”':''}`}</div></div>
       <div class="btnRow">${ev.state==='pending'||ev.state==='speak'?`<button type="button" class="btn confirm sm" data-exam="${e.i}|approve">Approve</button><button type="button" class="btn ghost sm" data-exam="${e.i}|deny">Choose another date</button>${ev.state!=='speak'?`<button type="button" class="btn soft sm" data-exam="${e.i}|speak">Speak with student</button>`:''}`:''}${ev.state==='approved'||ev.state==='completed'?`<button type="button" class="btn soft sm" data-exam="${e.i}|passed">Record result</button><button type="button" class="btn ghost sm" data-exam="${e.i}|followup">Needs follow-up</button>`:''}${ev.state==='denied'||ev.state==='followup'||ev.state==='passed'?`<button type="button" class="btn ghost sm" data-exam="${e.i}|reopen">Reopen</button>`:''}${ev.state!=='passed'?`<button type="button" class="btn ghost xs" data-exam-set="${e.i}">Edit date</button>`:''}</div></div>`;
  return `<div class="chHead" style="margin-top:22px" id="exam"><span class="t">Exam plan</span><span class="c">${esc(ev.label)}</span></div><div class="panel exPanel">${body}</div>`; }
function examSheet(si, by){ const m=model(); const e=m.eff[m.canonOf(si)]; const ex=examOf(e.i); const student=by==='student';
  openSheet(`<div class="t">${student?'Set my exam date':'Exam plan · '+esc(e.n)}</div><div class="d">${student?'Tell Dr J which exam you are taking and the date you intend to sit it. She will review it and you will see her answer here. Once approved, classes after your exam date are free while you wait for your result.':'Enter the Step / Level and intended date on the student\'s behalf. It goes into your review queue like any submission.'}</div>
    <div class="stepPick" role="radiogroup" aria-label="Which exam">${['s1','s2','s3'].map(st=>`<button type="button" class="opt ${ex&&ex.step===st?'on':''}" data-step="${st}" role="radio" aria-checked="${ex&&ex.step===st?'true':'false'}"><b>${esc(STEP_NAMES[st])}</b><span>${st==='s1'?'Basic sciences':st==='s2'?'Clinical knowledge':'Patient management'}</span></button>`).join('')}</div>
    <div class="field" style="margin-top:14px"><label for="exDate">Intended exam date</label><input id="exDate" type="date" value="${esc(ex?ex.date:'')}" min="2026-06-01"></div>
    <div class="acts"><button type="button" class="btn primary" id="exGo" disabled>${student?'Send to Dr J':'Save exam plan'}</button><button type="button" class="btn ghost" id="exNo">Cancel</button></div>`, w=>{ let step=ex?ex.step:null; const refresh=()=>{ $('#exGo').disabled=!(step && $('#exDate').value); };
      w.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{ step=b.dataset.step; w.querySelectorAll('[data-step]').forEach(x=>{ x.classList.toggle('on',x===b); x.setAttribute('aria-checked',x===b?'true':'false'); }); refresh(); }); $('#exDate').oninput=refresh; refresh();
      $('#exGo').onclick=()=>{ submitExam(e.i, step, $('#exDate').value, student?'student':'admin'); closeSheet(); render(); toast(student?'Sent to Dr J. You will see her answer here.':'Exam plan saved to your review queue.'); }; $('#exNo').onclick=closeSheet; }); }
function examDecideSheet(si, action){ const m=model(); const e=m.eff[m.canonOf(si)]; const ex=examOf(e.i); if(!ex) return;
  const first=e.n.split(' ')[0]; const wasApproved=['approved','completed'].includes(examView(e.i).state);
  if(action==='passed'){ openSheet(`<div class="t">Record ${esc(first)}'s result</div><div class="d">${esc(STEP_NAMES[ex.step])} on <b>${esc(fmtDate(ex.date))}</b>. Classes from ${esc(fmtDate(ex.date,{short:true}))} to today stay free whatever the result — grace is never billed backwards. Billing resumes from the next class.</div>
      <div class="optGrid" style="margin-top:12px"><button type="button" class="opt" data-res="passed"><b>Passed</b><span>${esc(first)} told you she passed</span></button><button type="button" class="opt" data-res="not_passed"><b>Did not pass</b><span>Grace ends today · plan a retake</span></button><button type="button" class="opt" data-res="no_result"><b>No result yet — end grace</b><span>Use when the wait has gone on too long</span></button></div>
      <div class="field" style="margin-top:12px"><label for="exNote">Note (kept in history)</label><input id="exNote" type="text" placeholder="optional"></div><div class="acts"><button type="button" class="btn confirm" id="exdGo" disabled>Record</button><button type="button" class="btn ghost" id="exdNo">Cancel</button></div>`, w=>{ let res=null; w.querySelectorAll('[data-res]').forEach(b=>b.onclick=()=>{ res=b.dataset.res; w.querySelectorAll('[data-res]').forEach(x=>x.classList.toggle('on',x===b)); $('#exdGo').disabled=false; }); $('#exdGo').onclick=()=>{ if(!res) return; const note=$('#exNote').value.trim(); if(res==='passed') markPassed(e.i,'admin'); else decideExam(e.i,res,note); closeSheet(); render(); toast(res==='passed'?'Passed recorded. Grace ended today.':res==='not_passed'?'Result recorded — did not pass. Grace ended today.':'Grace ended today. No result recorded.'); }; $('#exdNo').onclick=closeSheet; }); return; }
  const titles={approve:'Approve this exam date?', deny:'Ask for another date', speak:'Speak with the student first', followup:'Mark as needs follow-up', reopen:'Reopen this exam plan'};
  const desc={approve:`${esc(STEP_NAMES[ex.step])} on <b>${esc(fmtDate(ex.date))}</b>. Once approved, attendance after that date is recorded but not billed while ${esc(first)} waits for the result. If we have not heard by ${esc(fmtDate(thirdWednesdayAfter(ex.date),{short:true}))} (the third Wednesday after the exam) a check-in reminder goes out.`, deny:`The student will be asked to choose another date. You can suggest one.${wasApproved?' Days already in grace stay free; grace ends today.':''}`, speak:'Puts the request on hold and tells the student you want to talk first. Nothing changes on billing until you decide.', followup:'Use this when the result is overdue or something needs checking. Grace stays on until you record a result.', reopen:`Puts the plan back in your review queue.${wasApproved||ex.state==='passed'?' Days already in grace stay free.':''}`}[action];
  openSheet(`<div class="t">${titles[action]}</div><div class="d">${desc}</div>${action==='deny'?`<div class="field" style="margin-top:12px"><label for="exNew">Suggested date (optional)</label><input id="exNew" type="date"></div>`:''}<div class="field" style="margin-top:12px"><label for="exNote">Note to the student (optional, kept in history)</label><input id="exNote" type="text" placeholder="${action==='speak'?'e.g. Let’s talk about Step 2 timing on Tuesday':'optional'}"></div>
    <div class="acts"><button type="button" class="btn ${action==='approve'?'confirm':'primary'}" id="exdGo">${{approve:'Approve',deny:'Ask for another date',speak:'Put on hold & tell the student',followup:'Mark follow-up',reopen:'Reopen'}[action]}</button><button type="button" class="btn ghost" id="exdNo">Cancel</button></div>`, w=>{ $('#exdGo').onclick=()=>{ const note=$('#exNote').value.trim(); decideExam(e.i, action, note, action==='deny'?($('#exNew').value||null):null); closeSheet(); render(); toast({approve:'Exam date approved. Attendance after the exam date is now in grace.',deny:'Student asked to choose another date.',speak:'On hold — the student has been told you want to talk (prototype).',followup:'Marked needs follow-up.',reopen:'Reopened.'}[action]); }; $('#exdNo').onclick=closeSheet; }); }
function passedSheet(si){ const m=model(); const e=m.eff[m.canonOf(si)]; const ex=examOf(e.i); if(!ex) return;
  openSheet(`<div class="t">Did you pass ${esc(stepShort(ex.step))}?</div><div class="d">Marking <b>Passed</b> tells Dr J right away and records today's date. Classes while you waited for your result stay free; from tomorrow, classes are $25 per day again.</div><div class="acts"><button type="button" class="btn confirm lg" id="psYes">Yes — I passed</button><button type="button" class="btn ghost" id="psNo">Not yet</button></div><p class="muted" style="margin-top:10px;font-size:13.5px">Didn't pass? Tell Dr J from your <a class="linkish" href="#/me/exam">exam plan</a> and plan the retake — she records the result.</p>`, w=>{ $('#psYes').onclick=()=>{ markPassed(e.i,'student'); closeSheet(); render(); toast('Wonderful — Dr J has been notified (prototype).'); }; $('#psNo').onclick=closeSheet; }); }
function compSheet(si){ const m=model(); const e=m.eff[m.canonOf(si)]; const cur=compAllowance(e.i); const j=joinedAt(e.i);

  const dec=decisionFor(e.i,k); const b=dec.basis||basisOf(e,k); const sg={kind:b.kind||suggestionFor(e,k).kind}; const u=b.u; const uw=b.rule==='event'?(u===1?'class':'classes'):(u===1?'billable day':'billable days'); const ccB={att:b.att, dayCount:b.dayCount, billable:b.billable, comped:b.comped, grace:b.grace, s1:cc.s1, s23:cc.s23}; const basis = dec.t==='confirm' ? (u>=16?`Full-cycle rate — ${u} ${uw} (16 or more)`:(sg.kind==='full'?`Full-cycle rate (capped) — ${u} ${uw}`:(b.rule==='day'?`One $25 charge per calendar day — ${u} billable ${u===1?'day':'days'} × $25 (${ccB.att} attendances; a Step 1 and a Step 2/3 class on the same day count once)`:`Per-session rate — ${ccB.att} classes × $25`))) : `Amount set by Dr J${dec.note?' — '+esc(dec.note):''}`;
  const line = dec.t==='confirm' && u<16 && sg.kind==='per' ? {desc:`Live Drills attendance — ${esc(c.label)} (${fmtRange(c)})${b.rule==='day'?' — billable days':''}`,qty:u,unit:25,amt:st.amount} : {desc:`Live Drills — ${esc(c.label)} (${fmtRange(c)})${dec.t==='confirm'?' — full cycle':''}`,qty:1,unit:st.amount,amt:st.amount};
  const zeroLines = b.rule==='day' ? [ccB.comped?{desc:`Comped days — first ${e.compAllow} billable days of Drills (no charge)`,qty:ccB.comped}:null, ccB.grace?{desc:`Exam-result grace days — attendance after the approved exam date (no charge)`,qty:ccB.grace}:null].filter(Boolean) : [];
  return `<section class="view"><a class="back" href="#/student/${e.i}?cycle=${k}">← ${esc(e.n)}</a>

      <div class="brandLine"><div class="a">MissionMed <b>Institute</b></div><div class="b">Exam Prep Division · Dr J's Live Drills</div></div>
      <div class="meta"><div><div class="k">Billed to</div><div class="v"><b>${esc(e.n)}</b></div><div class="v ${ct.email?'':'miss'}">${ct.email?esc(ct.email):'Email missing — add it before sending'}</div></div>
        <div><div class="k">Invoice</div><div class="v">Draft · no number until sent</div><div class="k" style="margin-top:10px">Cycle</div><div class="v">${esc(c.label)} · ${fmtRange(c)}, 2026</div></div></div>
      <div class="basis"><b>Attendance:</b> ${ccB.att} of ${c.sessions} classes — Step 1: ${cc.s1} of ${c.s1_sessions} · Step 2/3: ${cc.s23} of ${c.s23_sessions}${b.rule==='day'?` · <b>${ccB.dayCount} class ${ccB.dayCount===1?'day':'days'}</b> (${ccB.billable} billable${ccB.comped?`, ${ccB.comped} comped`:''}${ccB.grace?`, ${ccB.grace} exam grace`:''})`:''}<br><b>Billing basis:</b> ${basis}${basisChanged(e,k,dec)?` <span class="chip review">Attendance changed since approval — re-approve before sending</span>`:''}</div>
      <table><thead><tr><th>Description</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead><tbody><tr><td>${line.desc}</td><td class="r">${line.qty}</td><td class="r">${money(line.unit)}</td><td class="r">${money(line.amt)}</td></tr>${zeroLines.map(z=>`<tr><td class="muted">${z.desc}</td><td class="r muted">${z.qty}</td><td class="r muted">$0</td><td class="r muted">$0</td></tr>`).join('')}</tbody></table>
      <div class="tot"><div class="box"><span>Subtotal</span><span class="r money">${money(st.amount)}</span><span class="g">Amount due</span><span class="g r money">${money(st.amount)}</span></div></div>

function viewBilling(selK){ const m=model(); const focusK = CYK.find(k=>cycleStats(k).questions>0 || cycleStats(k).groups.clean.length>0) || CYK[0]; const k = selK || focusK; const keys = k==='all'? CYK : (k==='current'? [] : [k]); const all=[]; keys.forEach(kk=>{ const s=cycleStats(kk); s.groups.ready.forEach(x=>all.push({...x,k:kk,state:'ready'})); s.groups.approved.forEach(x=>all.push({...x,k:kk,state:'approved'})); s.groups.approvedNoEmail.forEach(x=>all.push({...x,k:kk,state:'noemail'})); });
  const selName = k==='all'?'All cycles':cyc(k).name;
  const ready=all.filter(x=>x.state==='ready'), approved=all.filter(x=>x.state==='approved'), noemail=all.filter(x=>x.state==='noemail');
  const sum=a=>a.reduce((t,x)=>t+x.st.amount,0);
  const reviewN = k==='all'? totalQuestions() : (k==='current'? 0 : cycleStats(k).questions);
  const selHTML = cycleSelector(k, kk=>'#/billing?cycle='+kk, {all:true});
  const rowB = x => `<div class="row"><div class="ring ok" style="--p:${Math.round(100*x.att/cyc(x.k).sessions)}"><span>${x.att}</span></div><div class="who"><div class="nm"><a href="#/student/${x.e.i}?cycle=${x.k}">${esc(x.e.n)}</a></div><div class="meta"><span>${esc(cyc(x.k).label)}</span><span>· ${x.att} classes</span>${contactOf(x.e.i).email?`<span>· ${esc(contactOf(x.e.i).email)}</span>`:'<span style="color:var(--redInk)">· email needed</span>'}</div></div><div class="amt"><span class="m ok money">${money(x.st.amount)}</span></div><div class="act">${x.state==='noemail'?`<button type="button" class="btn soft sm" data-go="#/student/${x.e.i}?cycle=${x.k}#contact">Add email</button>`:`<button type="button" class="btn soft sm" data-go="#/invoice/${x.e.i}/${x.k}">${x.state==='ready'?'Invoice':'Preview invoice'}</button>`}</div></div></div>`;
  if(k==='current') return `<section class="view"><div class="eyebrow em">Billing</div><div class="cycBar" style="margin-top:8px">${selHTML}</div><h1 class="h1" style="margin-top:8px">Review → Ready → Sent → Paid</h1><div class="panel empty" style="margin-top:22px"><div class="ill">⏱</div><div class="t">Nothing to bill yet for the Current Cycle</div><div class="d">Attendance for the next cycle will arrive automatically once the dates are set and Live Drills run through MissionMed.</div></div></section>`;
  const rd=WS.ruleDecision; const origAll=CYK.reduce((a,kk)=>a+ORIG_TOTAL[kk],0);
  const gate = `<div class="gate" id="rule"><div class="gHead"><span class="chip ${rd?'approved':'review'}">${rd?'Founder decision recorded':'Waiting on the Founder'}</span><b>${rd? (rd.mode==='retroactive'?'The one-charge-per-day rule applies to June, July and August as well as future cycles.':'The one-charge-per-day rule applies from the Current Cycle onward; June–August keep the original per-class calculation.') : 'Should the one-charge-per-day rule apply to June–August, or only from September? The Founder decides.'}</b></div><div class="gBody">${rd? `Recorded ${esc(fmtStamp(rd.at))}${rd.note?' — “'+esc(rd.note)+'”':''}. (Engineering note: historical effective-date decision — ${rd.mode}.)` : 'Until then, the June–August totals are estimates under an undecided rule. Your per-student approvals stand either way and record which rule they used. Engineering note: <i>Historical effective-date decision required — retroactive vs prospective application of the one-charge-per-day rule.</i>'}</div>
    <details class="why" style="margin-top:10px"><summary>Show the comparison — original per-class rule vs corrected per-day rule</summary><div class="gTbl"><table class="tbl"><thead><tr><th>Cycle</th><th class="r">Attendance events</th><th class="r">Billable days</th><th class="r">Original rule · per event</th><th class="r">Corrected rule · per day</th><th class="r">Difference</th><th class="r">Working estimate today</th></tr></thead><tbody>${CYK.map(kk=>{ const st=cycleStats(kk); return `<tr><td>${esc(cyc(kk).name)}</td><td class="r">${st.events.toLocaleString()}</td><td class="r">${st.dayCount.toLocaleString()}${st.dupDays?` <span class="muted">(${st.dupDays} both-Step days)</span>`:''}</td><td class="r money">${money(ORIG_TOTAL[kk])}</td><td class="r money">${money(st.estDayPure)}</td><td class="r money" style="color:var(--redInk)">${money(st.estDayPure-ORIG_TOTAL[kk])}</td><td class="r money muted">${money(st.est)}</td></tr>`; }).join('')}<tr><td><b>All cycles</b></td><td class="r"><b>${CYK.reduce((a,kk)=>a+cycleStats(kk).events,0).toLocaleString()}</b></td><td class="r"><b>${CYK.reduce((a,kk)=>a+cycleStats(kk).dayCount,0).toLocaleString()}</b></td><td class="r money"><b>${money(origAll)}</b></td><td class="r money"><b>${money(CYK.reduce((a,kk)=>a+cycleStats(kk).estDayPure,0))}</b></td><td class="r money" style="color:var(--redInk)"><b>${money(CYK.reduce((a,kk)=>a+cycleStats(kk).estDayPure,0)-origAll)}</b></td><td class="r money muted"><b>${money(CYK.reduce((a,kk)=>a+cycleStats(kk).est,0))}</b></td></tr></tbody></table></div><p class="muted" style="margin-top:8px;font-size:13.5px">"Original rule · per event" is frozen from the 5000B snapshot (${money(origAll)} in total) and never drifts; "Corrected rule · per day" isolates the rule change on the same reconciled attendance (same tiers: 0 → $0 · 1–15 days × $25 · 16+ days → $300). "Working estimate today" also reflects your corrections, comp days, exam-result grace and the displayed rule. <b>Open questions for the same decision:</b> whether the 16+ full-cycle threshold is counted in billable days (as shown) or attendance events, and whether a per-day amount may ever exceed the $300 full-cycle price.</p></details>

  const allTable = k==='all'? gate+`<div class="chapter"><div class="chHead"><span class="t">By cycle</span><span class="c">reporting view</span></div><div class="tblWrap"><table class="tbl"><thead><tr><th>Cycle</th><th>Dates</th><th class="r">Classes</th><th class="r">People</th><th>Review</th><th>Approved</th><th>Invoices</th><th>Payments</th></tr></thead><tbody>${CY_ALL.map(c=>{ const mt=cycleMeta(c.key); return `<tr><td><a class="linkish" href="#/billing?cycle=${c.key}">${esc(mt.name)}</a></td><td class="muted">${esc(mt.range)}</td><td class="r">${mt.classes||'—'}</td><td class="r">${mt.people||'—'}</td><td>${esc(mt.review)}</td><td>${esc(mt.approved)}</td><td>${esc(mt.invoices)}</td><td class="muted">${esc(mt.payments)}</td></tr>`; }).join('')}</tbody></table></div></div>` : '';

function missionAccountsHydrateProviderInvoice(root){
  if(document.documentElement.dataset.missionaccountsBuild!=='production') return;
  const route=(location.hash||'').match(new RegExp('^#/invoice/([0-9]+)/(june|july|august)'));
  if(!route) return;
  const si=Number(route[1]); const k=route[2]; const provider=WS.providerInvoices?.[si]?.[k]||null;
  const ready=WS.ready?.[si]?.[k]===true; const panel=root.querySelector('.invSide .panel');
  const row=panel?.querySelector('.btnRow'); const chip=panel?.querySelector('.chip'); const message=panel?.querySelector('.muted');
  if(!row||!chip||!message) return;
  const activate=button=>{ button.onclick=async()=>{ const [studentIndex,cycleKey,action]=button.dataset.providerInvoice.split('|'); const saved=await window.MissionAccountsRuntime.dispatch('hosted-invoice',{si:Number(studentIndex),k:cycleKey,action}); if(saved===false)return; render(); }; };
  if(!provider&&ready){
    const send=document.createElement('button'); send.type='button'; send.className='btn confirm';
    send.dataset.providerInvoice=si+'|'+k+'|send'; send.textContent='Send Stripe invoice'; activate(send); row.prepend(send); return;
  }
  if(!provider) return;
  const labels={sent:'Sent',paid:'Paid',overdue:'Overdue',void:'Voided',failed:'Provider attention needed'};
  chip.textContent=labels[provider.state]||'Provider invoice';
  chip.className='chip '+(provider.state==='paid'?'approved':provider.state==='sent'?'ready':provider.state==='void'?'none':'review');
  message.textContent=provider.state==='paid'?'Stripe confirmed payment.'
    :provider.state==='void'?'This Stripe invoice is void and cannot be paid.'
    :provider.state==='failed'?'The provider action failed safely. Review and retry the same invoice.'
    :'Stripe is hosting this invoice'+(provider.dueAt?' · due '+String(provider.dueAt).slice(0,10):'.');
  row.querySelectorAll('[data-ready]').forEach(control=>control.remove());
  const controls=[];
  if(provider.hostedUrl&&String(provider.hostedUrl).startsWith('https://invoice.stripe.com/')){
    const open=document.createElement('a'); open.className='btn confirm'; open.href=provider.hostedUrl;
    open.target='_blank'; open.rel='noopener noreferrer'; open.textContent='Open Stripe invoice'; controls.push(open);
  }
  if(['sent','overdue','failed'].includes(provider.state)){
    const resend=document.createElement('button'); resend.type='button'; resend.className='btn soft';
    resend.dataset.providerInvoice=si+'|'+k+'|resend'; resend.textContent='Resend invoice'; activate(resend); controls.push(resend);
    const voidButton=document.createElement('button'); voidButton.type='button'; voidButton.className='btn ghost';
    voidButton.dataset.providerInvoice=si+'|'+k+'|void'; voidButton.textContent='Void invoice'; activate(voidButton); controls.push(voidButton);
  }
  controls.reverse().forEach(control=>row.prepend(control));
}
function missionAccountsApplyCapabilityState(root){
  if(document.documentElement.dataset.missionaccountsBuild!=='production') return;
  const rules=[
    ['student_contacts','[data-save-contact],#eSaveId,[data-etab="identity"]','Student contact editing is not enabled for this environment.'],
    ['billing_decisions','[data-decide],[data-decide-amt],[data-undecide],[data-other],[data-confirm-group],[data-confirm-all],[data-policy],[data-ready]','Billing approval and invoice readiness are not enabled for this environment.'],
    ['attendance_corrections','[data-undo-corr],[data-report],[data-attendance-issue-review],[data-att],#eSaveNote,#eSaveId,[data-etab="attendance"]','Attendance corrections and issue review are not enabled for this environment.'],
    ['exam_plans','[data-exam-set],[data-exam],[data-passed],[data-exam-withdraw]','Exam-plan actions are not enabled for this environment.'],
    ['comp_days','[data-comp]','Comp-day editing is not enabled for this environment.'],
    ['auto_billing','[data-pay],[data-auth],[data-auth-off]','Payment activation is pending; no payment action will occur.'],
    ['hosted_invoices','[data-provider-invoice]','Stripe-hosted invoicing is not enabled for this environment.'],
  ];
  for(const [capability,selector,reason] of rules){
    if(missionAccountsCapability(capability)) continue;
    root.querySelectorAll(selector).forEach(control=>missionAccountsDisable(control,reason));
  }
  root.querySelectorAll('[data-edit]').forEach(control=>{
    if(!missionAccountsCapability('student_contacts')&&!missionAccountsCapability('attendance_corrections')&&!missionAccountsCapability('billing_decisions')) missionAccountsDisable(control,'Record editing is not enabled for this environment.');
  });
  root.querySelectorAll('[data-rule-decision]').forEach(control=>missionAccountsDisable(control,'The Founder rule decision is locked and read-only.'));
  root.querySelectorAll('[data-confirm-group],[data-confirm-all],[data-undecide],[data-policy$="|"]').forEach(control=>missionAccountsDisable(control,'This batch or clear action remains unavailable until its authoritative server transaction is implemented.'));
  if(!missionAccountsCapability('billing_decisions')) root.querySelectorAll('[data-bt],#bSave,[data-etab="billing"],[data-t],#oSave').forEach(control=>missionAccountsDisable(control,'Billing decisions are not enabled for this environment.'));
  if(!missionAccountsCapability('identity_review')) root.querySelectorAll('[data-identity-canonical]').forEach(control=>missionAccountsDisable(control,'Identity review is not enabled for this environment.'));
  if(!['student'].includes(window.MissionAccountsRuntime?.state?.user?.role)){
    root.querySelectorAll('[data-pay],[data-auth],[data-auth-off]').forEach(control=>missionAccountsDisable(control,'Only the signed-in student may change payment setup or authorization.'));
  }
  root.querySelectorAll('[role="tab"]').forEach(tab=>{ const selected=tab.classList.contains('on'); tab.setAttribute('aria-selected',String(selected)); tab.tabIndex=selected?0:-1; });
  root.querySelectorAll('[data-theme-set]').forEach(button=>button.setAttribute('aria-pressed',String(button.classList.contains('on'))));
  root.querySelectorAll('[data-lens]').forEach(button=>button.setAttribute('aria-pressed',String(button.classList.contains('on'))));
}

      <p class="muted" style="margin-top:14px;font-size:14px"><b>Sources</b> · ${esc(D.meta.sources.ledger.file)} <span class="raw">${esc(D.meta.sources.ledger.sha256)}</span><br>${esc(D.meta.sources.graph.file)} <span class="raw">${esc(D.meta.sources.graph.sha256)}</span></p>

  else if(tab==='health'){ body=`<div class="panel" style="padding:20px;margin-top:14px"><div class="chHead" style="margin-top:0"><span class="t">Zoom Attendance Sync</span><span class="c">integration port</span></div>
      <div class="zoomPort"><div class="zState"><span class="chip ${missionAccountsZoomHealth().stateChip}">${esc(missionAccountsZoomHealth().stateLabel)}</span><span class="chip ${missionAccountsZoomHealth().readinessChip}">${esc(missionAccountsZoomHealth().readiness)}</span></div>
        <div class="kv" style="margin-top:12px"><span class="k">Last sync</span><span class="v">${esc(missionAccountsZoomHealth().last)}</span><span class="k">Next sync</span><span class="v">${esc(missionAccountsZoomHealth().next)}</span><span class="k">Health</span><span class="v">${esc(missionAccountsZoomHealth().health)}</span><span class="k">Review exceptions</span><span class="v">${missionAccountsZoomHealth().exceptions} integration exception${missionAccountsZoomHealth().exceptions===1?'':'s'} · <a class="linkish" href="#/review">${model().openClusters.length+openDevices().length} open identity question${model().openClusters.length+openDevices().length===1?'':'s'}</a></span><span class="k">Source of the data shown today</span><span class="v">MX-EXAMPREP-5000B reconciled ledger (one-time reconstruction)</span></div>
        <p class="muted" style="margin-top:12px;font-size:14px">When connected, MissionAccounts will read Dr J's completed Zoom meetings once a day, identify the Drills classes, and add attendance events here with full provenance. Ambiguous names go to <b>Similar names</b> for review. Sync never overwrites a decision Dr J has already made, and a failed run changes nothing.</p>
        <details class="why" style="margin-top:10px"><summary>Adapter contract (for engineering) · ZoomAttendanceProvider</summary><div class="evid"><div><span class="k">Inputs</span><br>date window · authorized account · meeting metadata · participant reports</div><div><span class="k">Outputs</span><br>canonical session candidates · attendance events · source IDs · join/leave times · provenance · ingestion result/health</div><div><span class="k">Guarantees</span><br>idempotent · replayable · audited · source-preserving · ambiguous identities staged for review · never overwrites Dr J-approved billing decisions · non-destructive on failure</div></div></details></div></div>
      <div class="panel" style="padding:20px;margin-top:14px"><div class="chHead" style="margin-top:0"><span class="t">Payments</span><span class="c">Stripe · future</span></div><div class="kv" style="margin-top:12px"><span class="k">Payment methods</span><span class="v">status will come from Stripe · MissionMed never stores card numbers</span><span class="k">Automatic Drills billing</span><span class="v">requires a saved payment method and accepted terms · charges within 24–48 h after verified attendance</span><span class="k">Reminders</span><span class="v">exam-result check-in on the third Wednesday after an approved exam date · cancelled when Passed is marked</span></div></div>`; }
  else if(tab==='working'){ body=`<div class="btnRow" style="margin-top:14px"><button type="button" class="btn soft sm" data-export="1">Download working state (JSON)</button><button type="button" class="btn danger sm" data-reset="1">Reset all prototype decisions</button><span class="muted">${WS.log.length} entries in this session · durable audit remains on the server</span></div><div class="log" style="margin-top:14px">${WS.log.map(l=>`<div class="e"><span class="w">${esc(fmtStamp(l.t))}</span><span>${esc(l.text)}</span><span class="m ${l.impact<0?'':''}" style="color:${l.impact<0?'var(--redInk)':l.impact>0?'var(--greenInk)':'var(--mute)'}">${l.impact?money(l.impact):''}</span></div>`).join('')||'<div class="muted">Nothing recorded yet.</div>'}</div>`; }
  return `<section class="view"><div class="eyebrow">Advanced · evidence and controls</div><h1 class="h1" style="margin-top:8px">Under the hood.</h1><p class="lead" style="margin-top:8px">Everything Dr J normally does not need. The source data is never edited here; your decisions are recorded separately and can be undone.</p>
    <div class="tabs">${tabs.map(([t,l])=>`<button type="button" class="${t===tab?'on':''}" data-go="#/advanced/${t}">${l}</button>`).join('')}</div>${body}</section>`; }

function otherSheet(si,k){ const e=model().eff[si]; const att=e.c[k]?e.c[k].att:0; const u=unitsOf(e.c[k]); const sug=suggestionFor(e,k);
  openSheet(`<div class="t">More options for ${esc(e.n)} · ${esc(cyc(k).label)}</div><div class="d">The estimate from attendance is ${money(sug.amount)} for ${u} ${unitWord(u)}${WS.rule==='day'&&att!==u?` (${att} attendances)`:''}. Pick how this cycle should be treated.</div>
    <div class="optGrid">
      <button type="button" class="opt" data-t="fullcycle"><b>Full-cycle price</b><span>$300 for the cycle</span></button>
      <button type="button" class="opt" data-t="prepaid"><b>Prepaid</b><span>Paid in advance · nothing due</span></button>
      <button type="button" class="opt" data-t="already_paid"><b>Already paid</b><span>Paid outside this system</span></button>
      <button type="button" class="opt" data-t="already_invoiced"><b>Already invoiced</b><span>Invoiced elsewhere · not again here</span></button>
      <button type="button" class="opt" data-t="waived"><b>Waived</b><span>No charge this cycle</span></button>
      <button type="button" class="opt" data-t="special"><b>Special arrangement</b><span>A different amount, with a note</span></button>
      <button type="button" class="opt" data-t="other"><b>Custom amount</b><span>Any amount</span></button>
    </div>
    <div class="otherForm" id="oForm" hidden><div class="field"><label for="oAmt">Amount (USD)</label><input id="oAmt" type="number" min="0" step="5" value="${sug.amount}"></div><div class="field"><label for="oNote">Note (shown on the record)</label><input id="oNote" type="text" placeholder="e.g. Half price agreed in June · Family rate"></div></div>
    <div class="acts"><button type="button" class="btn confirm" id="oSave" hidden>Save treatment</button><button type="button" class="btn ghost" id="oCancel">Cancel</button></div>`, w=>{ let chosen=null;
      w.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ chosen=b.dataset.t; w.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b)); const needsAmt = chosen==='special'||chosen==='other'; $('#oForm').hidden=!needsAmt; $('#oSave').hidden=false; if(!needsAmt){ decide(si,k,chosen); closeSheet(); render(); } else { $('#oAmt').focus(); } });
      $('#oSave').onclick=()=>{ if(!chosen) return; const amt=Math.max(0,Math.round(+$('#oAmt').value||0)); decide(si,k,chosen,amt,$('#oNote').value.trim()); closeSheet(); render(); }; $('#oCancel').onclick=closeSheet; }); }

/* ---------------- Edit / correct record ---------------- */
function editSheet(si,k,tab){ const m=model(); const e=m.eff[m.canonOf(si)]; const ct=contactOf(e.i); tab=tab||'identity'; const sessions=D.sessions.filter(s=>s.c===k); const mine=new Set(e.c[k]?e.c[k].sess:[]); const src=e.src[k]||{att:0}; const cur=e.c[k]||{att:0};
  const tabs=[['identity','Identity'],['attendance','Attendance'],['billing','Billing']].map(([t,l])=>`<button type="button" class="${t===tab?'on':''}" data-etab="${t}">${l}</button>`).join('');
  let body='';
  if(tab==='identity') body=`<div class="otherForm"><div class="field"><label for="eName">Display name</label><input id="eName" type="text" value="${esc(e.n)}"><span class="muted" style="font-size:13px">Source name from Zoom: <b>${esc(e.srcName)}</b>. The source is never overwritten.</span></div>
      <div class="field"><label for="eEmail">Email</label><input id="eEmail" type="email" value="${esc(ct.email||'')}" placeholder="student@email.com"></div>
      <div class="field"><label for="ePhone">Phone (if collected later)</label><input id="ePhone" type="tel" value="${esc(ct.phone||'')}"></div>
      <div class="field"><label for="eWhy">Reason (optional, kept in history)</label><input id="eWhy" type="text" placeholder="e.g. Student asked to be listed by her full name"></div></div>
      <div class="acts"><button type="button" class="btn confirm" id="eSaveId">Save identity</button><button type="button" class="btn ghost" data-eclose="1">Close</button></div>`;
  else if(tab==='attendance') body=`<div class="layersMini"><span>Zoom reconstruction: <b>${src.att}</b></span><span>Dr J record: <b>${cur.att}</b> ${cur.att!==src.att?'<span class="chip review">corrected</span>':''}</span><span>Estimate: <b class="money est">${money(suggestionFor(e,k).amount)}</b></span></div>
      <div class="field" style="margin-top:12px"><label for="eReason">Reason for the change (optional, shown in history)</label><input id="eReason" type="text" placeholder="e.g. Student was on the call but joined by phone"></div>
      <div class="attEdit">${sessions.map(s=>{ const att=mine.has(s.i); const shown=e.stepOv[s.i]||s.st; const add=e.added.has(s.i), rem=e.removed.has(s.i); return `<div class="attRow ${att?'is':''}"><span class="dt">${esc(fmtDate(s.d))} · ${fmtTime(s.t)}</span><span class="chip ${shown}">${stepLabel(shown)}${e.stepOv[s.i]?' · corrected':''}</span><span class="st">${att?`<span class="chip approved">✓ Attended${add?' · added':''}</span>`:`<span class="chip ${rem?'review':'none'}">${rem?'Removed by Dr J':'Not attended'}</span>`}</span><span class="acts2">${att?`<button type="button" class="btn xs soft" data-att="${s.i}|remove">Remove</button><button type="button" class="btn xs ghost" data-att="${s.i}|step">Step → ${stepLabel(shown==='s1'?'s23':'s1')}</button>`:`<button type="button" class="btn xs green" data-att="${s.i}|add">Add attendance</button>`}</span></div>`; }).join('')}</div>
      <div class="field" style="margin-top:12px"><label for="eNote">Manual attendance note</label><input id="eNote" type="text" placeholder="e.g. Attended Aug 21 from a hospital phone; verified with the student"></div>
      <div class="acts"><button type="button" class="btn soft" id="eSaveNote">Add note</button><button type="button" class="btn ghost" data-eclose="1">Close</button></div>`;
  else body=`<div class="d">Approve the suggested amount, set another treatment, or add an internal note. The suggested amount is <b class="money">${money(suggestionFor(e,k).amount)}</b> for ${unitsOf(cur)} ${unitWord(unitsOf(cur))}.</div>
      <div class="optGrid" style="margin-top:12px">
        <button type="button" class="opt" data-bt="confirm"><b>Approve suggested</b><span>${money(suggestionFor(e,k).amount)} · ${esc(suggestionFor(e,k).label)}</span></button>
        <button type="button" class="opt" data-bt="other"><b>Custom amount</b><span>Any amount</span></button>
        <button type="button" class="opt" data-bt="ucc"><b>UCC</b><span>No charge · separate arrangement</span></button>
        <button type="button" class="opt" data-bt="mul"><b>MUL</b><span>No charge · separate arrangement</span></button>
        <button type="button" class="opt" data-bt="fullcycle"><b>Prepaid / full-cycle</b><span>$300 full-cycle price</span></button>
        <button type="button" class="opt" data-bt="waived"><b>Waived / no charge</b><span>$0 this cycle</span></button>
        <button type="button" class="opt" data-bt="already_paid"><b>Already paid</b><span>Nothing due</span></button>
        <button type="button" class="opt" data-bt="already_invoiced"><b>Already invoiced</b><span>Not invoiced again here</span></button>
        <button type="button" class="opt" data-bt="special"><b>Special arrangement</b><span>Amount + note</span></button>
      </div>
      <div class="otherForm" id="bForm" hidden><div class="field"><label for="bAmt">Amount (USD)</label><input id="bAmt" type="number" min="0" step="5" value="${suggestionFor(e,k).amount}"></div></div>
      <div class="field" style="margin-top:10px"><label for="bNote">Internal note (kept in history, not shown to the student)</label><input id="bNote" type="text" placeholder="optional"></div>
      <div class="acts"><button type="button" class="btn confirm" id="bSave" hidden>Save billing decision</button><button type="button" class="btn ghost" data-eclose="1">Close</button></div>`;
  openSheet(`<div class="t">Edit / correct record · ${esc(e.n)}</div><div class="d">${esc(cyc(k).label)}. Corrections never overwrite the source; each one is recorded and can be undone.</div><div class="tabs etabs">${tabs}</div>${body}`, w=>{
    w.querySelectorAll('[data-etab]').forEach(b=>b.onclick=()=>editSheet(si,k,b.dataset.etab));
    w.querySelectorAll('[data-eclose]').forEach(b=>b.onclick=()=>{ closeSheet(); render(); });
    const sv=$('#eSaveId'); if(sv) sv.onclick=()=>{ const nm=$('#eName').value.trim(); const why=$('#eWhy').value.trim(); if(nm && nm!==e.n) addCorr(e.i,'name',{from:e.n,to:nm,reason:why}); const em=$('#eEmail').value.trim(); if(em && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ toast('That email does not look right yet.'); $('#eEmail').focus(); return; } setContact(e.i, em, $('#ePhone').value.trim()); closeSheet(); render(); toast('Identity saved. Source name is kept.'); };
    w.querySelectorAll('[data-att]').forEach(b=>b.onclick=()=>{ const [ss,op]=b.dataset.att.split('|'); const s=D.sessions[+ss]; const reason=$('#eReason').value.trim(); const before=cur.att;
      if(op==='remove'){ if(e.added.has(+ss)){ const cr=(WS.corrs||[]).find(c=>c.type==='att_add'&&c.sess===+ss&&m.canonOf(c.si)===e.i); if(cr) undoCorr(cr.id); } else addCorr(e.i,'att_remove',{sess:+ss,k,from:before,to:before-1,reason}); }
      else if(op==='add'){ if(e.removed.has(+ss)){ const cr=(WS.corrs||[]).find(c=>c.type==='att_remove'&&c.sess===+ss&&m.canonOf(c.si)===e.i); if(cr) undoCorr(cr.id); } else addCorr(e.i,'att_add',{sess:+ss,k,from:before,to:before+1,reason}); }
      else if(op==='step'){ const shown=e.stepOv[+ss]||s.st; const to=shown==='s1'?'s23':'s1'; const existing=(WS.corrs||[]).find(c=>c.type==='step'&&c.sess===+ss&&m.canonOf(c.si)===e.i); if(existing) undoCorr(existing.id); if(to!==s.st) addCorr(e.i,'step',{sess:+ss,k,from:s.st,to,reason}); }
      editSheet(si,k,'attendance'); });
