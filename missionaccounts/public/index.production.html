/* ---------------- STUDENTS ---------------- */
function viewStudents(q, missing, setup){ return `<section class="view"><div class="eyebrow em">Students</div><h1 class="h1" style="margin-top:8px">Find a student.</h1>
  <div class="dirHead"><label class="bigSearch"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="dirSearch" placeholder="Type a name — first, last, or how it appeared in Zoom" value="${esc(q||'')}" autocomplete="off"></label>
  <label class="toggle"><input type="checkbox" id="missingOnly" ${missing?'checked':''}> Only people without an email</label><label class="toggle"><input type="checkbox" id="needOnly"> Only people who still need a decision</label><label class="toggle"><input type="checkbox" id="setupOnly" ${setup?'checked':''}> Only people missing payment setup</label></div>
  <div id="dirList"></div></section>`; }
function pendingCycles(e){ return CYK.filter(k=>e.c[k] && ['clean','question','device'].includes(accountState(e,k).state)); }
function renderStudents(q, partial){ const m=model(); const list=$('#dirList'); if(!list) return; const missing=$('#missingOnly')&&$('#missingOnly').checked; const needOnly=$('#needOnly')&&$('#needOnly').checked; const setupOnly=$('#setupOnly')&&$('#setupOnly').checked; const needle=(q||'').trim().toLowerCase();
  const people=m.eff.filter(e=>!e.absorbed && !e.notStudent && e.k!=='device' && (!missing || !contactOf(e.i).email) && (!needOnly || pendingCycles(e).length) && (!setupOnly || needsSetup(e)) && (!needle || e.n.toLowerCase().includes(needle) || e.a.some(a=>a.toLowerCase().includes(needle))));
  const devices=m.eff.filter(e=>!e.absorbed && !e.notStudent && e.k==='device' && (!needle || e.n.toLowerCase().includes(needle)));
  const total = e => CYK.reduce((a,k)=>a+(e.c[k]?e.c[k].att:0),0);
  let html=`<p class="muted" style="margin-top:14px;display:flex;gap:14px;flex-wrap:wrap;align-items:center"><span>${people.length} ${people.length===1?'person':'people'}${needle?` matching “${esc(needle)}”`:''}${missing?' without an email':''}${setupOnly?' missing payment setup':''}.</span><span class="cyc3" style="display:inline-flex;gap:6px;align-items:center;font-size:13px"><i class="on" style="width:26px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--em),var(--em2));display:inline-block"></i> bars = June · July · August attended</span></p>`;
  let last=''; people.forEach(e=>{ const L=e.n[0].toUpperCase(); if(L!==last && !needle){ html+=`<div class="letter">${esc(L)}</div>`; last=L; }
    const alias = e.a.filter(a=>a!==e.n); html+=`<a class="srow" href="#/student/${e.i}"><div><div class="nm">${esc(e.n)}</div><div class="al">${alias.length?'Also seen as '+esc(alias.slice(0,3).join(', '))+(alias.length>3?'…':''):''}${contactOf(e.i).email?(alias.length?' · ':'')+esc(contactOf(e.i).email):(alias.length?' · ':'')+'no email yet'}</div></div><div class="cyc3" title="June · July · August">${CYK.map(k=>`<i class="${e.c[k]?'on':''}"></i>`).join('')}</div><div class="tot">${total(e)}<small>classes</small></div><div class="need">${(()=>{ const p=pendingCycles(e); const cy=CYK.filter(k=>e.c[k]); const approved=cy.reduce((a,k)=>{ const st=accountState(e,k); return a+((st.state==='approved'||st.state==='ready'||st.state==='approvedNoEmail')?st.amount:0); },0); const ev=examView(e.i); return (p.length? `<span class="chip review">${p.length} of ${cy.length} to decide</span>` : `<span class="chip approved">✓ decided · ${money(approved)}</span>`) + (ev.state!=='none'?` <span class="chip ${ev.state==='pending'?'review':ev.state==='passed'?'approved':'s23'}" title="Exam plan">${esc(stepShort(ev.ex.step))} · ${esc(fmtDate(ev.ex.date,{short:true}))}</span>`:'') + (setupOnly?' <span class="chip none">setup missing</span>':''); })()}</div></a>`; });
  if(devices.length && !missing){ html+=`<div class="letter" style="margin-top:28px">Unidentified attendees</div><p class="muted" style="margin:-2px 0 10px 4px;font-size:14.5px">Zoom names that are not a person yet. They are listed here so nothing is lost — resolve them from <a class="linkish" href="#/review">Similar names</a>.</p>`;
    devices.forEach(e=>{ html+=`<a class="srow" href="#/review"><div><div class="nm"><span class="chip device">${esc(e.n)}</span></div><div class="al">Recorded Zoom name · not counted as a student</div></div><div class="cyc3">${CYK.map(k=>`<i class="${e.c[k]?'on':''}"></i>`).join('')}</div><div class="tot">${total(e)}<small>classes</small></div><div class="need"><span class="chip device">unidentified</span></div></a>`; }); }
  if(!people.length && !devices.length) html+=`<div class="panel empty"><div class="ill">?</div><div class="t">No one matches “${esc(needle)}”</div><div class="d">Try a first name only, or the name as it appeared in Zoom.</div></div>`;
  list.innerHTML=html; }

/* ---------------- STUDENT PROFILE ---------------- */
function calendarHTML(e, k, opts={}){ const c=cyc(k); const sessions=D.sessions.filter(s=>s.c===k); const mine=new Set(e.c[k]?e.c[k].sess:[]);
  const stepOf = s => e.stepOv[s.i]||s.st;
  const byDate={}; sessions.forEach(s=>{ (byDate[s.d]=byDate[s.d]||{}); byDate[s.d][s.st]=s; });
  // weeks Monday..Friday between cycle start and end
  const start=new Date(c.start+'T12:00:00'); const end=new Date(c.end+'T12:00:00'); const d0=new Date(start); d0.setDate(d0.getDate()-((d0.getDay()+6)%7));
  let html=`<div class="cal"><div class="dh">Mon</div><div class="dh">Tue</div><div class="dh">Wed</div><div class="dh">Thu</div><div class="dh">Fri</div>`;
  for(let w=new Date(d0); w<=end; w.setDate(w.getDate()+7)){
    for(let i=0;i<5;i++){ const day=new Date(w); day.setDate(day.getDate()+i); const iso=localISO(day); const inRange=day>=start && day<=end; const sess=byDate[iso];
      if(!inRange){ html+=`<div class="day blank" aria-hidden="true"></div>`; continue; }
      if(!sess){ html+=`<div class="day blank"><div class="dn"><span>${day.getDate()}</span><small>${MONTH[day.getMonth()].toUpperCase()}</small></div><span class="nc">No class</span></div>`; continue; }
      const lane = st => { const s=sess[st]; if(!s) return `<div class="lane nos"></div>`; const att=mine.has(s.i); const shown=stepOf(s); const add=e.added.has(s.i), rem=e.removed.has(s.i); return `<div class="lane ${att?'att '+shown:'miss'} ${add?'added':''} ${rem?'removed':''}" title="${stepLong(shown)} · ${fmtTime(s.t)} · ${att?'attended':'not attended'}${add?' · added by Dr J':''}${rem?' · removed by Dr J':''}">${att?'✓ ':''}<span class="full">${stepLabel(shown)}${add?' +':''}</span><span class="short">${shown==='s1'?'S1':'S2/3'}</span></div>`; };
      const stu=WS.lens==='student'; const dayInfo = (e.c[k]&&e.c[k].days||[]).find(x=>x.d===iso); const dayTag = !dayInfo? '' : dayInfo.kind==='comped'? `<span class="dayTag comp" title="Comped — Day ${dayInfo.compN} of ${e.compAllow}">${stu?`Free day ${dayInfo.compN} of ${e.compAllow}`:`Comped ${dayInfo.compN}/${e.compAllow}`}</span>` : dayInfo.kind==='grace'? `<span class="dayTag grace" title="Exam-result grace — recorded, not billed">${stu?'Free · waiting for result':'Exam grace'}</span>` : dayInfo.dup? `<span class="dayTag one" title="Step 1 and Step 2/3 on the same day — one $25 charge">${stu?'Both Steps · one $25 day':'1 billable day'}</span>` : `<span class="dayTag bill" title="Billable day">$25 day</span>`;
      const exDate = examApprovedDate(examOf(e.i)); const isExam = exDate===iso;
      html+=`<div class="day ${dayInfo?dayInfo.kind:''} ${isExam?'examDay':''}"><div class="dn"><span>${day.getDate()}</span><small>${MONTH[day.getMonth()].toUpperCase()}</small>${isExam?'<b class="exMark" title="Approved exam date">EXAM</b>':''}</div>${lane('s1')}${lane('s23')}${WS.rule==='day'?dayTag:''}</div>`; }
  }
  html+=`</div>`; return html; }
function ledgerHTML(e, k, showMissed, admin){ const sessions=D.sessions.filter(s=>s.c===k); const mine=new Map(); D.events.forEach(([si,ss,mins,ai,rows])=>{ const m=model(); if(m.canonOf(si)===e.i && D.sessions[ss].c===k) mine.set(ss,{mins,alias:D.students[si].a[ai],rows}); });
  const attended=new Set(e.c[k]?e.c[k].sess:[]);
  const rows=sessions.filter(s=>showMissed||attended.has(s.i)||e.removed.has(s.i)).map(s=>{ const ev=mine.get(s.i); const shown=e.stepOv[s.i]||s.st; const isAtt=attended.has(s.i);
    if(!isAtt){ const rem=e.removed.has(s.i); return `<div class="led miss"><span class="dt">${esc(fmtDate(s.d))}</span><span class="tm">${fmtTime(s.t)}</span><span class="as">${stepLong(shown)} · ${rem?`Zoom shows attended · <b>removed by Dr J</b>`:'class held'}</span><span class="st"><span class="chip ${rem?'review':'none'}">${rem?'Removed by Dr J':'Not attended'}</span></span></div>`; }
    if(!ev){ return `<div class="led"><span class="dt">${esc(fmtDate(s.d))}</span><span class="tm">${fmtTime(s.t)}</span><span class="as"><span class="chip ${shown}">${stepLabel(shown)}</span> ${admin?'No Zoom record · <b>added by Dr J</b>':'Confirmed by Dr J'}</span><span class="st"><span class="chip approved">✓ Attended · added</span>${(()=>{ const di=(e.c[k]&&e.c[k].kindOf)?e.c[k].kindOf[s.i]:null; return !di||WS.rule!=='day'?'': di.kind==='comped'?`<span class="chip comp">Comped · Day ${di.compN} of ${e.compAllow}</span>`: di.kind==='grace'?`<span class="chip grace">Exam-result grace · not billable</span>`: (di.dup&&di.sess[0]!==s.i)?`<span class="chip bday">Same day · counted once</span>`:`<span class="chip bday">Billable day · $25</span>`; })()}</span></div>`; }
    const di=(e.c[k]&&e.c[k].kindOf)?e.c[k].kindOf[s.i]:null; const billChip = !di||WS.rule!=='day' ? '' : di.kind==='comped'? `<span class="chip comp">${admin?`Comped · Day ${di.compN} of ${e.compAllow}`:`Free day ${di.compN} of ${e.compAllow}`}</span>` : di.kind==='grace'? `<span class="chip grace">${admin?'Exam-result grace · not billable':'Free · waiting for your result'}</span>` : (di.dup && di.sess[0]!==s.i)? `<span class="chip bday">Same day · counted once</span>` : `<span class="chip bday">Billable day · $25</span>`;
    return `<div class="led"><span class="dt">${esc(fmtDate(s.d))}</span><span class="tm">${fmtTime(s.t)}</span><span class="as"><span class="chip ${shown}">${stepLabel(shown)}${e.stepOv[s.i]?' · corrected':''}</span> ${admin?`Joined as <b>${esc(ev.alias)}</b> · ${ev.mins} min connected`:`${ev.mins} min in class`}</span><span class="st"><span class="chip approved">✓ Attended</span>${billChip}${admin?`<details><summary>Source</summary><div class="src">Zoom meeting ${esc(s.m)} · started ${esc(s.t.replace('T',' '))} · ${ev.rows} participant row${ev.rows===1?'':'s'} consolidated · ${s.n} participants in class${e.stepOv[s.i]?` · source Step: ${stepLabel(s.st)}`:''}</div></details>`:''}</span></div>`; }).join('');
  return `<div class="ledger">${rows||'<div class="led"><span class="as">No classes attended in this cycle.</span></div>'}</div>`; }

function recordLayersHTML(e,k){ const src=e.src[k]||{att:0,s1:0,s23:0,days:0}; const cur=e.c[k]||{att:0,s1:0,s23:0,billable:0,comped:0,grace:0,dayCount:0}; const sugSrc=suggestionN(WS.rule==='event'?src.att:src.days,k); const sugCur=suggestionFor(e,k); const st=accountState(e,k); const dec=decisionFor(e.i,k); const ct=contactOf(e.i); const corrs=corrsFor(e.i).filter(c=>c.type==='name'||(c.sess!=null && D.sessions[c.sess].c===k));
  const changed = src.att!==cur.att || src.s1!==cur.s1 || e.n!==e.srcName;
  return `<div class="layers panel"><div class="lay"><span class="k">Source record</span><span class="s">what Zoom and the reconciliation say</span><div class="v">${src.att} ${src.att===1?'class':'classes'}<small>Step 1: ${src.s1} · Step 2/3: ${src.s23}</small></div><div class="v2">${esc(e.srcName)}</div></div>
    <div class="lay"><span class="k">System interpretation</span><span class="s">what the attendance rules calculate</span><div class="v">${cur.att} ${cur.att===1?'class':'classes'}${changed?' <span class="chip review">corrected</span>':''}<small>${WS.rule==='day'?`${cur.billable} billable ${cur.billable===1?'day':'days'}${cur.comped?` · ${cur.comped} comped`:''}${cur.grace?` · ${cur.grace} exam grace`:''} · `:''}${esc(sugCur.label)} · <span class="money est">${money(sugCur.amount)}</span> estimate</small></div><div class="v2">${changed&&src.att!==cur.att?`was ${src.att} · ${money(sugSrc.amount)}`:'no corrections'}</div></div>
    <div class="lay"><span class="k">Dr J approved record</span><span class="s">the operational truth after your decision</span><div class="v ${dec?'ok':''}">${dec? (st.amount||st.state==='nocharge'||st.state==='handled'? money(st.amount) : money(st.amount)) : '—'}<small>${dec? esc(st.label) : 'not yet approved'}</small></div><div class="v2">${e.n!==e.srcName?`shown as <b>${esc(e.n)}</b>`:''}${ct.email?` · ${esc(ct.email)}`:''}</div></div></div>`; }
function examPlanChapterHTML(e){ const ev=examView(e.i); const ex=ev.ex; const chipCls = {none:'none',pending:'review',approved:'approved',speak:'s23',denied:'none',completed:'s1',passed:'approved',followup:'review'}[ev.state];
  const body = !ex ? `<div class="exRow"><div><div class="t">No exam date yet</div><div class="d">The student can submit a Step / Level and an intended date from their MissionAccounts home. Dr J can also enter one here.</div></div><button type="button" class="btn soft sm" data-exam-set="${e.i}">Enter exam plan</button></div>`
    : `<div class="exRow"><div><div class="t">${esc(STEP_NAMES[ex.step])} · ${esc(fmtDate(ex.date))}, ${ex.date.slice(0,4)} <span class="chip ${chipCls}">${esc(ev.label)}</span></div><div class="d">${ev.state==='pending'?`Submitted ${esc(fmtStamp(ex.submittedAt))} · waiting for your decision.`:ev.state==='approved'?`Approved ${esc(fmtStamp(ex.decidedAt))}. Attendance after ${esc(fmtDate(ex.date,{short:true}))} is recorded but <b>not billed</b> while the result is pending.${ev.reminder?' '+esc(ev.reminder.text)+'.':''}`:ev.state==='completed'?`Exam date has passed · awaiting result. ${ev.reminder?esc(ev.reminder.text)+'.':''} Attendance since ${esc(fmtDate(ex.date,{short:true}))} is in exam-result grace.`:ev.state==='passed'?`Passed · recorded ${esc(fmtDate(passedDate(ex)||TODAY_ISO))}. Classes from ${esc(fmtDate(ex.date,{short:true}))} to ${esc(fmtDate(passedDate(ex)||TODAY_ISO,{short:true}))} stay free; billing resumes from the next class. ${ev.reminder?esc(ev.reminder.text)+'.':''}`:ev.state==='speak'?`You asked to speak with the student before deciding.${ex.note?' “'+esc(ex.note)+'”':''}`:ev.state==='denied'?`Not approved — the student was asked to choose another date${ex.suggested?` (you suggested ${esc(fmtDate(ex.suggested,{short:true}))})`:''}.${ex.note?' “'+esc(ex.note)+'”':''}`:`Needs follow-up.${ex.note?' “'+esc(ex.note)+'”':''}`}</div></div>
       <div class="btnRow">${ev.state==='pending'||ev.state==='speak'?`<button type="button" class="btn confirm sm" data-exam="${e.i}|approve">Approve</button><button type="button" class="btn ghost sm" data-exam="${e.i}|deny">Choose another date</button>${ev.state!=='speak'?`<button type="button" class="btn soft sm" data-exam="${e.i}|speak">Speak with student</button>`:''}`:''}${ev.state==='approved'||ev.state==='completed'?`<button type="button" class="btn soft sm" data-exam="${e.i}|passed">Record result</button><button type="button" class="btn ghost sm" data-exam="${e.i}|followup">Needs follow-up</button>`:''}${ev.state==='denied'||ev.state==='followup'||ev.state==='passed'?`<button type="button" class="btn ghost sm" data-exam="${e.i}|reopen">Reopen</button>`:''}${ev.state!=='passed'?`<button type="button" class="btn ghost xs" data-exam-set="${e.i}">Edit date</button>`:''}</div></div>`;
  return `<div class="chHead" style="margin-top:22px" id="exam"><span class="t">Exam plan</span><span class="c">${esc(ev.label)}</span></div><div class="panel exPanel">${body}</div>`; }
function examSheet(si, by){ const m=model(); const e=m.eff[m.canonOf(si)]; const ex=examOf(e.i); const student=by==='student';
  openSheet(`<div class="t">${student?'Set my exam date':'Exam plan · '+esc(e.n)}</div><div class="d">${student?'Tell Dr J which exam you are taking and the date you intend to sit it. She will review it and you will see her answer here. Once approved, classes after your exam date are free while you wait for your result.':'Enter the Step / Level and intended date on the student\'s behalf. It goes into your review queue like any submission.'}</div>
    <div class="stepPick" role="radiogroup" aria-label="Which exam">${['s1','s2','s3'].map(st=>`<button type="button" class="opt ${ex&&ex.step===st?'on':''}" data-step="${st}" role="radio" aria-checked="${ex&&ex.step===st?'true':'false'}"><b>${esc(STEP_NAMES[st])}</b><span>${st==='s1'?'Basic sciences':st==='s2'?'Clinical knowledge':'Patient management'}</span></button>`).join('')}</div>
    <div class="field" style="margin-top:14px"><label for="exDate">Intended exam date</label><input id="exDate" type="date" value="${esc(ex?ex.date:'')}" min="2026-06-01"></div>
    <div class="acts"><button type="button" class="btn primary" id="exGo" disabled>${student?'Send to Dr J':'Save exam plan'}</button><button type="button" class="btn ghost" id="exNo">Cancel</button></div>`, w=>{ let step=ex?ex.step:null; const refresh=()=>{ $('#exGo').disabled=!(step && $('#exDate').value); };
      w.querySelectorAll('[data-step]').forEach(b=>b.onclick=async()=>{ step=b.dataset.step; w.querySelectorAll('[data-step]').forEach(x=>{ x.classList.toggle('on',x===b); x.setAttribute('aria-checked',x===b?'true':'false'); }); refresh(); }); $('#exDate').oninput=refresh; refresh();
      $('#exGo').onclick=async()=>{ if(await submitExam(e.i, step, $('#exDate').value, student?'student':'admin')===false)return; closeSheet(); render(); toast(student?'Sent to Dr J. You will see her answer here.':'Exam plan saved to your review queue.'); }; $('#exNo').onclick=closeSheet; }); }
function examDecideSheet(si, action){ const m=model(); const e=m.eff[m.canonOf(si)]; const ex=examOf(e.i); if(!ex) return;
  const first=e.n.split(' ')[0]; const wasApproved=['approved','completed'].includes(examView(e.i).state);
  if(action==='passed'){ openSheet(`<div class="t">Record ${esc(first)}'s result</div><div class="d">${esc(STEP_NAMES[ex.step])} on <b>${esc(fmtDate(ex.date))}</b>. Classes from ${esc(fmtDate(ex.date,{short:true}))} to today stay free whatever the result — grace is never billed backwards. Billing resumes from the next class.</div>
      <div class="optGrid" style="margin-top:12px"><button type="button" class="opt" data-res="passed"><b>Passed</b><span>${esc(first)} told you she passed</span></button><button type="button" class="opt" data-res="not_passed"><b>Did not pass</b><span>Grace ends today · plan a retake</span></button><button type="button" class="opt" data-res="no_result"><b>No result yet — end grace</b><span>Use when the wait has gone on too long</span></button></div>
      <div class="field" style="margin-top:12px"><label for="exNote">Note (kept in history)</label><input id="exNote" type="text" placeholder="optional"></div><div class="acts"><button type="button" class="btn confirm" id="exdGo" disabled>Record</button><button type="button" class="btn ghost" id="exdNo">Cancel</button></div>`, w=>{ let res=null; w.querySelectorAll('[data-res]').forEach(b=>b.onclick=async()=>{ res=b.dataset.res; w.querySelectorAll('[data-res]').forEach(x=>x.classList.toggle('on',x===b)); $('#exdGo').disabled=false; }); $('#exdGo').onclick=async()=>{ if(!res) return; const note=$('#exNote').value.trim(); const saved=res==='passed'?await markPassed(e.i,'admin'):await decideExam(e.i,res,note); if(saved===false)return; closeSheet(); render(); toast(res==='passed'?'Passed recorded. Grace ended today.':res==='not_passed'?'Result recorded — did not pass. Grace ended today.':'Grace ended today. No result recorded.'); }; $('#exdNo').onclick=closeSheet; }); return; }
  const titles={approve:'Approve this exam date?', deny:'Ask for another date', speak:'Speak with the student first', followup:'Mark as needs follow-up', reopen:'Reopen this exam plan'};
  const desc={approve:`${esc(STEP_NAMES[ex.step])} on <b>${esc(fmtDate(ex.date))}</b>. Once approved, attendance after that date is recorded but not billed while ${esc(first)} waits for the result. If we have not heard by ${esc(fmtDate(thirdWednesdayAfter(ex.date),{short:true}))} (the third Wednesday after the exam) a check-in reminder goes out.`, deny:`The student will be asked to choose another date. You can suggest one.${wasApproved?' Days already in grace stay free; grace ends today.':''}`, speak:'Puts the request on hold and tells the student you want to talk first. Nothing changes on billing until you decide.', followup:'Use this when the result is overdue or something needs checking. Grace stays on until you record a result.', reopen:`Puts the plan back in your review queue.${wasApproved||ex.state==='passed'?' Days already in grace stay free.':''}`}[action];
  openSheet(`<div class="t">${titles[action]}</div><div class="d">${desc}</div>${action==='deny'?`<div class="field" style="margin-top:12px"><label for="exNew">Suggested date (optional)</label><input id="exNew" type="date"></div>`:''}<div class="field" style="margin-top:12px"><label for="exNote">Note to the student (optional, kept in history)</label><input id="exNote" type="text" placeholder="${action==='speak'?'e.g. Let’s talk about Step 2 timing on Tuesday':'optional'}"></div>
    <div class="acts"><button type="button" class="btn ${action==='approve'?'confirm':'primary'}" id="exdGo">${{approve:'Approve',deny:'Ask for another date',speak:'Put on hold & tell the student',followup:'Mark follow-up',reopen:'Reopen'}[action]}</button><button type="button" class="btn ghost" id="exdNo">Cancel</button></div>`, w=>{ $('#exdGo').onclick=async()=>{ const note=$('#exNote').value.trim(); if(await decideExam(e.i, action, note, action==='deny'?($('#exNew').value||null):null)===false)return; closeSheet(); render(); toast({approve:'Exam date approved. Attendance after the exam date is now in grace.',deny:'Student asked to choose another date.',speak:'On hold — the student can see your request to talk.',followup:'Marked needs follow-up.',reopen:'Reopened.'}[action]); }; $('#exdNo').onclick=closeSheet; }); }
function passedSheet(si){ const m=model(); const e=m.eff[m.canonOf(si)]; const ex=examOf(e.i); if(!ex) return;
  openSheet(`<div class="t">Did you pass ${esc(stepShort(ex.step))}?</div><div class="d">Marking <b>Passed</b> tells Dr J right away and records today's date. Classes while you waited for your result stay free; from tomorrow, classes are $25 per day again.</div><div class="acts"><button type="button" class="btn confirm lg" id="psYes">Yes — I passed</button><button type="button" class="btn ghost" id="psNo">Not yet</button></div><p class="muted" style="margin-top:10px;font-size:13.5px">Didn't pass? Tell Dr J from your <a class="linkish" href="#/me/exam">exam plan</a> and plan the retake — she records the result.</p>`, w=>{ $('#psYes').onclick=async()=>{ if(await markPassed(e.i,'student')===false)return; closeSheet(); render(); toast('Passed recorded. Dr J can see your update.'); }; $('#psNo').onclick=closeSheet; }); }

    ${e.compUsed?`<label class="toggle" style="margin-top:10px"><input type="checkbox" id="cRetro"> Also apply to the ${e.compUsed} ${e.compUsed===1?'day':'days'} already comped (they may become billable again)</label>`:''}

function viewStudent(si, q){ const m=model(); const e=m.eff[m.canonOf(si)]; if(!e) return viewStudents('');

        : `<button type="button" class="btn confirm lg" data-decide="${e.i}|${k}|confirm" ${openCl?'disabled':''}>Confirm ${money(sug.amount)}<span class="k">${esc(sug.label)}</span></button>`}
        <div class="btnRow"><button type="button" class="btn ghost" data-decide="${e.i}|${k}|ucc">UCC · no charge</button><button type="button" class="btn ghost" data-decide="${e.i}|${k}|mul">MUL · no charge</button><button type="button" class="btn ghost" data-other="${e.i}|${k}">More options…</button></div>
        <div class="muted" style="font-size:13.5px">UCC and MUL students are covered by a separate arrangement and are not billed through these invoices. Attendance stays on record.</div></div>`;
  return `<section class="view">

      <div class="known">Attended Live Drills in <b>${cyclesWith.map(kk=>cyc(kk).label.replace(' Cycle','')).join(', ')}</b>${alias.length?` · also appeared in Zoom as <b>${esc(alias.join(', '))}</b>`:''}${e.m?' · we combined two or more Zoom names for this person':''}${ct.email?` · <b>${esc(ct.email)}</b>`:' · <span style="color:var(--redInk);font-weight:700">no email yet</span>'}</div></div>
      <div class="profTools"><div class="seg" role="tablist" aria-label="Cycle">${CY_ALL.map(cc2=>`<button type="button" role="tab" class="${cc2.key===k?'on':''}" data-go="#/student/${e.i}?cycle=${cc2.key}" ${e.c[cc2.key]?'':'disabled title="'+(cc2.placeholder?'No classes yet':'No classes in this cycle')+'"'}>${esc(cc2.placeholder?'Current':cc2.label.replace(' Cycle',''))}</button>`).join('')}</div>

      <div><span class="lbl">${esc(c.label)} · ${fmtRange(c)}</span><div class="big">${att}<small>of ${c.sessions} classes</small></div>
        <div class="progress light"><i style="width:${Math.round(100*att/c.sessions)}%"></i></div>
        <div class="steps"><span class="chip s1">Step 1 · ${cc?cc.s1:0} of ${c.s1_sessions}</span><span class="chip s23">Step 2/3 · ${cc?cc.s23:0} of ${c.s23_sessions}</span></div>
        ${cc&&WS.rule==='day'?`<div class="dayFacts"><span><b>${cc.dayCount}</b> class ${cc.dayCount===1?'day':'days'}</span><span class="bill"><b>${cc.billable}</b> billable</span>${cc.comped?`<span class="comp"><b>${cc.comped}</b> comped</span>`:''}${cc.grace?`<span class="grace"><b>${cc.grace}</b> exam grace</span>`:''}${cc.dupDays?`<span class="muted">${cc.dupDays} ${cc.dupDays===1?'day':'days'} had both Steps — counted once</span>`:''}</div>`:''}</div>
      <div><span class="lbl">Attendance suggests</span><div class="sugg">${esc(sug.label)}</div><div class="est ${dec?(st.amount?'ok':'zero'):''} money">${dec? money(st.amount) : money(sug.amount)}</div><div class="note">${dec? (st.amount===sug.amount?'Approved as suggested.':`Starting estimate was ${money(sug.amount)}.`) : esc(sug.why||'')+' Starting estimate — not yet approved.'}</div></div>
      <div><span class="lbl">How should we treat ${esc(c.label.replace(' Cycle',''))}?</span>${treat}</div>
    </div>

    ${missionAccountsManualChargeHTML(e,k)}
    ${recordLayersHTML(e,k)}
    ${examPlanChapterHTML(e)}

      ${calendarHTML(e,k)}
      ${ledgerHTML(e,k,WS.showMissed,true)}
      <p class="muted" style="margin-top:10px;font-size:14px">Step is shown from the class start time (before 1:30 PM = Step 1; 1:30 PM and later = Step 2/3). Any time in the Zoom room counts as attendance; if someone left before the drill started, remove it with <b>Edit / correct record</b>. Source times are kept on every record.</p>
    </div>

    <div class="subgrid">
      <div><div class="chHead"><span class="t">All cycles</span></div><div class="miniCycles">${CYK.map(kk=>{ if(!e.c[kk]) return `<div class="miniCyc" style="opacity:.6;cursor:default"><div><div class="t">${esc(cyc(kk).label)}</div><div class="d">No classes attended</div></div><div class="m">—</div></div>`; const s2=accountState(e,kk); const sg=suggestion(e.c[kk].att,kk); return `<div class="miniCyc ${kk===k?'on':''}" data-go="#/student/${e.i}?cycle=${kk}"><div><div class="t">${esc(cyc(kk).label)} · ${e.c[kk].att} of ${cyc(kk).sessions}</div><div class="d"><span class="chip s1">Step 1 · ${e.c[kk].s1}</span> <span class="chip s23">Step 2/3 · ${e.c[kk].s23}</span> <span class="chip ${s2.chip}" style="margin-left:4px">${esc(s2.label)}</span></div></div><div class="m money ${s2.state==='clean'||s2.state==='question'?'est':(s2.state==='approved'||s2.state==='ready'?'ok':'')}">${money(s2.amount)}</div></div>`; }).join('')}</div>
        <div class="chHead" style="margin-top:22px"><span class="t">Billing</span><span class="c">working state</span></div>
        <div class="billLines">${CYK.filter(kk=>e.c[kk]).map(kk=>{ const s2=accountState(e,kk); return `<div class="billLine"><div><div class="t">${esc(cyc(kk).label)}</div><div class="d">${s2.state==='clean'||s2.state==='question'||s2.state==='device'?'Starting estimate · not yet approved':esc(s2.label)}${(s2.state==='approved'||s2.state==='ready')?` · <a class="linkish" href="#/invoice/${e.i}/${kk}">Preview invoice</a>`:''}</div></div><div class="m money ${s2.state==='approved'||s2.state==='ready'?'':''}" style="${s2.state==='clean'?'text-decoration:underline dashed var(--line2);text-underline-offset:5px':''}${s2.state==='approved'||s2.state==='ready'?'color:var(--greenInk)':''}">${money(s2.amount)}</div></div>`; }).join('')}
          <div class="billLine" style="border-style:dashed;background:transparent"><div><div class="t">Sent · Paid</div><div class="d">Nothing sent yet. Appears once online invoicing is switched on.</div></div><div class="m" style="color:var(--faint)">—</div></div></div>

function examRow(e){ const ev=examView(e.i); const ex=ev.ex; const chipCls={pending:'review',approved:'approved',speak:'s23',denied:'none',completed:'s1',passed:'approved',followup:'review'}[ev.state];
  const acts = ev.state==='pending'||ev.state==='speak' ? `<button type="button" class="btn confirm sm" data-exam="${e.i}|approve">Approve</button><button type="button" class="btn ghost sm" data-exam="${e.i}|deny">Choose another date</button>${ev.state!=='speak'?`<button type="button" class="btn soft sm" data-exam="${e.i}|speak">Speak with student</button>`:''}`
    : ev.state==='approved'||ev.state==='completed' ? `<button type="button" class="btn soft sm" data-exam="${e.i}|passed">Record result</button><button type="button" class="btn ghost sm" data-exam="${e.i}|followup">Needs follow-up</button>` : `<button type="button" class="btn ghost sm" data-exam="${e.i}|reopen">Reopen</button>`;
  return `<div class="row exam"><div class="ring ${ev.state==='passed'?'ok':''}" style="--p:${ev.state==='passed'?100:ev.state==='approved'||ev.state==='completed'?66:33}"><span>${esc(stepShort(ex.step).replace('Step ','S'))}</span></div><div class="who"><div class="nm"><a href="#/student/${e.i}#exam">${esc(e.n)}</a></div><div class="meta"><span>${esc(STEP_NAMES[ex.step])}</span><span>· <b>${esc(fmtDate(ex.date))}, ${ex.date.slice(0,4)}</b></span><span class="chip ${chipCls}">${esc(ev.label)}</span>${ev.reminder?`<span class="muted">· ${esc(ev.reminder.text)}</span>`:''}${ex.note?`<span class="muted">· “${esc(ex.note)}”</span>`:''}</div></div><div class="act">${acts}</div></div>`; }
function viewExams(q){ const m=model(); const all=m.eff.filter(e=>!e.absorbed&&!e.notStudent&&e.k!=='device'&&examOf(e.i)); const by=st=>all.filter(e=>examView(e.i).state===st).sort((a,b)=>examOf(a.i).date.localeCompare(examOf(b.i).date));
  const pend=by('pending'), speak=by('speak'), appr=[...by('approved'),...by('completed')].sort((a,b)=>examOf(a.i).date.localeCompare(examOf(b.i).date)), passed=by('passed'), fu=by('followup'), den=by('denied'); const up=upcomingExams();
  const section=(t,c,items,why,empty)=>`<div class="chapter"><div class="chHead"><span class="t">${t}</span><span class="c">${c}</span>${why?`<span class="why">${why}</span>`:''}</div>${items.length?`<div class="stack">${items.map(examRow).join('')}</div>`:`<div class="panel empty" style="padding:22px"><div class="d">${empty}</div></div>`}</div>`;
  return `<section class="view"><a class="back" href="#/home">← Home</a><div class="eyebrow em">Exam dates</div><h1 class="h1" style="margin-top:8px">${pend.length?`${pend.length} exam ${pend.length===1?'date is':'dates are'} waiting for you.`:'Exam dates.'}</h1>

  const dec=decisionFor(e.i,k); const b=dec.basis||basisOf(e,k); const sg={kind:b.kind||suggestionFor(e,k).kind}; const u=b.u; const uw=b.rule==='event'?(u===1?'class':'classes'):(u===1?'billable day':'billable days'); const ccB={att:b.att, dayCount:b.dayCount, billable:b.billable, comped:b.comped, grace:b.grace, s1:cc.s1, s23:cc.s23}; const basis = dec.t==='confirm' ? (u>=16?`Full-cycle rate — ${u} ${uw} (16 or more)`:(sg.kind==='full'?`Full-cycle rate (capped) — ${u} ${uw}`:(b.rule==='day'?`One $25 charge per calendar day — ${u} billable ${u===1?'day':'days'} × $25 (${ccB.att} attendances; a Step 1 and a Step 2/3 class on the same day count once)`:`Per-session rate — ${ccB.att} classes × $25`))) : `Amount set by Dr J${dec.note?' — '+esc(dec.note):''}`;

  return `<section class="view"><a class="back" href="#/student/${e.i}?cycle=${k}">← ${esc(e.n)}</a>

      <div class="meta"><div><div class="k">Billed to</div><div class="v"><b>${esc(e.n)}</b></div><div class="v ${ct.email?'':'miss'}">${ct.email?esc(ct.email):'Email missing — add it before sending'}</div></div>
        <div><div class="k">Invoice</div><div class="v">Draft · no number until sent</div><div class="k" style="margin-top:10px">Cycle</div><div class="v">${esc(c.label)} · ${fmtRange(c)}, 2026</div></div></div>
      <div class="basis"><b>Attendance:</b> ${ccB.att} of ${c.sessions} classes — Step 1: ${cc.s1} of ${c.s1_sessions} · Step 2/3: ${cc.s23} of ${c.s23_sessions}${b.rule==='day'?` · <b>${ccB.dayCount} class ${ccB.dayCount===1?'day':'days'}</b> (${ccB.billable} billable${ccB.comped?`, ${ccB.comped} comped`:''}${ccB.grace?`, ${ccB.grace} exam grace`:''})`:''}<br><b>Billing basis:</b> ${basis}${basisChanged(e,k,dec)?` <span class="chip review">Attendance changed since approval — re-approve before sending</span>`:''}</div>
      <table><thead><tr><th>Description</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead><tbody><tr><td>${line.desc}</td><td class="r">${line.qty}</td><td class="r">${money(line.unit)}</td><td class="r">${money(line.amt)}</td></tr>${zeroLines.map(z=>`<tr><td class="muted">${z.desc}</td><td class="r muted">${z.qty}</td><td class="r muted">$0</td><td class="r muted">$0</td></tr>`).join('')}</tbody></table>

    <details class="why" style="margin-top:10px"><summary>Show the comparison — original per-class rule vs corrected per-day rule</summary><div class="gTbl"><table class="tbl"><thead><tr><th>Cycle</th><th class="r">Attendance events</th><th class="r">Billable days</th><th class="r">Original rule · per event</th><th class="r">Corrected rule · per day</th><th class="r">Difference</th><th class="r">Working estimate today</th></tr></thead><tbody>${CYK.map(kk=>{ const st=cycleStats(kk); return `<tr><td>${esc(cyc(kk).name)}</td><td class="r">${st.events.toLocaleString()}</td><td class="r">${st.dayCount.toLocaleString()}${st.dupDays?` <span class="muted">(${st.dupDays} both-Step days)</span>`:''}</td><td class="r money">${money(ORIG_TOTAL[kk])}</td><td class="r money">${money(st.estDayPure)}</td><td class="r money" style="color:var(--redInk)">${money(st.estDayPure-ORIG_TOTAL[kk])}</td><td class="r money muted">${money(st.est)}</td></tr>`; }).join('')}<tr><td><b>All cycles</b></td><td class="r"><b>${CYK.reduce((a,kk)=>a+cycleStats(kk).events,0).toLocaleString()}</b></td><td class="r"><b>${CYK.reduce((a,kk)=>a+cycleStats(kk).dayCount,0).toLocaleString()}</b></td><td class="r money"><b>${money(origAll)}</b></td><td class="r money"><b>${money(CYK.reduce((a,kk)=>a+cycleStats(kk).estDayPure,0))}</b></td><td class="r money" style="color:var(--redInk)"><b>${money(CYK.reduce((a,kk)=>a+cycleStats(kk).estDayPure,0)-origAll)}</b></td><td class="r money muted"><b>${money(CYK.reduce((a,kk)=>a+cycleStats(kk).est,0))}</b></td></tr></tbody></table></div><p class="muted" style="margin-top:8px;font-size:13.5px">"Original rule · per event" is frozen from the 5000B snapshot (${money(origAll)} in total) and never drifts; "Corrected rule · per day" isolates the rule change on the same reconciled attendance (same tiers: 0 → $0 · 1–15 days × $25 · 16+ days → $300). "Working estimate today" also reflects your corrections, comp days, exam-result grace and the displayed rule. <b>Open questions for the same decision:</b> whether the 16+ full-cycle threshold is counted in billable days (as shown) or attendance events, and whether a per-day amount may ever exceed the $300 full-cycle price.</p></details>

  const allTable = k==='all'? gate+`<div class="chapter"><div class="chHead"><span class="t">By cycle</span><span class="c">reporting view</span></div><div class="tblWrap"><table class="tbl"><thead><tr><th>Cycle</th><th>Dates</th><th class="r">Classes</th><th class="r">People</th><th>Review</th><th>Approved</th><th>Invoices</th><th>Payments</th></tr></thead><tbody>${CY_ALL.map(c=>{ const mt=cycleMeta(c.key); return `<tr><td><a class="linkish" href="#/billing?cycle=${c.key}">${esc(mt.name)}</a></td><td class="muted">${esc(mt.range)}</td><td class="r">${mt.classes||'—'}</td><td class="r">${mt.people||'—'}</td><td>${esc(mt.review)}</td><td>${esc(mt.approved)}</td><td>${esc(mt.invoices)}</td><td class="muted">${esc(mt.payments)}</td></tr>`; }).join('')}</tbody></table></div></div>` : '';

function viewMeExam(e){ const ev=examView(e.i); const ex=ev.ex; const steps=[['none','Not submitted'],['pending','Pending Dr J review'],['approved','Approved'],['completed','Exam completed · awaiting result'],['passed','Passed']];

  </section>`; }
function studentCycleStatus(e,k){ const charge=WS.manualCharges?.[e.i]?.[k]||null; if(charge?.state==='succeeded') return {chip:'paid',text:`Paid · ${money(charge.amount)}`,state:'paid',amount:Number(charge.amount)||0}; if(charge?.state==='pending') return {chip:'ready',text:`Processing · ${money(charge.amount)}`,state:'processing',amount:Number(charge.amount)||0}; if(charge?.state==='failed') return {chip:'review',text:'Payment needs attention',state:'failed',amount:Number(charge.amount)||0}; const st=accountState(e,k); if(st.state==='nocharge') return {chip:'none',text:'No charge this cycle',state:st.state,amount:0}; if(st.state==='handled') return {chip:'none',text:'Nothing due · '+st.reason.toLowerCase(),state:st.state,amount:0}; if(st.state==='ready'||st.state==='approved') return {chip:'approved',text:`${money(st.amount)} · approved balance`,state:st.state,amount:st.amount}; if(st.state==='approvedNoEmail') return {chip:'approved',text:`${money(st.amount)} · we need your email`,state:st.state,amount:st.amount}; return {chip:'review',text:'Amount coming — Dr J is finalizing it',state:st.state,amount:st.amount}; }

function missionAccountsHydrateProviderInvoice(root){

  if(!route) return;
  const si=Number(route[1]); const k=route[2]; const provider=WS.providerInvoices?.[si]?.[k]||null;
  const ready=WS.ready?.[si]?.[k]===true; const panel=root.querySelector('.invSide .panel');
  const row=panel?.querySelector('.btnRow'); const chip=panel?.querySelector('.chip'); const message=panel?.querySelector('.muted');

  const activate=button=>{ button.onclick=async()=>{ const [studentIndex,cycleKey,action]=button.dataset.providerInvoice.split('|'); const saved=await window.MissionAccountsRuntime.dispatch('hosted-invoice',{si:Number(studentIndex),k:cycleKey,action}); if(saved===false)return; render(); }; };

  }

  message.textContent=provider.state==='paid'?'Stripe confirmed payment.'
    :provider.state==='void'?'This Stripe invoice is void and cannot be paid.'

    :'Stripe is hosting this invoice'+(provider.dueAt?' · due '+String(provider.dueAt).slice(0,10):'.');
  row.querySelectorAll('[data-ready]').forEach(control=>control.remove());
  const controls=[];
  if(provider.hostedUrl&&String(provider.hostedUrl).startsWith('https://invoice.stripe.com/')){
    const open=document.createElement('a'); open.className='btn confirm'; open.href=provider.hostedUrl;
    open.target='_blank'; open.rel='noopener noreferrer'; open.textContent='Open Stripe invoice'; controls.push(open);
  }
  if(['sent','overdue','failed'].includes(provider.state)){
    const resend=document.createElement('button'); resend.type='button'; resend.className='btn soft';
    resend.dataset.providerInvoice=si+'|'+k+'|resend'; resend.textContent='Resend invoice'; activate(resend); controls.push(resend);

    voidButton.dataset.providerInvoice=si+'|'+k+'|void'; voidButton.textContent='Void invoice'; activate(voidButton); controls.push(voidButton);
  }
  controls.reverse().forEach(control=>row.prepend(control));
}

    root.querySelectorAll(credentialMutationSelector).forEach(control=>{ if(control.disabled) return; missionAccountsDisable(control,credentialReason); control.dataset.credentialDisabled='true'; });

  const rows=(result.results||[]).map(row=>{ const si=Object.entries(window.MissionAccountsRuntime.getCanonicalModel().ids.students).find(([,id])=>id===row.student_id)?.[0]; const student=D.students[Number(si)]; return '<div class="panel" style="padding:12px;margin-top:8px">'+(si==null?'Record unavailable':'<a href="#/student/'+Number(si)+'?cycle='+k+'">'+esc(student?.n||'Record')+'</a>')+' · '+(row.accepted?(reversing?'Reversed':'Confirmed'):('Needs review: '+esc(String(row.reason||'Record changed').replaceAll('_',' '))))+'</div>'; }).join('');
  openSheet('<div class="t">'+count+' '+(reversing?'reversed':'confirmed')+' · '+Number(result.rejected_count||0)+' need review</div><div class="d">Each result is recorded on the server. Held records keep their prior state. No payment was sent or collected.</div><div style="max-height:40vh;overflow:auto">'+rows+'</div><div class="acts">'+(!reversing&&count?'<button class="btn ghost" id="batchUndo">Undo confirmed records</button>':'')+'<button class="btn primary" id="batchDone">Done</button></div>',()=>{
    $('#batchDone').onclick=closeSheet;
    const undo=$('#batchUndo'); if(undo){ const requestId='ui:'+crypto.randomUUID(); undo.onclick=async()=>{ undo.disabled=true; const receipt=await window.MissionAccountsRuntime.dispatch('billing-batch-reversal',{batchId:result.batch_id,requestId}); if(receipt===false){undo.disabled=false;return;} missionAccountsBatchOutcome(receipt,k); }; }
  });
}
async function missionAccountsConfirmGroupSheet(k,which){
  if(WS.rule==='event'){toast('Switch back to the corrected rule before approving amounts.');return;}
  const lists=window.__lists?.[k]; if(!lists){toast('Reopen the cycle to refresh these records.');return;}
  const all=which==='all'?[...lists.cleanFull,...lists.cleanPer]:(lists[which]||[]);
  const items=all.slice(0,100); if(!items.length){toast('There are no clean records to confirm.');return;}
  const ids=window.MissionAccountsRuntime.getCanonicalModel().ids.students;
  const expectedAmounts=new Map(items.map(x=>[ids[x.e.i],Math.round(suggestionFor(x.e,k).amount*100)]));
  const cycleKey={june:'2026-cycle-1',july:'2026-cycle-2',august:'2026-cycle-3'}[k];
  let controls;
  try { controls=await window.MissionAccountsRuntime.mutation('/admin/billing-batches/controls',{body:{cycle_key:cycleKey,student_ids:[...expectedAmounts.keys()]}}); }
  catch(error){toast(error.message||'These records could not be prepared. Try again.');return;}
  const requestItems=controls.items.map(item=>({...item,expected_amount_cents:expectedAmounts.get(item.student_id)}));
  const total=[...expectedAmounts.values()].reduce((a,b)=>a+b,0)/100;
  const requestId='ui:'+crypto.randomUUID();
  openSheet('<div class="t">Confirm '+items.length+' '+esc(cyc(k).label)+' records?</div><div class="d">Total <b class="money">'+money(total)+'</b>. The server will recheck each record. Changed or held records are reported separately. Nothing is charged.'+(all.length>100?' This batch contains the first 100 of '+all.length+' records; reopen the group for the remainder.':'')+'</div><div class="picker" style="max-height:34vh">'+items.map(x=>'<div style="padding:12px">'+esc(x.e.n)+' · '+money(suggestionFor(x.e,k).amount)+'</div>').join('')+'</div><div class="acts"><button class="btn confirm" id="gGo">Confirm '+items.length+' · '+money(total)+'</button><button class="btn ghost" id="gNo">Cancel</button></div>',()=>{
    $('#gNo').onclick=closeSheet; $('#gGo').onclick=async()=>{ const button=$('#gGo');button.disabled=true;const result=await window.MissionAccountsRuntime.dispatch('billing-batch',{k,items:requestItems,requestId});if(result===false){button.disabled=false;return;} missionAccountsBatchOutcome(result,k); };
  });
}
function missionAccountsManualChargeHTML(e,k){
  if(document.documentElement.dataset.missionaccountsBuild!=='production'||!missionAccountsCapability('manual_charges'))return '';
  if(e.sponsor==='UCC'||e.sponsor==='MUL')return '<div class="panel" style="padding:18px;margin:14px 0"><div class="chHead"><span class="t">Sponsor</span><span class="chip '+e.sponsor.toLowerCase()+'">'+esc(e.sponsor)+'</span></div><p class="muted" style="margin-top:8px"><b>$0 due from student.</b> Attendance and payment history remain visible; direct MissionAccounts collection is blocked.</p></div>';
  const decision=WS.dec?.[e.i]?.[k]||null; const method=pmOf(e.i); const charge=WS.manualCharges?.[e.i]?.[k]||null;
  if(!decision||decision.state!=='approved'||Number(decision.amt)<=0)return '';
  if(charge?.state==='succeeded')return '<div class="panel" style="padding:18px;margin:14px 0"><div class="chHead"><span class="t">'+esc(cyc(k).label)+' payment</span><span class="chip approved">Paid · '+money(charge.amount)+'</span></div><p class="muted" style="margin-top:8px">Stripe confirmed this explicit charge. The collected state is stored in MissionAccounts.</p></div>';
  if(charge?.state==='pending')return '<div class="panel" style="padding:18px;margin:14px 0"><div class="chHead"><span class="t">'+esc(cyc(k).label)+' payment</span><span class="chip future">Processing · '+money(charge.amount)+'</span></div><p class="muted" style="margin-top:8px">Waiting for the signed Stripe webhook. Reload before taking another action.</p></div>';
  if(charge?.state==='failed')return '<div class="panel" style="padding:18px;margin:14px 0"><div class="chHead"><span class="t">'+esc(cyc(k).label)+' payment</span><span class="chip review">Charge failed</span></div><p class="muted" style="margin-top:8px">No paid state was recorded. Review the declined payment before requesting a separately authorized retry.</p></div>';
  if(!method||method.state!=='on_file'||!/^\d{4}$/.test(String(method.last4||'')))return '<div class="panel" style="padding:18px;margin:14px 0"><div class="t">Saved payment method required</div><p class="muted" style="margin-top:8px">The approved balance cannot be charged until the student has a verified card on file.</p></div>';
  return '<div class="panel" style="padding:18px;margin:14px 0"><div class="chHead"><span class="t">Collect approved balance</span><span class="chip ready">Manual action</span></div><p class="muted" style="margin-top:8px">Approved '+money(decision.amt)+' · '+esc(method.brand||'card')+' •••• '+esc(method.last4)+'. Nothing runs automatically.</p><div class="btnRow" style="margin-top:12px"><button type="button" class="btn confirm" data-manual-charge="'+e.i+'|'+k+'">Charge '+money(decision.amt)+'</button></div></div>';
}
function missionAccountsManualChargeSheet(si,k){
  const e=model().eff[si]; const decision=WS.dec?.[si]?.[k]||null; const method=pmOf(si);

    $('#mcNo').onclick=closeSheet; $('#mcGo').onclick=async()=>{const button=$('#mcGo');button.disabled=true;const saved=await window.MissionAccountsRuntime.dispatch('manual-cycle-charge',{si,k,decisionId:decision.id,amountCents:Math.round(Number(decision.amt)*100),last4:String(method.last4)});if(saved===false){button.disabled=false;return;}closeSheet();render();toast('Charge submitted. Reloading will show Stripe-confirmed status.');};
  });
}

function programState(selected,enrolled){ if(selected==='mission-residency'){ return `<section class="accountAccess">${programTabs(selected)}<div class="accessState"><div class="stateMark">Mission Residency Accounts</div><h1>${enrolled?"You're enrolled. Your Mission Residency account workspace is being prepared.":"Looks like you're not enrolled in Mission Residency yet."}</h1><p>${enrolled?'Your Mission Residency access remains active. This accounting workspace will arrive in a separate release.':'Explore Mission Residency and choose the path that fits your Match goals.'}</p><div class="btnRow"><a class="btn primary" href="${enrolled?'/member-dashboard/':'/mission-residency/'}">${enrolled?'Return to Matrix':'Explore Mission Residency'}</a></div></div></section>`; } return `<section class="accountAccess">${programTabs(selected)}<div class="accessState"><div class="stateMark">ExamPrep</div><h1>${enrolled?"You're enrolled. Your ExamPrep account workspace is being connected.":"Looks like you're not enrolled in ExamPrep yet."}</h1><p>${enrolled?'Your enrollment is active. MissionMed support can finish connecting your private account record without exposing another student’s information.':'Explore ExamPrep and see how Dr J can help with your exam plan.'}</p><div class="btnRow"><a class="btn primary" href="${enrolled?'/member-dashboard/':'/examprep/'}">${enrolled?'Return to Matrix':'Explore ExamPrep'}</a></div></div></section>`; }
function renderAccountAccess(){ if(!ACCOUNT_ACCESS_MODE)return; applyTheme(); const r=route(); const selected=r.parts[1]==='mission-residency'?'mission-residency':'examprep'; const mr=PROGRAM_ACCESS.programs.mission_residency.enrolled; const xp=PROGRAM_ACCESS.programs.examprep.enrolled; $('#hdr').innerHTML=`<div class="brand" data-go="#/program/examprep" role="link" tabindex="0"><div class="brandTitle">MyMissionMed <b>Account</b></div><div class="brandSub">MissionMed Institute</div></div><span class="ctxLbl">Programs</span>${programTabs(selected)}<div class="hActions"><div class="theme" role="group" aria-label="Theme">${[['daylight','☼','Daylight'],['dark','☾','Dark'],['system','A','System']].map(([v,i,l])=>`<button type="button" class="${themePref()===v?'on':''}" data-theme-set="${v}" title="${l}" aria-label="${l} theme"><span aria-hidden="true">${i}</span></button>`).join('')}</div></div>`; $('#rail').innerHTML=`<button type="button" class="rtab ${selected==='examprep'?'on':''}" data-go="#/program/examprep">ExamPrep</button><button type="button" class="rtab ${selected==='mission-residency'?'on':''}" data-go="#/program/mission-residency">Mission Residency</button><div class="railFoot"><div class="railWho"><span class="avc stu">${esc((ACCOUNT_USER.display_name||'M').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase())}</span><div><div class="nm">${esc(ACCOUNT_USER.display_name||'MissionMed member')}</div><div class="rl">Registered account</div></div></div><div class="railNote">MyMissionMed Account</div></div>`; document.body.dataset.lens='registered'; document.body.dataset.context=selected; const main=$('#main'); main.innerHTML=(!mr&&!xp)?programDiscovery(selected):programState(selected,selected==='mission-residency'?mr:xp); bind(main); $('#hdr').querySelectorAll('[data-theme-set]').forEach(button=>button.onclick=()=>setTheme(button.dataset.themeSet)); document.title=`MyMissionMed Account · ${selected==='mission-residency'?'Mission Residency':'ExamPrep'}`; }
function hydrateAccountAccess(access,user){ const normalized=normalizeProgramAccess(access); if(!normalized.registered) throw new Error('A registered MissionMed account is required'); ACCOUNT_ACCESS_MODE=true; PROGRAM_ACCESS=normalized; ACCOUNT_USER=user||{}; renderAccountAccess(); return {registered:true,programs:PROGRAM_ACCESS.programs}; }

  openSheet(`<div class="t">More options for ${esc(e.n)} · ${esc(cyc(k).label)}</div><div class="d">The estimate from attendance is ${money(sug.amount)} for ${u} ${unitWord(u)}${WS.rule==='day'&&att!==u?` (${att} attendances)`:''}. Pick how this cycle should be treated.</div>

      <button type="button" class="opt" data-t="fullcycle"><b>Full-cycle price</b><span>$300 for the cycle</span></button>

    <div class="acts"><button type="button" class="btn confirm" id="oSave" hidden>Save treatment</button><button type="button" class="btn ghost" id="oCancel">Cancel</button></div>`, w=>{ let chosen=null;
      w.querySelectorAll('.opt').forEach(b=>b.onclick=async()=>{ chosen=b.dataset.t; w.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b)); const needsAmt = chosen==='special'||chosen==='other'; $('#oForm').hidden=!needsAmt; $('#oSave').hidden=false; if(!needsAmt){ if(await decide(si,k,chosen)===false)return; closeSheet(); render(); } else { $('#oAmt').focus(); } });
      $('#oSave').onclick=async()=>{ if(!chosen) return; const amt=Math.max(0,Math.round(+$('#oAmt').value||0)); if(await decide(si,k,chosen,amt,$('#oNote').value.trim())===false)return; closeSheet(); render(); }; $('#oCancel').onclick=closeSheet; }); }

/* ---------------- Edit / correct record ---------------- */
function editSheet(si,k,tab){ const m=model(); const e=m.eff[m.canonOf(si)]; const ct=contactOf(e.i); tab=tab||'identity'; const sessions=D.sessions.filter(s=>s.c===k); const mine=new Set(e.c[k]?e.c[k].sess:[]); const src=e.src[k]||{att:0}; const cur=e.c[k]||{att:0};
  const tabs=[['identity','Identity'],['attendance','Attendance'],['billing','Billing']].map(([t,l])=>`<button type="button" class="${t===tab?'on':''}" data-etab="${t}">${l}</button>`).join('');
  let body='';
  if(tab==='identity') body=`<div class="otherForm"><div class="field"><label for="eName">Display name</label><input id="eName" type="text" value="${esc(e.n)}"><span class="muted" style="font-size:13px">Source name from Zoom: <b>${esc(e.srcName)}</b>. The source is never overwritten.</span></div>
      <div class="field"><label for="eEmail">Email</label><input id="eEmail" type="email" value="${esc(ct.email||'')}" placeholder="student@email.com"></div>
      <div class="field"><label for="ePhone">Phone (if collected later)</label><input id="ePhone" type="tel" value="${esc(ct.phone||'')}"></div>
      <div class="field"><label for="eWhy">Reason (optional, kept in history)</label><input id="eWhy" type="text" placeholder="e.g. Student asked to be listed by her full name"></div></div>
      <div class="acts"><button type="button" class="btn confirm" id="eSaveId">Save identity</button><button type="button" class="btn ghost" data-eclose="1">Close</button></div>`;
  else if(tab==='attendance') body=`<div class="layersMini"><span>Zoom reconstruction: <b>${src.att}</b></span><span>Dr J record: <b>${cur.att}</b> ${cur.att!==src.att?'<span class="chip review">corrected</span>':''}</span><span>Estimate: <b class="money est">${money(suggestionFor(e,k).amount)}</b></span></div>
      <div class="field" style="margin-top:12px"><label for="eReason">Reason for the change (optional, shown in history)</label><input id="eReason" type="text" placeholder="e.g. Student was on the call but joined by phone"></div>
      <div class="attEdit">${sessions.map(s=>{ const att=mine.has(s.i); const shown=e.stepOv[s.i]||s.st; const add=e.added.has(s.i), rem=e.removed.has(s.i); return `<div class="attRow ${att?'is':''}"><span class="dt">${esc(fmtDate(s.d))} · ${fmtTime(s.t)}</span><span class="chip ${shown}">${stepLabel(shown)}${e.stepOv[s.i]?' · corrected':''}</span><span class="st">${att?`<span class="chip approved">✓ Attended${add?' · added':''}</span>`:`<span class="chip ${rem?'review':'none'}">${rem?'Removed by Dr J':'Not attended'}</span>`}</span><span class="acts2">${att?`<button type="button" class="btn xs soft" data-att="${s.i}|remove">Remove</button><button type="button" class="btn xs ghost" data-att="${s.i}|step">Step → ${stepLabel(shown==='s1'?'s23':'s1')}</button>`:`<button type="button" class="btn xs green" data-att="${s.i}|add">Add attendance</button>`}</span></div>`; }).join('')}</div>
      <div class="field" style="margin-top:12px"><label for="eNote">Manual attendance note</label><input id="eNote" type="text" placeholder="e.g. Attended Aug 21 from a hospital phone; verified with the student"></div>
      <div class="acts"><button type="button" class="btn soft" id="eSaveNote">Add note</button><button type="button" class="btn ghost" data-eclose="1">Close</button></div>`;
  else body=`<div class="d">Approve the suggested amount, set another treatment, or add an internal note. The suggested amount is <b class="money">${money(suggestionFor(e,k).amount)}</b> for ${unitsOf(cur)} ${unitWord(unitsOf(cur))}.</div>
      <div class="optGrid" style="margin-top:12px">
        <button type="button" class="opt" data-bt="confirm"><b>Approve suggested</b><span>${money(suggestionFor(e,k).amount)} · ${esc(suggestionFor(e,k).label)}</span></button>
        <button type="button" class="opt" data-bt="other"><b>Custom amount</b><span>Any amount</span></button>
        <button type="button" class="opt" data-bt="ucc"><b>UCC</b><span>No charge · separate arrangement</span></button>
        <button type="button" class="opt" data-bt="mul"><b>MUL</b><span>No charge · separate arrangement</span></button>
        <button type="button" class="opt" data-bt="fullcycle"><b>Prepaid / full-cycle</b><span>$300 full-cycle price</span></button>
        <button type="button" class="opt" data-bt="waived"><b>Waived / no charge</b><span>$0 this cycle</span></button>
        <button type="button" class="opt" data-bt="already_paid"><b>Already paid</b><span>Nothing due</span></button>
        <button type="button" class="opt" data-bt="already_invoiced"><b>Already invoiced</b><span>Not invoiced again here</span></button>
        <button type="button" class="opt" data-bt="special"><b>Special arrangement</b><span>Amount + note</span></button>
      </div>
      <div class="otherForm" id="bForm" hidden><div class="field"><label for="bAmt">Amount (USD)</label><input id="bAmt" type="number" min="0" step="5" value="${suggestionFor(e,k).amount}"></div></div>
      <div class="field" style="margin-top:10px"><label for="bNote">Internal note (kept in history, not shown to the student)</label><input id="bNote" type="text" placeholder="optional"></div>
      <div class="acts"><button type="button" class="btn confirm" id="bSave" hidden>Save billing decision</button><button type="button" class="btn ghost" data-eclose="1">Close</button></div>`;
  openSheet(`<div class="t">Edit / correct record · ${esc(e.n)}</div><div class="d">${esc(cyc(k).label)}. Corrections never overwrite the source; each one is recorded and can be undone.</div><div class="tabs etabs">${tabs}</div>${body}`, w=>{
    w.querySelectorAll('[data-etab]').forEach(b=>b.onclick=()=>editSheet(si,k,b.dataset.etab));
    w.querySelectorAll('[data-eclose]').forEach(b=>b.onclick=async()=>{ closeSheet(); render(); });
    const sv=$('#eSaveId'); if(sv) sv.onclick=async()=>{ const nm=$('#eName').value.trim(); const why=$('#eWhy').value.trim(); const em=$('#eEmail').value.trim(); const phone=$('#ePhone').value.trim(); const contactStudentId=window.MissionAccountsRuntime.getCanonicalModel().ids.students[e.i]; if(em && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ toast('That email does not look right yet.'); $('#eEmail').focus(); return; } if(nm && nm!==e.n && await addCorr(e.i,'name',{from:e.n,to:nm,reason:why})===false)return; const contactIndex=Object.entries(window.MissionAccountsRuntime.getCanonicalModel().ids.students).find(([,id])=>id===contactStudentId)?.[0]; if(contactIndex==null){toast('This record changed. Reopen it before saving contact details.');return;} if(await setContact(Number(contactIndex), em, phone)===false)return; closeSheet(); render(); toast('Identity saved. Source name is kept.'); };
    w.querySelectorAll('[data-att]').forEach(b=>b.onclick=async()=>{ const [ss,op]=b.dataset.att.split('|'); const s=D.sessions[+ss]; const reason=$('#eReason').value.trim(); const before=cur.att;
      if(op==='remove'){ if(e.added.has(+ss)){ const cr=(WS.corrs||[]).find(c=>c.type==='att_add'&&c.sess===+ss&&m.canonOf(c.si)===e.i); if(cr && await undoCorr(cr.id)===false)return; } else if(await addCorr(e.i,'att_remove',{sess:+ss,k,from:before,to:before-1,reason})===false)return; }
      else if(op==='add'){ if(e.removed.has(+ss)){ const cr=(WS.corrs||[]).find(c=>c.type==='att_remove'&&c.sess===+ss&&m.canonOf(c.si)===e.i); if(cr && await undoCorr(cr.id)===false)return; } else if(await addCorr(e.i,'att_add',{sess:+ss,k,from:before,to:before+1,reason})===false)return; }
      else if(op==='step'){ const shown=e.stepOv[+ss]||s.st; const to=shown==='s1'?'s23':'s1'; const existing=(WS.corrs||[]).find(c=>c.type==='step'&&c.sess===+ss&&m.canonOf(c.si)===e.i); if(existing && await undoCorr(existing.id)===false)return; if(to!==s.st && await addCorr(e.i,'step',{sess:+ss,k,from:s.st,to,reason})===false)return; }
      editSheet(si,k,'attendance'); });
    const sn=$('#eSaveNote'); if(sn) sn.onclick=async()=>{ const t=$('#eNote').value.trim(); if(!t){ $('#eNote').focus(); return; } if(await addCorr(e.i,'note',{k,to:t,from:'',reason:t})===false)return; editSheet(si,k,'attendance'); toast('Note added to history.'); };
    let bt=null; w.querySelectorAll('[data-bt]').forEach(b=>b.onclick=async()=>{ bt=b.dataset.bt; w.querySelectorAll('[data-bt]').forEach(x=>x.classList.toggle('on',x===b)); const needs=bt==='other'||bt==='special'; $('#bForm').hidden=!needs; $('#bSave').hidden=false; });
    const bs=$('#bSave'); if(bs) bs.onclick=async()=>{ if(!bt) return; const amt=Math.max(0,Math.round(+($('#bAmt')?$('#bAmt').value:0)||0)); if(await decide(e.i,k,bt,amt,$('#bNote').value.trim())===false)return; closeSheet(); render(); }; }); }

/* ---------------- payment method / authorization sheets ---------------- */
function paymentSheet(si, mode){ if(document.documentElement.dataset.missionaccountsBuild==='production') return window.MissionAccountsRuntime.dispatch('payment-setup',{si,mode}); const m=model(); const e=m.eff[m.canonOf(si)]; const student=WS.lens==='student';
  openSheet(`<div class="t">Secure payment setup</div><div class="d">${student?'Your':`${esc(e.n)}'s`} card information will be entered securely through Stripe. MissionMed will not store the full card number.</div>
    <div class="secure"><div class="row2"><span class="ic">🔒</span><div><b>Handled by Stripe</b><span>Card details go straight to Stripe's secure form — never through MissionMed.</span></div></div><div class="row2"><span class="ic">✓</span><div><b>Saved for Drills only</b><span>$25 per eligible calendar day after ${student?'you accept':'the student accepts'} the approved advance authorization. Eligible attendance is generally processed within 24–48 hours after it is confirmed billable. Turn future automatic billing off any time.</span></div></div><div class="row2"><span class="ic">↺</span><div><b>Change it any time</b><span>Update or remove the card from this page.</span></div></div></div>
    <div class="acts"><button type="button" class="btn primary" id="pGo">Continue to secure payment setup</button><button type="button" class="btn ghost" id="pNo">Cancel</button></div>
    <div id="pSim" hidden style="margin-top:16px"><div class="panel" style="padding:16px;border-style:dashed"><div class="k" style="font-family:var(--num);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)">Prototype</div><div class="d" style="margin-top:6px">This is where Stripe's secure card form opens in production. Nothing is entered here. Payment method status will come from Stripe.</div><div class="btnRow" style="margin-top:12px"><button type="button" class="btn confirm sm" id="pSimYes">Simulate a saved test card (•••• 4242)</button><button type="button" class="btn ghost sm" id="pSimNo">Close</button></div></div></div>`, w=>{ $('#pGo').onclick=async()=>{ $('#pSim').hidden=false; $('#pGo').disabled=true; }; $('#pNo').onclick=closeSheet; $('#pSimYes').onclick=async()=>{ setPM(e.i,'on_file'); closeSheet(); render(); toast(student?'Your card is saved (prototype test card).':'Card saved (prototype test card).'); }; $('#pSimNo').onclick=closeSheet; }); }
function authSheet(si){ if(document.documentElement.dataset.missionaccountsBuild==='production') return window.MissionAccountsRuntime.dispatch('billing-authorization',{si}); const m=model(); const e=m.eff[m.canonOf(si)]; const student=WS.lens==='student'; const pm=pmOf(e.i); const au=authOf(e.i);
  openSheet(`<div class="t">Automatic Drills billing</div><div class="d">${au.state==='authorized'?'Automatic billing is authorized for this account.':'Review the terms for automatic billing after verified Drills attendance.'}</div>
    <div class="terms"><b>Drills automatic-billing terms (preview only)</b><ul><li>$25 for each eligible calendar day ${student?'you attend':'the student attends'} a Live Drills class. Multiple qualifying sessions on the same day count as one charge.</li><li>Eligible attendance is generally processed within 24–48 hours after it is confirmed billable; the obligation remains durable if processing is delayed.</li><li>No individual approval is required for each charge after advance authorization is enabled.</li><li>A failed payment may receive one automatic retry. After two unsuccessful attempts, automatic retries stop and the balance enters review; no late-fee amount is encoded by this release.</li><li>Classes after an approved exam date are free while ${student?'you wait':'the student waits'} for the result. A new student's first ${DEFAULT_COMP_DAYS} class days are free.</li><li>${student?'You':'The student'} can disable future automatic billing at any time. This does not reverse a submitted payment or erase eligible obligations incurred while authorization was active.</li><li>A receipt is emailed for every completed charge.</li></ul><div class="chip future">Preview only. Exact Founder-approved terms are required before production authorization.</div></div>
    ${pm.state!=='on_file'?`<div class="muted" style="margin-top:12px">A payment method is required before automatic billing can be enabled.</div>`:''}

function resetSheet(){ if(document.documentElement.dataset.missionaccountsBuild==='production') return window.MissionAccountsRuntime.dispatch('unsupported',{message:'Server-authoritative MissionAccounts records cannot be reset in the browser.'}); openSheet(`<div class="t">Reset prototype changes?</div><div class="d">This clears treatments, name answers, corrections, emails, exam plans, comp-day settings, payment-setup states and the working history stored in this browser. The source data is untouched. Your theme choice is kept.</div><div class="acts"><button type="button" class="btn danger" id="rYes">Reset</button><button type="button" class="btn ghost" id="rNo">Cancel</button></div>`, w=>{ $('#rYes').onclick=async()=>{ const lens=WS.lens; WS=fresh(); WS.lens=lens; touch(); closeSheet(); render(); toast('Prototype changes reset.'); }; $('#rNo').onclick=closeSheet; }); }

function confirmGroupSheet(k, which){ if(document.documentElement.dataset.missionaccountsBuild==='production') return missionAccountsConfirmGroupSheet(k,which); if(WS.rule==='event'){ toast('Comparison view — switch back to the corrected rule to approve amounts.'); return; } const lists=window.__lists[k]; const items = which==='all'? [...lists.cleanFull,...lists.cleanPer] : lists[which]; const total=items.reduce((a,x)=>a+suggestionFor(x.e,k).amount,0);
  openSheet(`<div class="t">Confirm ${items.length} ${esc(cyc(k).label)} record${items.length===1?'':'s'} at the suggested amounts?</div><div class="d">Total <b class="money">${money(total)}</b>. Each one can still be changed on the student page, and this can be undone.</div>

function matchSheet(dv){
  const m=model(); const people=m.eff.filter(e=>!e.absorbed&&!e.notStudent&&e.k!=='device').sort((a,b)=>a.n.localeCompare(b.n));
  openSheet(`<div class="t">Who is “${esc(dv.name)}”?</div><div class="d">${dv.att} ${dv.att===1?'class':'classes'} in ${dv.cycles.map(k=>cyc(k).label.replace(' Cycle','')).join(', ')}. Select the real student record using its account email and Record ID, then confirm the match. If the evidence does not establish the right account, cancel and keep the attendee on hold.</div>
    <label class="bigSearch" style="margin-top:14px"><input id="mSearch" placeholder="Type a name"></label><div class="picker" id="mList"></div>
    <div class="muted" style="margin-top:10px">Student not listed? Cancel and leave this attendee on hold. A missing student needs a verified Matrix account and ExamPrep link.</div>
    <div class="acts"><button type="button" class="btn confirm" id="mConfirm" disabled>Confirm attendee match</button><button type="button" class="btn ghost" id="mNo">Cancel · keep on hold</button></div>`, w=>{
    const search=w.querySelector('#mSearch'), list=w.querySelector('#mList'), confirm=w.querySelector('#mConfirm'), cancel=w.querySelector('#mNo');
    let selected=null, saving=false;

function onboardingProfileChanges(values,current){
  const optional=new Set(['preferred_name','mailing_line2']);

  return profile;
}
