:root{
  --disp:'Archivo',system-ui,sans-serif; --num:'Rajdhani',sans-serif; --voice:'Lora',Georgia,serif;
  /* family chrome (dark) */
  --bg:#0a0d14; --bg2:#0f1522; --card:#121927; --edge:#243046; --edge2:#31405c; --tx:#e9eefb; --dim:#7e8ba6; --mid:#aab8d1;
  --em:#ffb340; --em2:#ff7a3d; --cy:#39d6ff; --vi:#8a7dff; --gd:#ffd76a; --gn:#4ade9d; --rd:#ff5470;
  --accent:var(--em); --accent2:var(--em2); --accentGlow:255,179,64;
  /* daylight operational surface */
  --paper:#f3efe6; --paper2:#ebe5d8; --sheet:#fffdf8; --sheet2:#f8f4eb; --ink:#141a2b; --ink2:#2b3550; --mute:#5f6a84; --faint:#8b94a8;
  --line:#e2dccd; --line2:#cfc7b4; --dash:#a89c7e; --amberInk:#8a4b00; --amberSoft:#ffe9c2; --greenInk:#0f7a4a; --greenSoft:#dcf5e8; --redInk:#b8283f; --redSoft:#ffe1e6;
  --blueInk:#0b6b8a; --blueSoft:#dcf1f8; --violetInk:#5a4dd8; --violetSoft:#e9e5ff; --goldInk:#8a6400; --goldSoft:#fff1c2;
  --hdr:64px; --rail:212px; --radius:16px;
  --shadow:0 10px 30px rgba(20,26,43,.08),0 2px 6px rgba(20,26,43,.05);
  --shadow2:0 18px 50px rgba(20,26,43,.14),0 3px 10px rgba(20,26,43,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:17px;-webkit-text-size-adjust:100%}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--disp);overflow:hidden;line-height:1.45}
button{cursor:pointer;font-family:inherit;border:0;background:none;color:inherit;font-size:inherit}
a{color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--em);color:#000}
:focus-visible{outline:3px solid var(--cy);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;z-index:999;background:var(--em);color:#000;padding:8px 12px;border-radius:8px}
.skip:focus{left:8px}

/* ---------- ambient (daylight) ---------- */
.dayfx{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(900px 520px at 12% -10%,rgba(255,179,64,.16),transparent 60%),
  radial-gradient(720px 480px at 100% 0%,rgba(138,125,255,.10),transparent 60%),
  radial-gradient(600px 420px at 70% 110%,rgba(57,214,255,.08),transparent 60%)}
body[data-context="mr"] .dayfx{display:none}

/* ---------- HEADER (family dark chrome) ---------- */
#hdr{position:fixed;top:0;left:0;right:0;height:var(--hdr);z-index:70;display:flex;align-items:center;gap:16px;padding:0 20px;
  background:linear-gradient(180deg,rgba(10,13,20,.98),rgba(8,11,18,.92));border-bottom:1px solid rgba(49,64,92,.78);color:var(--tx)}
.brand{display:flex;flex-direction:column;justify-content:center;flex:none;min-width:210px;line-height:1;cursor:pointer}
.brandTitle{display:flex;align-items:baseline;white-space:nowrap;font-size:19px;font-style:italic;font-weight:900;letter-spacing:-.025em;transform:skewX(-4deg)}
.brandTitle b{color:var(--em);font-style:italic;font-weight:900;margin-left:.28em}
.brandSub{margin-top:5px;color:var(--dim);font-family:var(--num);font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.ctxSwitch{display:flex;align-items:center;border:1px solid var(--edge2);border-radius:999px;padding:3px;background:rgba(15,21,34,.9);flex:none}
.ctxSwitch button{font-family:var(--num);font-weight:700;font-size:13px;letter-spacing:.06em;padding:7px 14px;border-radius:999px;color:var(--dim);transition:.18s;white-space:nowrap}
.ctxSwitch button.on{background:linear-gradient(90deg,rgba(var(--accentGlow),.28),rgba(var(--accentGlow),.10));color:#fff}
.ctxSwitch button:hover:not(.on){color:#fff}
.ctxLbl{font-family:var(--num);font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-right:-4px}
.hActions{display:flex;align-items:center;gap:10px;margin-left:auto;min-width:0}
.hSearch{display:flex;align-items:center;gap:8px;background:rgba(15,21,34,.9);border:1px solid var(--edge);border-radius:10px;padding:7px 12px;width:min(300px,24vw);transition:.18s;cursor:text}
.hSearch:focus-within{border-color:var(--cy);box-shadow:0 0 0 1px rgba(57,214,255,.3)}
.hSearch svg{flex:none;opacity:.6}
.hSearch input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--tx);font-size:14px}
.hSearch input::placeholder{color:#6d7a95}
.lens{display:flex;align-items:center;gap:4px;border:1px solid var(--edge);background:rgba(15,21,34,.9);border-radius:999px;padding:3px;flex:none}
.lens button{display:flex;align-items:center;gap:7px;padding:4px 12px 4px 5px;border-radius:999px;font-family:var(--num);font-weight:700;font-size:12.5px;letter-spacing:.06em;color:var(--dim);transition:.18s;white-space:nowrap}
.lens button.on{background:linear-gradient(90deg,rgba(var(--accentGlow),.22),rgba(var(--accentGlow),.08));color:var(--tx)}
.avc{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:11px;flex:none}
.avc.adm{background:linear-gradient(150deg,#ffb340,#ff7a3d);color:#161005}
.avc.stu{background:linear-gradient(150deg,#39d6ff,#5a8dff);color:#04121c}
.demo{display:flex;align-items:center;gap:8px;border:1px dashed #5a6a8c;border-radius:999px;padding:3px 4px 3px 12px;background:rgba(255,215,106,.04)}
.demo[hidden]{display:none!important}
.demoLbl{font-family:var(--num);font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gd);white-space:nowrap}
.pickBtn{padding:4px 8px;border-radius:999px;color:var(--dim);font-size:13px}
.pickBtn:hover{color:#fff;background:rgba(36,48,70,.6)}

/* ---------- RAIL ---------- */
#rail{position:fixed;top:var(--hdr);left:0;bottom:0;width:var(--rail);z-index:60;display:flex;flex-direction:column;padding:18px 12px 14px;color:var(--tx);
  background:linear-gradient(180deg,rgba(14,20,32,.98),rgba(10,13,20,.96));border-right:1px solid var(--edge)}
.rtab{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:6px;font-family:var(--num);font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%);transition:.15s;text-align:left;position:relative;width:100%}
.rtab:hover{color:#fff;background:rgba(36,48,70,.6)}
.rtab.on{color:#0d0800;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.rtab .badge{margin-left:auto;font-size:12px;letter-spacing:0;background:var(--rd);color:#0a0d14;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px}
.rtab.on .badge{background:rgba(0,0,0,.35);color:#fff}
.rtab.sec{font-size:12px;color:#6d7a95;margin-top:6px}
.advLink{display:block;margin:12px 0 0;font-family:var(--num);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#7e8ba6;text-align:left;padding:6px 0}
.advLink:hover,.advLink.on{color:var(--gd)}
.railSep{height:1px;background:var(--edge);margin:12px 4px}
.railFoot{margin-top:auto;padding:12px 6px 0;border-top:1px solid var(--edge)}
.railWho{display:flex;align-items:center;gap:10px}
.railWho .nm{font-weight:800;font-size:14px}
.railWho .rl{font-family:var(--num);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.railNote{margin-top:12px;font-size:12px;color:#7e8ba6;line-height:1.45}

/* ---------- MAIN ---------- */
#main{position:fixed;top:var(--hdr);left:var(--rail);right:0;bottom:0;overflow-y:auto;overflow-x:hidden;z-index:10;scroll-behavior:smooth}
.view{min-height:100%;padding:34px clamp(20px,4.5vw,64px) 110px;max-width:1280px;margin:0 auto;animation:vin .38s cubic-bezier(.2,.9,.3,1.1)}
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001s!important;transition-duration:.001s!important}}

/* type */
.eyebrow{font-family:var(--num);font-size:13px;font-weight:700;letter-spacing:.24em;color:var(--mute);text-transform:uppercase}
.eyebrow.em{color:var(--amberInk)}
.h1{font-size:clamp(30px,3.6vw,46px);font-weight:900;font-style:italic;transform:skewX(-3deg);letter-spacing:-.025em;line-height:1.04;color:var(--ink)}
.h1 em{color:var(--em2);font-style:italic}
.h2{font-size:clamp(22px,2.4vw,28px);font-weight:900;font-style:italic;transform:skewX(-3deg);letter-spacing:-.02em;line-height:1.1}
.h2 em{color:var(--em2);font-style:italic}
.h3{font-size:19px;font-weight:800;letter-spacing:-.01em}
.voice{font-family:var(--voice);font-style:italic;font-size:18px;color:var(--ink2);line-height:1.5}
.lead{font-size:17px;color:var(--ink2)}
.muted{color:var(--mute)}
.num{font-family:var(--num);font-weight:700;font-variant-numeric:tabular-nums}
.back{display:inline-flex;align-items:center;gap:6px;font-family:var(--num);font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:14px;text-decoration:none;padding:4px 0}
.back:hover{color:var(--ink)}
.money{font-family:var(--num);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* panels & cards (daylight) */
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--radius);position:relative;box-shadow:var(--shadow)}
.panel:before{content:"";position:absolute;top:0;left:18px;right:18px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(var(--accentGlow),.85),transparent);opacity:.9}
.panel.dark{background:linear-gradient(160deg,#131a2b,#0e1422);border-color:#2a3650;color:var(--tx);box-shadow:var(--shadow2)}
.panel.dark:before{background:linear-gradient(90deg,transparent,var(--em),transparent)}
.pHead{display:flex;align-items:center;gap:12px;padding:18px 22px 0}
.pBody{padding:14px 22px 22px}
.pMore{margin-left:auto;font-family:var(--num);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);transition:.15s}
.pMore:hover{color:var(--amberInk)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:10px 20px;border-radius:12px;font-weight:800;font-size:16px;letter-spacing:-.005em;transition:.18s;border:1px solid transparent;white-space:nowrap}
.btn.primary{background:linear-gradient(90deg,var(--em),var(--em2));color:#1d0d00;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);border-radius:0;padding:12px 26px;font-family:var(--num);font-size:16px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.btn.primary:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn.lg{min-height:56px;font-size:18px;padding:14px 30px}
.btn.ghost{background:var(--sheet);border-color:var(--line2);color:var(--ink)}
.btn.ghost:hover{border-color:var(--ink2);background:#fff}
.btn.soft{background:var(--sheet2);border-color:var(--line);color:var(--ink)}
.btn.soft:hover{background:#fff;border-color:var(--line2)}
.btn.green{background:var(--greenSoft);color:var(--greenInk);border-color:#bfe8d2}
.btn.green:hover{background:#cdf0de}
.btn.confirm{background:linear-gradient(90deg,#1f9d63,#17835a);color:#fff;font-weight:800}
.btn.confirm:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn.danger{background:var(--redSoft);color:var(--redInk);border-color:#ffc6cf}
.btn.sm{min-height:38px;padding:6px 14px;font-size:14px;border-radius:10px}
.btn.xs{min-height:32px;padding:4px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;filter:none!important}
.btnRow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.linkish{color:var(--blueInk);text-decoration:underline;text-underline-offset:3px;font-weight:600}

/* status chips (one grammar) */
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-family:var(--num);font-weight:700;font-size:13.5px;letter-spacing:.06em;white-space:nowrap;border:1px solid transparent}
.chip.est{background:var(--paper2);color:var(--ink2);border-color:var(--line2);border-style:dashed}
.chip.review{background:var(--amberSoft);color:var(--amberInk)}
.chip.ready{background:var(--blueSoft);color:var(--blueInk)}
.chip.approved{background:var(--greenSoft);color:var(--greenInk)}
.chip.paid{background:#1f9d63;color:#fff}
.chip.sent{background:var(--blueSoft);color:var(--blueInk);border-color:#9fd6ea}
.chip.none{background:#ecebe6;color:var(--mute)}
.chip.ucc{background:var(--violetSoft);color:var(--violetInk)}
.chip.mul{background:var(--goldSoft);color:var(--goldInk)}
.chip.device{background:#eef0f4;color:#4b5568;border-color:#d5dbe6;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:0;font-size:13px}
.chip.future{background:transparent;color:var(--faint);border-color:var(--line2);border-style:dashed}
.chip.s1{background:#e6f4ff;color:#0b5b8a}
.chip.s23{background:#efe9ff;color:#4a3fc4}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

/* ---------- HOME ---------- */
.homeHero{padding:2vh 0 26px;max-width:900px}
.greet{font-size:clamp(34px,4.4vw,54px);font-weight:900;font-style:italic;transform:skewX(-3deg);letter-spacing:-.03em;line-height:1.02;animation:rise .5s .05s both}
.greet em{color:var(--em2);font-style:italic}
.greetSub{margin-top:14px;animation:rise .5s .14s both}
.hero{display:grid;grid-template-columns:1.55fr 1fr;gap:0;overflow:hidden;animation:rise .5s .22s both}
.hero>div{min-width:0}
.hero .lft{padding:30px 34px 30px}
.hero .ttl,.hero .sub{overflow-wrap:anywhere}
.hero .rgt{padding:30px 30px;border-left:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:18px;background:rgba(255,255,255,.025)}
.hero .kick{font-family:var(--num);font-size:13px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--gd)}
.hero .ttl{margin-top:10px;font-size:clamp(28px,3.2vw,40px);font-weight:900;font-style:italic;transform:skewX(-3deg);letter-spacing:-.025em;line-height:1.05;color:#fff}
.hero .ttl em{color:var(--em);font-style:italic}
.hero .sub{margin-top:14px;font-size:17px;color:var(--mid);max-width:560px;line-height:1.5}
.hero .sub b{color:#fff;font-weight:700}
.hero .cta{margin-top:26px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hero .ghostDark{color:#fff;border-color:var(--edge2);background:rgba(255,255,255,.04)}
.hero .ghostDark:hover{background:rgba(255,255,255,.09)}
.stat{display:flex;flex-direction:column;gap:3px}
.stat .l{font-family:var(--num);font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.stat .n{font-family:var(--num);font-weight:700;font-size:38px;line-height:1;color:#fff;letter-spacing:-.01em}
.stat .n.est{color:#f3d7a8;text-decoration:underline dashed rgba(243,215,168,.7);text-underline-offset:8px;text-decoration-thickness:2px}
.stat.small .n{font-size:28px}
.stat .n.ok{color:var(--gn)}
.stat .s{font-size:13.5px;color:var(--mid)}
.progress{height:10px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;position:relative}
.progress i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--em),var(--em2))}
.progress.light{background:var(--paper2)}
.progress.light i{background:linear-gradient(90deg,var(--em2),var(--em))}
.progress.green i{background:linear-gradient(90deg,#17835a,#1f9d63)}
.path{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px;animation:rise .5s .26s both}
.step{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--sheet2)}
.step .k{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:15px;background:var(--paper2);color:var(--mute);flex:none}
.step b{display:block;font-size:15.5px}
.step span:not(.k){font-size:13.5px;color:var(--mute);line-height:1.35}
.step.now{background:var(--sheet);border-color:var(--em2);box-shadow:var(--shadow)}
.step.now .k{background:linear-gradient(90deg,var(--em),var(--em2));color:#1d0d00}
.step.done .k{background:var(--greenSoft);color:var(--greenInk)}
.step.warn .k{background:var(--redSoft);color:var(--redInk)}
@media(max-width:1100px){.path{grid-template-columns:repeat(2,1fr)}}
.muted2{color:var(--mid)}
.mStats{display:none}
.qrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px;animation:rise .5s .3s both}
@media(max-width:1100px){.qrow{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.qrow{grid-template-columns:1fr}}
.qbtn{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;text-align:left;transition:.18s;min-height:64px;box-shadow:var(--shadow)}
.qbtn:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:var(--shadow2)}
.qbtn .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--amberSoft);color:var(--amberInk);flex:none;font-family:var(--num);font-weight:700;font-size:15px}
.qbtn .t{font-weight:800;font-size:16px}
.qbtn .d{font-size:13.5px;color:var(--mute)}
.cycleStrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:26px;animation:rise .5s .36s both}
.cyc{padding:18px 20px;cursor:pointer;transition:.18s;display:flex;flex-direction:column;gap:10px;text-align:left}
.cyc:hover{transform:translateY(-3px);box-shadow:var(--shadow2)}
.cyc .nm{font-weight:900;font-style:italic;font-size:22px;transform:skewX(-2deg);letter-spacing:-.02em}
.cyc .rg{font-family:var(--num);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.cyc .facts{display:flex;gap:16px;flex-wrap:wrap}
.cyc .facts .f{display:flex;flex-direction:column}
.cyc .facts .n{font-family:var(--num);font-weight:700;font-size:22px;line-height:1}
.cyc .facts .l{font-size:12.5px;color:var(--mute)}
.cyc.future{border-style:dashed;background:transparent;box-shadow:none}
.cyc.future:before{display:none}
.cyc.done .nm{color:var(--greenInk)}

/* ---------- CYCLE WORKSPACE ---------- */
.band{display:grid;grid-template-columns:repeat(4,1fr);gap:0;overflow:hidden;margin-top:20px}
.band .cell:nth-child(-n+4){border-bottom:1px solid var(--line)}
.band .cell:nth-child(4n){border-right:0}
.band .cell{padding:16px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.band .cell:last-child{border-right:0}
.band .l{font-size:13px;color:var(--mute);font-weight:600}
.band .n{font-family:var(--num);font-weight:700;font-size:30px;line-height:1.05;letter-spacing:-.01em}
.band .s{font-size:13px;color:var(--mute)}
.band .n.est{color:var(--ink2);text-decoration:underline dashed var(--dash);text-underline-offset:6px;text-decoration-thickness:2px}
.band .n.ok{color:var(--greenInk)}
.band .n.blue{color:var(--blueInk)}
.band .n.faint{color:var(--faint)}
.chapter{margin-top:34px}
.chHead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.chHead .t{font-size:24px;font-weight:900;font-style:italic;transform:skewX(-3deg);letter-spacing:-.02em}
.chHead .c{font-family:var(--num);font-weight:700;font-size:16px;color:var(--mute);letter-spacing:.06em}
.chHead .why{font-size:15px;color:var(--mute);flex-basis:100%}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:18px;padding:12px 18px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;transition:.15s}
.row:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.row .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.row .nm{font-weight:800;font-size:17px;letter-spacing:-.01em}
.row .nm a{text-decoration:none}
.row .nm a:hover{text-decoration:underline;text-underline-offset:3px}
.row .meta{font-size:14px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .amt{display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:118px}
.row .amt .m{font-family:var(--num);font-weight:700;font-size:24px;line-height:1}
.row .amt .m.est{text-decoration:underline dashed var(--dash);text-underline-offset:5px}
.row .amt .m.ok{color:var(--greenInk)}
.row .act{display:flex;gap:8px;align-items:center;min-width:200px;justify-content:flex-end}
.ring{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:13px;color:var(--ink2);background:conic-gradient(var(--em2) calc(var(--p)*1%),var(--paper2) 0);position:relative;flex:none}
.ring:after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--sheet)}
.ring span{position:relative;z-index:1}
.ring.ok{background:conic-gradient(#1f9d63 calc(var(--p)*1%),var(--paper2) 0)}
.moreRow{display:flex;justify-content:center;padding:8px}
.groupHead{display:flex;align-items:center;gap:12px;margin:18px 0 10px;flex-wrap:wrap}
.groupHead .t{font-weight:800;font-size:17px}
.groupHead .d{font-size:14.5px;color:var(--mute)}
.groupHead .right{margin-left:auto;display:flex;gap:8px;align-items:center}

/* question cards */
.qcard{display:grid;grid-template-columns:1fr auto;gap:18px;padding:20px 22px;background:var(--sheet);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.qcard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--em),var(--em2))}
.qcard.dev:before{background:linear-gradient(180deg,#7b8798,#4b5568)}
.qcard.pol:before{background:linear-gradient(180deg,var(--vi),#5a4dd8)}
.qcard.done{opacity:.85}
.qcard.done:before{background:linear-gradient(180deg,#1f9d63,#17835a)}
.qcard .q{font-size:20px;font-weight:900;font-style:italic;transform:skewX(-2deg);letter-spacing:-.015em;line-height:1.15}
.qcard .names{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}
.qcard .nameBox{display:flex;flex-direction:column;gap:3px;padding:10px 14px;background:var(--sheet2);border:1px solid var(--line);border-radius:12px;min-width:180px}
.qcard .nameBox .n{font-weight:800;font-size:17px}
.qcard .nameBox .n.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;color:#3e475a}
.qcard .nameBox .d{font-size:13.5px;color:var(--mute)}
.qcard .impact{margin-top:12px;font-size:15px;color:var(--ink2)}
.qcard .impact b{font-family:var(--num);font-size:17px}
.qcard .impact .neg{color:var(--redInk)} .qcard .impact .pos{color:var(--greenInk)}
.qcard .acts{display:flex;flex-direction:column;gap:8px;justify-content:center;min-width:220px}
.qcard .acts .btn{justify-content:flex-start}
.qcard .decided{display:flex;flex-direction:column;gap:8px;align-items:flex-end;justify-content:center}
details.why{margin-top:12px}
details.why summary{cursor:pointer;font-weight:700;color:var(--blueInk);font-size:15px;list-style:none;display:inline-flex;align-items:center;gap:6px}
details.why summary::-webkit-details-marker{display:none}
details.why summary:before{content:"▸";transition:.15s;display:inline-block}
details.why[open] summary:before{transform:rotate(90deg)}
.evid{margin-top:10px;padding:14px 16px;background:var(--sheet2);border:1px solid var(--line);border-radius:12px;font-size:15px;color:var(--ink2);display:flex;flex-direction:column;gap:8px}
.evid .k{font-family:var(--num);font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.evid .raw{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:#3e475a}

/* ---------- STUDENT PROFILE ---------- */
.profHead{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap}
.profHead .h1{max-width:760px}
.profHead .known{font-size:15.5px;color:var(--mute);margin-top:10px}
.profHead .known b{color:var(--ink2);font-weight:700}
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--paper2);border-radius:999px;border:1px solid var(--line)}
.seg button{padding:8px 16px;border-radius:999px;font-family:var(--num);font-weight:700;font-size:15px;letter-spacing:.06em;color:var(--mute);transition:.15s}
.seg button.on{background:var(--ink);color:#fff}
.seg button:hover:not(.on){color:var(--ink)}
.story{display:grid;grid-template-columns:1.1fr 1fr 1.1fr;gap:0;margin-top:20px;overflow:hidden}
.story>div{padding:24px 26px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:12px;min-width:0}
.story>div:last-child{border-right:0}
.story .lbl{font-size:14px;color:var(--mute);font-weight:600}
.story .big{font-family:var(--num);font-weight:700;font-size:56px;line-height:.95;letter-spacing:-.02em}
.story .big small{font-size:24px;color:var(--mute);font-weight:600;margin-left:6px}
.story .steps{display:flex;gap:10px;flex-wrap:wrap}
.story .sugg{font-size:26px;font-weight:900;font-style:italic;transform:skewX(-2deg);letter-spacing:-.02em;line-height:1.1}
.story .est{font-family:var(--num);font-weight:700;font-size:40px;line-height:1;text-decoration:underline dashed var(--dash);text-underline-offset:8px;text-decoration-thickness:2px}
.story .est.ok{color:var(--greenInk);text-decoration:none}
.story .est.zero{color:var(--mute);text-decoration:none}
.story .note{font-family:var(--voice);font-style:italic;font-size:15.5px;color:var(--ink2);line-height:1.5}
.treat{display:flex;flex-direction:column;gap:8px}
.treat .btn{justify-content:flex-start}
.treat .btn .k{font-family:var(--num);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:inherit;opacity:.7;margin-left:auto}
.decidedBox{display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-radius:14px;background:var(--greenSoft);border:1px solid #bfe8d2}
.decidedBox.zero{background:#f0efe9;border-color:var(--line2)}
.decidedBox .t{font-weight:800;font-size:18px;color:var(--greenInk)}
.decidedBox.zero .t{color:var(--ink2)}
.decidedBox .d{font-size:14.5px;color:var(--ink2)}
.otherForm{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line2);border-radius:12px;background:var(--sheet2)}
.otherForm input,.otherForm textarea{padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:#fff;font-size:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:700;color:var(--ink2)}
.field input{padding:12px 14px;border:1px solid var(--line2);border-radius:12px;background:#fff;font-size:16px;min-height:46px}
.field input:focus{border-color:var(--blueInk);box-shadow:0 0 0 3px rgba(11,107,138,.15);outline:none}
.subgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin-top:20px}
.miniCycles{display:flex;flex-direction:column;gap:10px}
.miniCyc{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--sheet);cursor:pointer;transition:.15s}
.miniCyc:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.miniCyc .t{font-weight:800;font-size:16px}
.miniCyc .d{font-size:14px;color:var(--mute)}
.miniCyc .m{font-family:var(--num);font-weight:700;font-size:22px}
.miniCyc .m.est{text-decoration:underline dashed var(--dash);text-underline-offset:5px}
.miniCyc .m.ok{color:var(--greenInk)}
.miniCyc.on{border-color:var(--ink);box-shadow:0 0 0 2px rgba(20,26,43,.08)}
.billLines{display:flex;flex-direction:column;gap:8px}
.billLine{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--sheet)}
.billLine .t{font-weight:800}
.billLine .d{font-size:14px;color:var(--mute)}
.billLine .m{font-family:var(--num);font-weight:700;font-size:22px;text-align:right}
.hist{display:flex;flex-direction:column;gap:8px}
.hist .h{display:grid;grid-template-columns:auto 1fr;gap:12px;font-size:14.5px;color:var(--ink2);padding:8px 0;border-bottom:1px solid var(--line)}
.hist .h .w{font-family:var(--num);font-weight:700;color:var(--mute);white-space:nowrap}

/* ---------- ATTENDANCE HISTORY (showcase) ---------- */
.attHead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.attHead .t{font-size:24px;font-weight:900;font-style:italic;transform:skewX(-3deg);letter-spacing:-.02em}
.attHead .d{font-size:15px;color:var(--mute)}
.attHead .right{margin-left:auto;display:flex;gap:10px;align-items:center}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--mute);align-items:center}
.legend i{display:inline-block;width:22px;height:12px;border-radius:6px;margin-right:6px;vertical-align:middle}
.legend i.att{background:linear-gradient(90deg,var(--em),var(--em2))}
.legend i.miss{background:transparent;border:2px dashed var(--line2)}
.legend i.nos{background:var(--paper2)}
.legend i.estL{background:transparent;border-bottom:2px dashed var(--dash);height:8px;border-radius:0}
.legend i.okL{background:#1f9d63}
.legend.dark{color:var(--mid);font-size:13px}
.legend.dark i.est{background:transparent;border-bottom:2px dashed #f3d7a8;height:8px;border-radius:0}
.legend.dark i.ok{background:var(--gn)}
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.cal .dh{font-family:var(--num);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);text-align:center;padding-bottom:2px}
.day{border:1px solid var(--line);border-radius:12px;background:var(--sheet);padding:8px 10px 10px;min-height:86px;display:flex;flex-direction:column;gap:6px;position:relative}
.day.blank{border-style:dashed;background:transparent;opacity:.55}
.day.blank .nc{font-family:var(--num);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:auto}
.day .dn{font-family:var(--num);font-weight:700;font-size:14px;color:var(--ink2);display:flex;justify-content:space-between;align-items:center}
.day .dn small{font-weight:600;color:var(--mute);letter-spacing:.06em;font-size:11px}
.lane{height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:700;font-size:12px;letter-spacing:.06em;color:#fff;overflow:hidden;white-space:nowrap}
.lane .short{display:none}
@media(max-width:640px){.lane{font-size:10px;letter-spacing:.02em}}
.lane.att{background:linear-gradient(90deg,var(--em),var(--em2));color:#2a1400;box-shadow:inset 0 -1px 0 rgba(0,0,0,.08)}
.lane.att.s23{background:linear-gradient(90deg,#6a5cff,#8a7dff);color:#fff}
.lane.miss{border:2px dashed var(--line2);color:var(--faint);background:transparent}
.lane.nos{visibility:hidden}
.weekLbl{grid-column:1/-1;font-family:var(--num);font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.ledger{margin-top:18px;border:1px solid var(--line);border-radius:14px;background:var(--sheet);overflow:hidden}
.led{display:grid;grid-template-columns:120px 90px 1fr auto;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);font-size:15px}
.led:last-child{border-bottom:0}
.led .dt{font-weight:800}
.led .tm{font-family:var(--num);font-weight:700;color:var(--ink2)}
.led .as{color:var(--mute);font-size:14px}
.led.miss{color:var(--faint);background:var(--sheet2)}
.led .st{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.led details{display:inline}
.led details summary{list-style:none;cursor:pointer;color:var(--blueInk);font-size:13.5px;font-weight:700}
.led details summary::-webkit-details-marker{display:none}
.led details .src{grid-column:1/-1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:#3e475a;padding-top:6px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14.5px;color:var(--ink2);cursor:pointer;user-select:none}
.toggle input{width:18px;height:18px}

/* ---------- STUDENTS DIRECTORY ---------- */
.dirHead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px}
.bigSearch{display:flex;align-items:center;gap:10px;flex:1;min-width:260px;background:var(--sheet);border:1px solid var(--line2);border-radius:14px;padding:6px 14px;box-shadow:var(--shadow)}
.bigSearch input{flex:1;border:0;outline:0;background:none;font-size:18px;padding:10px 0;min-width:0}
.bigSearch svg{opacity:.6}
.letter{font-family:var(--num);font-weight:700;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin:20px 0 8px;padding-left:4px}
.srow{display:grid;grid-template-columns:1fr auto auto auto;gap:14px;align-items:center;padding:12px 18px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;text-decoration:none;transition:.15s}
.srow .need{min-width:150px;text-align:right}
.srow:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.srow .nm{font-weight:800;font-size:17px}
.srow .al{font-size:13.5px;color:var(--mute)}
.srow .cyc3{display:flex;gap:6px;align-items:center}
.srow .cyc3 i{width:26px;height:8px;border-radius:4px;background:var(--paper2)}
.srow .cyc3 i.on{background:linear-gradient(90deg,var(--em),var(--em2))}
.srow .tot{font-family:var(--num);font-weight:700;font-size:20px;min-width:70px;text-align:right}
.srow .tot small{font-size:12px;color:var(--mute);font-weight:600;margin-left:3px}

/* ---------- BILLING ---------- */
.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:0;overflow:hidden;margin-top:20px}
.pipe .st{padding:18px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;position:relative}
.pipe .st:last-child{border-right:0}
.pipe .st .k{font-family:var(--num);font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.pipe .st .t{font-weight:900;font-style:italic;font-size:22px;transform:skewX(-2deg)}
.pipe .st .n{font-family:var(--num);font-weight:700;font-size:34px;line-height:1}
.pipe .st .d{font-size:13.5px;color:var(--mute)}
.pipe .st.fut .n{color:var(--faint)}
.pipe .st:after{content:"›";position:absolute;right:-9px;top:50%;transform:translateY(-50%);font-size:26px;color:var(--line2);background:var(--sheet);padding:0 2px;z-index:2}
.pipe .st:last-child:after{display:none}
.empty{padding:36px 28px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty .t{font-size:22px;font-weight:900;font-style:italic;transform:skewX(-2deg)}
.empty .d{font-size:16px;color:var(--mute);max-width:560px}
.empty .ill{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:var(--paper2);color:var(--mute);margin-bottom:6px}

/* ---------- INVOICE ---------- */
.invWrap{display:grid;grid-template-columns:1fr 300px;gap:22px;margin-top:18px;align-items:start}
.invoice{background:#fff;border:1px solid var(--line);border-radius:6px;padding:44px 48px;box-shadow:var(--shadow2);position:relative;color:#111;font-family:var(--disp)}
.invoice .draft{position:absolute;right:40px;top:36px;font-family:var(--num);font-weight:700;font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:var(--redInk);border:2px solid var(--redInk);padding:8px 12px;border-radius:6px;transform:rotate(-4deg)}
.invoice .brandLine{display:flex;flex-direction:column;gap:2px}
.invoice .brandLine .a{font-weight:900;font-style:italic;font-size:22px;transform:skewX(-4deg);letter-spacing:-.02em}
.invoice .brandLine .a b{color:var(--em2)}
.invoice .brandLine .b{font-family:var(--num);font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#666}
.invoice .meta{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:30px}
.invoice .meta .k{font-family:var(--num);font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#777}
.invoice .meta .v{font-size:16px;margin-top:4px}
.invoice .meta .v.miss{color:var(--redInk);font-weight:700}
.invoice table{width:100%;border-collapse:collapse;margin-top:28px;font-size:15px}
.invoice th{text-align:left;font-family:var(--num);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#777;padding:10px 0;border-bottom:2px solid #111}
.invoice td{padding:14px 0;border-bottom:1px solid #e5e5e5;vertical-align:top}
.invoice td.r,.invoice th.r{text-align:right;font-family:var(--num);font-weight:700;font-size:17px}
.invoice .tot{display:flex;justify-content:flex-end;margin-top:14px}
.invoice .tot .box{min-width:260px;display:grid;grid-template-columns:1fr auto;gap:8px 20px;font-size:15px}
.invoice .tot .box .g{font-weight:900;font-size:22px;font-family:var(--num);border-top:2px solid #111;padding-top:8px}
.invoice .foot{margin-top:34px;font-size:13px;color:#666;line-height:1.5}
.invoice .basis{margin-top:18px;padding:12px 14px;background:#faf7f0;border:1px solid #eee6d6;border-radius:8px;font-size:14px;color:#333}
.invSide{display:flex;flex-direction:column;gap:10px}
.invSide .panel{padding:18px}
.invSide .k{font-family:var(--num);font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}

/* ---------- STUDENT LENS ---------- */
.meGrid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-top:22px}
.meCards{display:flex;flex-direction:column;gap:12px}
.meCyc{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:16px 18px}
.meCyc .t{font-weight:900;font-style:italic;font-size:20px;transform:skewX(-2deg)}
.meCyc .d{font-size:14.5px;color:var(--mute)}
.meCyc .b{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.placeholder{border:1px dashed var(--line2);border-radius:16px;padding:22px;background:transparent;display:flex;flex-direction:column;gap:8px}
.placeholder .t{font-weight:900;font-style:italic;font-size:20px;transform:skewX(-2deg)}
.placeholder .d{font-size:14.5px;color:var(--mute)}
.weekStrip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.weekStrip div{height:46px;border:1px dashed var(--line2);border-radius:8px;display:grid;place-items:center;font-family:var(--num);font-size:12px;color:var(--faint);letter-spacing:.14em}

/* ---------- ADVANCED ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.tabs button{padding:9px 14px;border-radius:10px;font-family:var(--num);font-weight:700;font-size:14px;letter-spacing:.08em;color:var(--mute);border:1px solid transparent}
.tabs button.on{background:var(--ink);color:#fff}
.tabs button:hover:not(.on){background:var(--paper2);color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th{text-align:left;font-family:var(--num);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);padding:10px 12px;border-bottom:1px solid var(--line2);cursor:pointer;white-space:nowrap;background:var(--sheet2)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td:first-child{white-space:nowrap}
.tbl td.r,.tbl th.r{text-align:right;font-family:var(--num);font-weight:700}
.tbl tr:hover td{background:#fff}
.tblWrap{overflow-x:auto;margin-top:14px;border-radius:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:15px}
.kv .k{color:var(--mute)}
.kv .v{font-family:var(--num);font-weight:700}
.log{display:flex;flex-direction:column;gap:6px}
.log .e{display:grid;grid-template-columns:150px 1fr auto;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);font-size:14px}
.log .e .w{font-family:var(--num);font-weight:700;color:var(--mute)}
.log .e .m{font-family:var(--num);font-weight:700}

/* ---------- MISSION RESIDENCY PLACEHOLDER ---------- */
body[data-context="mr"] #main{background:var(--bg);left:0}
body[data-context="mr"] #rail,body[data-context="mr"] .hSearch,body[data-lens="student"] .hSearch{display:none}
body[data-lens="student"] .lens button[data-lens="admin"]{opacity:.55}
.mrWrap{min-height:100%;display:grid;place-items:center;padding:40px 24px;color:var(--tx)}
.mrCard{max-width:720px;text-align:center;padding:48px 40px;background:linear-gradient(160deg,#131a2b,#0b1019);border:1px solid var(--edge2);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.5);position:relative}
.mrCard:before{content:"";position:absolute;top:0;left:20px;right:20px;height:2px;background:linear-gradient(90deg,transparent,var(--em),transparent)}
.mrCard .k{font-family:var(--num);font-size:13px;font-weight:700;letter-spacing:.42em;color:var(--gd)}
.mrCard .p{margin-top:6px;font-family:var(--num);font-size:17px;font-weight:700;letter-spacing:.24em;color:#d9dfeb}
.mrCard .t{margin-top:8px;font-size:56px;font-weight:900;font-style:italic;transform:skewX(-4deg);letter-spacing:-.03em;line-height:1}
.mrCard .t span{color:var(--em)}
.mrCard .s{margin-top:8px;font-family:var(--num);font-size:12px;letter-spacing:.3em;color:var(--dim)}
.mrCard .msg{margin-top:26px;font-family:var(--voice);font-style:italic;font-size:18px;color:var(--mid);line-height:1.55}
.mrCard .msg b{color:#fff;font-style:normal;font-family:var(--disp)}

/* ---------- SHEET / TOAST ---------- */
.sheetWrap{position:fixed;inset:0;z-index:120;display:none;align-items:flex-end;justify-content:center;background:rgba(10,13,20,.45);backdrop-filter:blur(3px)}
.sheetWrap.open{display:flex}
.sheet{width:min(720px,100%);max-height:88vh;overflow:auto;background:var(--sheet);border-radius:20px 20px 0 0;padding:26px 28px 30px;box-shadow:0 -20px 60px rgba(0,0,0,.3);animation:up .25s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet .t{font-size:24px;font-weight:900;font-style:italic;transform:skewX(-2deg);letter-spacing:-.02em}
.sheet .d{font-size:16px;color:var(--ink2);margin-top:8px}
.sheet .acts{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:115;background:#141a2b;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;opacity:0;transition:.25s;pointer-events:none;display:flex;gap:14px;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,.35);max-width:min(560px,92vw)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toast button{color:var(--gd);font-weight:800;text-decoration:underline;text-underline-offset:3px}

/* ---------- picker ---------- */
.picker{display:flex;flex-direction:column;gap:8px;margin-top:14px;max-height:40vh;overflow:auto}
.picker button{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);text-align:left;font-size:16px}
.picker button:hover{border-color:var(--ink2);background:#fff}
.picker button small{color:var(--mute)}
#identityCanonicalList button,#mList button{flex-wrap:wrap;gap:6px}
.picker button .accountEvidence{flex-basis:100%;overflow-wrap:anywhere;line-height:1.35}
#identityCanonicalConfirm,#mConfirm{max-width:100%;white-space:normal;overflow-wrap:anywhere}
.picker button[aria-pressed="true"],.picker button[aria-pressed="true"]:hover{border-color:var(--amberInk);background:var(--amberSoft);box-shadow:0 0 0 2px var(--amberSoft)}

/* ---------- RESPONSIVE ---------- */
@media(max-width:1100px){.story{grid-template-columns:1fr 1fr}.story>div:nth-child(3){grid-column:1/-1;border-top:1px solid var(--line);border-right:0}.hero{grid-template-columns:1fr}.hero .rgt{border-left:0;border-top:1px solid rgba(255,255,255,.08);flex-direction:row;flex-wrap:wrap}}
@media(max-width:900px){
  :root{--rail:0px}
  #rail{top:auto;bottom:0;left:0;right:0;width:auto;height:64px;flex-direction:row;padding:6px 8px;border-right:0;border-top:1px solid var(--edge);align-items:center;gap:4px}
  .rtab{flex:1;justify-content:center;padding:10px 6px;margin:0;font-size:12px;letter-spacing:.08em;clip-path:none;border-radius:10px}
  .rtab .badge{margin-left:6px}
  .railSep,.railFoot,.rtab.sec{display:none}
  #main{left:0;bottom:64px}
  .view{padding:22px 16px 90px}
  .ctxLbl,.protoTag{display:none}
  .hSearch{display:none}
  .brand{min-width:0}
  .brandSub{display:none}
  .subgrid,.meGrid,.invWrap{grid-template-columns:1fr}
  .band{grid-template-columns:repeat(2,1fr)}
  .band .cell{border-bottom:1px solid var(--line)}
  .story{grid-template-columns:1fr}.story>div{border-right:0;border-bottom:1px solid var(--line)}
  .qcard{grid-template-columns:1fr}.qcard .acts{flex-direction:row;flex-wrap:wrap;min-width:0}
  .row{grid-template-columns:auto 1fr auto;grid-template-areas:"a b c" "d d d"}.row .who{grid-area:b}.row .amt{grid-area:c}.row .act{grid-area:d;min-width:0;justify-content:flex-start}
  .pipe{grid-template-columns:repeat(2,1fr)}.pipe .st:after{display:none}
  .led{grid-template-columns:1fr auto;gap:6px 12px}.led .as{grid-column:1/-1}
  .invoice{padding:26px 20px}
}
@media(max-width:640px){
  :root{--hdr:118px}
  #hdr{flex-wrap:wrap;gap:8px 10px;padding:10px 12px;align-content:center;height:auto;min-height:var(--hdr)}
  .demo{padding:2px 3px 2px 8px}.demoLbl{font-size:8.5px;letter-spacing:.14em}
  .brand{flex:1 1 auto;min-width:0;order:1}
  .lens{order:2}
  .ctxSwitch{order:3;width:100%;justify-content:center}
  .ctxSwitch button{padding:6px 12px;font-size:12px;flex:1;text-align:center}
  .hActions{width:auto;margin-left:auto;order:2}
  .protoTag{display:none}
  .brandTitle{font-size:16px}
  .lens button{font-size:12px;padding:4px 9px 4px 4px}
  .greet{font-size:34px}
  .hero .lft,.hero .rgt{padding:22px 20px}
  .cal{gap:5px}.day{min-height:74px;padding:6px 6px 8px}.lane{height:20px;font-size:11px}
  .meCyc{grid-template-columns:auto 1fr}.meCyc .b{grid-column:2;align-items:flex-start}
  .hero .rgt{display:none}.mStats{display:flex;gap:18px;margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.05)}.mStats .stat .n{font-size:26px}
  .hero .sub{font-size:14.5px;margin-top:8px}.hero .ttl{font-size:26px}.hero .cta{margin-top:16px}
  .srow{grid-template-columns:1fr auto}.srow .cyc3{display:none}.srow .need{grid-column:1/-1;text-align:left;min-width:0}
  .path{grid-template-columns:1fr}
  .btn.primary{font-size:14px;padding:12px 18px;white-space:normal;max-width:100%}.btn.lg{min-height:52px;font-size:16px;padding:12px 20px}
  .stat .n{font-size:30px}
  .band{grid-template-columns:1fr 1fr}
}

/* ---------- PRINT (invoice only) ---------- */
@media print{
  #hdr,#rail,.dayfx,#toast,.sheetWrap,.invSide,.back,.noprint{display:none!important}
  body{overflow:visible;background:#fff}
  #main{position:static;overflow:visible}
  .view{padding:0;max-width:none}
  .invWrap{display:block;margin:0}
  .invoice{box-shadow:none;border:0;padding:0}
}

/* ===================================================================
   CANON additions — MX-EXAMPREP-5200P-CANON
   =================================================================== */
/* theme selector */
.theme{display:flex;align-items:center;gap:2px;border:1px solid var(--edge);background:rgba(15,21,34,.9);border-radius:999px;padding:3px;flex:none}
.theme button{width:30px;height:28px;border-radius:999px;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:14px;color:var(--dim);transition:.15s}
.theme button:hover{color:#fff;background:rgba(36,48,70,.6)}
.theme button.on{background:linear-gradient(90deg,rgba(var(--accentGlow),.28),rgba(var(--accentGlow),.10));color:#fff}

/* billing-cycle selector */
.cycBar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.cycSel{display:inline-flex;align-items:center;gap:6px}
.cycSel .arrow{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line2);background:var(--sheet);color:var(--ink);text-decoration:none;font-size:18px;font-weight:700;transition:.15s}
.cycSel .arrow:hover{background:#fff;border-color:var(--ink2)}
.cycSel .arrow.off{opacity:.35;pointer-events:none}
.cycMenu{position:relative}
.cycMenu summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:10px;min-height:40px;padding:6px 14px 6px 16px;border:1px solid var(--line2);border-radius:12px;background:var(--sheet);font-weight:900;font-style:italic;font-size:20px;letter-spacing:-.015em;transform:skewX(-2deg);box-shadow:var(--shadow)}
.cycMenu summary::-webkit-details-marker{display:none}
.cycMenu summary .car{font-style:normal;font-size:13px;color:var(--mute)}
.cycMenu[open] summary{border-color:var(--ink2)}
.cycMenu .menu{position:absolute;left:0;top:calc(100% + 6px);z-index:40;min-width:320px;background:var(--sheet);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow2);padding:6px;display:flex;flex-direction:column;gap:2px}
.cycMenu .menu a{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;text-decoration:none}
.cycMenu .menu a:hover{background:var(--sheet2)}
.cycMenu .menu a.on{background:var(--ink);color:#fff}
.cycMenu .menu a .n{font-weight:800;font-size:16px}
.cycMenu .menu a .d{font-size:13px;color:var(--mute)}
.cycMenu .menu a.on .d{color:rgba(255,255,255,.75)}

/* profile tools */
.profTools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

/* record layers */
.layers{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:14px;overflow:hidden}
.lay{padding:16px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.lay:last-child{border-right:0}
.lay .k{font-family:var(--num);font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.lay .s{font-size:13px;color:var(--mute)}
.lay .v{font-family:var(--num);font-weight:700;font-size:26px;line-height:1.1;margin-top:6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.lay .v small{font-family:var(--disp);font-weight:600;font-size:13.5px;color:var(--ink2)}
.lay .v.ok{color:var(--greenInk)}
.lay .v2{font-size:13.5px;color:var(--mute)}
.lay:nth-child(3){background:var(--sheet2)}
.layersMini{display:flex;gap:18px;flex-wrap:wrap;font-size:15px;color:var(--ink2)}

/* corrections history */
.hist .h.corr{background:var(--amberSoft);border-radius:8px;padding:8px 10px;border-bottom:0}

/* payment & auto billing module */
.pay{display:grid;grid-template-columns:1fr 1fr;gap:0;overflow:hidden}
.payBlock{padding:18px 20px;display:flex;flex-direction:column;gap:8px;border-right:1px solid var(--line)}
.payBlock:last-child{border-right:0}
.payBlock .k{font-family:var(--num);font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.payBlock .v{font-weight:900;font-style:italic;font-size:20px;transform:skewX(-2deg)}
.payBlock .v.ok{color:var(--greenInk)}
.payBlock .d{font-size:14.5px;color:var(--ink2)}
.payBlock .fine{font-size:12.5px;color:var(--mute);margin-top:auto}
.setup{padding:20px 22px;display:flex;flex-direction:column;gap:6px;border-color:var(--em2)}
.setup .k{font-family:var(--num);font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--amberInk)}
.setup .t{font-weight:900;font-style:italic;font-size:21px;transform:skewX(-2deg);letter-spacing:-.015em}
.setup .d{font-size:15px;color:var(--ink2)}
.setup .btn{margin-top:10px;align-self:flex-start}
.setup.done{border-color:#bfe8d2}
.setup.done .k{color:var(--greenInk)}

/* option grid in sheets */
.optGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.opt{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line2);border-radius:12px;background:var(--sheet);text-align:left;transition:.15s}
.opt b{font-size:16px}.opt span{font-size:13.5px;color:var(--mute)}
.opt:hover{border-color:var(--ink2);background:#fff}
.opt.on{border-color:var(--greenInk);box-shadow:0 0 0 2px rgba(31,157,99,.25)}
.etabs{margin-top:14px}
.attEdit{display:flex;flex-direction:column;gap:6px;margin-top:12px;max-height:34vh;overflow:auto;padding-right:4px}
.attRow{display:grid;grid-template-columns:1.2fr auto 1fr auto;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);font-size:14px}
.attRow .dt{font-weight:700}
.attRow .acts2{display:flex;gap:6px;justify-content:flex-end}
.secure{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.secure .row2{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--sheet2)}
.secure .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--sheet);border:1px solid var(--line);flex:none}
.secure b{display:block;font-size:15.5px}.secure span{font-size:14px;color:var(--mute)}
.terms{margin-top:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--sheet2);font-size:15px}
.terms ul{margin:8px 0 10px 18px;display:flex;flex-direction:column;gap:4px;color:var(--ink2)}
.lane.added:after{content:"";}
.lane.removed{opacity:.7;text-decoration:line-through}
@media(max-width:900px){.layers{grid-template-columns:1fr}.lay{border-right:0;border-bottom:1px solid var(--line)}.pay{grid-template-columns:1fr}.payBlock{border-right:0;border-bottom:1px solid var(--line)}.optGrid{grid-template-columns:1fr}.attRow{grid-template-columns:1fr auto;grid-template-areas:"a b" "c d"}.attRow .st{grid-area:c}.attRow .acts2{grid-area:d}.cycMenu summary{font-size:18px}.cycMenu .menu{min-width:260px}}
@media(max-width:640px){.theme{order:2}.cycBar{gap:10px}}

/* ---------- atmosphere layers (StoryForge .aur a/b/c) — dark theme only, behind everything ---------- */

/* ---------------- opening sequence — ported from StoryForge V5 public/app.js (showOpeningExperience / dismissOpeningExperience / completeOpeningExperience) ---------------- */
const openingNode = document.getElementById('maOpening');
const OPENING_TAB_KEY = 'missionaccounts_opening_seen_this_tab';
const OPENING_MINIMUM_MS = 1650;          // donor value
const OPENING_REDUCED_MOTION_MS = 650;    // donor value
let openingStartedAt = performance.now(); let openingProgressTimer = 0; let openingDone = false; let openingSeenThisTab = false;
function delay(ms){ return new Promise(r=>window.setTimeout(r, ms)); }
function reducedMotion(){ return window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; }
function canRevealMissionAccountsShell(){ return document.documentElement.dataset.missionaccountsBuild!=='production' || ['authenticated-readonly','registered-limited'].includes(document.documentElement.dataset.missionaccountsRuntime); }
function revealAuthoritative(){ if(!canRevealMissionAccountsShell()) return false; completeOpeningExperience(); return true; }
function showOpeningExperience(){ if(!openingNode) return;
  try{ openingSeenThisTab = sessionStorage.getItem(OPENING_TAB_KEY)==='1' && !location.hash.includes('replay=1'); }catch(e){ openingSeenThisTab=false; /* a blocked session store may replay the bounded visual, never block access */ }
  const alreadyActive = !openingNode.hidden && document.body.classList.contains('opening-active'); if(alreadyActive) return;
  if(openingProgressTimer) window.clearTimeout(openingProgressTimer);
  openingStartedAt = performance.now(); openingNode.hidden=false; openingNode.dataset.phase='forming'; document.body.classList.add('opening-active');
  const status = openingNode.querySelector('[data-opening-status]'); if(status) status.textContent='Securely opening your account workspace…';
  openingProgressTimer = window.setTimeout(()=>{ if(!openingNode.hidden && status) status.textContent='Connecting your private MissionMed workspace…'; }, 2100); }
function dismissOpeningExperience({immediate=false}={}){ if(!openingNode) return; if(openingProgressTimer) window.clearTimeout(openingProgressTimer); openingProgressTimer=0; openingNode.dataset.phase = immediate?'idle':'leaving'; document.body.classList.remove('opening-active'); if(canRevealMissionAccountsShell()) document.body.classList.remove('is-booting'); if(immediate) openingNode.hidden=true; }
async function completeOpeningExperience(){ if(!openingNode || openingNode.hidden || openingDone) return; openingDone=true;
  if(!canRevealMissionAccountsShell()){ openingDone=false; return; }
  const rm=reducedMotion(); const minimum = openingSeenThisTab?0:(rm? OPENING_REDUCED_MOTION_MS : OPENING_MINIMUM_MS); const remaining=Math.max(0, minimum-(performance.now()-openingStartedAt)); if(remaining) await delay(remaining);

function legacyInvoiceLine(line){
  const kind=line.kind==='frozen_group'?'Frozen group attendance':line.kind==='manual_1on1'?'Verified 1-on-1':'Verified credit';
  const attendanceDays=Array.isArray(line.attendance_days)?line.attendance_days:[];
  const detail=line.kind==='frozen_group'
    ? Number(line.source_events||0)+' source event'+(Number(line.source_events||0)===1?'':'s')+' collapsed to '+attendanceDays.length+' unique billable date'+(attendanceDays.length===1?'':'s')+': '+attendanceDays.map(day=>esc(day)).join(', ')
    : line.kind==='manual_1on1'
      ? esc(line.service_on||'Date unavailable')+' · '+Number(line.duration_minutes||0)+' minutes at '+legacyInvoiceMoney(line.rate_cents)+'/hour'
      : esc(line.reason||'Authorized credit');
  const source=line.kind==='frozen_group'
    ? 'Source row '+esc(line.source_id||'missing')+' · ledger '+esc(line.artifact_sha256||'hash unavailable')
    : line.source_ref?'Source: '+esc(line.source_ref)+' · '+esc(line.source_sha256||'hash unavailable'):'';
  return `<div class="legacyLine"><div><b>${esc(kind)}</b><div class="muted">${detail}</div>${source?`<small class="legacyHash">${source}</small>`:''}</div><div class="amt">${legacyInvoiceMoney(line.amount_cents)}</div></div>`;
}

      <button type="button" class="panel cyc future" data-go="#/cycle/current"><div class="nm">Current Cycle</div><div class="rg">September · dates to be set</div><div class="facts"><div class="f"><span class="n">—</span><span class="l">people</span></div><div class="f"><span class="n">—</span><span class="l">classes</span></div></div><div class="d muted" style="font-size:14px">${missionAccountsCapability('zoom_sync')?'Attendance updates automatically after the daily Zoom sync runs.':'Attendance will arrive from the daily Zoom sync once it is connected.'}</div></button>
    </div>
  </section>`; }

/* ---------------- CYCLE ---------------- */
function ruleSentence(){ const d=WS.ruleDecision; if(WS.rule==='event') return 'Comparison view — the original $25-per-class rule.'; if(d) return d.mode==='retroactive'? 'Estimated with the corrected rule (one $25 charge per class day) — the Founder decided it applies to past cycles too.' : 'Estimated with the corrected rule (one $25 charge per class day) — the Founder decided it applies from the Current Cycle onward; earlier cycles are shown for comparison.'; return 'Estimated with the corrected rule (one $25 charge per class day). The Founder is still deciding whether it also applies to past cycles.'; }
function ruleNoteHTML(s){ return `<span class="ruleNote"><span class="chip ${WS.rule==='day'?'approved':'review'}">${WS.rule==='day'?'Corrected rule · one charge per day':'Original rule · per class'}</span><span class="muted">${esc(ruleSentence())} <a class="linkish" href="#/billing?cycle=all#rule">Details</a></span></span>`; }
function rowHTML(item, k, opts={}){ const {e,st,att}=item; const cc=e.c[k]; const sug=suggestionFor(e,k); const pct=Math.round(100*att/cyc(k).sessions); const email=contactOf(e.i).email;
  const dec=decisionFor(e.i,k);
  const amtHTML = st.state==='stale' ? `<span class="m est money">${money(sug.amount)}</span><span class="chip review">was approved ${money(st.amount)} · basis changed</span>`
    : st.state==='clean'||st.state==='question'||st.state==='device' ? `<span class="m est money">${money(sug.amount)}</span><span class="chip est">${esc(sug.label)}</span>`
    : (st.state==='nocharge'||st.state==='handled') ? `<span class="m money" style="color:var(--mute)">$0</span><span class="chip ${st.chip}">${esc(st.label)}</span>`
    : `<span class="m ok money">${money(st.amount)}</span><span class="chip ${st.chip}">${esc(st.label)}</span>`;
  const acts = st.state==='stale' ? `<button type="button" class="btn confirm sm" data-decide="${e.i}|${k}|confirm">Re-approve ${money(sug.amount)}</button><button type="button" class="btn soft sm" data-go="#/student/${e.i}?cycle=${k}">Open</button>`
    : st.state==='clean' ? `<button type="button" class="btn confirm sm" data-decide="${e.i}|${k}|confirm">Confirm ${money(sug.amount)}</button><button type="button" class="btn soft sm" data-go="#/student/${e.i}?cycle=${k}">Open</button>`
    : st.state==='approvedNoEmail' ? `<button type="button" class="btn soft sm" data-go="#/student/${e.i}?cycle=${k}#contact">Add email</button>`
    : st.state==='approved' ? `<button type="button" class="btn soft sm" data-go="#/invoice/${e.i}/${k}">Preview invoice</button>`
    : st.state==='ready' ? `<button type="button" class="btn soft sm" data-go="#/invoice/${e.i}/${k}">Invoice</button>`
    : `<button type="button" class="btn soft sm" data-go="#/student/${e.i}?cycle=${k}">Open</button>`;
  return `<div class="row"><div class="ring ${st.state==='approved'||st.state==='ready'?'ok':''}" style="--p:${pct}"><span>${att}</span></div>
    <div class="who"><div class="nm"><a href="#/student/${e.i}?cycle=${k}">${esc(e.n)}</a></div><div class="meta"><span>${att} of ${cyc(k).sessions} classes</span><span class="chip s1">Step 1 · ${e.c[k].s1}</span><span class="chip s23">Step 2/3 · ${e.c[k].s23}</span>${WS.rule==='day'?`<span class="chip bday" title="One $25 charge per calendar day — attending Step 1 and Step 2/3 on the same day counts once">${cc.billable} billable ${cc.billable===1?'day':'days'}${cc.comped?` · ${cc.comped} comped`:''}${cc.grace?` · ${cc.grace} exam grace`:''}</span>`:''}${email?'':'<span class="muted">· no email yet</span>'}${dec&&dec.note?`<span class="muted">· ${esc(dec.note)}</span>`:''}</div></div>
    <div class="amt">${amtHTML}</div><div class="act">${acts}</div></div>`; }

function clusterCard(cl, opts={}){ const m=model(); const d=WS.ident[cl.id]; const prev=mergePreview(cl); const total=prev.reduce((a,x)=>a+x.delta,0);
  const primary=cl.members[0];
  const names = cl.members.map(mm=>{ const e=m.eff[m.canonOf(mm.si)]; const cyclesTxt=CYK.filter(kk=>mm.cycles.includes(kk)).map(kk=>cyc(kk).label.replace(' Cycle','')).join(', ');
    return `<div class="nameBox"><span class="n ${mm.device?'mono':''}">${esc(mm.alias)}</span><span class="d">${mm.att} ${mm.att===1?'class':'classes'} · ${esc(cyclesTxt)}</span>${(()=>{ const r=(mm.raw||[]).filter(x=>x.toLowerCase()!==mm.alias.toLowerCase()); return r.length?`<span class="d">Zoom name: <b>${esc(r.join(' / '))}</b></span>`:''; })()}</div>`; }).join('');
  const impact = prev.length? `<div class="impact">If they are the same person: ${prev.map(p=>`<span style="${opts.cycle===p.k?'background:var(--amberSoft);padding:2px 6px;border-radius:6px':''}">${esc(p.label.replace(' Cycle',''))} ${p.att} classes → <b>${money(p.after)}</b> <span class="muted">(was ${money(p.before)})${(p.att>=13&&p.att<=15&&!WS.policy[p.k])?' · pricing question pending':''}</span></span>`).join(' · ')} ${total!==0?`<b>${money(Math.abs(total))} ${total<0?'less':'more'} than billing them separately</b>`:'<b>no change to the total</b>'}</div>`:'';
  const why = `<details class="why"><summary>Why do we think this?</summary><div class="evid">
      <div><span class="k">What matches</span><br>${esc(cl.supporting)}</div>
      <div><span class="k">Timing</span><br>${esc(cl.temporal)}</div>
      <div><span class="k">What argues against</span><br>${esc(cl.against)}${cl.cooccur?` · seen in the same class at the same time ${cl.cooccur}×`:''}</div>
      <div><span class="k">Confidence</span><br>${cl.tier==='probable'?'Likely the same person — please confirm.':'Possibly the same person — we are not sure.'}</div></div></details>`;
  const decided = d ? `<div class="decided"><span class="chip ${d.d==='same'?'approved':d.d==='different'?'none':'review'}">${d.d==='same'?'✓ Same student':d.d==='different'?'Different people':'Not sure — kept open'}</span><span class="muted" style="font-size:13px">${esc(fmtStamp(d.at))}</span><button type="button" class="btn xs soft" data-ident-undo="${esc(cl.id)}">Undo</button></div>`
    : `<div class="acts"><button type="button" class="btn confirm" data-ident="${esc(cl.id)}|same">Yes, same student</button><button type="button" class="btn ghost" data-ident="${esc(cl.id)}|different">No, different people</button><button type="button" class="btn soft" data-ident="${esc(cl.id)}|unsure">I'm not sure</button></div>`;
  return `<div class="qcard ${d?'done':''}" id="q-${esc(cl.id)}"><div><div class="q">${d&&d.d==='same'?`Merged as <em>${esc(m.eff[m.canonOf(primary.si)].n)}</em>`:'We think these may be the same person'}</div><div class="names">${names}</div>${impact}${why}</div>${decided}</div>`; }

function deviceCard(dv){ const m=model(); const d=WS.dev[dv.key]; const e=m.eff[dv.si]; const cyclesTxt=dv.cycles.map(kk=>cyc(kk).label.replace(' Cycle','')).join(', ');
  const sessions = e.absorbed? [] : CYK.flatMap(kk=> (D.students[dv.si].c[kk]?D.students[dv.si].c[kk].sess:[]) ).map(ss=>D.sessions[ss]);
  const when = sessions.slice(0,4).map(s=>`${fmtDate(s.d,{short:true})} ${fmtTime(s.t)} (${stepLabel(s.st)})`).join(' · ') + (sessions.length>4?` · +${sessions.length-4} more`:'');
  const decided = d && d.d!=='leave' ? `<div class="decided"><span class="chip ${d.d==='match'?'approved':'none'}">${d.d==='match'?'✓ Matched to '+esc(D.students[d.si].n):'Not a student'}</span><span class="muted" style="font-size:13px">${esc(fmtStamp(d.at))}</span><button type="button" class="btn xs soft" data-dev-undo="${esc(dv.key)}">Undo</button></div>`
    : `<div class="acts"><button type="button" class="btn confirm" data-dev="${esc(dv.key)}|match">Match to a student</button><button type="button" class="btn ghost" data-dev="${esc(dv.key)}|not">Not a student</button><button type="button" class="btn soft" data-dev="${esc(dv.key)}|leave">Decide later</button></div>`;
  return `<div class="qcard dev ${d&&d.d!=='leave'?'done':''}" id="d-${esc(dv.key)}"><div><div class="q">We need your help identifying this attendee</div>
    <div class="names"><div class="nameBox"><span class="d">Recorded Zoom name</span><span class="n mono">${esc(dv.name)}</span></div><div class="nameBox"><span class="d">Attendance</span><span class="n">${dv.att} ${dv.att===1?'class':'classes'} · ${esc(dv.cycles.map(kk=>cyc(kk).label).join(', '))}</span><span class="d">${esc(when)}</span></div></div>
    <div class="impact">Carried in the starting estimate at <b>${money(CYK.reduce((a,kk)=>a+(e.c[kk]?suggestionFor(e,kk).amount:0),0))}</b> (${WS.rule==='day'?'$25 per billable day':'$25 per class'}). It stays flagged — not shown as a student — until you match it to someone, mark it not a student, or decide later.</div></div>${decided}</div>`; }

function viewCycle(k){ if(k==='current') return viewCurrent(); const s=cycleStats(k); if(!s) return viewHome(); const c=s.c; const m=model();
  const clusters = m.openClusters.filter(cl=>cl.members.some(mm=>mm.cycles.includes(k)));
  const decidedClusters = D.clusters.filter(cl=>WS.ident[cl.id] && WS.ident[cl.id].d!=='unsure' && cl.members.some(mm=>mm.cycles.includes(k)));
  const devices = D.devices.filter(dv=>dv.cycles.includes(k) && !(WS.dev[dv.key] && WS.dev[dv.key].d!=='leave'));
  const devicesDone = D.devices.filter(dv=>dv.cycles.includes(k) && WS.dev[dv.key] && WS.dev[dv.key].d!=='leave');
  const capOpen = !WS.policy[k] && s.capCount>0;
  const attentionN = clusters.length + devices.length + (capOpen?1:0);
  const g=s.groups; const cleanFull=g.clean.filter(x=>x.u>=16), cleanPer=g.clean.filter(x=>x.u<16);
  const allDone = attentionN===0 && g.clean.length===0;
  const dominant = attentionN>0? `<a class="btn primary lg" href="#/cycle/${k}#attention">Answer the ${attentionN} question${attentionN===1?'':'s'} →</a>` : g.clean.length? `<button type="button" class="btn primary lg" data-confirm-all="${k}">Confirm ${g.clean.length} clean record${g.clean.length===1?'':'s'} · ${money(g.clean.reduce((a,x)=>a+suggestionFor(x.e,k).amount,0))}</button>` : `<span class="chip approved" style="font-size:16px;padding:10px 16px">✓ ${esc(c.label)} fully confirmed</span>`;
  const list = (items, limit, id) => { const shown=items.slice(0,limit); return `<div class="stack" id="${id}">${shown.map(it=>rowHTML(it,k)).join('')}</div>${items.length>limit?`<div class="moreRow"><button type="button" class="btn ghost sm" data-expand="${id}">Show all ${items.length}</button></div>`:''}`; };
  const noChargeAll=[...g.nocharge,...g.handled];
  window.__lists = window.__lists||{}; window.__lists[k]={cleanFull,cleanPer,approved:[...g.approved,...g.approvedNoEmail],ready:g.ready,nocharge:noChargeAll};
  return `<section class="view">
    <a class="back" href="#/home">← Home</a>
    <div class="cycBar">${cycleSelector(k, kk=>'#/cycle/'+kk)}<span class="eyebrow em">${esc(c.label)} · ${fmtRange(c)}</span></div>
    <h1 class="h1" style="margin-top:8px">${allDone?`${esc(c.label.replace(' Cycle',''))} is done.`:`Let's finish ${esc(c.label.replace(' Cycle',''))}.`}</h1>
    ${WS.rule==='event'?`<div class="compareBanner"><span class="chip review">Comparison view</span> You are looking at the <b>original per-class rule</b>. Approvals are paused in this view — <a class="linkish" href="#/billing?cycle=all#rule">switch back to the corrected rule</a> to approve amounts.</div>`:''}
    <p class="lead" style="margin-top:10px">${c.sessions} Live Drills classes · ${s.people.length} people attended · ${s.events.toLocaleString()} attendances recorded from Zoom.</p>
    <div class="panel band">
      <div class="cell"><span class="l">Classes</span><span class="n">${c.sessions}</span><span class="s">${c.s1_sessions} Step 1 · ${c.s23_sessions} Step 2/3 · ${c.days} class days</span></div>
      <div class="cell"><span class="l">People</span><span class="n">${s.people.length}</span><span class="s">${s.full} at 16+ classes · ${s.per} at 1–15${s.groups.device.length?` · incl. ${s.groups.device.length} unidentified`:''}</span></div>
      <div class="cell"><span class="l">Attendance events</span><span class="n">${s.events.toLocaleString()}</span><span class="s">${s.s1.toLocaleString()} Step 1 · ${s.s23.toLocaleString()} Step 2/3 — every event is kept</span></div>
      <div class="cell"><span class="l">Billable days</span><span class="n">${s.billDays.toLocaleString()}</span><span class="s">one $25 charge per calendar day · ${s.dupDays.toLocaleString()} days had both Steps${s.compDays?` · ${s.compDays} comped`:''}${s.graceDays?` · ${s.graceDays} exam grace`:''}</span></div>
      <div class="cell"><span class="l">Dr J approved</span><span class="n ok money">${money(s.approved)}</span><span class="s">${s.decided} of ${s.people.length} confirmed${s.ncNo?` · ${s.ncNo} no charge`:''}</span></div>
      <div class="cell"><span class="l">Our estimate · not approved</span><span class="n est money">${money(s.est)}</span><span class="s">from attendance, before your decisions</span></div>
      <div class="cell"><span class="l">Ready to invoice</span><span class="n blue money">${money(s.ready)}</span><span class="s">${g.ready.length} approved with an email on file</span></div>
      <div class="cell"><span class="l">Paid</span><span class="n faint">—</span><span class="s">Appears once invoices go out</span></div>
    </div>
    <div class="legend" style="margin-top:10px"><span><i class="estL"></i>dashed = our estimate</span><span><i class="okL"></i>green = approved by you</span>${ruleNoteHTML(s)}</div>
    <div style="margin-top:22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">${dominant}<span class="muted">Then confirm the clean records, preview invoices, and mark them ready.</span></div>

    <div class="chapter" id="attention"><div class="chHead"><span class="t">Needs your attention</span><span class="c">${attentionN} question${attentionN===1?'':'s'} in ${esc(c.label.replace(' Cycle',''))}</span><span class="why">Only the questions that change who is billed or how much. Everything else is already organized below.${totalQuestions()>attentionN?` (${totalQuestions()} questions across all cycles.)`:''}</span></div>
      <div class="stack">
        ${capOpen? `<div class="qcard pol"><div><div class="q">${s.capCount} ${s.capCount===1?'person':'people'} ${WS.rule==='day'?'have 13–15 billable days':'attended 13–15 classes'}. At $25 ${WS.rule==='day'?'a day':'a class'} that is $325–$375 — more than the $300 full cycle.</div><div class="impact">By the written rule they would pay more than students who came to every class. Charge the flat $300 full-cycle price, or ${WS.rule==='day'?'$25 a day':'$25 a class'}? You can still change any one of them individually.</div><details class="why"><summary>Who this affects</summary><div class="evid">${s.people.filter(e=>{ const u=unitsOf(e.c[k]); return u>=13&&u<=15; }).map(e=>`<div>${esc(e.n)} — ${unitsOf(e.c[k])} ${unitWord(unitsOf(e.c[k]))} · ${money(unitsOf(e.c[k])*25)} at $25</div>`).join('')}</div></details></div><div class="acts"><button type="button" class="btn confirm" data-policy="${k}|cap">Cap at $300 full-cycle</button><button type="button" class="btn ghost" data-policy="${k}|per">Charge ${WS.rule==='day'?'$25 per day':'$25 per class'}</button></div></div>`
        : (WS.policy[k]? `<div class="qcard pol done"><div><div class="q">13–15 ${WS.rule==='day'?'billable days':'classes'}: ${WS.policy[k]==='cap'?'capped at the $300 full-cycle price':'kept at $25 each'}</div><div class="impact">${s.capCount} ${s.capCount===1?'person':'people'} in ${esc(c.label)}. Change this any time.</div></div><div class="decided"><button type="button" class="btn xs soft" data-policy="${k}|">Undo</button></div></div>`:'')}
        ${clusters.slice(0,5).map(cl=>clusterCard(cl,{cycle:k})).join('')}
        ${clusters.length>5? `<div id="moreQ-${k}" hidden>${clusters.slice(5).map(cl=>clusterCard(cl,{cycle:k})).join('')}</div><div class="moreRow"><button type="button" class="btn ghost" data-reveal="moreQ-${k}">Show the other ${clusters.length-5} name questions</button></div>`:''}
        ${devices.map(dv=>deviceCard(dv)).join('')}
        ${attentionN===0? `<div class="panel empty"><div class="ill">✓</div><div class="t">No open questions for ${esc(c.label.replace(' Cycle',''))}</div><div class="d">Every name is resolved and every unidentified attendee has been handled.</div></div>`:''}
        ${decidedClusters.length||devicesDone.length? `<details class="why"><summary>${decidedClusters.length+devicesDone.length} answered question${decidedClusters.length+devicesDone.length===1?'':'s'}</summary><div class="stack" style="margin-top:10px">${decidedClusters.map(cl=>clusterCard(cl)).join('')}${devicesDone.map(dv=>deviceCard(dv)).join('')}</div></details>`:''}
      </div>
    </div>

    ${g.stale.length? `<div class="chapter" id="stale"><div class="chHead"><span class="t">Attendance changed after you approved</span><span class="c">${g.stale.length}</span><span class="why">The billable-day count moved (a correction, a comp-day change or an exam approval). The approved amount is kept until you re-approve.</span></div>${list(g.stale,6,'ls-'+k)}</div>`:''}
    <div class="chapter" id="clean"><div class="chHead"><span class="t">Attendance looks clean</span><span class="c">${g.clean.length} ${g.clean.length===1?'record':'records'}</span><span class="why">One clear name, no open questions. The starting estimate follows the written rule; confirm each one, or confirm them together.</span></div>
      ${cleanFull.length? `<div class="groupHead"><span class="t">Attendance suggests full-cycle</span><span class="d">${cleanFull.length} people at 16+ ${unitWord(16)} · $300 each${s.full>cleanFull.length?` · ${s.full-cleanFull.length} more waiting on a name question`:''}</span><div class="right"><button type="button" class="btn green sm" data-confirm-group="${k}|cleanFull">Confirm all ${cleanFull.length} · ${money(cleanFull.reduce((a,x)=>a+suggestionFor(x.e,k).amount,0))}</button></div></div>${list(cleanFull,6,'lf-'+k)}`:''}
      ${cleanPer.length? `<div class="groupHead"><span class="t">Attendance suggests ${WS.rule==='day'?'per day':'per-session'}</span><span class="d">${cleanPer.length} people at 1–${WS.policy[k]?'15':'12'} ${unitWord(2)} · $25 ${WS.rule==='day'?'per billable day':'per class'}</span><div class="right"><button type="button" class="btn green sm" data-confirm-group="${k}|cleanPer">Confirm all ${cleanPer.length} · ${money(cleanPer.reduce((a,x)=>a+suggestionFor(x.e,k).amount,0))}</button></div></div>${list(cleanPer,6,'lp-'+k)}`:''}
      ${g.held.length? `<div class="groupHead"><span class="t">Waiting on your pricing answer</span><span class="d">${g.held.length} people at 13–15 ${unitWord(14)}${s.capCount>g.held.length?` · ${s.capCount-g.held.length} more are in name questions above`:''}</span><div class="right"><a class="btn soft sm" href="#/cycle/${k}#attention">Answer the question</a></div></div><div class="panel" style="padding:16px 18px"><div class="lead" style="font-size:16px">${g.held.map(x=>esc(x.e.n)).slice(0,8).join(', ')}${g.held.length>8?` and ${g.held.length-8} more`:''} are held here until you decide whether 13–15 ${unitWord(14)} is capped at $300. They are not in the totals above as confirmed.</div></div>`:''}
      ${g.clean.length===0&&!g.held.length? `<div class="panel empty"><div class="ill">✓</div><div class="t">Every clean record is confirmed</div><div class="d">Approved amounts are listed below.</div></div>`:''}
    </div>

    <div class="chapter" id="ready"><div class="chHead"><span class="t">Ready to invoice</span><span class="c">${g.ready.length} ready · ${g.approved.length+g.approvedNoEmail.length} approved</span><span class="why">Confirmed amounts become invoices once the student has an email on file. <span class="chip future">Server-authoritative state</span></span></div>
      ${g.ready.length? `<div class="groupHead"><span class="t">Ready to send</span><span class="d">${g.ready.length} · ${money(s.ready)}</span></div>${list(g.ready,8,'lr-'+k)}`:''}
      ${g.approved.length? `<div class="groupHead"><span class="t">Approved — preview and mark ready</span><span class="d">${g.approved.length}</span></div>${list(g.approved,8,'la-'+k)}`:''}
      ${g.approvedNoEmail.length? `<div class="groupHead"><span class="t">Approved — email needed before invoicing</span><span class="d">${g.approvedNoEmail.length}</span></div>${list(g.approvedNoEmail,6,'ln-'+k)}`:''}
      ${g.ready.length+g.approved.length+g.approvedNoEmail.length===0? `<div class="panel empty"><div class="ill">→</div><div class="t">Nothing approved yet</div><div class="d">Confirm a clean record above and it moves here.</div></div>`:''}
    </div>

    <div class="chapter" id="nocharge"><div class="chHead"><span class="t">No charge · UCC · MUL · handled elsewhere</span><span class="c">${noChargeAll.length}</span><span class="why">Attendance stays on record; nothing is invoiced from here (UCC, MUL, waived, prepaid, already paid or invoiced elsewhere).</span></div>
      ${noChargeAll.length? list(noChargeAll,6,'lnc-'+k) : `<div class="panel empty" style="padding:22px"><div class="d">No one in ${esc(c.label.replace(' Cycle',''))} is marked UCC, MUL, waived, prepaid or already handled yet.</div></div>`}
    </div>

    <div class="chapter"><div class="chHead"><span class="t">Invoiced</span><span class="c">0</span></div><div class="panel empty" style="padding:22px"><div class="d">No invoices have been sent through this system yet. Sent and Paid fill in once online invoicing is switched on.</div></div></div>
    <div class="chapter"><div class="chHead"><span class="t">Paid</span><span class="c">0</span></div><div class="panel empty" style="padding:22px"><div class="d">Payments will appear here after invoices are sent.</div></div></div>
    <p class="muted" style="margin-top:28px">Need every record at once? <a class="linkish" href="#/advanced/records?cycle=${k}">Open all ${s.people.length} ${esc(c.label)} records in Advanced</a>.</p>
  </section>`; }
